[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."claude-parse"]
  timeout = 26

[functions."receipt-inbox"]
  timeout = 26

[functions."receipt-xero"]
  timeout = 26

[functions."xero-mcp"]
  timeout = 26

# SPA routing — serve index.html for all non-file paths (enables /xero-callback)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Always check for a newer page (stops the iPhone Home Screen app showing an old version)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
