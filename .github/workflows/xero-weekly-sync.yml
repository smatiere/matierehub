name: Xero Weekly Dashboard Sync

on:
  schedule:
    - cron: "13 20 * * 6"
    - cron: "58 20 * * 6"
  workflow_dispatch:

# Daily and weekly syncs share one queue so they never hit Xero at the same second
# (on Saturdays both are started together and the weekly one timed out).
concurrency:
  group: xero-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Compute P&L refresh window (last 2 months)
        id: daterange
        run: |
          FROM=$(date -u -d "1 month ago" +%Y-%m)
          TO=$(date -u +%Y-%m)
          echo "Refreshing discrete monthly P&L for $FROM to $TO"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"

      - name: Sync dashboard data (quotes, invoices, P&L, bank liabilities) from Xero
        run: |
          # Xero and Netlify have short hiccups (500, 504): try up to 3 times before failing.
          for attempt in 1 2 3; do
            response=$(curl -s -w "\n%{http_code}" -X POST "https://matierehub2.netlify.app/.netlify/functions/xero-sync?scope=quotes,invoices,pnl,bank&from=${{ steps.daterange.outputs.from }}&to=${{ steps.daterange.outputs.to }}" -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" -H "Content-Type: application/json")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "Attempt $attempt, HTTP status: $http_code"
            echo "Response: $body"
            if [ "$http_code" = "200" ]; then
              echo "dashboard sync completed"
              exit 0
            fi
            if [ "$attempt" != "3" ]; then
              echo "dashboard sync failed with HTTP $http_code, waiting 60 seconds before trying again"
              sleep 60
            fi
          done
          echo "dashboard sync failed 3 times, last HTTP $http_code"
          exit 1
