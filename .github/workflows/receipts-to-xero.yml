name: Receipts to Xero (batch)

# Sends receipts that are saved in the Hub's Receipt Inbox and waiting ("queued") to Xero as Spend Money,
# with the file attached. Manual for now (Actions tab > Run workflow). To run it twice a day,
# remove the leading # on the two cron lines below once the first manual batch has been checked in Xero.
on:
  # schedule:
  #   - cron: "23 21 * * *"   # ~8:23am Sydney
  #   - cron: "37 5 * * *"    # ~4:37pm Sydney
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send queued receipts
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            response=$(curl -s -w "\n%{http_code}" -X POST "https://matierehub2.netlify.app/.netlify/functions/receipt-xero" -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" -H "Content-Type: application/json" -d '{"action":"push"}')
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "HTTP $http_code: $body"
            if [ "$http_code" != "200" ]; then exit 1; fi
            remaining=$(echo "$body" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ "${remaining:-0}" = "0" ]; then break; fi
          done
