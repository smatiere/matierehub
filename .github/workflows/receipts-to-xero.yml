name: Receipts to Xero (batch)

# Sends receipts that are saved in the Hub's Receipt Inbox and waiting ("queued") to Xero as Spend Money,
# with the file attached. Runs twice a day (switched on 2026-11-06) and can still be run by hand
# (Actions tab > Run workflow) or from the Hub's "Send to Xero now" button.
on:
  schedule:
    - cron: "23 21 * * *"   # ~8:23am Sydney
    - cron: "37 5 * * *"    # ~4:37pm Sydney
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send queued receipts
        run: |
          # Xero allows about 60 calls a minute, so go gently: a few receipts at a time, a pause between rounds,
          # a longer pause when Xero says "slow down", and don't give up on one hiccup.
          fails=0
          for i in $(seq 1 20); do
            response=$(curl -s -m 100 -w "\n%{http_code}" -X POST "https://matierehub2.netlify.app/.netlify/functions/receipt-xero" -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" -H "Content-Type: application/json" -d '{"action":"push"}')
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            echo "round $i: HTTP $http_code: $body"
            if [ "$http_code" != "200" ]; then
              fails=$((fails+1))
              if [ "$fails" -ge 3 ]; then echo "Three failures in a row, stopping"; exit 1; fi
              sleep 45; continue
            fi
            fails=0
            remaining=$(echo "$body" | sed -n 's/.*"remaining":\([0-9]*\).*/\1/p')
            if [ "${remaining:-0}" = "0" ]; then break; fi
            if echo "$body" | grep -q '"rate_limited":true'; then sleep 65; else sleep 20; fi
          done
