<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matière Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #000000;
  --bg-2:    #0f0f0f;
  --bg-3:    #1a1a1a;
  --bg-4:    #252525;
  --border:  #2a2a2a;
  --border-2:#383838;
  --ink:     #ffffff;
  --ink-2:   #cccccc;
  --ink-3:   #888888;
  --ink-4:   #505050;
  /* keep old names for compat */
  --cream:   #000000;
  --cream-2: #0f0f0f;
  --cream-3: #1a1a1a;
  --navy:    #0a0a0a;
  /* brand palette */
  --amber:   #FFBE0B;
  --orange:  #FB5607;
  --pink:    #FF006E;
  --purple:  #8338EC;
  --blue:    #3A86FF;
  /* semantic */
  --gold:    #FFBE0B;
  --gold-2:  #ffd54f;
  --gold-light: rgba(255,190,11,0.12);
  --rust:    #FB5607;
  --sage:    #05C46B;
  --r: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--ink);min-height:100vh}

/* ── Header ── */
.header{background:#000;border-bottom:1px solid var(--border);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:baseline;gap:8px}
.header-brand h1{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.header-brand span{font-size:10px;color:var(--ink-4);letter-spacing:.2em;text-transform:uppercase}
.header-meta{font-size:11px;color:var(--ink-4);text-align:right;line-height:1.5}
.btn-refresh{background:rgba(255,255,255,.06);border:1px solid var(--border-2);color:var(--ink-3);padding:6px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;transition:all .2s}
.btn-refresh:hover{background:rgba(255,255,255,.12);color:var(--ink)}

/* ── Tabs ── */
.tabs{display:flex;gap:0;background:#000;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}

/* ── Pages ── */
.page{display:none;padding:20px;max-width:1040px;margin:0 auto}
.page.active{display:block}

/* ── KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:11px;color:var(--ink-4);margin-top:4px}
.kpi.highlight{border-left:2px solid var(--amber)}
.kpi.warn{border-left:2px solid var(--orange)}
.kpi.good{border-left:2px solid var(--sage)}

/* ── Sections ── */
.section{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.section-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-head h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.section-body{padding:16px}
.chart-wrap{position:relative;height:220px}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 14px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-3)}
.amount{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ── Badges ── */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.04em}
.badge-green{background:rgba(5,196,107,.15);color:#05C46B}
.badge-amber{background:rgba(255,190,11,.15);color:var(--amber)}
.badge-red{background:rgba(255,0,110,.15);color:var(--pink)}
.badge-blue{background:rgba(58,134,255,.15);color:var(--blue)}
.badge-gray{background:var(--bg-3);color:var(--ink-4)}

/* ── Mini bars ── */
.mini-bar{background:var(--bg-3);border-radius:2px;height:4px;overflow:hidden;margin-top:6px}
.mini-bar-fill{background:var(--amber);height:100%;border-radius:2px;transition:width .4s}

/* ── Layout ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.kpi-value{font-size:20px}}
.divider{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── Loading / Error ── */
#loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--ink-4)}
.spinner{width:28px;height:28px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#error-box{display:none;background:rgba(255,0,110,.1);border:1px solid rgba(255,0,110,.3);border-radius:var(--r);padding:16px;margin:20px;color:var(--pink);font-size:13px}

/* ── Log entries ── */
.log-entry{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0}
.log-dot.expense{background:var(--orange)}
.log-dot.hours{background:var(--sage)}
.log-text{flex:1;line-height:1.5}
.log-date{font-size:11px;color:var(--ink-4);margin-top:2px}
.log-amount{font-weight:600;white-space:nowrap;color:var(--ink)}

/* ── Empty states ── */
.empty{text-align:center;padding:40px 20px;color:var(--ink-4);font-size:13px}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.5}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;width:100%;max-width:660px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.8);animation:modalIn .18s ease}
@keyframes modalIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0}
.modal-head h3{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.modal-close{background:var(--bg-3);border:1px solid var(--border);font-size:14px;cursor:pointer;color:var(--ink-3);line-height:1;padding:4px 9px;border-radius:var(--r)}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:20px;max-height:72vh;overflow-y:auto}
.modal-body .kpi{padding:12px}
.modal-body .kpi-value{font-size:20px}

/* ── Misc ── */
.project-row{cursor:pointer}
.chart-clickable-hint{font-size:10px;color:var(--ink-4);letter-spacing:.04em}
.btn-primary{background:var(--amber);color:#000;border:none;padding:9px 18px;font-size:12px;border-radius:var(--r);cursor:pointer;transition:background .2s;font-weight:700;letter-spacing:.04em}
.btn-primary:hover{background:var(--gold-2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.load-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;padding:14px 16px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r)}

/* ── Timesheet specific ── */
.ts-filter-bar{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.ts-filter-bar label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.ts-filter-bar select{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:5px 10px;border-radius:var(--r);font-size:12px}
.ts-nav-btn{background:transparent;border:1px solid var(--border-2);color:var(--ink-3);padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:16px;transition:all .15s}
.ts-nav-btn:hover{color:var(--ink);border-color:var(--ink-4)}
.ts-range-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ts-range-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-right:4px}
.ts-range-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-4);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.ts-range-btn:hover{color:var(--ink-2);border-color:var(--ink-4)}
.ts-range-btn.active{background:var(--amber);color:#000;border-color:var(--amber)}
.ts-range-bar input[type="date"]{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:4px 8px;border-radius:var(--r);font-size:11px;color-scheme:dark}
.ts-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.ts-day-hdr{text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);padding:6px 0}
.ts-cell{aspect-ratio:1;border-radius:5px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:flex-start;padding:4px 5px;font-size:10px;position:relative;overflow:hidden;min-height:36px}
.ts-cell.clickable{cursor:pointer}
.ts-cell.clickable:hover{border-color:var(--amber) !important}
.ts-cell-grey{background:rgba(255,255,255,.02);border-color:transparent}
.ts-cell-missing{border-color:rgba(255,0,110,.25) !important}
.ts-day-num{font-size:10px;font-weight:700;color:var(--ink-3);z-index:1;position:relative;line-height:1}
.ts-day-label{font-size:8px;color:var(--ink-4);z-index:1;position:relative;margin-top:1px;letter-spacing:.04em}
.ts-miss-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.85}
.ts-bar-fill{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse}
.ts-bar-seg{width:100%;flex-shrink:0}
.ts-popup-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4)}
.ts-popup{position:absolute;background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;min-width:260px;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.7);overflow:hidden}
.ts-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--border)}
.ts-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.ts-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── P&L specific ── */
.pnl-cat-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-4);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.pnl-cat-btn:hover{color:var(--ink-2);border-color:var(--ink-4)}
.pnl-cat-btn.active{color:#000}

/* ── Floating Claude input bar ── */
#claude-bar{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(0,0,0,.94);border-top:1px solid var(--border-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 14px;display:flex;align-items:center;gap:8px}
#claude-bar-input{flex:1;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink);padding:9px 14px;border-radius:24px;font-size:13px;outline:none;transition:border-color .2s;min-width:0}
#claude-bar-input:focus{border-color:var(--amber)}
#claude-bar-input::placeholder{color:var(--ink-4)}
#claude-bar-input:disabled{opacity:.5}
#claude-add-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;flex-shrink:0;transition:all .2s;background:var(--bg-3);color:var(--ink-3)}
#claude-add-btn:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink)}
#claude-add-btn:disabled{opacity:.4;cursor:not-allowed}
#claude-file-chips{display:none;flex-wrap:wrap;gap:4px}
.claude-chip{display:flex;align-items:center;gap:4px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:12px;padding:2px 6px 2px 4px;font-size:11px;color:var(--ink-3)}
.claude-chip-name{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.claude-chip-rm{cursor:pointer;color:var(--ink-4);font-size:10px;flex-shrink:0;padding-left:2px}
.claude-chip-rm:hover{color:var(--ink)}
#claude-send-btn{background:var(--amber);color:#000;border:none;padding:9px 16px;border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.04em;transition:all .15s;flex-shrink:0}
#claude-send-btn:hover:not(:disabled){background:var(--gold-2)}
#claude-send-btn:disabled{opacity:.4;cursor:not-allowed}
#claude-bar-status{font-size:10px;color:var(--ink-4);white-space:nowrap;flex-shrink:0;letter-spacing:.06em;min-width:60px;text-align:right;display:none}
/* toast */
#claude-toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:9px 20px;border-radius:24px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;letter-spacing:.04em;white-space:nowrap;max-width:90vw;text-align:center}
#claude-toast.success{background:var(--sage);color:#000;opacity:1}
#claude-toast.error{background:var(--pink);color:#fff;opacity:1}
#claude-toast.unclear{background:var(--amber);color:#000;opacity:1}
body{padding-bottom:62px}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span style="font-size:12px;letter-spacing:.08em">LOADING MATIÈRE HUB</span></div>
<div id="error-box"></div>

<div id="app" style="display:none">

<div class="header">
  <div class="header-brand">
    <img src="https://raw.githubusercontent.com/smatiere/matierehub/main/logo.png"
         alt="Matiere" height="22"
         style="display:block;filter:invert(1);image-rendering:crisp-edges">
    <span style="font-size:12px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,0.2);text-transform:uppercase;align-self:center;margin-left:4px">HUB</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="header-meta" id="header-meta"></div>
    <button id="xero-btn" class="btn-refresh">⚡ Connect Xero</button>
    <button id="xero-sync-btn" class="btn-refresh" style="display:none" onclick="syncFromXero()">⬇ Sync Xero</button>
    <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('overview',this)">Overview</div>
  <div class="tab" onclick="showTab('cash',this)">Cash & Invoices</div>
  <div class="tab" onclick="showTab('timesheet',this)">Timesheets</div>
  <div class="tab" onclick="showTab('profitability',this)">Profitability</div>
  <div class="tab" onclick="showTab('pnl',this)">P&amp;L</div>
  <div class="tab" onclick="showTab('materials',this)">Materials</div>
  <div class="tab" onclick="showTab('projects',this)">Projects</div>
  <div class="tab" onclick="showTab('quotes',this)">Quotes & Pricing</div>
  <div class="tab" onclick="showTab('log',this)">Activity Log</div>
  <div class="tab" onclick="showTab('transactions',this)">Transactions</div>
</div>

<div class="page active" id="page-overview"></div>
<div class="page" id="page-cash"></div>
<div class="page" id="page-timesheet"></div>
<div class="page" id="page-profitability"></div>
<div class="page" id="page-pnl"></div>
<div class="page" id="page-materials"></div>
<div class="page" id="page-projects"></div>
<div class="page" id="page-quotes"></div>
<div class="page" id="page-log"></div>
<div class="page" id="page-transactions"></div>

<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Timesheet day popup -->
<div id="ts-popup-overlay" class="ts-popup-overlay" onclick="if(event.target===this)tsDismissPopup()">
  <div id="ts-popup" class="ts-popup"></div>
</div>

</div><!-- end #app -->

<!-- Floating Claude input bar -->
<div id="claude-bar">
  <button id="claude-add-btn" onclick="claudeAddClick()" title="Attach photo or document">+</button>
  <input id="claude-file-input" type="file" accept="image/*,.pdf" multiple style="display:none" onchange="claudeFilesSelected(this.files)">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
    <div id="claude-file-chips"></div>
    <input id="claude-bar-input" type="text" placeholder='e.g. "6h mark today" · "$85 bunnings screws" · "sick day" · "fix hours to 5"' autocomplete="off">
  </div>
  <span id="claude-bar-status"></span>
  <button id="claude-send-btn" onclick="claudeBarSend()">Log</button>
</div>
<div id="claude-toast"></div>

<script>
let D = null;
let charts = {};

// ── Supabase config ───────────────────────────────────────────────────────────
const SB_URL  = 'https://nwpzjqblhywclqharggu.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cHpqcWJsaHl3Y2xxaGFyZ2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTQ2NjcsImV4cCI6MjA5NjI5MDY2N30.XYgfk5jriDpZVXFW6xkWh-hyaYLsP6ZKpInTMXqk9tc';
const SB_HDR  = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };

async function sbGet(path) {
  const r = await fetch(SB_URL + path, { headers: SB_HDR });
  if (!r.ok) throw new Error('Supabase error ' + r.status + ' on ' + path);
  return r.json();
}

async function sbPatch(table, query, body) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + query, {
    method: 'PATCH',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Supabase PATCH error ' + r.status);
  return r.json();
}

// ── Data load — live from Supabase ────────────────────────────────────────────
async function loadData() {
  try {
    const [timesheets, expenses, projects, xeroRows, invoiceItems] = await Promise.all([
      sbGet('/rest/v1/timesheets?select=*&order=date.asc,id.asc'),
      sbGet('/rest/v1/expense_log?select=*&order=date.asc,id.asc'),
      sbGet('/rest/v1/projects?select=*&order=id.asc'),
      sbGet('/rest/v1/xero_cache?select=key,data'),
      sbGet('/rest/v1/invoice_items?select=invoice_number,quote_number,contact,contact_id,price_excl_gst,paid,status,date,description,item')
    ]);

    const xero = {};
    xeroRows.forEach(row => { xero[row.key] = row.data; });

    D = {
      timesheets,
      expense_log:          expenses,
      projects,
      invoice_items:        invoiceItems,
      kpis:                 xero.kpis                 || {},
      monthly:              xero.monthly              || { labels:[], periods:[], revenue:[], materials:[], wages_owner:[] },
      open_invoices:        xero.open_invoices        || [],
      top_customers:        xero.top_customers        || [],
      quotes:               xero.quotes               || [],
      fy_summary:           xero.fy_summary           || {},
      cost_detail_monthly:  xero.cost_detail_monthly  || {},
      liability_transactions: xero.liability_transactions || null,
      account_categories:   xero.account_categories   || {},
      meta:                 xero.meta                 || { last_updated: new Date().toISOString() }
    };

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('error-box').style.display = 'none';
    renderAll();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.style.display = 'block';
    eb.textContent = 'Could not load data. ' + e.message;
  }
}

function fmt(n, decimals=0) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-AU', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function pct(n) { return (n||0).toFixed(1) + '%'; }

function showTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  (el || event.target).classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'quotes') renderQuotes();
  if (name === 'timesheet') renderTimesheet();
  if (name === 'pnl') renderPnL();
  if (name === 'transactions') renderTransactions();
  if (name === 'projects' && D) renderProjects(D.kpis);
}

function kpi(label, value, sub, style='') {
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function kpiBar(label, value, sub, fillPct, style='') {
  const w = Math.min(100, Math.max(0, fillPct||0));
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    <div class="mini-bar"><div class="mini-bar-fill" style="width:${w}%"></div></div>
  </div>`;
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

const CHART_GRID = 'rgba(255,255,255,0.06)';
const CHART_TICK = { color:'#555', font:{size:11} };

  const k = D.kpis, m = D.monthly;

    : '—';
  document.getElementById('header-meta').innerHTML = `Last sync: ${lastSync}`;
  renderOverview(k, m);
  renderCash(k);

  renderLog();
}

// ── Projects ──────────────────────────────────────────────────────────────────
function renderProjects(k) {
  const definedProjects = D.projects || [];
  const timesheets      = D.timesheets || [];
  const expenses        = D.expense_log || [];
  const invoiceItems    = D.invoice_items || [];
  const xeroQuotes      = (D.quotes && D.quotes.length) ? D.quotes : [];
  const rate            = k.sebRate_per_hour || 100;

  // ── Lookup helpers ────────────────────────────────────────────────────────
  const definedMap = {};
  definedProjects.forEach(p => { definedMap[p.name] = p; });

  const allNames = new Set(definedProjects.map(p => p.name));
  timesheets.forEach(t => t.project && allNames.add(t.project));
  expenses.forEach(e => e.project && allNames.add(e.project));

  // Xero quotes indexed by QuoteNumber for fast item lookup
  const xeroQuoteByNum = {};
  xeroQuotes.forEach(q => {
    const num = q.QuoteNumber || q.number || '';
    if (num) xeroQuoteByNum[num] = q;
  });

  // Working days Mon–Fri between two YYYY-MM-DD strings (inclusive)
  function workingDays(start, end) {
    if (!start || !end) return null;
    const s = new Date(start + 'T00:00:00');
    const e = new Date(end   + 'T00:00:00');
    let count = 0;
    const d = new Date(s);
    while (d <= e) {
      const dow = d.getDay();
      if (dow > 0 && dow < 6) count++;
      d.setDate(d.getDate() + 1);
    }
    return count || 1;   // minimum 1 so same-day projects don't divide by zero
  }

  // ── Build per-project aggregates ──────────────────────────────────────────
  const pData = {};
  allNames.forEach(name => {
    const def = definedMap[name] || {};
    pData[name] = {
      id: def.id || '—', name,
      status: def.status || 'Active',
      quoted: def.quoted != null ? def.quoted : null,
      // stored links (exact, from Supabase projects table)
      storedContactId:  def.contact_id   || null,
      storedQuoteNum:   def.quote_number || null,
      // fallback fuzzy key (first segment of project name)
      clientName: name.split(' - ')[0].trim(),
      hours: 0, laborValue: 0,
      players: new Set(),
      dates: [],
      expensesTotal: 0,
      invoicedValue: 0,
      quoteNumbers: new Set(),
      invoiceContactName: null,
    };
  });

  timesheets.forEach(t => {
    if (!t.project || !pData[t.project]) return;
    const p = pData[t.project];
    p.hours      += (t.hours || 0);
    p.laborValue += (t.hours || 0) * rate;
    if (t.employee) p.players.add(t.employee);
    if (t.date) p.dates.push(t.date);
  });

  expenses.forEach(e => {
    if (!e.project || !pData[e.project]) return;
    pData[e.project].expensesTotal += (e.amount || 0);
  });

  // Match invoice_items → projects
  // Priority: exact contact_id match (stored) > fuzzy client name match (fallback)
  invoiceItems.forEach(ii => {
    if (!ii.contact) return;
    const contactLower = ii.contact.toLowerCase();
    Object.values(pData).forEach(p => {
      // Exact match via stored contact_id
      if (p.storedContactId) {
        if (ii.contact_id !== p.storedContactId) return;
      } else {
        // Fuzzy fallback: contact name must contain client name
        const cl = p.clientName.toLowerCase();
        if (!cl || cl === 'admin') return;
        if (!contactLower.includes(cl)) return;
      }
      p.invoicedValue += (ii.price_excl_gst || 0);
      if (ii.quote_number) p.quoteNumbers.add(ii.quote_number);
      if (!p.invoiceContactName) p.invoiceContactName = ii.contact;
    });
  });

  // ── Derive final metrics per project ─────────────────────────────────────
  const dash = '<span style="color:var(--ink-4)">—</span>';

  const sorted = Object.values(pData).map(p => {
    const sortedDates = [...p.dates].sort();
    const startDate   = sortedDates[0] || null;
    const endDate     = sortedDates[sortedDates.length - 1] || null;
    const span        = workingDays(startDate, endDate);

    const hasInv = p.invoicedValue > 0;
    const profit       = hasInv ? p.invoicedValue - p.expensesTotal - p.laborValue : null;
    const profitPct    = hasInv && p.invoicedValue ? profit / p.invoicedValue * 100 : null;
    const adjRate      = hasInv && p.hours > 0 ? (p.invoicedValue - p.expensesTotal) / p.hours : null;
    const hrPerDay     = span && p.hours > 0 ? p.hours / span : null;
    const dilutionPct  = hrPerDay != null ? (hrPerDay / 8) * 100 : null;

    // Quote numbers: stored value takes priority, then derive from matched invoice_items
    const derivedQuoteNums = [...p.quoteNumbers];
    const quoteNums = p.storedQuoteNum
      ? [p.storedQuoteNum, ...derivedQuoteNums.filter(q => q !== p.storedQuoteNum)]
      : derivedQuoteNums;

    // Quote item descriptions from Xero quotes (if cached)
    let quoteItemsHtml = '';
    quoteNums.forEach(qn => {
      const q = xeroQuoteByNum[qn];
      if (q) {
        const lineItems = (q.LineItems || q.line_items || []);
        lineItems.forEach(li => {
          const code = li.ItemCode || li.item || '';
          const desc = li.Description || li.description || '';
          if (code || desc) quoteItemsHtml += (code ? code + ': ' : '') + desc + '<br>';
        });
      }
    });

    // Contact display: prefer the name resolved from stored contact_id match,
    // then from fuzzy match, then fall back to client name extracted from project name
    const contactDisplay = p.invoiceContactName || p.clientName;

    return {
      ...p,
      players: [...p.players],
      quoteNums,
      quoteItemsHtml,
      contactDisplay,
      startDate, endDate, span,
      profit, profitPct, adjRate, hrPerDay, dilutionPct,
    };
  }).sort((a, b) => {
    const aD = definedMap[a.name] ? 0 : 1, bD = definedMap[b.name] ? 0 : 1;
    if (aD !== bD) return aD - bD;
    if (a.startDate && b.startDate) return b.startDate.localeCompare(a.startDate);
    return a.name.localeCompare(b.name);
  });

  // ── Row renderer ──────────────────────────────────────────────────────────
  function pc(v, pos='var(--sage)', neg='var(--pink)') { return v === null ? 'var(--ink-4)' : v >= 0 ? pos : neg; }

  const rows = sorted.map(p => {
    const safeName = p.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const adjRateColor = p.adjRate !== null ? (p.adjRate >= rate ? 'var(--sage)' : 'var(--pink)') : 'var(--ink-4)';

    const profitCell = p.profit !== null
      ? `<span style="color:${pc(p.profit)};font-weight:600">${fmt(p.profit)}</span><br>
         <span style="font-size:10px;color:${pc(p.profitPct)}">${p.profitPct >= 0 ? '+' : ''}${p.profitPct.toFixed(1)}%</span>`
      : dash;

    const dilutionCell = p.hrPerDay != null
      ? `${p.hrPerDay.toFixed(1)}h/d<br><span style="font-size:10px;color:var(--ink-4)">${p.dilutionPct.toFixed(0)}%</span>`
      : dash;

    // Separate Quote Item (codes) and Description from matched quote line items
    let quoteItemCode = dash, quoteItemDesc = dash;
    if (p.quoteItemsHtml) {
      // Already formatted above; for table cells we need two separate values
      const allLI = p.quoteNums.flatMap(qn => {
        const q = xeroQuoteByNum[qn];
        return q ? (q.LineItems || q.line_items || []) : [];
      });
      const codes = allLI.map(li => li.ItemCode || li.item || '').filter(Boolean);
      const descs = allLI.map(li => li.Description || li.description || '').filter(Boolean);
      if (codes.length) quoteItemCode = `<span style="font-size:10px;color:var(--ink-3)">${codes.join('<br>')}</span>`;
      if (descs.length) quoteItemDesc = `<span style="font-size:11px">${descs.map(d => d.length > 40 ? d.slice(0,40) + '…' : d).join('<br>')}</span>`;
    }

    return `<tr onclick="showProjectDetail('${safeName}')" style="cursor:pointer">
      <td style="font-size:11px;color:var(--ink-4);white-space:nowrap">#${p.id}</td>
      <td><strong style="white-space:nowrap">${p.name}</strong>
          <div style="margin-top:2px"><span class="badge ${p.status==='Active'?'badge-green':'badge-gray'}" style="font-size:9px">${p.status}</span></div>
      </td>
      <td style="font-size:12px;white-space:nowrap">${p.contactDisplay}</td>
      <td style="font-size:11px;color:var(--ink-3)">${p.players.length ? p.players.join(', ') : dash}</td>
      <td style="font-size:11px;color:var(--blue);white-space:nowrap">${p.quoteNums.length ? p.quoteNums.join('<br>') : dash}</td>
      <td style="font-size:11px">${quoteItemCode}</td>
      <td style="font-size:11px;max-width:160px">${quoteItemDesc}</td>
      <td class="amount">${p.quoted != null ? fmt(p.quoted) : dash}</td>

function showProjectDetail(name) {
  const rate = D.kpis.sebRate_per_hour || 100;
  const ts = (D.timesheets||[]).filter(t=>t.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const exp = (D.expense_log||[]).filter(e=>e.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalHours = ts.reduce((a,t)=>a+(t.hours||0),0);
  const laborValue = totalHours * rate;
  const totalExpenses = exp.reduce((a,e)=>a+(e.amount||0),0);
  const defined = (D.projects||[]).find(p=>p.name===name);
  const quoted = defined && defined.quoted != null ? defined.quoted : null;
  const remaining = quoted != null ? quoted - laborValue - totalExpenses : null;
  const tsRows = ts.length
    ? ts.map(t=>`<tr><td>${t.date||'—'}</td><td>${t.employee||'Seb'}</td><td style="color:var(--ink-4)">${t.notes||'—'}</td><td class="amount">${t.hours}h</td><td class="amount" style="color:var(--amber)">${fmt(t.hours*rate)}</td></tr>`).join('')
      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${totalHours}h</td><td class="amount" style="color:var(--amber)">${fmt(laborValue)}</td></tr>`
    : `<tr><td colspan="5" style="text-align:center;color:var(--ink-4);padding:16px 0">No timesheet entries</td></tr>`;

      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${fmt(totalExpenses)}</td></tr>`
    : `<tr><td colspan="4" style="text-align:center;color:var(--ink-4);padding:16px 0">No expenses logged</td></tr>`;

      ${kpi('Expenses',totalExpenses>0?fmt(totalExpenses):'$0','Materials & costs','')}
      ${kpi('Remaining',remaining!==null?fmt(remaining):'—','Budget left',remaining===null?'':remaining>=0?'good':'warn')}
    </div>
    <div style="margin-bottom:20px">
      <div class="divider" style="margin-top:0">Timesheets</div>
      <table><thead><tr><th>Date</th><th>By</th><th>Notes</th><th style="text-align:right">Hours</th><th style="text-align:right">Value</th></tr></thead><tbody>${tsRows}</tbody></table>
    </div>
    <div>
      <div class="divider">Expenses</div>
      <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>${expRows}</tbody></table>
    </div>`);
}

const NON_BILLABLE = ['Admin','Office','Wasted time','Holidays','Sick days','Carer days'];

// NSW public holidays (no Bank Holidays — not applicable)
const NSW_HOLIDAYS = {
  '2025-01-01':'NYD','2025-01-27':'AUD','2025-04-18':'GFR','2025-04-19':'ESA',
  '2025-04-20':'ESU','2025-04-21':'EMO','2025-04-25':'ANZ','2025-06-09':'KBD',
  '2025-10-06':'LAB','2025-12-25':'CHR','2025-12-26':'BOX',
  '2026-01-01':'NYD','2026-01-26':'AUD','2026-04-03':'GFR','2026-04-04':'ESA',
  '2026-04-05':'ESU','2026-04-06':'EMO','2026-04-25':'ANZ','2026-06-08':'KBD',
  '2026-10-05':'LAB','2026-12-25':'CHR','2026-12-28':'BOX',
};

// 5 brand colours for active projects (cycles if more than 5)
const PROJ_PALETTE = ['#FFBE0B','#3A86FF','#05C46B','#8338EC','#FB5607'];
const PROJ_NB_COLOR = '#383838';   // non-billable grey
let PROJECT_COLOR_MAP = {};

let tsPlayer     = 'Seb';
let tsCalMonth   = new Date();
let tsRangeMode  = '2w';
let tsRangeFrom  = null;
let tsRangeTo    = null;

function ds(d) {
  // Use local date parts — avoids UTC offset shifting the date
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Returns today's date string in Sydney timezone (AEST/AEDT)
// More reliable than new Date() which can shift at day boundaries
function todayStrSydney() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
  // en-CA locale returns YYYY-MM-DD format
}

// Returns a Date object for the start of today in local/Sydney time
function todayMidnight() {
  const s = todayStrSydney();
  return new Date(s + 'T00:00:00');
}

function isWeekend(d) { const w=d.getDay(); return w===0||w===6; }
function isNSWHoliday(d) { return !!NSW_HOLIDAYS[ds(d)]; }
function isWorkday(d) { return !isWeekend(d) && !isNSWHoliday(d); }

function buildColorMap(timesheets, projects) {
  const active = new Set();
  (projects||[]).filter(p=>p.status==='Active').forEach(p=>active.add(p.name));
  (timesheets||[]).forEach(t=>{ if(t.project && !NON_BILLABLE.includes(t.project)) active.add(t.project); });
  const arr = [...active].sort();
  PROJECT_COLOR_MAP = {};
  arr.forEach((name,i) => { PROJECT_COLOR_MAP[name] = PROJ_PALETTE[i % PROJ_PALETTE.length]; });
  NON_BILLABLE.forEach(name => { PROJECT_COLOR_MAP[name] = PROJ_NB_COLOR; });
}

function getRange() {
  const today = todayMidnight();
  let from, to = new Date(today);
  if (tsRangeMode==='2w')      { from=new Date(today); from.setDate(from.getDate()-14); }
  else if (tsRangeMode==='1m') { from=new Date(today); from.setMonth(from.getMonth()-1); }
  else if (tsRangeMode==='3m') { from=new Date(today); from.setMonth(from.getMonth()-3); }
  else if (tsRangeMode==='1y') { from=new Date(today); from.setFullYear(from.getFullYear()-1); }
  else { from=tsRangeFrom?new Date(tsRangeFrom):new Date(today); to=tsRangeTo?new Date(tsRangeTo):new Date(today); }
  return { from, to };
}

function renderTimesheet() {
  if (!D) return;
  buildColorMap(D.timesheets, D.projects);

  const today = todayMidnight();
  const twoWeeksAgo = new Date(today); twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);
  const twelveMonthsAgo = new Date(today); twelveMonthsAgo.setFullYear(today.getFullYear()-1);

  const allTs = D.timesheets || [];
  const playerTs = allTs.filter(t => (t.employee||'Seb') === tsPlayer);

  // KPI 1: missing days in past 2 weeks
  let missingDays=0, availHrs=0, loggedHrs=0;
  for (let d=new Date(twoWeeksAgo); d<today; d.setDate(d.getDate()+1)) {
    if (!isWorkday(d)) continue;
    availHrs += 8;
    const dayH = playerTs.filter(t=>t.date===ds(d)).reduce((a,t)=>a+(t.hours||0),0);
    loggedHrs += dayH;
    if (dayH < 8) missingDays++;
  }
  const busyPct   = availHrs>0 ? loggedHrs/availHrs*100 : 0;
  const twoWeekTs = playerTs.filter(t=>t.date>=ds(twoWeeksAgo)&&t.date<ds(today));
  const nbHrs     = twoWeekTs.filter(t=>NON_BILLABLE.includes(t.project)).reduce((a,t)=>a+(t.hours||0),0);
  const nbPct     = availHrs>0 ? nbHrs/availHrs*100 : 0;
  const yearTs    = playerTs.filter(t=>t.date>=ds(twelveMonthsAgo));
  const holidayD  = yearTs.filter(t=>t.project==='Holidays').reduce((a,t)=>a+(t.hours||0)/8,0);
  const sickD     = yearTs.filter(t=>t.project==='Sick days').reduce((a,t)=>a+(t.hours||0)/8,0);

  // Players list
  const players = [...new Set(allTs.map(t=>t.employee).filter(Boolean))];
  if (!players.includes('Seb')) players.unshift('Seb');
  const playerOpts = players.map(p=>`<option value="${p}"${p===tsPlayer?' selected':''}>${p}</option>`).join('');

  // Range buttons
  const rangeBtns = [
    {v:'2w',l:'Last 2 weeks'},{v:'1m',l:'Last month'},{v:'3m',l:'Last quarter'},{v:'1y',l:'Last year'}
  ].map(r=>`<button class="ts-range-btn${tsRangeMode===r.v?' active':''}" onclick="tsSetRange('${r.v}')">${r.l}</button>`).join('');
  const customBtn = `<button class="ts-range-btn${tsRangeMode==='custom'?' active':''}" onclick="tsSetRange('custom')">Custom</button>`;
  const customInputs = tsRangeMode==='custom' ? `
    <input type="date" id="ts-from" value="${tsRangeFrom||''}" onchange="tsCustomRange()" max="${ds(today)}">
    <span style="color:var(--ink-4)">→</span>
    <input type="date" id="ts-to" value="${tsRangeTo||ds(today)}" onchange="tsCustomRange()" max="${ds(today)}">` : '';

  document.getElementById('page-timesheet').innerHTML = `
    <!-- KPIs -->
    <div class="kpi-grid">
      ${kpi('Missing Days', missingDays, 'Past 2 weeks · need input', missingDays>0?'warn':'good')}
      ${kpiBar('How Busy', busyPct.toFixed(0)+'%', loggedHrs.toFixed(0)+'h logged of '+availHrs+'h available', busyPct, 'highlight')}
      ${kpiBar('Non-Billable', nbHrs.toFixed(0)+'h', 'Admin, office, sick…', nbPct, '')}
      ${kpi('Holidays', holidayD.toFixed(1)+'d', 'Rolling 12 months', '')}
      ${kpi('Sick Days', sickD.toFixed(1)+'d', 'Rolling 12 months', '')}
    </div>

    <!-- Player filter -->
    <div class="ts-filter-bar">
      <label>Player</label>
      <select id="ts-player" onchange="tsChangePlayer(this.value)">${playerOpts}</select>
    </div>

    <!-- Calendar -->
    <div class="section">
      <div class="section-head">
        <button class="ts-nav-btn" onclick="tsNavMonth(-1)">←</button>
        <h2 id="ts-cal-title" style="flex:1;text-align:center"></h2>
        <button class="ts-nav-btn" onclick="tsNavMonth(1)">→</button>
      </div>
      <div id="ts-legend" class="ts-legend"></div>
      <div id="ts-calendar" class="ts-cal-grid"></div>
    </div>

    <!-- Second filter -->
    <div class="ts-range-bar">
      <span class="ts-range-label">Period</span>
      ${rangeBtns}${customBtn}${customInputs}
    </div>

    <!-- Treemap -->
    <div class="section">
      <div class="section-head"><h2>Time Distribution</h2><span class="chart-clickable-hint">click a block for name + hours</span></div>
      <div class="section-body" style="padding:12px">
        <div id="ts-treemap" style="min-height:160px;width:100%"></div>
        <div id="ts-treemap-legend" style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="section">
      <div class="section-head"><h2>Timesheet Log</h2></div>
      <div id="ts-table"></div>
    </div>`;

  renderTsCalendar();
  renderTsTreemap();
  renderTsTable();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function renderTsCalendar() {
  const today = todayMidnight();
  const y = tsCalMonth.getFullYear(), mo = tsCalMonth.getMonth();

  const playerTs = (D.timesheets||[]).filter(t=>(t.employee||'Seb')===tsPlayer);

  // Build day lookup
  const dayMap = {};
  playerTs.forEach(t => {
    if (!dayMap[t.date]) dayMap[t.date] = [];
    dayMap[t.date].push({ project: t.project, hours: t.hours||0 });
  });

  document.getElementById('ts-cal-title').textContent =
    new Date(y,mo,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'});

  // Legend — active projects seen in this month
  const activeInMonth = new Set();
  Object.entries(dayMap).forEach(([d, entries]) => {
    if (d.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)) {
      entries.forEach(e => { if (!NON_BILLABLE.includes(e.project)) activeInMonth.add(e.project); });
    }
  });
  const legend = document.getElementById('ts-legend');
  legend.innerHTML = [...activeInMonth].map(p =>
    `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJECT_COLOR_MAP[p]||'#666'}"></div>${p}</div>`
  ).join('') + (activeInMonth.size
    ? `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJ_NB_COLOR}"></div>Non-billable</div>` : '');

  const firstDay = new Date(y, mo, 1);
  const lastDay  = new Date(y, mo+1, 0);
  let pad = firstDay.getDay() - 1; if (pad < 0) pad = 6;

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cal = document.getElementById('ts-calendar');

  let html = dayNames.map(d => `<div class="ts-day-hdr">${d}</div>`).join('');

  // Empty pad cells
  for (let i=0; i<pad; i++) html += `<div></div>`;

  for (let d=1; d<=lastDay.getDate(); d++) {
    const date = new Date(y, mo, d);
    const dStr = ds(date);
    const isFuture     = date > today;
    const isWknd       = isWeekend(date);
    const isHol        = isNSWHoliday(date);
    const isOffDay     = isWknd || isHol;       // weekend or public holiday — greyed for visual context
    const isGrey       = isOffDay || isFuture;
    const hlabel       = NSW_HOLIDAYS[dStr];
    const entries      = dayMap[dStr] || [];
    const totalH       = entries.reduce((a,e)=>a+e.hours,0);
    const isPast       = date < today;
    const isMiss       = isPast && !isGrey && totalH === 0;
    const isOver       = totalH > 8;
    // Off-days (weekends/holidays) that are today-or-earlier remain clickable —
    // tradies sometimes do work weekends/holidays and should be able to log it.
    const offDayClickable = isOffDay && !isFuture;

    if (isGrey && entries.length === 0) {
      const cls   = 'ts-cell ts-cell-grey' + (offDayClickable ? ' clickable' : '');
      const click = offDayClickable ? ` onclick="tsDayClick('${dStr}',event)"` : '';
      const tip   = offDayClickable ? `No hours logged — click to add (${isHol ? 'holiday' : 'weekend'})` : dStr;
      html += `<div class="${cls}"${click} title="${tip}">
        <span class="ts-day-num" style="color:var(--ink-4)">${d}</span>
        ${hlabel ? `<span class="ts-day-label">${hlabel}</span>` : ''}
      </div>`;
      continue;
    }

    if (isMiss) {
      html += `<div class="ts-cell ts-cell-missing clickable" onclick="tsDayClick('${dStr}',event)" title="No hours logged — click to add">
        <span class="ts-day-num">${d}</span>
        <div class="ts-miss-dot"></div>
      </div>`;
      continue;
    }

    if (entries.length > 0) {
      // Stacked bar: segments bottom-up, sorted by hours desc (largest at bottom)
      const sorted = entries.slice().sort((a,b)=>b.hours-a.hours);
      const fillPct = Math.min(100, totalH/8*100);
      // Build segments as % of cell height
      let segsHtml = '';
      sorted.forEach(e => {
        const segH = (e.hours / Math.max(totalH, 0.01)) * fillPct;
        const col  = PROJECT_COLOR_MAP[e.project] || '#555';
        segsHtml += `<div class="ts-bar-seg" style="height:${segH.toFixed(1)}%;background:${col};opacity:.85"></div>`;
      });
      const borderStyle = isOver
        ? `2px solid ${PROJECT_COLOR_MAP[sorted[0].project]||'var(--amber)'}`
        : '1px solid var(--border)';
      html += `<div class="ts-cell clickable" style="border:${borderStyle}" onclick="tsDayClick('${dStr}',event)" title="${totalH}h logged">
        <span class="ts-day-num" style="position:relative;z-index:2">${d}</span>
        <div class="ts-bar-fill" style="position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse;height:100%">${segsHtml}</div>
      </div>`;
      continue;
    }

    // Today or future day within working week with no entries yet
    html += `<div class="ts-cell clickable" onclick="tsDayClick('${dStr}',event)" title="${dStr}">
      <span class="ts-day-num">${d}</span>
    </div>`;
  }

  cal.innerHTML = html;
}

function claudeSetState(state) {
  // states: idle | processing
  const addBtn = document.getElementById('claude-add-btn');
  const inp    = document.getElementById('claude-bar-input');
  const btn    = document.getElementById('claude-send-btn');

async function claudeFilesSelected(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/') && file.type !== 'application/pdf') continue;
    try {
      const { data, type } = await fileToBase64(file);
      _attachedFiles.push({ name: file.name, type, data });
    } catch(e) { claudeToast('Could not read file: ' + file.name, 'error'); }
  }
  renderChips();
  document.getElementById('claude-file-input').value = '';
}

async function fileToBase64(file) {
  if (file.type.startsWith('image/')) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const maxDim = 1200;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ data: canvas.toDataURL('image/jpeg', 0.85).split(',')[1], type: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = url;
    });
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ data: reader.result.split(',')[1], type: file.type });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function claudeRemoveFile(i) {

  renderChips();
}

function renderChips() {
  const container = document.getElementById('claude-file-chips');
  if (!_attachedFiles.length) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = 'flex';
  container.innerHTML = _attachedFiles.map((f, i) => {
    const preview = f.type.startsWith('image/')
      ? `<img src="data:${f.type};base64,${f.data}" style="width:18px;height:18px;object-fit:cover;border-radius:3px;flex-shrink:0">`
      : `<span style="font-size:13px;flex-shrink:0">📄</span>`;
    const name = f.name.length > 18 ? f.name.slice(0, 15) + '…' : f.name;
    return `<span class="claude-chip">${preview}<span class="claude-chip-name">${name.replace(/</g,'&lt;')}</span><span class="claude-chip-rm" onclick="claudeRemoveFile(${i})">✕</span></span>`;
  }).join('');
}

// Stores a pending action awaiting "yes" confirmation from the user
window._pendingConfirm = null;

async function claudeBarSend() {
  const inp  = document.getElementById('claude-bar-input');
  const text = inp.value.trim();
  if (!text && !_attachedFiles.length) return;

  // ── Check for confirmation ("yes"/"yep"/"ok" etc.) ───────────────────────
  const isYes = /^(yes|yeah|yep|yup|ok|correct|confirm|sure|go ahead)$/i.test(text);
  if (isYes && window._pendingConfirm) {
    const pending = window._pendingConfirm;
    window._pendingConfirm = null;
    inp.value = '';
    claudeSetState('processing');
    try {
      const res = await fetch('/.netlify/functions/claude-parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pendingAction: pending })
      });
      const data = await res.json();
      claudeSetState('idle');
      claudeHandleResponse(data, inp);
    } catch (err) {
      claudeSetState('idle');
      claudeToast('⚠ Connection error — try again', 'error');
    }
    return;
  }

  // Any non-yes input clears the pending confirmation
  window._pendingConfirm = null;

  claudeSetState('processing');

  try {
    const payload = { text: text || 'Parse this receipt and log the expense.' };
    if (_attachedFiles.length) {
      payload.images = _attachedFiles.map(f => ({ name: f.name, mediaType: f.type, data: f.data }));
    }
    const res = await fetch('/.netlify/functions/claude-parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    claudeSetState('idle');
    claudeHandleResponse(data, inp);

  } catch (err) {
    claudeSetState('idle');
    claudeToast('⚠ Connection error — try again', 'error');
  }
}

function claudeHandleResponse(data, inp) {
  if (data.status === 'success') {
    inp.value = '';
    _attachedFiles = [];
    renderChips();
    const action = data.action || '';
    let msg = '';
    if (action === 'new' && data.entry) {
      const e = data.entry;
      msg = data.type === 'timesheet'
        ? `✓ Logged ${e.hours}h · ${e.project} · ${e.date}`
        : `✓ Logged $${e.amount} · ${(e.description||'').slice(0,35)}`;
    } else if (action === 'edit')   msg = `✏ ${data.label}`;
    else if (action === 'delete')   msg = `🗑 ${data.label}`;
    else msg = `✓ ${data.label || 'Done'}`;
    claudeToast(msg, 'success');

    // Optimistic in-memory update — no re-fetch needed
    if (D) {
      if (action === 'new' && data.entry) {
        if (data.type === 'timesheet') {
          D.timesheets = D.timesheets || [];
          D.timesheets.push(data.entry);
        } else {
          D.expense_log = D.expense_log || [];
          D.expense_log.push(data.entry);
        }
      } else if (action === 'edit' && data.updated) {
        const updatedArr = Array.isArray(data.updated) ? data.updated : [data.updated];
        updatedArr.forEach(u => {
          const idx = (D.timesheets||[]).findIndex(ts => ts.id === u.id);
          if (idx !== -1) D.timesheets[idx] = u;
        });
      } else if (action === 'delete' && data.deleted) {
        D.timesheets = (D.timesheets||[]).filter(ts => ts.id !== data.deleted.id);
      }
      renderAll();
      if (document.getElementById('page-timesheet').classList.contains('active')) renderTimesheet();
    }

  } else if (data.status === 'confirm') {
    // Store the pending action and prompt Seb to confirm
    window._pendingConfirm = data.pending;
    claudeToast(`❓ ${data.message} — type yes to confirm`, 'unclear', 8000);

  } else if (data.status === 'unclear') {
    claudeToast('❓ ' + (data.message || 'Could not understand — try again'), 'unclear');
  } else {
    claudeToast('⚠ ' + (data.message || 'Something went wrong'), 'error');
  }
}

function claudeToast(msg, type='success', duration) {
  const t = document.getElementById('claude-toast');
  t.textContent = msg;
  t.className = type;
  clearTimeout(t._timer);
  const ms = duration || (type === 'success' ? 3000 : 4500);
  t._timer = setTimeout(() => { t.className = ''; }, ms);
}

// ── Treemap ───────────────────────────────────────────────────────────────────
// Squarified treemap: recursively splits the rect along the longest axis,
// greedily adding items to a strip while the worst aspect ratio improves.
function squarify(items, x, y, w, h) {
  const result = [];
  function layout(nodes, x, y, w, h) {
    if (!nodes.length) return;
    if (nodes.length === 1) {
      result.push({ ...nodes[0], rx: x, ry: y, rw: w, rh: h });
      return;
    }
    const totalArea = nodes.reduce((s, n) => s + n.area, 0);

    function worstRatio(row, stripW, stripH) {
      const rowArea = row.reduce((s, n) => s + n.area, 0);
      let worst = 0;
      for (const n of row) {
        const bw = stripW >= stripH ? stripW : n.area / (rowArea / stripH);
        const bh = stripW >= stripH ? n.area / (rowArea / stripW) : stripH;
        worst = Math.max(worst, bw > bh ? bw / bh : bh / bw);
      }
      return worst;
    }

    // Build best strip along the shorter axis
    let strip = [];
    let best = Infinity;
    for (const node of nodes) {
      const candidate = [...strip, node];
      const ratio = worstRatio(candidate, w, h);
      if (ratio < best) { strip = candidate; best = ratio; }
      else break;
    }

    const stripArea = strip.reduce((s, n) => s + n.area, 0);
    const stripFrac = stripArea / totalArea;

    if (w >= h) {
      // Strip runs top-to-bottom along left edge; width = fraction of w
      const stripW = w * stripFrac;
      let cy = y;
      for (const n of strip) {
        const nh = h * (n.area / stripArea);
        result.push({ ...n, rx: x, ry: cy, rw: stripW, rh: nh });
        cy += nh;
      }
      layout(nodes.slice(strip.length), x + stripW, y, w - stripW, h);
    } else {
      // Strip runs left-to-right along top edge; height = fraction of h
      const stripH = h * stripFrac;
      let cx = x;
      for (const n of strip) {
        const nw = w * (n.area / stripArea);
        result.push({ ...n, rx: cx, ry: y, rw: nw, rh: stripH });
        cx += nw;
      }
      layout(nodes.slice(strip.length), x, y + stripH, w, h - stripH);
    }
  }
  layout(items, x, y, w, h);
  return result;
}

function renderTsTreemap() {
  const { from, to } = getRange();
  const playerTs = (D.timesheets||[]).filter(t => {
    return (t.employee||'Seb')===tsPlayer && t.date>=ds(from) && t.date<=ds(to);
  });

  // Available workday hours in range — exclude today
  const todayStr = ds(todayMidnight());
  let avail = 0;
  for (let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) {
    if (isWorkday(d) && ds(d) < todayStr) avail += 8;
  }

  // Group by project
  const byProj = {};
  playerTs.forEach(t => { byProj[t.project] = (byProj[t.project]||0)+(t.hours||0); });
  const total = playerTs.reduce((a,t)=>a+(t.hours||0),0);
  const missing = Math.max(0, avail-total);

  const items = Object.entries(byProj)
    .sort((a,b)=>b[1]-a[1])
    .map(([name,hrs]) => ({ name, hrs, color: PROJECT_COLOR_MAP[name]||'#555', isGap:false }));
  if (missing>0.5) items.push({ name:'Not logged', hrs:missing, color:'rgba(255,0,110,0.12)', isGap:true });

  const tmEl = document.getElementById('ts-treemap');
  const lgEl = document.getElementById('ts-treemap-legend');
  if (!tmEl) return;

  const W = tmEl.offsetWidth || 600;
  const H = 160;
  const tmTotal = items.reduce((s, i) => s + i.hrs, 0) || 1;

  // Attach normalised area (pixels²) to each item
  const nodes = items
    .filter(i => i.hrs / tmTotal >= 0.005)
    .map(i => ({ ...i, area: (i.hrs / tmTotal) * W * H }));

  const rects = squarify(nodes, 0, 0, W, H);

  tmEl.style.cssText = 'position:relative;height:' + H + 'px';
  tmEl.innerHTML = rects.map(r => {
    const gap = 2;
    const textColor = r.isGap ? '#FF006E' : 'rgba(0,0,0,0.85)';
    const showLabel = r.rw > 40 && r.rh > 30;
    return `<div
      onclick="tsTmTip(this,'${r.name.replace(/'/g,"\\'")}',${r.hrs})"
      style="position:absolute;left:${r.rx+gap}px;top:${r.ry+gap}px;
             width:${Math.max(0,r.rw-gap*2)}px;height:${Math.max(0,r.rh-gap*2)}px;
             background:${r.color};border-radius:5px;cursor:pointer;overflow:hidden;
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             border:${r.isGap?'1px dashed rgba(255,0,110,0.4)':'none'};
             box-sizing:border-box;padding:4px;text-align:center">
      ${showLabel ? `<div style="font-size:10px;font-weight:700;color:${textColor};line-height:1.3;word-break:break-word">${r.name}</div>
      <div style="font-size:13px;font-weight:700;color:${textColor}">${r.hrs.toFixed(0)}h</div>` : ''}
    </div>`;
  }).join('');

  lgEl.innerHTML = items.map(i =>
    `<div class="ts-legend-item">
      <div class="ts-legend-dot" style="background:${i.color};border:${i.isGap?'1px dashed rgba(255,0,110,.5)':'none'}"></div>
      <span>${i.name} — ${i.hrs.toFixed(0)}h</span>
    </div>`
  ).join('');
}

function tsTmTip(el, name, hrs) {

  document.querySelectorAll('.ts-tm-tip').forEach(t=>t.remove());
  const tip = document.createElement('div');

  tip.style.cssText = 'position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;font-size:11px;padding:4px 10px;border-radius:4px;pointer-events:none;white-space:nowrap;z-index:5;border:1px solid var(--border-2)';
  tip.textContent = name + ' · ' + hrs.toFixed(0) + 'h';
  el.style.position = 'relative';
  el.appendChild(tip);
  setTimeout(() => tip.remove(), 2500);
}
