// same pattern as "Admin" above. Seb's ask 2026-07-10: it was showing in the
// billable Project table; it belongs with the non-billable ones instead.
const NON_BILLABLE = ['Daddy','Admin','Consumables','Wasted Time','Quote','Office','Holidays','Sick days','Carer days',"Eléa's bed","Elea's bed"];
const NON_BILLABLE_LC = NON_BILLABLE.map(s => s.toLowerCase());
function isNonBillable(name) { return !!name && NON_BILLABLE_LC.includes(String(name).trim().toLowerCase()); }

// NSW public holidays (no Bank Holidays — not applicable)
const NSW_HOLIDAYS = {
  '2025-01-01':'NYD','2025-01-27':'AUD','2025-04-18':'GFR','2025-04-19':'ESA',
  '2025-04-20':'ESU','2025-04-21':'EMO','2025-04-25':'ANZ','2025-06-09':'KBD',
  '2025-10-06':'LAB','2025-12-25':'CHR','2025-12-26':'BOX',
  '2026-01-01':'NYD','2026-01-26':'AUD','2026-04-03':'GFR','2026-04-04':'ESA',
  '2026-04-05':'ESU','2026-04-06':'EMO','2026-04-25':'ANZ','2026-06-08':'KBD',
  '2026-10-05':'LAB','2026-12-25':'CHR','2026-12-28':'BOX',
};

// ── HUB_PALETTE — canonical hub-wide categorical colour palette (10 neon) ─────
// Single source of truth for any feature that needs multiple distinct colours
// (project colours, charts, category tags…). Edit here to re-colour the whole HUB.
// See CLAUDE.md → "Shared UI styles".
const HUB_PALETTE = ['#FF0080','#FF3300','#FF6B00','#FFE600','#00FF41','#00FFCC','#00C8FF','#3D00FF','#CC00FF','#FF00FF'];

// Active-project colours draw from the hub palette (cycles if more than 10)
const PROJ_PALETTE = HUB_PALETTE;
const PROJ_NB_COLOR = '#383838';   // non-billable grey
let PROJECT_COLOR_MAP = {};

// Pick black or white text for readability on a given background hex
function textOn(hex) {
  const h = String(hex || '').replace('#', '');
  if (h.length < 6) return '#000';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? '#000' : '#fff';
}

let tsPlayer     = 'Seb';
let tsCalMonth   = new Date();
let tsRangeMode  = '2w';
let tsRangeFrom  = null;
let tsRangeTo    = null;

// Timesheet Log table filters — independent of the period/player selectors above;
// these only narrow what's shown in the table itself, not the calendar/treemap/summary.
let tsTableProject = 'All';
let tsTableSearch   = '';

function ds(d) {
  // Use local date parts — avoids UTC offset shifting the date
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Returns today's date string in Sydney timezone (AEST/AEDT)
// More reliable than new Date() which can shift at day boundaries
function todayStrSydney() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
  // en-CA locale returns YYYY-MM-DD format
}

// Returns a Date object for the start of today in local/Sydney time
function todayMidnight() {
  const s = todayStrSydney();
  return new Date(s + 'T00:00:00');
}

function isWeekend(d) { const w=d.getDay(); return w===0||w===6; }
function isNSWHoliday(d) { return !!NSW_HOLIDAYS[ds(d)]; }
function isWorkday(d) { return !isWeekend(d) && !isNSWHoliday(d); }

function buildColorMap(timesheets, projects) {
  const active = new Set();
  (projects||[]).filter(p=>p.status==='Active').forEach(p=>active.add(p.name));
  (timesheets||[]).forEach(t=>{ if(t.project && !NON_BILLABLE.includes(t.project)) active.add(t.project); });
  const arr = [...active].sort();
  PROJECT_COLOR_MAP = {};
  arr.forEach((name,i) => { PROJECT_COLOR_MAP[name] = PROJ_PALETTE[i % PROJ_PALETTE.length]; });
  NON_BILLABLE.forEach(name => { PROJECT_COLOR_MAP[name] = PROJ_NB_COLOR; });
}

function getRange() {
  const today = todayMidnight();
  let from, to = new Date(today);
  if (tsRangeMode==='2w')      { from=new Date(today); from.setDate(from.getDate()-14); }
  else if (tsRangeMode==='1m') { from=new Date(today); from.setMonth(from.getMonth()-1); }
  else if (tsRangeMode==='3m') { from=new Date(today); from.setMonth(from.getMonth()-3); }
  else if (tsRangeMode==='1y') { from=new Date(today); from.setFullYear(from.getFullYear()-1); }
  else { from=tsRangeFrom?new Date(tsRangeFrom):new Date(today); to=tsRangeTo?new Date(tsRangeTo):new Date(today); }
  return { from, to };
}

function renderTimesheet() {
  if (!D) return;
  buildColorMap(D.timesheets, D.projects);

  const today = todayMidnight();
  const twoWeeksAgo = new Date(today); twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);
  const twelveMonthsAgo = new Date(today); twelveMonthsAgo.setFullYear(today.getFullYear()-1);

  const allTs = D.timesheets || [];
  const playerTs = allTs.filter(t => (t.employee||'Seb') === tsPlayer);

  // KPI 1: missing days in past 2 weeks
  let missingDays=0, availHrs=0, loggedHrs=0;
  for (let d=new Date(twoWeeksAgo); d<today; d.setDate(d.getDate()+1)) {
    if (!isWorkday(d)) continue;
    availHrs += 8;
    const dayH = playerTs.filter(t=>t.date===ds(d)).reduce((a,t)=>a+(t.hours||0),0);
    loggedHrs += dayH;
    if (dayH < 8) missingDays++;
  }
  const busyPct   = availHrs>0 ? loggedHrs/availHrs*100 : 0;
  const twoWeekTs = playerTs.filter(t=>t.date>=ds(twoWeeksAgo)&&t.date<ds(today));
  const nbHrs     = twoWeekTs.filter(t=>NON_BILLABLE.includes(t.project)).reduce((a,t)=>a+(t.hours||0),0);
  const nbPct     = availHrs>0 ? nbHrs/availHrs*100 : 0;
  const yearTs    = playerTs.filter(t=>t.date>=ds(twelveMonthsAgo));
  const holidayD  = yearTs.filter(t=>t.project==='Holidays').reduce((a,t)=>a+(t.hours||0)/8,0);
  const sickD     = yearTs.filter(t=>t.project==='Sick days').reduce((a,t)=>a+(t.hours||0)/8,0);

  // Players list
  const players = [...new Set(allTs.map(t=>t.employee).filter(Boolean))];
  if (!players.includes('Seb')) players.unshift('Seb');
  const playerOpts = players.map(p=>`<option value="${p}"${p===tsPlayer?' selected':''}>${p}</option>`).join('');

  // Range buttons
  const rangeBtns = [
    {v:'2w',l:'Last 2 weeks'},{v:'1m',l:'Last month'},{v:'3m',l:'Last quarter'},{v:'1y',l:'Last year'}
  ].map(r=>`<button class="ts-range-btn${tsRangeMode===r.v?' active':''}" onclick="tsSetRange('${r.v}')">${r.l}</button>`).join('');
  const customBtn = `<button class="ts-range-btn${tsRangeMode==='custom'?' active':''}" onclick="tsSetRange('custom')">Custom</button>`;
  const customInputs = tsRangeMode==='custom' ? `
    <input type="date" id="ts-from" value="${tsRangeFrom||''}" onchange="tsCustomRange()" max="${ds(today)}">
    <span style="color:var(--ink-4)">→</span>
    <input type="date" id="ts-to" value="${tsRangeTo||ds(today)}" onchange="tsCustomRange()" max="${ds(today)}">` : '';

  document.getElementById('page-timesheet').innerHTML = `
    <button class="btn-primary ts-logbtn" onclick="tsQuickLog()">＋ Log hours</button>
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi ${missingDays>0?'warn':'good'}" style="cursor:pointer" onclick="tsShowMissing('${ds(twoWeeksAgo)}','${ds(today)}')" title="Click to see and fill the missing days">
        <div class="kpi-label">Missing Days</div>
        <div class="kpi-value">${missingDays}</div>
        <div class="kpi-sub">Past 2 weeks · click to fill →</div>
      </div>
      ${kpiBar('How Busy', busyPct.toFixed(0)+'%', loggedHrs.toFixed(0)+'h logged of '+availHrs+'h available', busyPct, 'highlight')}
      ${kpiBar('Non-Billable', nbHrs.toFixed(0)+'h', 'Admin, office, sick…', nbPct, '')}
      ${kpi('Leave', holidayD.toFixed(1)+' / '+sickD.toFixed(1)+'d', 'Holidays / Sick · 12 mo', '')}
    </div>

    <!-- Player filter -->
    <div class="ts-filter-bar">
      <label>Player</label>
      <select id="ts-player" onchange="tsChangePlayer(this.value)">${playerOpts}</select>
    </div>

    <!-- Calendar -->
    <div class="section">
      <div class="section-head">
        <button class="ts-nav-btn" onclick="tsNavMonth(-1)">←</button>
        <h2 id="ts-cal-title" style="flex:1;text-align:center"></h2>
        <button class="ts-nav-btn" onclick="tsNavMonth(1)">→</button>
      </div>
      <div id="ts-legend" class="ts-legend"></div>
      <div id="ts-calendar" class="ts-cal-grid"></div>
    </div>

    <!-- Second filter -->
    <div class="ts-range-bar">
      <span class="ts-range-label">Period</span>
      ${rangeBtns}${customBtn}${customInputs}
    </div>

    <!-- Period summary -->
    <div class="section">
      <div class="section-head"><h2>Period Summary</h2></div>
      <div class="section-body" id="ts-summary" style="padding:14px 16px"></div>
    </div>

    <!-- Treemap -->
    <div class="section">
      <div class="section-head"><h2>Time Distribution</h2><span class="chart-clickable-hint">click "Not logged" to fill missing days</span></div>
      <div class="section-body" style="padding:12px">
        <div id="ts-treemap" style="min-height:160px;width:100%"></div>
        <div id="ts-treemap-legend" style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="section">
      <div class="section-head"><h2>Timesheet Log</h2></div>
      <div class="ts-filter-bar" id="ts-table-filters" style="padding-top:0;margin-bottom:10px"></div>
      <div id="ts-table"></div>
    </div>`;

  renderTsCalendar();
  renderTsTreemap();
  tsRenderTableFilters();
  renderTsTable();
  tsRenderSummary();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function renderTsCalendar() {
  const today = todayMidnight();
  const y = tsCalMonth.getFullYear(), mo = tsCalMonth.getMonth();

  const playerTs = (D.timesheets||[]).filter(t=>(t.employee||'Seb')===tsPlayer);

  // Build day lookup
  const dayMap = {};
  playerTs.forEach(t => {
    if (!dayMap[t.date]) dayMap[t.date] = [];
    dayMap[t.date].push({ project: t.project, hours: t.hours||0 });
  });

  document.getElementById('ts-cal-title').textContent =
    new Date(y,mo,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'});

  // Legend — active projects seen in this month
  const activeInMonth = new Set();
  Object.entries(dayMap).forEach(([d, entries]) => {
    if (d.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)) {
      entries.forEach(e => { if (!NON_BILLABLE.includes(e.project)) activeInMonth.add(e.project); });
    }
  });
  const legend = document.getElementById('ts-legend');
  legend.innerHTML = [...activeInMonth].map(p =>
    `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJECT_COLOR_MAP[p]||'#666'}"></div>${p}</div>`
  ).join('') + (activeInMonth.size
    ? `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJ_NB_COLOR}"></div>Non-billable</div>` : '');

  const firstDay = new Date(y, mo, 1);
  const lastDay  = new Date(y, mo+1, 0);
  let pad = firstDay.getDay() - 1; if (pad < 0) pad = 6;

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cal = document.getElementById('ts-calendar');

  let html = dayNames.map(d => `<div class="ts-day-hdr">${d}</div>`).join('');

  // Empty pad cells
  for (let i=0; i<pad; i++) html += `<div></div>`;

  for (let d=1; d<=lastDay.getDate(); d++) {
    const date = new Date(y, mo, d);
    const dStr = ds(date);
    const isFuture     = date > today;
    const isWknd       = isWeekend(date);
    const isHol        = isNSWHoliday(date);
    const isOffDay     = isWknd || isHol;       // weekend or public holiday — greyed for visual context
    const isGrey       = isOffDay || isFuture;
    const hlabel       = NSW_HOLIDAYS[dStr];
    const entries      = dayMap[dStr] || [];
    const totalH       = entries.reduce((a,e)=>a+e.hours,0);
    const isPast       = date < today;
    const isMiss       = isPast && !isGrey && totalH === 0;
    const isOver       = totalH > 8;
    // Off-days (weekends/holidays) that are today-or-earlier remain clickable —
    // tradies sometimes do work weekends/holidays and should be able to log it.
    const offDayClickable = isOffDay && !isFuture;

    if (isGrey && entries.length === 0) {
      const cls   = 'ts-cell ts-cell-grey' + (offDayClickable ? ' clickable' : '');
      const click = offDayClickable ? ` onclick="tsDayClick('${dStr}',event)"` : '';
      const tip   = offDayClickable ? `No hours logged — click to add (${isHol ? 'holiday' : 'weekend'})` : (hlabel ? `${dStr} · public holiday` : dStr);
      html += `<div class="${cls}"${click} title="${tip}">
        <span class="ts-day-num" style="color:var(--ink-4)">${d}</span>
        ${hlabel ? `<span class="ts-ph-label">${hlabel}</span>` : ''}
      </div>`;
      continue;
    }

    if (isMiss) {
      html += `<div class="ts-cell ts-cell-missing clickable" onclick="tsDayClick('${dStr}',event)" title="No hours logged — click to add">
        <span class="ts-day-num">${d}</span>
        <div class="ts-miss-dot"></div>
      </div>`;
      continue;
    }

    if (entries.length > 0) {
      // Stacked bar: segments bottom-up, sorted by hours desc (largest at bottom)
      const sorted = entries.slice().sort((a,b)=>b.hours-a.hours);
      const fillPct = Math.min(100, totalH/8*100);
      // Build segments as % of cell height
      let segsHtml = '';
      sorted.forEach(e => {
        const segH = (e.hours / Math.max(totalH, 0.01)) * fillPct;
        const col  = PROJECT_COLOR_MAP[e.project] || '#555';
        segsHtml += `<div class="ts-bar-seg" style="height:${segH.toFixed(1)}%;background:${col};opacity:.85"></div>`;
      });
      const isPartial = isPast && !isOffDay && totalH < 8;
      const borderStyle = isOver
        ? `2px solid ${PROJECT_COLOR_MAP[sorted[0].project]||'var(--amber)'}`
        : (isPartial ? '1px solid rgba(255,190,11,.55)' : '1px solid var(--border)');
      const cellCls = 'ts-cell clickable' + (isPartial ? ' ts-cell-incomplete' : '');
      const tip = isPartial ? `${totalH}h logged — under 8h, click to complete` : `${totalH}h logged`;
      html += `<div class="${cellCls}" style="border:${borderStyle}" onclick="tsDayClick('${dStr}',event)" title="${tip}">
        <span class="ts-day-num" style="position:relative;z-index:2">${d}</span>
        ${isPartial ? '<div class="ts-incomplete-dot"></div>' : ''}
        <div class="ts-bar-fill" style="position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse;height:100%">${segsHtml}</div>
      </div>`;
      continue;
    }

    // Today or future day within working week with no entries yet
    html += `<div class="ts-cell clickable" onclick="tsDayClick('${dStr}',event)" title="${dStr}">
      <span class="ts-day-num">${d}</span>
    </div>`;
  }

  cal.innerHTML = html;
}

// Show a clickable list of past workdays under 8h in [fromStr, toStr); clicking a
// day opens that day's add-entry popup. Used by the Missing Days KPI and the
// "Not logged" treemap block so the user jumps straight to filling the gaps.
function tsShowMissing(fromStr, toStr) {
  const playerTs = (D.timesheets||[]).filter(t => (t.employee||'Seb')===tsPlayer);
  const today = todayMidnight();
  const from = new Date(fromStr + 'T00:00:00');
  const to   = new Date(toStr + 'T00:00:00');
  const miss = [];
  for (let d=new Date(from); d<to && d<today; d.setDate(d.getDate()+1)) {
    if (!isWorkday(d)) continue;
    const dStr = ds(d);
    const h = playerTs.filter(t=>t.date===dStr).reduce((a,t)=>a+(t.hours||0),0);
    if (h < 8) miss.push({ dStr, h });
  }
  miss.reverse();   // most recent first

  const rows = miss.length ? miss.map(m => {
    const label = new Date(m.dStr+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
    const tag = m.h===0
      ? '<span style="color:var(--pink);font-weight:700">0h</span>'
      : `<span style="color:var(--amber);font-weight:700">${m.h}h / 8h</span>`;
    return `<div onclick="tsDayClick('${m.dStr}')" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;background:var(--bg-3);margin-bottom:5px;font-size:12px" onmouseover="this.style.background='var(--bg-1)'" onmouseout="this.style.background='var(--bg-3)'">
      <span style="flex:1;color:var(--ink-2)">${label}</span>${tag}
      <span style="color:var(--ink-4);font-size:11px">fill →</span>
    </div>`;
  }).join('') : `<div style="color:var(--sage);font-size:12px;padding:8px 4px">✓ All workdays in this window are fully logged.</div>`;

  const popup = document.getElementById('ts-popup');
  popup.innerHTML = `
    <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:700;color:var(--ink)">Missing entries</div>
      <div style="font-size:11px;color:var(--ink-4);margin-top:2px">${miss.length} day${miss.length===1?'':'s'} under 8h · click one to fill it</div>
    </div>
    <div style="padding:12px 14px;max-height:340px;overflow:auto">${rows}</div>`;
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  document.getElementById('ts-popup-overlay').style.display = 'block';
}

async function fileToBase64(file) {
  if (file.type.startsWith('image/')) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        // 1568px = Claude's vision long-edge cap; anything bigger is downscaled
        // server-side anyway. Receipts are long & full of fine print, so we send
        // the max useful resolution (was 900px/0.80, which made small rows
        // unreadable and dropped line items).
        const maxDim = 1568;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve({ data: canvas.toDataURL('image/jpeg', 0.9).split(',')[1], type: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = url;
    });
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ data: reader.result.split(',')[1], type: file.type });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Stores a pending action awaiting "yes" confirmation from the user
window._pendingConfirm = null;

async function claudeBarSend() {
  const inp  = document.getElementById('claude-bar-input');
  const text = inp.value.trim();
  if (!text && !_attachedFiles.length) return;

  // ── Check for confirmation ("yes"/"yep"/"ok" etc.) ───────────────────────
  const isYes = /^(yes|yeah|yep|yup|ok|correct|confirm|sure|go ahead)$/i.test(text);
  if (isYes && window._pendingConfirm) {
    const pending = window._pendingConfirm;
    window._pendingConfirm = null;
    inp.value = '';
    claudeSetState('processing');
    try {
      const res = await fetch('/.netlify/functions/claude-parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pendingAction: pending })
      });
      const data = await res.json();
      claudeSetState('idle');
      claudeHandleResponse(data, inp);
    } catch (err) {
      claudeSetState('idle');
      claudeToast('⚠ Connection error — try again', 'error');
    }
    return;
  }

  // Any non-yes input clears the pending confirmation
  window._pendingConfirm = null;

  claudeSetState('processing');

  try {
    const payload = { text: text || 'Parse this receipt and log the expense.' };
    if (_attachedFiles.length) {
      payload.images = _attachedFiles.map(f => ({ name: f.name, mediaType: f.type, data: f.data }));
    }
    const res = await fetch('/.netlify/functions/claude-parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let data;
    try { data = await res.json(); }
    catch(e) {
      claudeSetState('idle');
      claudeToast(`⚠ Server error (${res.status}) — check Netlify logs`, 'error');
      return;
    }
    claudeSetState('idle');
    claudeHandleResponse(data, inp);

  } catch (err) {
    claudeSetState('idle');
    claudeToast('⚠ ' + (err.message || 'Connection error — try again'), 'error');
  }
}

function claudeHandleResponse(data, inp) {
  if (data.status === 'success') {
    inp.value = '';
    _attachedFiles = [];
    renderChips();
    const action = data.action || '';
    let msg = '';
    if (data.type === 'expense_batch' && data.entries) {
      msg = `✓ ${data.label}`;
    } else if (action === 'new' && data.entry) {
      const e = data.entry;
      msg = data.type === 'timesheet'
        ? `✓ Logged ${e.hours}h · ${e.project} · ${e.date}`
        : `✓ Logged $${e.amount} · ${(e.description||'').slice(0,35)}`;
    } else if (action === 'edit')   msg = `✏ ${data.label}`;
    else if (action === 'delete')   msg = `🗑 ${data.label}`;
    else msg = `✓ ${data.label || 'Done'}`;
    claudeToast(msg, 'success');

    // Optimistic in-memory update — no re-fetch needed
    if (D) {
      if (data.type === 'expense_batch' && data.entries) {
        D.expense_log = D.expense_log || [];
        data.entries.forEach(e => D.expense_log.push(e));
      } else if (action === 'new' && data.entry) {
        if (data.type === 'timesheet') {
          D.timesheets = D.timesheets || [];
          D.timesheets.push(data.entry);
        } else {
          D.expense_log = D.expense_log || [];
          D.expense_log.push(data.entry);
        }
      } else if (action === 'edit' && data.updated) {
        const updatedArr = Array.isArray(data.updated) ? data.updated : [data.updated];
        updatedArr.forEach(u => {
          const idx = (D.timesheets||[]).findIndex(ts => ts.id === u.id);
          if (idx !== -1) D.timesheets[idx] = u;
        });
      } else if (action === 'delete' && data.deleted) {
        D.timesheets = (D.timesheets||[]).filter(ts => ts.id !== data.deleted.id);
      }
      renderAll();
      if (document.getElementById('page-timesheet').classList.contains('active')) renderTimesheet();
    }

  } else if (data.status === 'confirm') {
    // Store the pending action and prompt Seb to confirm
    window._pendingConfirm = data.pending;
    claudeToast(`❓ ${data.message} — type yes to confirm`, 'unclear', 8000);

  } else if (data.status === 'unclear') {
    claudeToast('❓ ' + (data.message || 'Could not understand — try again'), 'unclear');
  } else {
    claudeToast('⚠ ' + (data.message || 'Something went wrong'), 'error');
  }
}

function claudeToast(msg, type='success', duration) {
  const t = document.getElementById('claude-toast');
  t.textContent = msg;
  t.className = type;
  clearTimeout(t._timer);
  const ms = duration || (type === 'success' ? 3000 : 4500);
  t._timer = setTimeout(() => { t.className = ''; }, ms);
}

// ── Treemap ───────────────────────────────────────────────────────────────────
// Squarified treemap: recursively splits the rect along the longest axis,
// greedily adding items to a strip while the worst aspect ratio improves.
function squarify(items, x, y, w, h) {
  const result = [];
  function layout(nodes, x, y, w, h) {
    if (!nodes.length) return;
    if (nodes.length === 1) {
      result.push({ ...nodes[0], rx: x, ry: y, rw: w, rh: h });
      return;
    }
    const totalArea = nodes.reduce((s, n) => s + n.area, 0);

    function worstRatio(row, stripW, stripH) {
      const rowArea = row.reduce((s, n) => s + n.area, 0);
      let worst = 0;
      for (const n of row) {
        const bw = stripW >= stripH ? stripW : n.area / (rowArea / stripH);
        const bh = stripW >= stripH ? n.area / (rowArea / stripW) : stripH;
        worst = Math.max(worst, bw > bh ? bw / bh : bh / bw);
      }
      return worst;
    }

    // Build best strip along the shorter axis
    let strip = [];
    let best = Infinity;
    for (const node of nodes) {
      const candidate = [...strip, node];
      const ratio = worstRatio(candidate, w, h);
      if (ratio < best) { strip = candidate; best = ratio; }
      else break;
    }

    const stripArea = strip.reduce((s, n) => s + n.area, 0);
    const stripFrac = stripArea / totalArea;

    if (w >= h) {
      // Strip runs top-to-bottom along left edge; width = fraction of w
      const stripW = w * stripFrac;
      let cy = y;
      for (const n of strip) {
        const nh = h * (n.area / stripArea);
        result.push({ ...n, rx: x, ry: cy, rw: stripW, rh: nh });
        cy += nh;
      }
      layout(nodes.slice(strip.length), x + stripW, y, w - stripW, h);
    } else {
      // Strip runs left-to-right along top edge; height = fraction of h
      const stripH = h * stripFrac;
      let cx = x;
      for (const n of strip) {
        const nw = w * (n.area / stripArea);
        result.push({ ...n, rx: cx, ry: y, rw: nw, rh: stripH });
        cx += nw;
      }
      layout(nodes.slice(strip.length), x, y + stripH, w, h - stripH);
    }
  }
  layout(items, x, y, w, h);
  return result;
}

function renderTsTreemap() {
  const { from, to } = getRange();
  const playerTs = (D.timesheets||[]).filter(t => {
    return (t.employee||'Seb')===tsPlayer && t.date>=ds(from) && t.date<=ds(to);
  });

  // Available workday hours in range — exclude today
  const todayStr = ds(todayMidnight());
  let avail = 0;
  for (let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) {
    if (isWorkday(d) && ds(d) < todayStr) avail += 8;
  }

  // Group by project
  const byProj = {};
  playerTs.forEach(t => { byProj[t.project] = (byProj[t.project]||0)+(t.hours||0); });
  const total = playerTs.reduce((a,t)=>a+(t.hours||0),0);
  const missing = Math.max(0, avail-total);

  const items = Object.entries(byProj)
    .sort((a,b)=>b[1]-a[1])
    .map(([name,hrs]) => ({ name, hrs, color: PROJECT_COLOR_MAP[name]||'#555', isGap:false }));
  if (missing>0.5) items.push({ name:'Not logged', hrs:missing, color:'rgba(255,0,110,0.12)', isGap:true });

  const tmEl = document.getElementById('ts-treemap');
  const lgEl = document.getElementById('ts-treemap-legend');
  if (!tmEl) return;

  const W = tmEl.offsetWidth || 600;
  const H = 160;
  const tmTotal = items.reduce((s, i) => s + i.hrs, 0) || 1;

  // Attach normalised area (pixels²) to each item
  const nodes = items
    .filter(i => i.hrs / tmTotal >= 0.005)
    .map(i => ({ ...i, area: (i.hrs / tmTotal) * W * H }));

  const rects = squarify(nodes, 0, 0, W, H);

  tmEl.style.cssText = 'position:relative;height:' + H + 'px';
  tmEl.innerHTML = rects.map(r => {
    const gap = 2;
    const textColor = r.isGap ? '#FF006E' : textOn(r.color);
    const showLabel = r.rw > 40 && r.rh > 30;
    const clickAttr = r.isGap
      ? `onclick="tsShowMissing('${ds(from)}','${ds(to)}')" title="Click to see and fill the missing days"`
      : '';
    return `<div
      ${clickAttr}
      style="position:absolute;left:${r.rx+gap}px;top:${r.ry+gap}px;
             width:${Math.max(0,r.rw-gap*2)}px;height:${Math.max(0,r.rh-gap*2)}px;
             background:${r.color};border-radius:5px;cursor:${r.isGap?'pointer':'default'};overflow:hidden;
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             border:${r.isGap?'1px dashed rgba(255,0,110,0.4)':'none'};
             box-sizing:border-box;padding:4px;text-align:center">
      ${showLabel ? `<div style="font-size:10px;font-weight:700;color:${textColor};line-height:1.3;word-break:break-word">${r.name}</div>
      <div style="font-size:13px;font-weight:700;color:${textColor}">${r.hrs.toFixed(0)}h</div>` : ''}
    </div>`;
  }).join('');

  lgEl.innerHTML = items.map(i =>
    `<div class="ts-legend-item">
      <div class="ts-legend-dot" style="background:${i.color};border:${i.isGap?'1px dashed rgba(255,0,110,.5)':'none'}"></div>
      <span>${i.name} — ${i.hrs.toFixed(0)}h</span>
    </div>`
  ).join('');
}

// ── Period Summary ───────────────────────────────────────────────────────────
// Plain-text + KPI digest of the SAME period/player currently selected above
// (not affected by the Timesheet Log table filters below — this always reflects
// the full picture for the chosen range).
function tsRenderSummary() {
  const el = document.getElementById('ts-summary');
  if (!el) return;

  const { from, to } = getRange();
  const fromStr = ds(from), toStr = ds(to);
  const rows = (D.timesheets||[]).filter(t => (t.employee||'Seb')===tsPlayer && t.date>=fromStr && t.date<=toStr);

  if (!rows.length) {
    el.innerHTML = `<div class="empty" style="padding:10px 4px"><div class="empty-icon">📋</div>No entries in this period</div>`;
    return;
  }

  const totalHours    = rows.reduce((a,t)=>a+(t.hours||0),0);
  const billableRows   = rows.filter(t => !isNonBillable(t.project));
  const nbRows         = rows.filter(t => isNonBillable(t.project));
  const billableHours  = billableRows.reduce((a,t)=>a+(t.hours||0),0);
  const nbHours        = nbRows.reduce((a,t)=>a+(t.hours||0),0);
  const billablePct    = totalHours>0 ? billableHours/totalHours*100 : 0;
  const nbPct          = totalHours>0 ? nbHours/totalHours*100 : 0;

  // Distinct billable projects worked on in this period, and how many already
  // have a quote or invoice line item hand-linked (Projects tab linking feature).
  const billableProjects = [...new Set(billableRows.map(t=>t.project).filter(Boolean))];
  const linkedSet = new Set([
    ...(D.quote_items||[]).map(qi=>(qi.project||'').trim()).filter(Boolean),
    ...(D.invoice_items||[]).map(ii=>(ii.project||'').trim()).filter(Boolean),
  ]);
  const linkedProjects = billableProjects.filter(p => linkedSet.has(p));

  const sortedDates = rows.map(t=>t.date).sort();
  const startLabel = new Date(sortedDates[0]+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  const endLabel   = new Date(sortedDates[sortedDates.length-1]+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
  const projectWord = billableProjects.length===1 ? 'project' : 'projects';

  const linkSentence = billableProjects.length
    ? ` ${linkedProjects.length} of ${billableProjects.length} ${projectWord} ${billableProjects.length===1?'has':'have'} a quote or invoice linked.`
    : '';

  const summarySentence = `Between <strong>${startLabel}</strong> and <strong>${endLabel}</strong>, ${tsPlayer} logged <strong>${totalHours.toFixed(1)}h</strong>` +
    (billableProjects.length ? ` across ${billableProjects.length} billable ${projectWord}` : '') +
    (nbHours>0 ? `, plus <strong>${nbHours.toFixed(1)}h</strong> non-billable (${nbPct.toFixed(0)}%)` : '') +
    `.${linkSentence}`;

  el.innerHTML = `
    <div style="font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px">${summarySentence}</div>
    <div class="kpi-grid">
      ${kpi('Total Hours', totalHours.toFixed(1)+'h', rows.length+' entr'+(rows.length===1?'y':'ies'), '')}
      ${kpiBar('Billable', billableHours.toFixed(1)+'h', billablePct.toFixed(0)+'% of period', billablePct, 'good')}
      ${kpiBar('Non-Billable', nbHours.toFixed(1)+'h', nbPct.toFixed(0)+'% of period', nbPct, nbPct>30?'warn':'')}
      ${kpi('Quote/Invoice Linked', linkedProjects.length+' / '+billableProjects.length, 'billable projects with a link', (billableProjects.length && linkedProjects.length===billableProjects.length) ? 'good':'')}
    </div>`;
}

// ── P&L TAB ───────────────────────────────────────────────────────────────────

let pnlPeriod    = '12m';
let pnlActiveCats = null;   // null = initialise on first render
let pnlCompare   = false;
let pnlCustomFrom = null;
let pnlCustomTo   = null;

const PNL_COST_CATEGORIES = ['Materials', 'Wages & Owner Pay', 'Motor Vehicles', 'Subcontractors', 'Tax & BAS', 'Operating'];
const PNL_CAT_COLORS = {
  'Materials':        '#FB5607',
  'Wages & Owner Pay':'#8338EC',
  'Motor Vehicles':   '#3A86FF',
  'Subcontractors':   '#FF006E',
  'Tax & BAS':        '#FFBE0B',
  'Operating':        '#888888',
};

function normalizePnLCat(cat, desc) {
  const s = ((cat||'')+(desc||'')).toLowerCase();
  if (/material|hardware|timber|bunnings|mitre|supply|supplier|paint|fastener/.test(s)) return 'Materials';
  if (/wage|payg|salary|payroll|super|leave|staff|employee|entitlement/.test(s))        return 'Wages & PAYG';
  if (/drawing|owner|director loan/.test(s))                                             return 'Owner Drawings';
  return 'Operating';
}

function getPnLDateRange() {
  const today = new Date();
  let toD   = new Date(today.getFullYear(), today.getMonth()+1, 0);
  let fromD;
  const mo = n => new Date(today.getFullYear(), today.getMonth()-n+1, 1);
  if      (pnlPeriod==='1m')  fromD = new Date(today.getFullYear(), today.getMonth(), 1);
  else if (pnlPeriod==='3m')  fromD = mo(3);
  else if (pnlPeriod==='6m')  fromD = mo(6);
  else if (pnlPeriod==='12m') fromD = mo(12);
  else if (pnlPeriod==='24m') fromD = mo(24);
  else if (pnlPeriod==='36m') fromD = mo(36);
  else {
    fromD = pnlCustomFrom ? new Date(pnlCustomFrom) : mo(12);
    toD   = pnlCustomTo   ? new Date(pnlCustomTo)   : toD;
  }
  return { fromD, toD };
}

function buildPnLData(fromD, toD) {
  // Build months array
  const months = [];
  let c = new Date(fromD.getFullYear(), fromD.getMonth(), 1);
  const end = new Date(toD.getFullYear(), toD.getMonth(), 1);
  while (c <= end) {
    months.push(c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0'));
    c = new Date(c.getFullYear(), c.getMonth()+1, 1);
  }

  // Revenue + materials from D.monthly (Xero-sourced, most reliable)
  const revMap = {}, matMap = {};
  (D.monthly.periods||[]).forEach((p,i) => {
    revMap[p] = D.monthly.revenue[i]||0;
    matMap[p] = (D.monthly.materials&&D.monthly.materials[i])||0;
  });

  // Cost arrays — now sourced directly from data.json monthly breakdown
  const m = D.monthly;
  const wagesMap  = {}, motorMap = {}, subconMap = {}, taxMap = {}, opMap = {};
  (m.periods||[]).forEach((p,i) => {
    // "Wages & Owner Pay" = Wages & Salaries (real P&L expense, carried in m.wages_owner
    // alongside the near-always-zero liability-account P&L figures) PLUS the transaction-
    // based Loan/Wages-Payable and Superannuation totals (m.owner_drawings / m.super) —
    // those liability accounts are Balance Sheet items that structurally never post to the
    // P&L (see project_bas_tax_gap memory), so summing them here can't double-count.
    // Mirrors the same liability-transaction-wins recalculation used in the P&L breakdown
    // table (commit 1fcfe53) — without this the chart bars showed near-$0 every month
    // except where a stray P&L posting happened to land (e.g. May'26).
    wagesMap[p]  = ((m.wages_owner&&m.wages_owner[i])||0) + ((m.owner_drawings&&m.owner_drawings[i])||0) + ((m.super&&m.super[i])||0);
    motorMap[p]  = (m.motor_vehicles&&m.motor_vehicles[i])     || 0;
    subconMap[p] = (m.subcontractors&&m.subcontractors[i])     || 0;
    taxMap[p]    = (m.tax_bas&&m.tax_bas[i])                   || 0;
    opMap[p]     = (m.operating&&m.operating[i])               || 0;
  });

  return months.map(month => {
    const label          = new Date(month+'-01').toLocaleDateString('en-AU',{month:'short',year:'2-digit'});
    const revenue        = revMap[month]||0;
    const materials      = matMap[month]||0;
    const wages_owner    = wagesMap[month]||0;
    const motor_vehicles = motorMap[month]||0;
    const subcontractors = subconMap[month]||0;
    const tax_bas        = taxMap[month]||0;
    const operating      = opMap[month]||0;
    const totalCosts     = materials+wages_owner+motor_vehicles+subcontractors+tax_bas+operating;
    const profit         = revenue - totalCosts;
    return { month, label, revenue, materials, wages_owner, motor_vehicles, subcontractors, tax_bas, operating, totalCosts, profit };
  });
}

function aggPnL(data) {
  return {
    revenue:        data.reduce((a,d)=>a+d.revenue,0),
    materials:      data.reduce((a,d)=>a+d.materials,0),
    wages_owner:    data.reduce((a,d)=>a+d.wages_owner,0),
    motor_vehicles: data.reduce((a,d)=>a+d.motor_vehicles,0),
    subcontractors: data.reduce((a,d)=>a+d.subcontractors,0),
    tax_bas:        data.reduce((a,d)=>a+d.tax_bas,0),
    operating:      data.reduce((a,d)=>a+d.operating,0),
    profit:         data.reduce((a,d)=>a+d.profit,0),
  };
}

function renderPnL() {
  if (!D) return;
  if (!pnlActiveCats) pnlActiveCats = new Set(PNL_COST_CATEGORIES);

  const { fromD, toD } = getPnLDateRange();
  const data = buildPnLData(fromD, toD);
  const agg  = aggPnL(data);

  const gpProfit = agg.revenue - agg.materials;
  const gpMargin = agg.revenue>0 ? gpProfit/agg.revenue*100 : 0;
  const netMargin= agg.revenue>0 ? agg.profit/agg.revenue*100 : 0;

  // Period toggle buttons
  const periodBtns = [
    {v:'1m',l:'This month'},{v:'3m',l:'3 months'},{v:'6m',l:'6 months'},
    {v:'12m',l:'12 months'},{v:'24m',l:'24 months'},{v:'36m',l:'36 months'}
  ].map(p=>`<button class="ts-range-btn${pnlPeriod===p.v?' active':''}" onclick="pnlSetPeriod('${p.v}')">${p.l}</button>`).join('');
  const customBtn = `<button class="ts-range-btn${pnlPeriod==='custom'?' active':''}" onclick="pnlSetPeriod('custom')">Custom</button>`;
  const customInputs = pnlPeriod==='custom' ? `
    <input type="date" id="pnl-from" value="${pnlCustomFrom||''}" onchange="pnlCustomRange()" style="background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:4px 8px;border-radius:var(--r);font-size:11px;color-scheme:dark">
    <span style="color:var(--ink-4)">→</span>
    <input type="date" id="pnl-to" value="${pnlCustomTo||''}" onchange="pnlCustomRange()" style="background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:4px 8px;border-radius:var(--r);font-size:11px;color-scheme:dark">` : '';

  // Cost category toggles
  const catBtns = PNL_COST_CATEGORIES.map(cat => {
    const on  = pnlActiveCats.has(cat);
    const col = PNL_CAT_COLORS[cat];
    return `<button class="pnl-cat-btn${on?' active':''}"
      style="${on?`background:${col};border-color:${col};`:''}"
      onclick="pnlToggleCat('${cat}')">${cat}</button>`;
  }).join('');

  document.getElementById('page-pnl').innerHTML = `
    <!-- KPIs -->
    <div class="kpi-grid">
      ${kpi('Revenue', fmt(agg.revenue), data.length+' months', 'highlight')}
      ${kpi('Gross Profit', fmt(gpProfit), pct(gpMargin)+' GP margin', gpProfit>=0?'good':'warn')}
      ${kpi('Total Costs', fmt(agg.materials+agg.wages_owner+agg.motor_vehicles+agg.subcontractors+agg.tax_bas+agg.operating), 'All categories', '')}
      ${kpi('Net Profit', fmt(agg.profit), pct(netMargin)+' net margin', agg.profit>=0?'good':'warn')}
      ${kpi('Owner Drawings', fmt(D.kpis.fy26_owner_drawings), 'FY26 total', '')}
    </div>

    <!-- Chart + filters -->
    <div class="section">
      <div class="section-head" style="flex-direction:column;align-items:stretch;gap:10px;padding-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <h2>Revenue vs Costs — Monthly</h2>
          <span class="chart-clickable-hint">click bars for detail · hover profit line for value</span>
        </div>
        <div style="font-size:10px;color:var(--ink-4);letter-spacing:.03em">Source: Xero bank transactions · 3 years (Jul 2023 – May 2026)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
          <span class="ts-range-label">Costs</span>
          <button class="pnl-cat-btn" onclick="pnlSetAllCats(true)" title="Show all cost categories">All</button>
          <button class="pnl-cat-btn" onclick="pnlSetAllCats(false)" title="Hide all — then click one to focus on it">None</button>
          ${catBtns}
        </div>
        <div class="ts-range-bar" style="margin-bottom:0">
          <span class="ts-range-label">Period</span>${periodBtns}${customBtn}${customInputs}
        </div>
      </div>
      <div class="section-body"><div class="chart-wrap" style="height:300px"><canvas id="chart-pnl-main"></canvas></div></div>
    </div>

    <!-- Compare toggle + P&L table -->
    <div class="section">
      <div class="section-head" style="flex-wrap:wrap;gap:8px">
        <h2>P&amp;L Summary</h2>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--ink-4)">Compare to prior period</span>
          <button class="ts-range-btn${pnlCompare?' active':''}" onclick="pnlToggleCompare()" style="padding:4px 14px">${pnlCompare?'On':'Off'}</button>
        </div>
      </div>
      <div id="pnl-table-wrap"></div>
    </div>`;

  renderPnLChart(data);
  renderPnLTable(data, fromD, toD);
}

function renderPnLChart(data) {
  destroyChart('pnl-main');
  const ctx = document.getElementById('chart-pnl-main');
  if (!ctx) return;

  const labels = data.map(d=>d.label);
  const datasets = [
    {
      type:'bar', label:'Revenue',
      data: data.map(d=>d.revenue),
      backgroundColor:'rgba(255,190,11,0.8)',
      borderRadius:3, borderSkipped:false, order:2, yAxisID:'y',
    }
  ];

  const keyMap = { 'Materials':'materials','Wages & Owner Pay':'wages_owner','Motor Vehicles':'motor_vehicles','Subcontractors':'subcontractors','Tax & BAS':'tax_bas','Operating':'operating' };
  PNL_COST_CATEGORIES.forEach(cat => {
    if (!pnlActiveCats.has(cat)) return;
    datasets.push({
      type:'bar', label:cat,
      data: data.map(d=>d[keyMap[cat]]||0),
      backgroundColor: PNL_CAT_COLORS[cat]+'cc',
      stack:'costs', borderRadius:2, borderSkipped:false, order:2, yAxisID:'y',
    });
  });

  // Profit line — ALWAYS deducts full costs, independent of which cost
  // categories are toggled on/off. The category toggles only filter which
  // cost bars are drawn; profit always reflects true revenue − all costs.
  const profitData = data.map(d => d.revenue - d.totalCosts);
  // Plugin: draw profit line as smooth bezier with precise color split at zero crossing
  const profitLinePlugin = {
    id: 'profitLine',
    afterDatasetsDraw(chart) {
      const dsIdx = chart.data.datasets.findIndex(d => d.label === 'Profit');
      if (dsIdx < 0) return;
      const meta = chart.getDatasetMeta(dsIdx);
      if (!meta.visible) return;
      const raw = chart.data.datasets[dsIdx].data;
      const pts = meta.data;
      const zero = chart.scales['y2'].getPixelForValue(0);
      const c = chart.ctx;

      const lp = (a,b,t) => a + t*(b-a);
      const byY = (y0,c1,c2,y3,t) => { const u=1-t; return u*u*u*y0+3*u*u*t*c1+3*u*t*t*c2+t*t*t*y3; };
      // Bisection: find t where bezier y = target
      function findT(y0,c1,c2,y3,target) {
        let lo=0,hi=1;
        for (let n=0;n<52;n++) {
          const m=(lo+hi)/2, v=byY(y0,c1,c2,y3,m)-target;
          if (Math.abs(v)<0.01) return m;
          if ((byY(y0,c1,c2,y3,lo)-target)*v<0) hi=m; else lo=m;
        }
        return (lo+hi)/2;
      }
      // De Casteljau split at t — returns [firstHalf, secondHalf] each as [p0,p1,p2,p3]
      function split(p0,p1,p2,p3,t) {
        const a={x:lp(p0.x,p1.x,t),y:lp(p0.y,p1.y,t)};
        const b={x:lp(p1.x,p2.x,t),y:lp(p1.y,p2.y,t)};
        const cc={x:lp(p2.x,p3.x,t),y:lp(p2.y,p3.y,t)};
        const d={x:lp(a.x,b.x,t),y:lp(a.y,b.y,t)};
        const e={x:lp(b.x,cc.x,t),y:lp(b.y,cc.y,t)};
        const f={x:lp(d.x,e.x,t),y:lp(d.y,e.y,t)};
        return [[p0,a,d,f],[f,e,cc,p3]];
      }
      function drawB(q,col) {
        c.beginPath(); c.strokeStyle=col;
        c.moveTo(q[0].x,q[0].y);
        c.bezierCurveTo(q[1].x,q[1].y,q[2].x,q[2].y,q[3].x,q[3].y);
        c.stroke();
      }

      c.save(); c.lineWidth=2.5; c.lineJoin='round'; c.lineCap='round';
      for (let i=0; i<pts.length-1; i++) {
        const v0=raw[i]??0, v1=raw[i+1]??0;
        const p0={x:pts[i].x,   y:pts[i].y};
        const p1={x:pts[i].cp2x??lp(pts[i].x,pts[i+1].x,1/3), y:pts[i].cp2y??lp(pts[i].y,pts[i+1].y,1/3)};
        const p2={x:pts[i+1].cp1x??lp(pts[i].x,pts[i+1].x,2/3), y:pts[i+1].cp1y??lp(pts[i].y,pts[i+1].y,2/3)};
        const p3={x:pts[i+1].x, y:pts[i+1].y};
        const pos0=v0>=0, pos1=v1>=0;
        if (pos0===pos1) {
          drawB([p0,p1,p2,p3], pos0?'#05C46B':'#FF006E');
        } else {
          const t=findT(p0.y,p1.y,p2.y,p3.y,zero);
          const [first,second]=split(p0,p1,p2,p3,t);
          drawB(first,  pos0?'#05C46B':'#FF006E');
          drawB(second, pos1?'#05C46B':'#FF006E');
        }
      }
      c.restore();
    }
  };

  datasets.push({
    type:'line', label:'Profit',
    data: profitData,
    borderColor:'transparent',
    backgroundColor:'transparent',
    fill: false,
    showLine: false,
    pointBackgroundColor: ctx => (ctx.raw||0) < 0 ? '#FF006E' : '#05C46B',
    pointBorderColor: 'transparent',
    tension:0.4, pointRadius:3,
    borderWidth:0, yAxisID:'y2', order:1,
  });

  charts['pnl-main'] = new Chart(ctx, {
    type:'bar',
    plugins: [profitLinePlugin],
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#888', font:{size:11}, padding:12 } },
        tooltip:{ callbacks:{ label: c => ` ${c.dataset.label}: ${fmt(c.raw)}` } }
      },
      scales:{
        x:{ ticks:CHART_TICK, grid:{display:false}, stacked:true },
        y:{ ticks:{ ...CHART_TICK, callback:v=>'$'+(v/1000).toFixed(0)+'k' }, grid:{color:CHART_GRID}, stacked:true },
        y2:{ type:'linear', position:'right', ticks:{ ...CHART_TICK, callback:v=>'$'+(v/1000).toFixed(0)+'k' }, grid:{display:false} }
      },
      onClick:(ev,els)=>{
        if (!els.length) return;
        const i = els[0].index;
        const lbl = datasets[els[0].datasetIndex].label;
        if (lbl==='Revenue') showPnLRevPopup(data[i]);
        else if (lbl!=='Profit') showPnLCostPopup(data[i]);
      },
      onHover:(ev,els)=>{ ev.native.target.style.cursor=els.length?'pointer':'default'; }
    }
  });
}

// Track expanded categories in P&L table
const pnlExpandedCats = new Set();

function pnlToggleExpand(cat) {
  // Clear bank tx cache when category is collapsed so a re-expand always re-fetches
  // for the current date range (avoids stale data if user changes the P&L date filter)
  if (pnlExpandedCats.has(cat)) {
    pnlExpandedCats.delete(cat);
    pnlExpandedAccts.clear();
    Object.keys(pnlBankTxCache).forEach(k => delete pnlBankTxCache[k]);
  } else {
    pnlExpandedCats.add(cat);
  }
  const { fromD, toD } = getPnLDateRange();
  renderPnLTable(buildPnLData(fromD, toD), fromD, toD);
}

// Track expanded individual accounts (transaction-level audit drill-down)
const pnlExpandedAccts = new Set();

// Cache of fetched bank_transactions per account + date-range key.
// Populated lazily when a non-liability account row is expanded.
const pnlBankTxCache = {};

async function pnlToggleAcctExpand(acc, ev) {
  if (ev) ev.stopPropagation();
  const wasExpanded = pnlExpandedAccts.has(acc);
  if (wasExpanded) {
    pnlExpandedAccts.delete(acc);
  } else {
    pnlExpandedAccts.add(acc);
    // Fetch bank_transactions for this account if not a liability account and not yet cached
    if (!LIABILITY_ACCOUNTS.has(acc)) {
      const { fromD, toD } = getPnLDateRange();
      const dateFrom = fromD.toISOString().slice(0, 10);
      const dateTo   = toD.toISOString().slice(0, 10);
      const cacheKey = acc + '|' + dateFrom + '|' + dateTo;
      if (!pnlBankTxCache[cacheKey]) {
        try {
          const rows = await sbGet(
            `/rest/v1/bank_transactions?account_name=eq.${encodeURIComponent(acc)}&date=gte.${dateFrom}&date=lte.${dateTo}&order=date.desc&select=id,date,contact,description,reference,gross,debit,credit,type`
          );
          pnlBankTxCache[cacheKey] = rows;
        } catch(e) {
          pnlBankTxCache[cacheKey] = [];
          console.warn('Could not fetch bank_transactions for', acc, e.message);
        }
      }
    }
  }
  const { fromD, toD } = getPnLDateRange();
  renderPnLTable(buildPnLData(fromD, toD), fromD, toD);
}

// These accounts are Balance Sheet LIABILITIES (BAS clearing, super payable, owner's
// loan/wages payable) — they structurally never post to the P&L, so cost_detail_monthly
// (sourced from Xero's P&L report) is always $0 for them. Real figures + line-item audit
// detail come from D.liability_transactions instead (synced from actual bank SPEND tx —
// see xero-sync.js bucketLiabilitiesByMonth / extractLiabilityTransactions).
const LIABILITY_ACCOUNTS = new Set([
  'Loan - Sebastien Matiere', 'Wages Payable', 'Superannuation Payable', 'ATO/BAS Clearing'
]);

function getCatDetailForPeriod(cat, months) {
  // months: array of 'YYYY-MM' strings
  if (!D.account_categories) return [];
  const periods  = D.monthly?.periods || [];
  const monthSet = new Set(months);
  const lt       = D.liability_transactions || null;
  const result   = [];

  for (const [acc, accCat] of Object.entries(D.account_categories)) {
    if (accCat !== cat) continue;

    if (LIABILITY_ACCOUNTS.has(acc) && lt) {
      const txns = [].concat(lt.tax_bas||[], lt.super||[], lt.owner_drawings||[])
        .filter(t => t.account_name === acc && monthSet.has((t.date||'').slice(0,7)));
      const total = Math.round(txns.reduce((s,t)=>s+(t.amount||0), 0) * 100) / 100;
      if (total > 0) result.push({ acc, total, txns: txns.sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0)) });
    } else {
      const arr = D.cost_detail_monthly?.[acc] || [];
      let total = 0;
      for (const m of months) {
        const idx = periods.indexOf(m);
        if (idx >= 0) total += arr[idx] || 0;
      }
      if (total > 0) {
        // Check cache for live bank_transactions (populated when user expands this account row)
        const { fromD, toD } = getPnLDateRange();
        const cacheKey = acc + '|' + fromD.toISOString().slice(0,10) + '|' + toD.toISOString().slice(0,10);
        const cachedTx = pnlBankTxCache[cacheKey] || null;
        // Map to same shape as liability txns: {date, payee, description, amount, ref}
        const txns = cachedTx ? cachedTx.map(t => ({
          date:        t.date,
          payee:       t.contact || '—',
          description: t.description || '',
          amount:      t.debit || t.credit || t.gross || 0,
          ref:         t.reference || ''
        })) : null;
        result.push({ acc, total, txns });
      }
    }
  }
  return result.sort((a,b) => b.total - a.total);
}

function renderPnLTable(data, fromD, toD) {
  const el = document.getElementById('pnl-table-wrap');
  if (!el) return;

  const cur = aggPnL(data);
  const months = data.map(d => d.month);

  // Full month-name labels; collapse to a single month when the range is one month.
  const moFmt   = d => d.toLocaleDateString('en-AU',{month:'long',year:'numeric'});
  const rangeLbl = (a, b) => { const x = moFmt(a), y = moFmt(b); return x === y ? x : `${x} – ${y}`; };

  let prev = null;
  let prevMonths = null;
  let prevHdr = 'Prior period';
  if (pnlCompare) {
    const dur  = toD.getTime() - fromD.getTime();
    const pTo  = new Date(fromD.getTime() - 86400000);
    const pFrom= new Date(fromD.getTime() - dur - 86400000);
    const prevData = buildPnLData(pFrom, pTo);
    prev = aggPnL(prevData);
    prevMonths = prevData.map(d => d.month);
    prevHdr = rangeLbl(pFrom, pTo);   // actual prior month(s), e.g. "May 2026"
  }

  const fmtDiff = (a, b) => {
    const d = a - b;
    return `<span style="color:${d>=0?'var(--sage)':'var(--pink)'}">${d>=0?'+':''}${fmt(d)}</span>`;
  };
  const curHdr = rangeLbl(fromD, toD);   // single month → just "June 2026"

  const row = (label, curV, prevV, isNeg=false, indented=false) => {
    const s2 = indented ? 'padding-left:24px;color:var(--ink-4)' : '';
    const vc = isNeg ? 'color:var(--orange)' : '';
    const fv = v => isNeg && v > 0 ? `(${fmt(v)})` : fmt(v);
    return `<tr>
      <td style="${s2}">${label}</td>
      <td class="amount" style="${vc}">${fv(curV)}</td>
      ${prev?`<td class="amount" style="${vc};opacity:.7">${fv(prevV||0)}</td>`:''}
      ${prev?`<td class="amount">${fmtDiff(curV,prevV||0)}</td>`:''}
    </tr>`;
  };

  // Expandable category row + sub-rows
  const catRow = (label, catKey, curV, prevV) => {
    const expanded = pnlExpandedCats.has(catKey);
    const chevron = `<span style="display:inline-block;transition:transform .2s;transform:rotate(${expanded?'90deg':'0deg'});margin-right:6px;font-size:10px;opacity:.6">▶</span>`;
    // Always compute detail (not just when expanded) — for categories that contain
    // liability accounts (Wages & Owner Pay, Tax & BAS), the real per-account total
    // (sourced from actual bank transactions) can differ from the old P&L-report-based
    // category figure. To keep the table internally consistent (category = sum of its
    // accounts), we override the displayed category total with the sum of the real
    // account-level figures whenever any account in it is transaction-sourced.
    const detail = getCatDetailForPeriod(catKey, months);
    const isLiabilityCat = detail.some(d => Array.isArray(d.txns));
    let curVEff = curV, prevVEff = prevV;
    if (isLiabilityCat) {
      curVEff = Math.round(detail.reduce((s,d)=>s+d.total, 0) * 100) / 100;
      if (prev && prevMonths) {
        const prevDetail = getCatDetailForPeriod(catKey, prevMonths);
        prevVEff = Math.round(prevDetail.reduce((s,d)=>s+d.total, 0) * 100) / 100;
      }
    }
    const detailRows = !expanded ? '' : detail.map(({acc, total, txns}) => {
      const hasTxns      = Array.isArray(txns) && txns.length > 0;
      const acctExpanded = hasTxns && pnlExpandedAccts.has(acc);
      const acctChevron  = hasTxns
        ? `<span style="display:inline-block;transition:transform .2s;transform:rotate(${acctExpanded?'90deg':'0deg'});margin-right:4px;font-size:9px;opacity:.5">▶</span>`
        : '';
      const rowAttrs = hasTxns
        ? ` style="background:var(--bg-2);cursor:pointer" onclick="pnlToggleAcctExpand('${acc.replace(/'/g,"\\'")}',event)" title="Click to see individual transactions"`
        : ` style="background:var(--bg-2)"`;
      const txnRows = (acctExpanded ? txns : []).map(t =>
        `<tr style="background:var(--bg-1)">
          <td style="padding-left:64px;color:var(--ink-4);font-size:10px">${t.date} · ${t.payee}${t.description?` — ${t.description}`:''}${t.ref?` <span style="opacity:.6">(${t.ref})</span>`:''}</td>
          <td class="amount" style="color:var(--ink-4);font-size:10px">(${fmt(t.amount)})</td>
          ${prev?`<td></td>`:''}${prev?`<td></td>`:''}
        </tr>`
      ).join('');
      const auditHint = (hasTxns && acctExpanded)
        ? `<tr style="background:var(--bg-1)"><td colspan="${prev?4:2}" style="padding-left:64px;font-size:10px;color:var(--ink-4);opacity:.6;padding-bottom:6px">${txns.length} transaction${txns.length===1?'':'s'} — sourced from actual bank spend, coded to ${acc}</td></tr>`
        : '';
      return `<tr${rowAttrs}>
        <td style="padding-left:44px;color:var(--ink-4);font-size:11px">${acctChevron}${acc}</td>
        <td class="amount" style="color:var(--orange);font-size:11px">(${fmt(total)})</td>
        ${prev?`<td></td>`:''}${prev?`<td></td>`:''}
      </tr>${txnRows}${auditHint}`;
    }).join('');
    const liabilityHint = (isLiabilityCat && expanded)
      ? `<tr style="background:var(--bg-2)"><td colspan="${prev?4:2}" style="padding-left:44px;font-size:10px;color:var(--ink-4);opacity:.6;padding-top:2px;padding-bottom:6px">Total recalculated from real bank-transaction detail — more accurate than Xero's P&amp;L report for these accounts, which always shows $0 for balance-sheet liability items like loans, super and wages payable.</td></tr>`
      : '';
    return `<tr style="cursor:pointer" onclick="pnlToggleExpand('${catKey}')">
      <td style="padding-left:24px;color:var(--ink-4)">${chevron}${label}</td>
      <td class="amount" style="color:var(--orange)">(${fmt(curVEff)})</td>
      ${prev?`<td class="amount" style="color:var(--orange);opacity:.7">(${fmt(prevVEff||0)})</td>`:''}
      ${prev?`<td class="amount">${fmtDiff(curVEff,prevVEff||0)}</td>`:''}
    </tr>${detailRows}`;
  };

  // Expandable Revenue row — drills into the per-month revenue that makes up the total.
  const revenueRow = () => {
    const expanded = pnlExpandedCats.has('Revenue');
    const chevron = `<span style="display:inline-block;transition:transform .2s;transform:rotate(${expanded?'90deg':'0deg'});margin-right:6px;font-size:10px;opacity:.6">▶</span>`;
    const detailRows = !expanded ? '' : data.filter(d=>d.revenue>0).map(d =>
      `<tr style="background:var(--bg-2)">
        <td style="padding-left:44px;color:var(--ink-4);font-size:11px">${d.label}</td>
        <td class="amount" style="font-size:11px">${fmt(d.revenue)}</td>
        ${prev?`<td></td>`:''}${prev?`<td></td>`:''}
      </tr>`
    ).join('');
    return `<tr style="cursor:pointer" onclick="pnlToggleExpand('Revenue')">
      <td>${chevron}Revenue</td>
      <td class="amount">${fmt(cur.revenue)}</td>
      ${prev?`<td class="amount" style="opacity:.7">${fmt(prev?.revenue||0)}</td>`:''}
      ${prev?`<td class="amount">${fmtDiff(cur.revenue,prev?.revenue||0)}</td>`:''}
    </tr>${detailRows}`;
  };

  const gpCur  = cur.revenue - cur.materials;
  const gpPrev = prev ? (prev.revenue - prev.materials) : 0;

  el.innerHTML = `<table>
    <thead><tr>
      <th></th>
      <th style="text-align:right">${curHdr}</th>
      ${prev?`<th style="text-align:right;color:var(--ink-4)">${prevHdr}</th>`:''}
      ${prev?`<th style="text-align:right">Δ</th>`:''}
    </tr></thead>
    <tbody>
      ${revenueRow()}
      ${catRow('Materials & Cost of Sales', 'Materials', cur.materials, prev?.materials)}
      <tr style="font-weight:600;border-top:1px solid var(--border-2)">
        <td>Gross Profit</td>
        <td class="amount">${fmt(gpCur)} <span style="font-weight:400;font-size:11px;color:var(--ink-4)">${pct(cur.revenue>0?gpCur/cur.revenue*100:0)}</span></td>
        ${prev?`<td class="amount" style="opacity:.7">${fmt(gpPrev)}</td>`:''}
        ${prev?`<td class="amount">${fmtDiff(gpCur,gpPrev)}</td>`:''}
      </tr>
      ${catRow('Wages & Owner Pay', 'Wages & Owner Pay', cur.wages_owner, prev?.wages_owner)}
      ${catRow('Motor Vehicles', 'Motor Vehicles', cur.motor_vehicles, prev?.motor_vehicles)}
      ${catRow('Subcontractors', 'Subcontractors', cur.subcontractors, prev?.subcontractors)}
      ${catRow('Tax & BAS', 'Tax & BAS', cur.tax_bas, prev?.tax_bas)}
      ${catRow('Operating Expenses', 'Operating', cur.operating, prev?.operating)}
      <tr style="font-weight:700;border-top:2px solid var(--border-2)">
        <td>Net Profit</td>
        <td class="amount" style="color:${cur.profit>=0?'var(--sage)':'var(--pink)'}">${fmt(cur.profit)} <span style="font-weight:400;font-size:11px;color:var(--ink-4)">${pct(cur.revenue>0?cur.profit/cur.revenue*100:0)}</span></td>
        ${prev?`<td class="amount" style="color:${(prev.profit||0)>=0?'var(--sage)':'var(--pink)'};opacity:.7">${fmt(prev.profit||0)}</td>`:''}
        ${prev?`<td class="amount">${fmtDiff(cur.profit,prev?.profit||0)}</td>`:''}
      </tr>
    </tbody>
  </table>`;
}

function showPnLRevPopup(d) {
  // Try to find invoices in that month from D data
  const invs = (D.open_invoices||[]).filter(i=>i.date&&i.date.startsWith(d.month));
  const body = invs.length
    ? `<table><thead><tr><th>Date</th><th>Client</th><th style="text-align:right">Amount</th></tr></thead>
       <tbody>${invs.map(i=>`<tr><td>${i.date}</td><td>${i.contact}</td><td class="amount" style="color:var(--amber)">${fmt(i.amount)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="kpi-grid" style="grid-template-columns:1fr 1fr;margin-bottom:0">
        ${kpi('Revenue', fmt(d.revenue), d.label, 'highlight')}
        ${kpi('Gross Profit', fmt(d.revenue-d.materials), pct(d.revenue>0?(d.revenue-d.materials)/d.revenue*100:0)+' margin', 'good')}
       </div>
       <div style="padding:14px 2px 0;font-size:12px;color:var(--ink-4)">Detailed invoice breakdown available after a Xero sync.</div>`;
  openModal('Revenue — ' + d.label, body);
}

function showPnLCostPopup(d) {
  const cats = [
    {name:'Materials',         val:d.materials},
    {name:'Wages & Owner Pay', val:d.wages_owner},
    {name:'Motor Vehicles',    val:d.motor_vehicles},
    {name:'Subcontractors',    val:d.subcontractors},
    {name:'Tax & BAS',         val:d.tax_bas},
    {name:'Operating',         val:d.operating},
  ].filter(c=>c.val>0).sort((a,b)=>b.val-a.val);
  const total = cats.reduce((a,c)=>a+c.val,0)||1;
  const bars  = cats.map(c=>{
    const p   = (c.val/total*100).toFixed(1);
    const col = PNL_CAT_COLORS[c.name]||'#555';
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px">
        <span style="color:var(--ink-2)">${c.name}</span>
        <span style="font-weight:700;color:${col}">${fmt(c.val)} <span style="font-weight:400;color:var(--ink-4)">(${p}%)</span></span>
      </div>
      <div class="mini-bar" style="height:6px"><div class="mini-bar-fill" style="width:${p}%;background:${col}"></div></div>
    </div>`;
  }).join('');
  openModal('Costs — ' + d.label, `
    <div class="kpi-grid" style="grid-template-columns:1fr 1fr;margin-bottom:20px">
      ${kpi('Total Costs', fmt(total), d.label, 'warn')}
      ${kpi('Profit', fmt(d.revenue-total), 'This month', d.revenue>=total?'good':'warn')}
    </div>
    <div>${bars}</div>`);
}

  // chart), so isolating a single category is just: None → click one.

}

  pnlActiveCats = on ? new Set(PNL_COST_CATEGORIES) : new Set();

  renderPnL();
}

async function getXeroToken() {
  const expiry = parseInt(localStorage.getItem('xero_token_expiry')||'0');
  if (Date.now() < expiry - 60000) return localStorage.getItem('xero_access_token');
  const refresh_token = localStorage.getItem('xero_refresh_token');
  if (!refresh_token) return null;
  try {
    const res = await fetch('/.netlify/functions/xero-auth', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'refresh', refresh_token})
    });
    const tokens = await res.json();
    if (tokens.error) throw new Error(JSON.stringify(tokens.error));
    localStorage.setItem('xero_access_token', tokens.access_token);
    if (tokens.refresh_token) localStorage.setItem('xero_refresh_token', tokens.refresh_token);
    localStorage.setItem('xero_token_expiry', Date.now() + (tokens.expires_in * 1000));
    return tokens.access_token;
  } catch(e) { console.error('Xero token refresh failed:', e); return null; }
}

async function xeroApiCall(endpoint, method='GET', body=null) {
  const token = await getXeroToken();
  if (!token) throw new Error('Not connected to Xero');
  const res = await fetch('/.netlify/functions/xero-api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({endpoint, method, body, access_token:token, tenant_id:localStorage.getItem('xero_tenant_id')})
  });
  return res.json();
}

function updateXeroBtn() {
  const btn = document.getElementById('xero-btn');
  if (!btn) return;
  const connected = !!localStorage.getItem('xero_access_token');
  const org = localStorage.getItem('xero_org_name') || 'Xero';
  const syncBtn = document.getElementById('xero-sync-btn');
  if (connected) {
    btn.textContent = '⚡ ' + org;
    btn.style.borderColor = 'rgba(5,196,107,.4)';
    btn.style.color = '#05C46B';
    btn.onclick = () => { if (confirm('Disconnect from Xero?')) xeroDisconnect(); };
    if (syncBtn) syncBtn.style.display = '';
  } else {
    btn.textContent = '⚡ Connect Xero';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.onclick = xeroConnect;
    if (syncBtn) syncBtn.style.display = 'none';
  }
}

async function syncFromXero() {
  openModal('Syncing from Xero…', '<div style="text-align:center;padding:30px"><div class="spinner" style="margin:0 auto 16px"></div><div id="sync-status" style="color:var(--ink-4);font-size:13px">Connecting…</div></div>');
  const status = t => { const el = document.getElementById('sync-status'); if (el) el.textContent = t; };
  const results = { synced_at: new Date().toISOString() };

  // Helper: paginate any Xero list endpoint
  async function fetchAllPages(baseEndpoint, arrayKey, label, maxPages=20) {
    let all = [], page = 1;
    while (true) {
      status(`${label} — page ${page} (${all.length} so far)…`);
      const sep = baseEndpoint.includes('?') ? '&' : '?';
      const res = await xeroApiCall(baseEndpoint + sep + 'page=' + page);
      const batch = res[arrayKey] || [];
      all = all.concat(batch);
      if (batch.length < 100) break;
      page++; if (page > maxPages) break;
    }
    return all;
  }

  try {
    // ── Sales invoices — 3 years ──────────────────────────────────────────────
    status('Fetching sales invoices (3 years)…');
    results.invoices = await fetchAllPages(
      'Invoices?where=Type%3D%3D%22ACCREC%22%26%26Date%3E%3DDateTime(2023%2C7%2C1)&unitdp=2&summaryOnly=false',
      'Invoices', 'Sales invoices'
    );

    // ── Purchase invoices / bills — 3 years ───────────────────────────────────
    status('Fetching bills / purchase invoices (3 years)…');
    results.bills = await fetchAllPages(
      'Invoices?where=Type%3D%3D%22ACCPAY%22%26%26Date%3E%3DDateTime(2023%2C7%2C1)&unitdp=2&summaryOnly=false',
      'Invoices', 'Bills'
    );

    // ── Quotes — all pages ─────────────────────────────────────────────────────
    results.quotes = await fetchAllPages('Quotes', 'Quotes', 'Quotes');
    QUOTES_LIVE = results.quotes;

    // ── Contacts ──────────────────────────────────────────────────────────────
    status('Fetching contacts…');
    const ctRes = await xeroApiCall('Contacts');
    results.contacts = ctRes.Contacts || [];

    // ── Bank transactions — paginated, 3 years ────────────────────────────────
    results.bank_transactions = await fetchAllPages(
      'BankTransactions?where=Date%3E%3DDateTime(2023%2C7%2C1)&unitdp=2',
      'BankTransactions', 'Bank transactions'
    );

    // ── Accounts chart ────────────────────────────────────────────────────────
    status('Fetching accounts…');
    const acRes = await xeroApiCall('Accounts?where=Status%3D%3D%22ACTIVE%22');
    results.accounts = acRes.Accounts || [];

    // ── P&L reports ───────────────────────────────────────────────────────────
    // 3-year monthly breakdown (the key one for P&L tab)
    status('Fetching monthly P&L — 3 years…');
    const pnl3y = await xeroApiCall('Reports/ProfitAndLoss?fromDate=2023-07-01&toDate=2026-06-30&periods=36&timeframe=MONTH');
    results.pnl_monthly_3y = pnl3y.Reports ? pnl3y.Reports[0] : pnl3y;

    // Annual summaries per FY
    status('Fetching FY24 P&L…');
    const pnl24 = await xeroApiCall('Reports/ProfitAndLoss?fromDate=2023-07-01&toDate=2024-06-30');
    results.pnl_fy24 = pnl24.Reports ? pnl24.Reports[0] : pnl24;

    status('Fetching FY25 P&L…');
    const pnl25 = await xeroApiCall('Reports/ProfitAndLoss?fromDate=2024-07-01&toDate=2025-06-30');
    results.pnl_fy25 = pnl25.Reports ? pnl25.Reports[0] : pnl25;

    status('Fetching FY26 P&L (YTD)…');
    const pnl26 = await xeroApiCall('Reports/ProfitAndLoss?fromDate=2025-07-01&toDate=2026-06-30');
    results.pnl_fy26 = pnl26.Reports ? pnl26.Reports[0] : pnl26;

    // Balance sheet
    status('Fetching balance sheet…');
    const bs = await xeroApiCall('Reports/BalanceSheet');
    results.balance_sheet = bs.Reports ? bs.Reports[0] : bs;

    // Trial balance
    status('Fetching trial balance…');
    const tb = await xeroApiCall('Reports/TrialBalance');
    results.trial_balance = tb.Reports ? tb.Reports[0] : tb;

    // ── Journals — full general ledger, 3 years ───────────────────────────────
    // (requires accounting.journals.read scope — reconnect Xero if this fails)
    try {
      status('Fetching journals (general ledger)…');
      results.journals = await fetchAllPages('Journals?offset=0', 'Journals', 'Journals', 50);
    } catch(e) {
      results.journals = [];
      results.journals_error = e.message;
    }

    // ── Summary ───────────────────────────────────────────────────────────────
    const summary = [
      `✓ Sales invoices: ${results.invoices.length} (from Jul 2023)`,
      `✓ Bills / purchase invoices: ${results.bills.length} (from Jul 2023)`,
      `✓ Quotes: ${results.quotes.length}`,
      `✓ Contacts: ${results.contacts.length}`,
      `✓ Bank transactions: ${results.bank_transactions.length} (from Jul 2023)`,
      `✓ Journals: ${results.journals.length}${results.journals_error?' ⚠ '+results.journals_error:''}`,
      `✓ P&L reports: monthly 3-year + FY24 + FY25 + FY26`,
      `✓ Balance sheet + trial balance`,
    ].join('<br>');

    const blob = new Blob([JSON.stringify(results,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='xero_sync_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    URL.revokeObjectURL(url);

    document.getElementById('modal-body').innerHTML = `
      <div style="padding:8px 0">
        <div style="color:var(--sage);font-size:15px;font-weight:700;margin-bottom:16px">✓ Full sync complete</div>
        <div style="line-height:2.2;font-size:13px;color:var(--ink-2)">${summary}</div>
        ${results.journals_error ? `<div style="margin-top:12px;padding:10px 14px;background:rgba(255,190,11,.08);border:1px solid rgba(255,190,11,.2);border-radius:5px;font-size:12px;color:var(--amber);line-height:1.7">⚠ Journals failed — reconnect Xero to grant <code>accounting.journals.read</code> scope, then sync again.</div>` : ''}
        <div style="margin-top:16px;padding:14px;background:var(--bg-3);border-radius:5px;font-size:12px;color:var(--ink-3);line-height:1.7">
          <strong style="color:var(--ink-2)">Next step:</strong> Upload the downloaded <code>xero_sync_YYYY-MM-DD.json</code> to Claude and say <em>"Merge this Xero sync into data.json"</em>
        </div>
      </div>`;
  } catch(err) {
    document.getElementById('modal-body').innerHTML = `<div style="color:var(--pink);padding:16px 0"><div style="font-weight:600;margin-bottom:8px">⚠ Sync failed</div><div style="font-size:12px;color:var(--ink-4)">${err.message}</div></div>`;
  }
}

// ── Quotes & Pricing ──────────────────────────────────────────────────────────
let QUOTES_LIVE = null;

function detectCategory(text) {
  const t = (text || '').toLowerCase();
  if (/paling|picket|pool fence|boundary fence|timber fence|\bfenc/.test(t)) return 'Fencing';
  if (/\bdeck\b|decking/.test(t)) return 'Decking';
  if (/pergola|carport|gazebo|shade structure/.test(t)) return 'Pergola & Carport';
  if (/timber floor|floorboard|flooring|floor board/.test(t)) return 'Flooring';
  if (/handrail|balustrade|staircase|\bstair/.test(t)) return 'Handrails & Stairs';
  if (/cladding|weatherboard|lining board/.test(t)) return 'Cladding';
  if (/wardrobe|cabinet|joinery|built.in|built in/.test(t)) return 'Joinery & Built-ins';
  if (/\bshelf\b|shelving|bookcase/.test(t)) return 'Shelving';
  if (/\bdoor\b|\bwindow\b/.test(t)) return 'Doors & Windows';
  if (/retaining|garden bed|planter|landscape/.test(t)) return 'Garden & Landscaping';
  if (/\bframe\b|stud wall|partition/.test(t)) return 'Framing';
  if (/repair|replace|\bfix\b|patch|maintenance/.test(t)) return 'Repairs & Maintenance';
  return 'General Carpentry';
}
