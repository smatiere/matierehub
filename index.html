<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Matiere Hub">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Matière Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #000000;
  --bg-1:    #141414;
  --bg-2:    #0f0f0f;
  --bg-3:    #1a1a1a;
  --bg-4:    #252525;
  --border:  #2a2a2a;
  --border-2:#383838;
  --ink:     #ffffff;
  --ink-1:   #ffffff;
  --ink-2:   #cccccc;
  --ink-3:   #888888;
  --ink-4:   #505050;
  /* keep old names for compat */
  --cream:   #000000;
  --cream-2: #0f0f0f;
  --cream-3: #1a1a1a;
  --navy:    #0a0a0a;
  /* brand palette */
  --amber:   #FFBE0B;
  --orange:  #FB5607;
  --pink:    #FF006E;
  --purple:  #8338EC;
  --blue:    #3A86FF;
  /* semantic */
  --gold:    #FFBE0B;
  --gold-2:  #ffd54f;
  --gold-light: rgba(255,190,11,0.12);
  --rust:    #FB5607;
  --sage:    #05C46B;
  --r: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--ink);min-height:100vh}

/* ── Header ── */
.header{background:#000;border-bottom:1px solid var(--border);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:baseline;gap:8px}
.header-brand h1{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.header-brand span{font-size:10px;color:var(--ink-4);letter-spacing:.2em;text-transform:uppercase}
.header-meta{font-size:11px;color:var(--ink-4);text-align:right;line-height:1.5}
.btn-refresh{background:rgba(255,255,255,.06);border:1px solid var(--border-2);color:var(--ink-3);padding:6px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;transition:all .2s}
.btn-refresh:hover{background:rgba(255,255,255,.12);color:var(--ink)}

/* ── Tabs ── */
.tabs{display:flex;gap:0;background:#000;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}
/* iOS Safari zooms the page when a focused input is <16px. Bump the Scan Receipt
   inputs to 16px on phones so editing a receipt doesn't trigger that zoom. Scoped
   to the new page only so it never disturbs the desktop table layouts. */
@media (max-width:640px){
  #page-receipts input,#page-receipts select{font-size:16px}
}

/* ── Pages ── */
.page{display:none;padding:20px;max-width:1040px;margin:0 auto}
.page.active{display:block}

/* ── KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:11px;color:var(--ink-4);margin-top:4px}
.kpi.highlight{border-left:2px solid var(--amber)}
.kpi.warn{border-left:2px solid var(--orange)}
.kpi.good{border-left:2px solid var(--sage)}

/* ── Sections ── */
.section{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.section-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-head h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.section-body{padding:16px}
.chart-wrap{position:relative;height:220px}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 14px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-3)}
.amount{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ── Badges ── */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.04em}
.badge-green{background:rgba(5,196,107,.15);color:#05C46B}
.badge-amber{background:rgba(255,190,11,.15);color:var(--amber)}
.badge-red{background:rgba(255,0,110,.15);color:var(--pink)}
.badge-blue{background:rgba(58,134,255,.15);color:var(--blue)}
.badge-gray{background:var(--bg-3);color:var(--ink-4)}
.badge-purple{background:rgba(131,56,236,.15);color:var(--purple)}

/* ── Mini bars ── */
.mini-bar{background:var(--bg-3);border-radius:2px;height:4px;overflow:hidden;margin-top:6px}
.mini-bar-fill{background:var(--amber);height:100%;border-radius:2px;transition:width .4s}

/* ── Layout ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.kpi-value{font-size:20px}}
.divider{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── Loading / Error ── */
#loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--ink-4)}
.spinner{width:28px;height:28px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#error-box{display:none;background:rgba(255,0,110,.1);border:1px solid rgba(255,0,110,.3);border-radius:var(--r);padding:16px;margin:20px;color:var(--pink);font-size:13px}
#hub-gate{display:none;position:fixed;inset:0;background:#000;z-index:2000;align-items:center;justify-content:center;padding:20px}
.hub-gate-card{width:100%;max-width:300px;text-align:center}
.hub-gate-title{font-size:16px;font-weight:700;letter-spacing:.22em;color:var(--ink);margin-bottom:4px}
.hub-gate-sub{font-size:11px;color:var(--ink-4);letter-spacing:.06em;margin-bottom:22px;text-transform:uppercase}
#hub-gate-pw{width:100%;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink);padding:11px 14px;border-radius:var(--r);font-size:14px;outline:none;text-align:center;margin-bottom:12px}
#hub-gate-pw:focus{border-color:var(--amber)}
.hub-gate-pw-wrap{position:relative;margin-bottom:12px}
.hub-gate-pw-wrap #hub-gate-pw{margin-bottom:0;padding-right:52px}
#hub-gate-pw-toggle{position:absolute;top:0;right:0;bottom:0;width:44px;background:none;border:none;color:var(--ink-4);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
#hub-gate-pw-toggle:hover{color:var(--ink-2)}
#hub-gate-btn{width:100%;background:var(--amber);color:#000;border:none;padding:11px;border-radius:var(--r);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .15s}
#hub-gate-btn:hover:not(:disabled){background:var(--gold-2)}
#hub-gate-btn:disabled{opacity:.5;cursor:not-allowed}
#hub-gate-error{display:none;margin-top:14px;font-size:12px;color:var(--pink)}

/* ── Log entries ── */
.log-entry{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0}
.log-dot.expense{background:var(--orange)}
.log-dot.hours{background:var(--sage)}
.log-text{flex:1;line-height:1.5}
.log-date{font-size:11px;color:var(--ink-4);margin-top:2px}
.log-amount{font-weight:600;white-space:nowrap;color:var(--ink)}

/* ── Empty states ── */
.empty{text-align:center;padding:40px 20px;color:var(--ink-4);font-size:13px}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.5}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;width:100%;max-width:660px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.8);animation:modalIn .18s ease}
.modal.modal-wide{max-width:1100px}
@keyframes modalIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0}
.modal-head h3{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.modal-close{background:var(--bg-3);border:1px solid var(--border);font-size:17px;cursor:pointer;color:var(--ink-3);line-height:1;padding:9px 14px;border-radius:var(--r);min-width:40px;min-height:40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.modal-close:hover{color:var(--ink)}
.modal-close:active{background:var(--bg-1);color:var(--ink)}
.modal-body{padding:20px;max-height:72vh;overflow-y:auto}
.modal-body .kpi{padding:12px}
.modal-body .kpi-value{font-size:20px}

/* ── Misc ── */
.project-row{cursor:pointer}
.chart-clickable-hint{font-size:10px;color:var(--ink-4);letter-spacing:.04em}
.btn-primary{background:var(--amber);color:#000;border:none;padding:9px 18px;font-size:12px;border-radius:var(--r);cursor:pointer;transition:background .2s;font-weight:700;letter-spacing:.04em}
.btn-primary:hover{background:var(--gold-2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.load-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;padding:14px 16px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r)}

/* ── Timesheet specific ── */
.ts-filter-bar{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.ts-filter-bar label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.ts-filter-bar select{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:5px 10px;border-radius:var(--r);font-size:12px}
.ts-nav-btn{background:transparent;border:1px solid var(--border-2);color:var(--ink-3);padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:16px;transition:all .15s}
.ts-nav-btn:hover{color:var(--ink);border-color:var(--ink-4)}
.ts-range-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ts-range-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-right:4px}
/* Canonical hub-wide pill/preset button — edit here to restyle EVERY range/preset
   button across the whole HUB (Timesheet period, Transactions & Expenses dates…).
   See CLAUDE.md → "Shared UI styles". .ts-range-btn kept as an alias. */
.hub-pill-btn,.ts-range-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-4);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.hub-pill-btn:hover,.ts-range-btn:hover{color:var(--ink-2);border-color:var(--ink-4)}
.hub-pill-btn.active,.ts-range-btn.active{background:var(--amber);color:#000;border-color:var(--amber)}
.ts-range-bar input[type="date"]{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:4px 8px;border-radius:var(--r);font-size:11px;color-scheme:dark}
.ts-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.ts-day-hdr{text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);padding:6px 0}
.ts-cell{aspect-ratio:1;border-radius:5px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:flex-start;padding:4px 5px;font-size:10px;position:relative;overflow:hidden;min-height:36px}
.ts-cell.clickable{cursor:pointer}
.ts-cell.clickable:hover{border-color:var(--amber) !important}
.ts-cell-grey{background:rgba(255,255,255,.02);border-color:transparent}
.ts-cell-missing{border-color:rgba(255,0,110,.25) !important}
.ts-day-num{font-size:10px;font-weight:700;color:var(--ink-3);z-index:1;position:relative;line-height:1}
.ts-day-label{font-size:8px;color:var(--ink-4);z-index:1;position:relative;margin-top:1px;letter-spacing:.04em}
.ts-miss-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.85}
.ts-cell-incomplete{border-color:rgba(255,190,11,.55) !important}
.ts-incomplete-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);position:absolute;top:4px;right:4px;z-index:3;box-shadow:0 0 5px rgba(255,190,11,.7)}
.ts-ph-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--blue);z-index:2}
.ts-bar-fill{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse}
.ts-bar-seg{width:100%;flex-shrink:0}
.ts-popup-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4)}
.ts-popup{position:absolute;background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;min-width:260px;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.7);overflow:hidden}
.ts-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--border)}
.ts-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.ts-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── P&L specific ── */
.pnl-cat-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-4);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.pnl-cat-btn:hover{color:var(--ink-2);border-color:var(--ink-4)}
.pnl-cat-btn.active{color:#000}

/* ── Floating Claude input bar ── */
#claude-bar{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(0,0,0,.94);border-top:1px solid var(--border-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 14px;display:flex;align-items:center;gap:8px}
#claude-bar-input{flex:1;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink);padding:9px 14px;border-radius:24px;font-size:13px;outline:none;transition:border-color .2s;min-width:0}
#claude-bar-input:focus{border-color:var(--amber)}
#claude-bar-input::placeholder{color:var(--ink-4)}
#claude-bar-input:disabled{opacity:.5}
#claude-add-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;flex-shrink:0;transition:all .2s;background:var(--bg-3);color:var(--ink-3)}
#claude-add-btn:hover:not(:disabled){border-color:var(--ink-4);color:var(--ink)}
#claude-add-btn:disabled{opacity:.4;cursor:not-allowed}
#claude-file-chips{display:none;flex-wrap:wrap;gap:4px}
.claude-chip{display:flex;align-items:center;gap:4px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:12px;padding:2px 6px 2px 4px;font-size:11px;color:var(--ink-3)}
.claude-chip-name{max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.claude-chip-rm{cursor:pointer;color:var(--ink-4);font-size:10px;flex-shrink:0;padding-left:2px}
.claude-chip-rm:hover{color:var(--ink)}
#claude-send-btn{background:var(--amber);color:#000;border:none;padding:9px 16px;border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.04em;transition:all .15s;flex-shrink:0}
#claude-send-btn:hover:not(:disabled){background:var(--gold-2)}
#claude-send-btn:disabled{opacity:.4;cursor:not-allowed}
#claude-bar-status{font-size:10px;color:var(--ink-4);white-space:nowrap;flex-shrink:0;letter-spacing:.06em;min-width:60px;text-align:right;display:none}
/* toast */
#claude-toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:9px 20px;border-radius:24px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;letter-spacing:.04em;white-space:nowrap;max-width:90vw;text-align:center}
#claude-toast.success{background:var(--sage);color:#000;opacity:1}
#claude-toast.error{background:var(--pink);color:#fff;opacity:1}
#claude-toast.unclear{background:var(--amber);color:#000;opacity:1}
body{padding-bottom:62px}

/* ── Schedule tab (2026-11-01) ── */
#page-schedule{max-width:1280px}
.sch-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sch-top h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sch-top-act{display:flex;gap:8px;align-items:center}
.sch-sub{font-size:12px;color:var(--ink-3)}
.sch-empty{padding:14px;color:var(--ink-4);font-size:13px;text-align:center}
.sch-empty.big{padding:40px 16px;line-height:1.6}
.sch-btn,.sch-ic,.sch-pick,.sch-link{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sch-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink-2);border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s}
.sch-btn:hover{border-color:var(--ink-4);color:var(--ink)}
.sch-btn.pri{background:var(--amber);border-color:var(--amber);color:#000}
.sch-btn.pri:hover{background:var(--gold-2)}
.sch-btn.danger{color:var(--pink);border-color:rgba(255,0,110,.35);background:transparent}
.sch-ic{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink-2);border-radius:8px;font-size:18px;line-height:1}
.sch-ic.sm{width:32px;height:32px;font-size:13px;flex:none}
.sch-link{background:none;border:none;color:var(--ink-3);font-size:12px;padding:10px 4px;text-align:left;text-decoration:underline;text-underline-offset:3px}
.sch-btn:focus-visible,.sch-ic:focus-visible,.sch-in:focus-visible,.sch-card:focus-visible,.sch-att:focus-visible,.sch-pill:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.sch-layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.sch-layout>*{min-width:0}
.sch-col-pipe{position:sticky;top:112px;max-height:calc(100vh - 220px);overflow-y:auto;padding-right:2px}
.sch-banner{position:sticky;top:96px;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--amber);color:#000;padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}
.sch-banner button{background:#000;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}

.sch-attn{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-bottom:16px}

.sch-sec-h{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:12px 2px 6px;display:flex;align-items:center;gap:8px}
.sch-sec-h::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sch-sec-h em{font-style:normal;color:var(--ink-4)}
.sch-card{background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--c);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .1s}
.sch-card:hover{border-color:var(--border-2);border-left-color:var(--c)}
.sch-card:active{transform:scale(.995)}
.sch-card.placing{outline:2px solid var(--amber)}
.sch-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sch-card-top b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.sch-card-sub{max-width:100%;font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.sch-meta .trunc{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sch-chips:empty{display:none}
.sch-chip{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--bg-3);color:var(--ink-3);line-height:1.3}
.sch-chip.bad{background:rgba(255,0,110,.16);color:#ff6aa8}
.sch-chip.warn{background:rgba(255,190,11,.14);color:var(--amber)}
.sch-card-act{display:flex;gap:6px;margin-top:10px}.sch-card-act .sch-btn{flex:1;min-height:34px;font-size:12px}
.sch-st{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:20px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap;flex:none}
.sch-pd{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;margin-right:6px;background:var(--ink-4)}
.sch-pd.p1{background:var(--pink)}.sch-pd.p3{background:transparent;border:1.5px solid var(--ink-4)}

.sch-cal{margin-bottom:16px}

.sch-cal-h h2{font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);flex:1;text-align:center;min-width:140px}
.sch-nav{display:flex;gap:6px}
.sch-seg{display:inline-flex;background:var(--bg-3);border:1px solid var(--border-2);border-radius:9px;padding:2px}
.sch-seg button{font:inherit;font-size:12px;font-weight:600;color:var(--ink-3);background:none;border:none;border-radius:7px;padding:0 14px;min-height:32px;cursor:pointer}
.sch-seg button.on{background:var(--amber);color:#000}
.sch-seg.wide{display:flex;margin-bottom:10px}.sch-seg.wide button{flex:1;padding:0 4px}
.sch-grid{display:grid;gap:1px;background:var(--border)}
.sch-grid.week{grid-template-columns:repeat(7,minmax(0,1fr))}
.sch-grid.month{grid-template-columns:repeat(7,minmax(0,1fr))}
.sch-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-2);border-bottom:1px solid var(--border)}
.sch-dow span{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);text-align:center;padding:8px 0}
.sch-day{background:var(--bg-2);min-height:150px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:background .12s}
.sch-grid.month .sch-day{min-height:96px}
.sch-day:hover{background:var(--bg-3)}
.sch-day.off{background:#0b0b0b}
.sch-day.dim{opacity:.38}
.sch-more{margin-top:14px;border-top:1px solid var(--border);padding-top:10px}
.sch-more>summary{cursor:pointer;color:var(--ink-3);font-size:13px;padding:6px 0}
.sch-day.past{background:#070707;opacity:.35;pointer-events:none;min-height:0}
.sch-day.past .sch-dn{color:var(--ink-4)}
.sch-ev.ghost{background:transparent;border:1.5px dashed var(--c);color:var(--ink-1)!important}
.sch-day.today .sch-dn{background:var(--amber);color:#000;border-radius:5px;padding:1px 6px}
.sch-day.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.sch-day.over,.sch-day.placeable:hover{background:rgba(255,190,11,.12);box-shadow:inset 0 0 0 2px var(--amber)}
.sch-day-h{display:flex;justify-content:space-between;align-items:center;gap:4px}
.sch-dn{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.sch-wx{font-size:10.5px;color:var(--ink-3)}.sch-wx.rain{color:var(--blue)}
.sch-load{height:3px;background:var(--bg-3);border-radius:2px;overflow:hidden}
.sch-load i{display:block;height:100%;background:var(--sage);border-radius:2px}
.sch-load.over i{background:var(--pink)}
.sch-evs{display:flex;flex-direction:column;gap:4px;min-height:0}
.sch-ev{background:var(--c);border-radius:6px;padding:5px 7px;cursor:grab;display:flex;flex-direction:column;gap:1px;font-size:11.5px;line-height:1.25;min-width:0}
.sch-ev b{display:flex;align-items:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-ev b .sch-pd{background:currentColor;opacity:.7;border-color:currentColor}
.sch-ev span{font-size:10.5px;opacity:.85}
.sch-ev.bad{box-shadow:0 0 0 2px var(--pink)}
.sch-ev.done{opacity:.45}
.sch-grid.month .sch-ev span{display:none}.sch-grid.month .sch-ev{padding:3px 6px}

.sch-plan{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--bg-3);border-left:3px solid var(--c);border-radius:8px;cursor:pointer;margin-bottom:6px}
.sch-plan time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);width:92px;flex:none}
.sch-plan>span:not(.sch-st){flex:1;min-width:0;display:flex;flex-direction:column}.sch-plan small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-trav{font-size:11px;color:var(--ink-4);padding:2px 0 8px 14px}

/* sheet */
.sch-sheet{display:flex;flex-direction:column;gap:2px}
.sch-lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sch-pills{display:flex;gap:6px;flex-wrap:wrap}
.sch-pill{font:inherit;font-size:12px;font-weight:600;min-height:36px;padding:0 13px;border-radius:20px;border:1px solid var(--border-2);background:transparent;color:var(--ink-3);cursor:pointer}
.sch-pill.on{background:var(--c);border-color:var(--c);color:#000}
.sch-issues{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.sch-iss{font-size:12.5px;padding:8px 11px;border-radius:8px;background:var(--bg-3);line-height:1.35}
.sch-iss.bad{background:rgba(255,0,110,.13);color:#ff8fbd}.sch-iss.warn{background:rgba(255,190,11,.1);color:var(--gold-2)}
.sch-f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0;flex:1}
.sch-f>span{font-size:11px;color:var(--ink-3);font-weight:600}
.sch-in{font:inherit;font-size:16px;width:100%;min-height:42px;padding:8px 11px;background:var(--bg-1);border:1px solid var(--border-2);border-radius:8px;color:var(--ink-1);color-scheme:dark;resize:vertical}
.sch-in:focus{border-color:var(--amber);outline:none}
.sch-move{background:var(--bg-3);border-radius:10px;padding:12px;margin-bottom:12px}
.sch-move-main,.sch-row3{display:flex;gap:10px;flex-wrap:wrap}
.sch-move-main .sch-f{min-width:96px}.sch-move-main .sch-f:first-child{flex:2;min-width:150px}
.sch-row3 .sch-f{min-width:130px}.sch-row3 .sch-f.span2{flex:2}
.sch-quick{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.sch-con{display:flex;align-items:center;gap:12px;background:var(--bg-3);border-radius:10px;padding:10px 12px;margin-bottom:6px;flex-wrap:wrap}
.sch-con.done{opacity:.5}
.sch-con-main{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}.sch-con-main small{font-size:11.5px;color:var(--ink-3)}
.sch-chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);min-height:36px}
.sch-chk input{width:20px;height:20px;accent-color:var(--amber)}
.sch-addcon{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sch-addcon .sch-in{flex:1;min-width:120px}
.sch-tl{margin:30px 44px 26px 44px}
.sch-tl-bar{position:relative;height:6px;background:var(--bg-1);border-radius:3px}
.sch-tl-bar i{position:absolute;top:0;height:100%;border-radius:3px}
.sch-tl-bar u{position:absolute;top:-4px;width:2px;height:14px;background:var(--ink-3);text-decoration:none}
.sch-tl-bar u s{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3);white-space:nowrap;text-decoration:none}
.sch-tl-bar u.o{background:var(--amber)}.sch-tl-bar u.e{background:var(--sage)}.sch-tl-bar u.st{background:var(--blue);top:-8px;height:22px}
.sch-tl-bar u.o s,.sch-tl-bar u.st s{top:-18px}
.sch-notify{background:var(--bg-3);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sch-send{display:flex;gap:8px;flex-wrap:wrap}.sch-send .sch-btn{flex:1;min-width:90px}
.sch-hint{font-size:11.5px;color:var(--ink-4);line-height:1.4}
.sch-log{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);padding:4px 0}
.sch-foot{margin-top:18px;display:flex;justify-content:flex-end}
.sch-pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--ink);background:var(--bg-3);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:6px;min-height:52px}
.sch-pick span{display:flex;flex-direction:column}.sch-pick small{font-size:11.5px;color:var(--ink-3)}.sch-pick i{font-style:normal;font-size:18px;color:var(--amber)}
.sch-sql{margin-top:14px;background:var(--bg-1);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11px;overflow:auto;max-height:220px;color:var(--ink-3)}
#sch-snack{position:fixed;left:50%;bottom:92px;transform:translate(-50%,24px);opacity:0;pointer-events:none;z-index:3000;background:#1d1d1d;border:1px solid var(--border-2);border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-width:calc(100vw - 24px);transition:all .2s}
#sch-snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#sch-snack button{font:inherit;font-weight:700;font-size:12.5px;background:none;border:none;color:var(--amber);padding:8px;cursor:pointer;white-space:nowrap}

@media (max-width:900px){
  .sch-layout{grid-template-columns:minmax(0,1fr)}
  .sch-col-pipe{position:static;max-height:none;order:2}
  .sch-col-cal{order:1}
}
@media (max-width:720px){
  #page-schedule{padding:14px 12px}
  .sch-grid.week{grid-template-columns:1fr}
  .sch-grid.week .sch-day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}
  .sch-grid.week .sch-day-h{width:96px;flex-direction:column;align-items:flex-start;gap:2px}
  .sch-grid.week .sch-load{width:100%;order:3}
  .sch-grid.week .sch-evs{flex:1;min-width:140px}
  .sch-grid.week .sch-day.off{display:none}
  .sch-grid.month .sch-day{min-height:62px;padding:5px 3px}
  .sch-grid.month .sch-ev b{font-size:9px}
  .sch-attn{grid-template-columns:1fr}
  .sch-cal-h h2{order:-1;flex-basis:100%}
}
@media (hover:none){.sch-ev{cursor:pointer}}


/* ══ Polish layer (2026-11-01) — ergonomics + consistency across the whole Hub ══ */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
button,.tab,.hub-pill-btn,select,input[type=checkbox]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
.tab:focus-visible{outline-offset:-2px}
.btn-refresh,.hub-pill-btn,.tab{transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn-refresh:active,.hub-pill-btn:active{transform:scale(.97)}
.header{padding-top:max(14px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
#claude-bar{padding-bottom:max(10px,env(safe-area-inset-bottom));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
#app{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.tab{scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media (max-width:720px){
  .header{padding:max(10px,env(safe-area-inset-top)) 12px 10px}
  .header-meta{display:none}
  .header-brand span{display:none}
  .header-brand img{height:18px;width:auto}
  .header>div:last-child{gap:6px!important}
  .btn-refresh{padding:0 10px}
  .btn-refresh{padding:0 12px;min-height:38px;font-size:12px;white-space:nowrap}
  .tabs{scroll-snap-type:x proximity;padding:0 4px}
  .tab{padding:0 14px;min-height:46px;display:flex;align-items:center;font-size:11.5px}
  .page{padding:14px 12px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .section{overflow-x:auto;-webkit-overflow-scrolling:touch}
  input,select,textarea{font-size:16px}               /* stops iOS zooming into fields */
  .hub-pill-btn,.ts-range-btn{min-height:38px}
  /* modals become bottom sheets */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal,.modal.modal-wide{max-width:none;width:100%;margin:0;border-radius:18px 18px 0 0;max-height:94vh;display:flex;flex-direction:column;animation:sheetIn .22s ease}
  .modal-head{border-radius:18px 18px 0 0;padding:14px 16px;position:sticky;top:0;background:var(--bg-2);z-index:2}
  .modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(20px,env(safe-area-inset-bottom))}
  #sch-snack{bottom:calc(92px + env(safe-area-inset-bottom))}
}

/* ══ Phone navigation (2026-11-06) — bottom bar for the 4 most-used tabs + "More" sheet.
   Based on usage: Timesheets, Projects, Schedule, Scan Receipt. Desktop keeps the top tab strip. ══ */
#hub-nav,#hub-more{display:none}
@media (max-width:720px){
  .tabs{display:none}
  #hub-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:520;background:#000;border-top:1px solid var(--border-2);padding:0 max(4px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-right))}
  #hub-nav button{flex:1;min-height:56px;background:none;border:none;color:var(--ink-4);font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;touch-action:manipulation}
  #hub-nav button .ni{font-size:20px;line-height:1}
  #hub-nav button.active{color:var(--amber)}
  #hub-nav .nbadge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;display:none}
  #claude-bar{bottom:calc(56px + env(safe-area-inset-bottom));padding-bottom:10px}
  #app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  #claude-toast{bottom:calc(130px + env(safe-area-inset-bottom))}
  #sch-snack{bottom:calc(150px + env(safe-area-inset-bottom))}
  #hub-more{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.6);align-items:flex-end}
  #hub-more.open{display:flex}
  #hub-more .sheet{width:100%;background:var(--bg-2);border-radius:18px 18px 0 0;padding:8px 12px calc(14px + env(safe-area-inset-bottom));animation:sheetIn .22s ease;max-height:80vh;overflow-y:auto}
  #hub-more .sheet-h{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);padding:12px 6px 6px}
  #hub-more .sheet button{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;background:none;border:none;border-bottom:1px solid var(--border);color:var(--ink);font:inherit;font-size:16px;padding:0 6px;text-align:left;touch-action:manipulation}
  #hub-more .sheet button.active{color:var(--amber);font-weight:700}
  #hub-more .sheet .mbadge{background:var(--orange);color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700}
  /* bigger thumb targets on the common action buttons */
  .btn-primary,.btn-refresh,.pnl-cat-btn,#claude-send-btn{min-height:44px}
  #claude-add-btn{min-width:44px;min-height:44px}
}

}

<script>
// The functions that read or write business data check the login token; add it to those calls.
(function () {
  const plainFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/\/\.netlify\/functions\/(hub-write|claude-parse|hub-read|hub-track|smart-note|receipt-inbox|receipt-xero)/.test(url)) {
      const token = localStorage.getItem('hub_auth_token');
      if (token) {
        const headers = new Headers((init && init.headers) || (typeof input !== 'string' && input.headers) || {});
        headers.set('x-hub-token', token);
        init = Object.assign({}, init, { headers });
      }
    }
    return plainFetch(input, init);
  };
})();
let D = null;
let charts = {};

// ── Supabase config ───────────────────────────────────────────────────────────
const SB_URL  = 'https://nwpzjqblhywclqharggu.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cHpqcWJsaHl3Y2xxaGFyZ2d1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTQ2NjcsImV4cCI6MjA5NjI5MDY2N30.XYgfk5jriDpZVXFW6xkWh-hyaYLsP6ZKpInTMXqk9tc';
const SB_HDR  = { 'apikey': SB_ANON, 'Authorization': 'Bearer ' + SB_ANON };

async function sbGet(path) {
  const r = await fetch(SB_URL + path, { headers: SB_HDR });
  if (!r.ok) throw new Error('Supabase error ' + r.status + ' on ' + path);
  return r.json();
}

async function sbPatch(table, query, body) {
  const r = await fetch(SB_URL + '/rest/v1/' + table + query, {
    method: 'PATCH',
    headers: { ...SB_HDR, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Supabase PATCH error ' + r.status);
  return r.json();
}

// hubWrite — the single write path for direct-from-HUB input. The browser's anon
// key is read-only; this POSTs to the hub-write function, which writes with the
// service key against a server-side allow-list. Use this for every HUB edit.
async function hubWrite(table, id, fields) {
  const r = await fetch('/.netlify/functions/hub-write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ table, id, fields })
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok || !out.ok) throw new Error(out.error || ('hub-write error ' + r.status));
  return out.row;
}

// Bookings hold client phone/email, so they are read through a password-gated function,
// not the browser's public key.
async function hubReadBookings() {
  const r = await fetch('/.netlify/functions/hub-read', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ table: 'bookings' }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok || !out.ok) throw new Error(out.error || 'read failed');
  return out.rows;
}

// ── Data load — live from Supabase ────────────────────────────────────────────
async function loadData() {
  try {
    const [timesheets, expenses, projects, xeroRows, invoiceItems, quoteItems, shoppingLists, bookings, priceList] = await Promise.all([
      sbGet('/rest/v1/timesheets?select=*&order=date.asc,id.asc'),
      sbGet('/rest/v1/expense_log?select=*&order=date.asc,id.asc'),
      sbGet('/rest/v1/projects?select=*&order=id.asc'),
      sbGet('/rest/v1/xero_cache?select=key,data'),
      sbGet('/rest/v1/invoice_items?select=id,invoice_number,quote_number,contact,contact_id,price_excl_gst,paid,status,date,description,item,project'),
      // quote_items is a brand-new table (added 2026-06-30) — until Seb runs
      // supabase_quote_items_setup.sql in the Supabase SQL editor it 404s.
      // Swallow that one failure so a missing table doesn't take down the
      // whole HUB; quote-linking just stays empty until the table exists.
      sbGet('/rest/v1/quote_items?select=id,quote_number,contact,contact_id,line_amount,status,date,expiry_date,description,item,project').catch(() => []),
      // shopping_lists (added 2026-09-18) — same "table might not exist yet"
      // guard until supabase_shopping_list_and_baseline.sql has been run.
      sbGet('/rest/v1/shopping_lists?select=*&order=created_at.desc').catch(() => []),
      // bookings (Schedule tab, 2026-11-01) — null = table not created yet
      // (supabase_bookings.sql not run); the tab then shows a one-tap setup card.
      hubReadBookings().catch(() => null),
      sbGet('/rest/v1/price_list?select=*&order=item.asc&limit=5000').catch(() => null)
    ]);

    const xero = {};
    xeroRows.forEach(row => { xero[row.key] = row.data; });

    D = {
      timesheets,
      expense_log:          expenses,
      projects,
      invoice_items:        invoiceItems,
      quote_items:          quoteItems,
      shopping_lists:       shoppingLists,
      bookings,
      price_list:           priceList,
      kpis:                 xero.kpis                 || {},
      monthly:              xero.monthly              || { labels:[], periods:[], revenue:[], materials:[], wages_owner:[] },
      open_invoices:        xero.open_invoices        || [],
      top_customers:        xero.top_customers        || [],
      quotes:               xero.quotes               || [],
      fy_summary:           xero.fy_summary           || {},
      cost_detail_monthly:  xero.cost_detail_monthly  || {},
      liability_transactions: xero.liability_transactions || null,
      account_categories:   xero.account_categories   || {},
      meta:                 xero.meta                 || { last_updated: new Date().toISOString() }
    };

    // Cascade project links both ways between quotes and invoices, then check
    // for newly-fully-paid projects — see functions below loadData().
    const autoLinked = await cascadeLinkedQuotesAndInvoices();
    const autoPaid   = await autoUpdatePaidProjects();
    if (autoLinked) claudeToast(`✓ Auto-linked ${autoLinked} quote/invoice line${autoLinked>1?'s':''} via shared quote reference`, 'success');
    const wl = await autoUpdateWonLost();
    if (wl) claudeToast(`✓ ${wl} quote${wl>1?'s':''} moved to Won/Lost from Xero`, 'success');
    schGapFill();
    if (autoPaid)   claudeToast(`✓ ${autoPaid} project${autoPaid>1?'s':''} marked Paid — invoice(s) fully paid in Xero`, 'success');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('error-box').style.display = 'none';
    renderAll();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.style.display = 'block';
    eb.textContent = 'Could not load data. ' + e.message;
  }
}

// When an accepted Xero quote is converted to an invoice, Xero auto-populates
// the invoice's Reference field with the quote number — synced into
// invoice_items.quote_number. If that quote is already hand-linked to a project,
// there's no reason to make Seb link the invoice too: cascade the same project
// onto any invoice line sharing that quote number that isn't linked yet.
// Never overwrites an invoice line that's already linked to a DIFFERENT project
// (a manual link always wins over the automatic one). Returns the count linked.
async function autoLinkInvoicesFromQuotes() {
  const quoteProjectMap = {};
  (D.quote_items || []).forEach(qi => {
    const proj = (qi.project || '').trim();
    const qn = (qi.quote_number || '').trim();
    if (proj && qn && !quoteProjectMap[qn]) quoteProjectMap[qn] = proj;
  });
  if (!Object.keys(quoteProjectMap).length) return 0;

  // A link to a name that is no longer a real project (e.g. a job later split into
  // several, "Dan - St Ives" -> "Dan - St Ives - post repairs") counts as unlinked,
  // otherwise the invoice never reaches its real job and Paid is never detected.
  const real = new Set((D.projects || []).map(x => x.name));
  const toLink = (D.invoice_items || []).filter(ii => {
    const qn = (ii.quote_number || '').trim(), cur = (ii.project || '').trim();
    return qn && quoteProjectMap[qn] && (!cur || !real.has(cur));
  });
  if (!toLink.length) return 0;

  let linked = 0;
  for (const ii of toLink) {
    const proj = quoteProjectMap[(ii.quote_number || '').trim()];
    try { await hubWrite('invoice_items', ii.id, { project: proj }); ii.project = proj; linked++; }
    catch (e) { /* skip a single failure, keep going */ }
  }
  return linked;
}

// Mirror of the above, other direction: when an invoice line is hand-linked to a
// project, auto-link any quote line sharing the same Xero quote reference — so
// Est. Value (driven by linked quote_items) reflects the quote as soon as one of
// its resulting invoices is linked, without Seb having to link the quote separately.
async function autoLinkQuotesFromInvoices() {
  const invoiceProjectMap = {};
  (D.invoice_items || []).forEach(ii => {
    const proj = (ii.project || '').trim();
    const qn = (ii.quote_number || '').trim();
    if (proj && qn && !invoiceProjectMap[qn]) invoiceProjectMap[qn] = proj;
  });
  if (!Object.keys(invoiceProjectMap).length) return 0;

  // If Seb already picked specific lines of a quote, respect that selection:
  // never pull in the rest of the quote (that made Est. Value show the full quote).
  const pickedQuotes = new Set((D.quote_items || []).filter(qi => (qi.project || '').trim()).map(qi => (qi.quote_number || '').trim()));
  const toLink = (D.quote_items || []).filter(qi => {
    const qn = (qi.quote_number || '').trim();
    return qn && invoiceProjectMap[qn] && !pickedQuotes.has(qn) && !(qi.project || '').trim();
  });
  if (!toLink.length) return 0;

  let linked = 0;
  for (const qi of toLink) {
    const proj = invoiceProjectMap[(qi.quote_number || '').trim()];
    try { await hubWrite('quote_items', qi.id, { project: proj }); qi.project = proj; linked++; }
    catch (e) { /* skip a single failure, keep going */ }
  }
  return linked;
}

// Run both cascade directions once each (quote→invoice, then invoice→quote) — a
// single pass of each is enough since it's a direct field copy, not recursive.
// Call this after ANY link/bulk-link action and once on every data load.
async function cascadeLinkedQuotesAndInvoices() {
  const y = await autoLinkInvoicesByAmount();
  const z = await autoLinkQuotesFromBookings();
  const a = await autoLinkInvoicesFromQuotes();
  const b = await autoLinkQuotesFromInvoices();
  return y + z + a + b;
}

// An invoice with no job whose client matches a job's client (first word of the
// name) and whose total equals that job's quoted figure to the cent is, in practice,
// that job's invoice. Link it only when exactly one job fits and the job has no
// invoice yet; the quote lines then follow through the quote-number cascade.
async function autoLinkInvoicesByAmount() {
  const real = new Set((D.projects || []).map(x => x.name));
  const hasInv = new Set((D.invoice_items || []).filter(ii => real.has((ii.project || '').trim())).map(ii => ii.project.trim()));
  const groups = {};
  (D.invoice_items || []).forEach(ii => {
    const cur = (ii.project || '').trim();
    if (cur && real.has(cur)) return;
    if (['VOIDED', 'DELETED', 'DRAFT'].includes((ii.status || '').toUpperCase())) return;
    (groups[ii.invoice_number] = groups[ii.invoice_number] || []).push(ii);
  });
  const first = t => String(t || '').trim().split(/[\s\-]+/)[0].toLowerCase();
  const taken = new Set();
  let linked = 0;
  for (const num of Object.keys(groups)) {
    const rows = groups[num], total = rows.reduce((a, r) => a + (Number(r.price_excl_gst) || 0), 0), who = first(rows[0].contact);
    if (!who || total <= 0) continue;
    const fits = (D.projects || []).filter(pr => !hasInv.has(pr.name) && !taken.has(pr.name) && Number(pr.quoted) > 0
      && Math.abs(Number(pr.quoted) - total) < 0.011 && first(pr.name) === who);
    if (fits.length !== 1) continue;
    const proj = fits[0].name;
    taken.add(proj);
    for (const r of rows) { try { await hubWrite('invoice_items', r.id, { project: proj }); r.project = proj; linked++; } catch (e) { /* skip */ } }
  }
  return linked;
}

// Quotes made from Claude record the job and the Xero quote number together in
// the Schedule's bookings table. That is exact common ground, so link those quote
// lines to the job straight away (only if nothing of that quote is linked yet).
async function autoLinkQuotesFromBookings() {
  const names = new Set((D.projects || []).map(p => p.name));
  const map = {};
  (D.bookings || []).forEach(b => {
    const qn = (b.quote_number || '').trim(), pr = (b.project || '').trim();
    if (qn && pr && names.has(pr) && !map[qn]) map[qn] = pr;
  });
  if (!Object.keys(map).length) return 0;
  const picked = new Set((D.quote_items || []).filter(qi => (qi.project || '').trim()).map(qi => (qi.quote_number || '').trim()));
  let linked = 0;
  for (const qi of (D.quote_items || [])) {
    const qn = (qi.quote_number || '').trim();
    if (!qn || !map[qn] || picked.has(qn) || (qi.project || '').trim()) continue;
    try { await hubWrite('quote_items', qi.id, { project: map[qn] }); qi.project = map[qn]; linked++; } catch (e) { /* skip */ }
  }
  return linked;
}

// Seb's ask (2026-07-09): once every hand-linked invoice on a project is PAID in
// Xero, flip the project's status to "Paid" automatically instead of relying on
// him to notice and click the status pill. Only ever moves status FORWARD to
// Paid — never touches a project already Paid or one marked Inactive (that's a
// deliberate override Seb made, not something to second-guess). Based only on
// HAND-LINKED invoice lines (not fuzzy auto-match — see projRenderAutoMatchedSection),
// since that's the same source of truth the Invoiced/Est.Value figures use.
async function autoUpdatePaidProjects() {
  let changed = 0;
  for (const proj of (D.projects || [])) {
    const status = proj.status || 'Active';
    if (status === 'Paid' || status === 'Inactive' || status === 'Lost') continue;
    if (isNonBillable(proj.name)) continue;
    const linkedInvoices = (D.invoice_items || []).filter(ii => (ii.project || '').trim() === proj.name);
    if (!linkedInvoices.length) continue;
    const allPaid = linkedInvoices.every(ii => (ii.status || '').toUpperCase() === 'PAID');
    if (!allPaid) continue;
    try {
      const row = await hubWrite('projects', proj.id, { status: 'Paid' });
      Object.assign(proj, row);
      changed++;
    } catch (e) { /* skip a single failure, keep going */ }
  }
  return changed;
}

// Won / Lost: a project still marked Quoted moves to Won when its Xero quote is ACCEPTED
// (Xero approval feeds in via the quote sync), or to Lost when DECLINED. Matches by the
// hand-linked quote lines, the Schedule booking, or same client + exact quoted amount.
async function autoUpdateWonLost() {
  const byQ = {};
  (D.quote_items || []).forEach(q => { if (q.quote_number) (byQ[q.quote_number] = byQ[q.quote_number] || []).push(q); });
  const low = x => String(x || '').toLowerCase().trim();
  let changed = 0;
  for (const proj of (D.projects || [])) {
    if (proj.status !== 'Quoted') continue;
    const nums = new Set();
    Object.entries(byQ).forEach(([qn, ls]) => { if (ls.some(l => low(l.project) === low(proj.name))) nums.add(qn); });
    (D.bookings || []).forEach(b => { if (b.quote_number && typeof schProjectOf === 'function' && (schProjectOf(b) || {}).id === proj.id) nums.add(b.quote_number); });
    if (!nums.size && Number(proj.quoted) > 0) {
      const first = low(proj.name).split(/[\s-]+/)[0];
      Object.entries(byQ).forEach(([qn, ls]) => {
        const tot = ls.reduce((t, l) => t + (Number(l.line_amount) || 0), 0);
        if (low(ls[0].contact).split(/[\s-]+/)[0] === first && (Math.abs(tot - proj.quoted) < 1.5 || Math.abs(tot * 1.1 - proj.quoted) < 1.5)) nums.add(qn);
      });
    }
    const sts = [...nums].map(n => String(byQ[n][0].status || '').toUpperCase());
    const next = sts.includes('ACCEPTED') ? 'Won' : (sts.length && sts.every(x => x === 'DECLINED') ? 'Lost' : null);
    if (!next) continue;
    try { Object.assign(proj, await hubWrite('projects', proj.id, { status: next })); changed++; } catch (e) {}
  }
  return changed;
}

// Seb's ask (2026-07-09): PR-016 ("Kim - Manly #6") was showing an Invoiced total
// pulled in from OTHER old jobs for the same repeat client (Kim has had 6+ jobs
// over 2 years, but only ever gets one project row per active job) — because a
// project with ZERO hand-linked invoices falls back to matching invoices purely
// by contact name/id (see renderProjects), and there's nowhere to unlink a line
// that was never explicitly linked in the first place. This section surfaces
// exactly what's being fuzzy-matched so Seb can see it, then convert it to
// explicit links in one click — after which the normal "✕ unlink" (already built)
// works on the wrong ones. Returns '' once any hand-link exists (auto-match is
// fully superseded at that point — see the exclusion in renderProjects).
// Fuzzy auto-match by client name/contact — brings only the SINGLE most recent
// invoice (by date), not every invoice this client was ever billed. Summing every
// historic invoice for a repeat customer produced bloated, meaningless "Invoiced"
// totals — e.g. PR-016 "Kim - Manly #6" pulling in 5 unrelated old jobs (Seb's ask,
// 2026-07-10). Used by renderProjects(), the auto-matched warning box, and its
// "convert to explicit links" action, so all three agree on the same result.
function projAutoMatchInvoices(name, def) {
  def = def || {};
  const storedContactId = def.contact_id || null;
  const clientName = name.split(' - ')[0].trim().toLowerCase();
  if (!clientName || clientName === 'admin') return [];
  const allMatches = (D.invoice_items || []).filter(ii => {
    if ((ii.project || '').trim()) return false; // hand-linked elsewhere already
    if (storedContactId) return ii.contact_id === storedContactId;
    return (ii.contact || '').toLowerCase().includes(clientName);
  });
  if (!allMatches.length) return [];
  const lastInvoiceNumber = allMatches.slice().sort((a, b) =>
    (b.date || '').localeCompare(a.date || '') || String(b.invoice_number||'').localeCompare(String(a.invoice_number||''))
  )[0].invoice_number;
  return allMatches.filter(ii => ii.invoice_number === lastInvoiceNumber)
                   .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}

// Cash taken on a job. If the amount was typed into the note box instead of the
// revenue box (a bare number), read it as the amount so it still counts.
function projManualRev(def) {
  if (!def) return 0;
  const n = Number(def.manual_revenue) || 0;
  if (n) return n;
  const t = String(def.manual_revenue_note || '').trim().replace(/[$,\s]/g, '');
  return /^\d+(\.\d+)?$/.test(t) ? Number(t) : 0;
}

function projHasHandLinks(name) {
  return (D.invoice_items || []).some(ii => (ii.project || '').trim() === name)
      || (D.quote_items || []).some(qi => (qi.project || '').trim() === name);
}

function projRenderAutoMatchedSection(name) {
  if (projHasHandLinks(name)) return '';
  const def = (D.projects || []).find(p => p.name === name) || {};
  const matches = projAutoMatchInvoices(name, def);
  if (!matches.length) return '';

  const total = matches.reduce((a, ii) => a + (Number(ii.price_excl_gst) || 0), 0);
  const invNo = matches[0].invoice_number || '—';
  const safe = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const rows = matches.map(ii => `<tr>
      <td style="white-space:nowrap;color:var(--ink-4);font-size:11px">${ii.date ? fmtDMYDash(ii.date) : '—'}</td>
      <td style="white-space:nowrap;color:var(--blue)">${ii.invoice_number || '—'}</td>
      <td style="color:var(--ink-4)">${attrEsc((ii.description || '').slice(0, 34))}</td>
      <td>${attrEsc(ii.contact || '')}</td>
      <td class="amount">${fmt(ii.price_excl_gst || 0)}</td>
    </tr>`).join('');

  return `<div style="margin-bottom:14px;padding:10px 12px;background:var(--bg-2);border-radius:8px;border-left:2px solid var(--amber)">
    <div style="font-size:11px;color:var(--amber);font-weight:700;margin-bottom:4px">⚠ Auto-matched by contact — last invoice ${attrEsc(invNo)}, ${matches.length} line${matches.length>1?'s':''} (${fmt(total)}), not hand-linked</div>
    <div style="font-size:11px;color:var(--ink-4);margin-bottom:8px">Older invoices for the same client are ignored. Convert to an explicit link if this is the right job.</div>
    <table style="font-size:12px;margin-bottom:8px"><tbody>${rows}</tbody></table>
    <span onclick="projConvertAutoMatched('${safe}')" style="cursor:pointer;color:var(--sage);font-weight:700;font-size:12px">+ convert to explicit link${matches.length>1?'s':''}</span>
  </div>`;
}

async function projConvertAutoMatched(name) {
  if (projHasHandLinks(name)) return;
  const def = (D.projects || []).find(p => p.name === name) || {};
  const matches = projAutoMatchInvoices(name, def);
  if (!matches.length) return;

  let ok = 0;
  for (const ii of matches) {
    try { await hubWrite('invoice_items', ii.id, { project: name }); ii.project = name; ok++; }
    catch (e) { /* keep going, report partial success below */ }
  }
  const cascaded = await cascadeLinkedQuotesAndInvoices();
  const paidChanged = await autoUpdatePaidProjects();
  claudeToast(`✓ Converted ${ok}/${matches.length} auto-matched invoice${matches.length>1?'s':''} to explicit links — unlink any that don't belong`
    + (cascaded ? ` (+${cascaded} quote/invoice line${cascaded>1?'s':''} auto-linked)` : '')
    + (paidChanged ? ` (${paidChanged} project${paidChanged>1?'s':''} marked Paid)` : ''), ok ? 'success' : 'error');
  showProjectDetail(name);
  renderProjects(D.kpis);
}

// Job-status baseline (2026-09-18) — projects.baseline_* is set once, when a
// quote is approved (normally by the Xero MCP connector's create_quote tool),
// capturing the agreed scope/price/labour-materials estimate. This block
// compares that baseline against actuals already computed by showProjectDetail
// (timesheets hours, expense_log total) so Seb can see at a glance whether a
// job ran on-budget, over/under on materials, or over/under on time. Read-only
// here — edit baseline_* via Supabase/hub-write directly if it needs correcting.
function projRenderBaseline(defined, actualHours, actualMaterials, rate) {
  if (!defined || defined.baseline_set_at == null) return '';
  const bHours = defined.baseline_labour_hours != null ? Number(defined.baseline_labour_hours) : null;
  const bMat   = defined.baseline_materials_estimate != null ? Number(defined.baseline_materials_estimate) : null;
  const bPrice = defined.baseline_price != null ? Number(defined.baseline_price) : null;
  const hoursDelta = bHours != null ? actualHours - bHours : null;
  const matDelta   = bMat != null ? actualMaterials - bMat : null;
  const deltaStyle = d => d == null ? 'var(--ink-4)' : d > 0 ? 'var(--orange)' : 'var(--sage)';
  const deltaText  = (d, unit) => d == null ? '—' : (d > 0 ? '+' : '') + d.toFixed(unit==='h'?1:0) + (unit==='h'?'h':'') + (d>0?' over':d<0?' under':' on budget');
  return `<div style="margin-bottom:20px">
    <div class="divider" style="margin-top:0">Baseline (quoted ${new Date(defined.baseline_set_at).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})})</div>
    ${defined.baseline_scope ? `<div style="font-size:12px;color:var(--ink-3);margin-bottom:10px;padding:8px 10px;background:var(--bg-2);border-radius:6px">${attrEsc(defined.baseline_scope)}</div>` : ''}
    <div style="display:flex;flex-wrap:wrap;gap:12px">
      <div style="flex:1;min-width:140px;padding:10px 12px;background:var(--bg-2);border-radius:8px">
        <div style="font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Price quoted</div>
        <div style="font-size:16px;font-weight:700">${bPrice!=null?fmt(bPrice):'—'}</div>
      </div>
      <div style="flex:1;min-width:140px;padding:10px 12px;background:var(--bg-2);border-radius:8px">
        <div style="font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Labour — baseline vs actual</div>
        <div style="font-size:16px;font-weight:700">${bHours!=null?bHours+'h':'—'} <span style="font-size:12px;font-weight:400;color:var(--ink-4)">vs ${actualHours}h</span></div>
        <div style="font-size:11px;color:${deltaStyle(hoursDelta)}">${deltaText(hoursDelta,'h')}</div>
      </div>
      <div style="flex:1;min-width:140px;padding:10px 12px;background:var(--bg-2);border-radius:8px">
        <div style="font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Materials — baseline vs actual</div>
        <div style="font-size:16px;font-weight:700">${bMat!=null?fmt(bMat):'—'} <span style="font-size:12px;font-weight:400;color:var(--ink-4)">vs ${fmt(actualMaterials)}</span></div>
        <div style="font-size:11px;color:${deltaStyle(matDelta)}">${deltaText(matDelta,'$')}</div>
      </div>
    </div>
  </div>`;
}

// Scope of Work — read-only, auto-derived from whatever's linked to the job.
// Was previously a free-text box (projects.scope_of_work); Seb's ask 2026-07-10:
// it looked like a manual input and duplicated info already sitting on the
// quote/invoice lines. Now it just lists the unique line-item descriptions —
// hand-linked quote/invoice lines first, falling back to the fuzzy "last
// invoice" auto-match (see projAutoMatchInvoices) when nothing is hand-linked
// yet. Nothing to save; the projects.scope_of_work column is left in place
// (harmless, unused) rather than migrated away.
function projRenderScope(name, linkedQ, linked, autoInvoices) {
  const seen = new Set();
  const lines = [];
  [...linkedQ, ...linked, ...(autoInvoices||[])].forEach(item => {
    const d = (item.description || '').trim();
    if (!d || seen.has(d.toLowerCase())) return;
    seen.add(d.toLowerCase());
    lines.push(d);
  });
  const body = lines.length
    ? `<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.6">${lines.map(d=>`<li>${attrEsc(d)}</li>`).join('')}</ul>`
    : `<div style="font-size:12px;color:var(--ink-4)">No scope details yet — link a quote or invoice line to populate this.</div>`;
  return `<div style="margin-bottom:20px">
    <div class="divider" style="margin-top:0">Scope of Work</div>
    <div style="padding:10px 12px;background:var(--bg-2);border-radius:8px">${body}</div>
  </div>`;
}

function fmt(n, decimals=0) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-AU', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function pct(n) { return (n||0).toFixed(1) + '%'; }

function showTab(name, el) {
  try { hubTrack('view', name); hubNavSync(name); } catch (e) {}
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  (el || event.target).classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'quotes') renderQuotes();
  if (name === 'timesheet') renderTimesheet();
  if (name === 'pnl') renderPnL();
  if (name === 'transactions') renderTransactions();
  if (name === 'expenses') renderExpenses();
  if (name === 'receipts') renderReceipts();
  if (name === 'action') renderForAction();
  if (name === 'shopping') renderShopping();
  if (name === 'schedule') renderSchedule();
  if (name === 'performance' && D) pfRender();
  if (name === 'projects' && D) renderProjects(D.kpis);
}

// ── Shopping List (2026-09-18, filters+priority+collapse added 2026-09-24) ──
// One row per job's materials list (shopping_lists.items is a JSONB array of
// {name, qty, checked, + optional special/supplier/supplier_email/lead_time/
// specs/delivery_fee/order_url captured at quoting time). Tapping a normal
// item toggles `checked` and PATCHes the whole items array via hubWrite —
// simplest possible sync from the phone while shopping. Tapping a `special`
// item (needs a supplier quote / custom order) opens its details instead of
// ticking it — use the checkbox itself to tick a special item off. Lists are
// normally created by the Xero MCP connector's create_quote tool (job
// approved → shopping list of materials); the "+ New list" button here
// covers the odd manual case.
//
// Default view: only Active-project lists that aren't done yet, with just
// the most recent one expanded — "Show done" / "Show quoted-only jobs" pills
// reveal the rest. SHOP holds that filter + collapse state client-side only.
let SHOP = { showDone: false, showQuotedOnly: false, expanded: null };

function shopProjectStatus(name) {
  if (!name) return null;
  const p = (D.projects || []).find(pr => (pr.name || '').toLowerCase() === String(name).toLowerCase());
  return p ? p.status : null;
}

function shopToggleFilter(key) {
  SHOP[key] = !SHOP[key];
  renderShopping();
}

function shopToggleExpand(id) {
  if (SHOP.expanded === null) SHOP.expanded = {};
  SHOP.expanded[id] = !SHOP.expanded[id];
  renderShopping();
}

function shopFilterBar(hiddenDone, hiddenQuoted) {
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="hub-pill-btn${SHOP.showDone?' active':''}" onclick="shopToggleFilter('showDone')">Done${hiddenDone?` (${hiddenDone} hidden)`:''}</button>
    <button class="hub-pill-btn${SHOP.showQuotedOnly?' active':''}" onclick="shopToggleFilter('showQuotedOnly')">Quoted-only jobs${hiddenQuoted?` (${hiddenQuoted} hidden)`:''}</button>
  </div>`;
}

async function renderShopping() {
  const page = document.getElementById('page-shopping');
  const lists = (D && D.shopping_lists) || [];
  if (!lists.length) {
    page.innerHTML = `<div class="section"><div style="padding:24px;text-align:center;color:var(--ink-4)">
      No shopping lists yet. These are created automatically when a quote is approved via the Xero connector, or start one by hand:
      <div style="margin-top:12px"><button onclick="shopNewList()" style="padding:8px 16px;background:var(--amber);color:#000;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700">+ New list</button></div>
    </div></div>`;
    return;
  }

  const hiddenDone = lists.filter(l => l.status === 'done').length;
  const hiddenQuoted = lists.filter(l => l.status !== 'done' && shopProjectStatus(l.project) === 'Quoted').length;
  const visible = lists.filter(l => {
    if (l.status === 'done' && !SHOP.showDone) return false;
    if (l.status !== 'done' && shopProjectStatus(l.project) === 'Quoted' && !SHOP.showQuotedOnly) return false;
    return true;
  });

  const topBar = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      ${shopFilterBar(hiddenDone, hiddenQuoted)}
      <button onclick="shopNewList()" style="padding:8px 16px;background:var(--amber);color:#000;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700">+ New list</button>
    </div>`;

  if (!visible.length) {
    page.innerHTML = `${topBar}<div class="section"><div style="padding:24px;text-align:center;color:var(--ink-4)">No shopping lists match the current filters.</div></div>`;
    return;
  }

  const open = visible.filter(l => l.status !== 'done');
  const done = visible.filter(l => l.status === 'done');

  // Default-expand only the most recent open list, once there actually is one
  // to expand (a first paint that's filtered down to nothing must not burn the
  // one-shot default) — after that, whatever the user has clicked stays as-is.
  if (SHOP.expanded === null && open.length) {
    SHOP.expanded = {};
    SHOP.expanded[open[0].id] = true;
  }
  if (SHOP.expanded === null) SHOP.expanded = {};

  const renderList = l => {
    const rawItems = Array.isArray(l.items) ? l.items : [];
    // Stable sort — items needing a supplier quote/special order float to the
    // top; order within each group (special / normal) is otherwise unchanged.
    const ordered = rawItems.map((it, i) => ({ it, i })).sort((a, b) => (b.it.special ? 1 : 0) - (a.it.special ? 1 : 0));
    const checkedCount = rawItems.filter(it => it.checked).length;
    const rows = ordered.map(({ it, i }) => {
      const isSpecial = !!it.special;
      const rowClick = isSpecial ? `shopShowSpecial('${attrEsc(l.id)}',${i})` : `shopToggleItem('${attrEsc(l.id)}',${i})`;
      return `
      <div onclick="${rowClick}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;background:${it.checked?'var(--bg-1)':'var(--bg-2)'};${isSpecial?'border-left:3px solid var(--amber)':''}">
        <span onclick="event.stopPropagation();shopToggleItem('${attrEsc(l.id)}',${i})" style="width:18px;height:18px;flex:none;border-radius:4px;border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;background:${it.checked?'var(--sage)':'transparent'};color:#fff;font-size:12px">${it.checked?'✓':''}</span>
        <span style="flex:1;${it.checked?'color:var(--ink-4);text-decoration:line-through':''}">${attrEsc(it.name||'')}${isSpecial?' <span style="color:var(--amber);font-size:10px;font-weight:700;letter-spacing:.03em;margin-left:4px">⚡ SPECIAL ORDER</span>':''}</span>
        <span style="color:var(--ink-4);font-size:12px">${attrEsc(it.qty||'')}</span>
        ${isSpecial ? '<span style="color:var(--amber);font-size:14px">›</span>' : ''}
      </div>`;
    }).join('');
    const expanded = !!SHOP.expanded[l.id];
    return `<div class="section" style="margin-bottom:12px">
      <div onclick="shopToggleExpand('${attrEsc(l.id)}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--ink-4);font-size:11px;display:inline-block;transition:transform .15s;transform:rotate(${expanded?90:0}deg)">›</span>
          <div><strong>${attrEsc(l.title||l.project||l.id)}</strong>${l.project?`<div style="font-size:11px;color:var(--ink-4)">${attrEsc(l.project)}</div>`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--ink-4)">${checkedCount}/${rawItems.length}</span>
          ${l.status!=='done' ? `<button onclick="event.stopPropagation();shopSetStatus('${attrEsc(l.id)}','done')" style="padding:5px 10px;background:transparent;border:1px solid var(--border-2);color:var(--ink-3);border-radius:6px;cursor:pointer;font-size:11px">Mark done</button>`
                               : `<button onclick="event.stopPropagation();shopSetStatus('${attrEsc(l.id)}','open')" style="padding:5px 10px;background:transparent;border:1px solid var(--border-2);color:var(--ink-3);border-radius:6px;cursor:pointer;font-size:11px">Reopen</button>`}
        </div>
      </div>
      ${expanded ? `<div style="padding:8px">${rows || '<div style="padding:10px;color:var(--ink-4);font-size:12px">No items</div>'}</div>` : ''}
    </div>`;
  };

  page.innerHTML = `${topBar}
    ${open.map(renderList).join('')}
    ${done.length ? `<div class="divider">Done</div>${done.map(renderList).join('')}` : ''}`;
}

// fee gathered at quoting time (see xero-mcp.js's create_quote `materials`),

async function shopToggleItem(id, idx) {
  const list = (D.shopping_lists||[]).find(l => l.id === id);
  if (!list) return;
  const items = Array.isArray(list.items) ? [...list.items] : [];
  if (!items[idx]) return;
  items[idx] = { ...items[idx], checked: !items[idx].checked };
  try {
    const row = await hubWrite('shopping_lists', id, { items });

async function shopSetStatus(id, status) {
  try {
    const row = await hubWrite('shopping_lists', id, { status });
    const list = (D.shopping_lists||[]).find(l => l.id === id);
    if (list) list.status = row.status;

async function shopNewList() {
  const project = prompt('Job / project name for this list:');

  const itemsRaw = prompt('Materials, one per line (e.g. "10x 90mm screws"):');
  if (!itemsRaw) return;
  const items = itemsRaw.split('\n').map(l => l.trim()).filter(Boolean).map(name => ({ name, qty: '', checked: false }));
  try {
    const r = await fetch('/.netlify/functions/hub-write', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
