async function loadXeroQuotes() {
  const statusEl = document.getElementById('quotes-status');
  const btn = document.getElementById('load-quotes-btn');
  if (!localStorage.getItem('xero_access_token')) {
    statusEl.innerHTML = '<span style="color:var(--pink)">⚠ Connect Xero first</span>';
    return;
  }
  btn.disabled = true;
  const setStatus = msg => { if (statusEl) statusEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:8px"><span class="spinner-sm"></span>${msg}</span>`; };
  setStatus('Connecting to Xero…');
  try {
    let allQuotes = [], page = 1;
    while (true) {
      setStatus(`Fetching page ${page} · ${allQuotes.length} quotes…`);
      const res = await xeroApiCall('Quotes?page=' + page);
      const batch = res.Quotes || [];
      allQuotes = allQuotes.concat(batch);
      if (batch.length < 100) break;
      page++; if (page > 10) break;
    }
    QUOTES_LIVE = allQuotes;
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--sage)">✓ ${allQuotes.length} quotes loaded live</span>`;
    btn.disabled = false;
    renderQuotesData(allQuotes);
  } catch(err) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--pink)">⚠ ${err.message}</span>`;
    btn.disabled = false;
  }
}

function renderQuotesData(quotes) {
  quotes = quotes || [];
  const enriched = quotes.map(q => {
    const lineItems = (q.line_items || q.LineItems || []).filter(li => (li.desc || li.Description||'').trim());
    const allDesc = lineItems.map(li => (li.desc || li.Description||'') + ' ' + (li.ItemCode||'')).join(' ');
    const total = Math.abs(q.total || q.SubTotal || q.Total || 0);
    return { number: q.number||q.QuoteNumber||'—', contact: q.contact||(q.Contact?q.Contact.Name:'—'),
      date: (q.date||q.DateString||q.Date||'').slice(0,10), status: q.status||q.Status||'—',
      total, category: detectCategory(allDesc), lineItems, _raw: q };
  });
  const byCategory = {};
  enriched.forEach(q => {
    if (!byCategory[q.category]) byCategory[q.category] = { quotes:[], total:0, amounts:[] };
    byCategory[q.category].quotes.push(q);
    byCategory[q.category].total += q.total;
    byCategory[q.category].amounts.push(q.total);
  });
  const categories = Object.entries(byCategory)
    .sort((a,b) => b[1].quotes.length - a[1].quotes.length)
    .map(([cat, d]) => {
      const sorted = d.amounts.filter(v=>v>0).sort((a,b)=>a-b);
      return { cat, count:d.quotes.length, total:d.total, avg:d.total/d.quotes.length,
        min:sorted[0]||0, max:sorted[sorted.length-1]||0,
        samples:d.quotes.slice(0,2).map(q=>q.contact.split(' ')[0]).join(', ') };
    });
  const accepted = enriched.filter(q=>['INVOICED','ACCEPTED'].includes(q.status)).length;
  const totalValue = enriched.reduce((a,q)=>a+q.total,0);
  const avgValue = totalValue / (quotes.length||1);
  const statusBadge = s => {
    const map = {INVOICED:'badge-green',SENT:'badge-blue',ACCEPTED:'badge-green',DECLINED:'badge-red',DRAFT:'badge-gray',DELETED:'badge-gray'};
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
  };
  const catRows = categories.map(c => `
    <tr onclick="showCategoryDetail('${c.cat.replace(/'/g,"\\\'")}')" style="cursor:pointer">
      <td><strong>${c.cat}</strong></td>
      <td style="text-align:right">${c.count}</td>
      <td class="amount" style="color:var(--ink-4);font-size:12px">${fmt(c.min)} – ${fmt(c.max)}</td>
      <td class="amount" style="color:var(--amber);font-weight:700">${fmt(c.avg)}</td>
      <td class="amount">${fmt(c.total)}</td>
      <td style="font-size:11px;color:var(--ink-4)">${c.samples}</td>
    </tr>`).join('');
  const recentRows = enriched.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(q => `
    <tr>
      <td style="font-size:12px;color:var(--ink-4)">${q.number}</td>
      <td style="font-size:12px;color:var(--ink-4)">${q.date}</td>
      <td>${q.contact}</td>
      <td><span class="badge badge-gray" style="font-size:10px">${q.category}</span></td>
      <td class="amount">${fmt(q.total)}</td>
      <td>${statusBadge(q.status)}</td>
    </tr>`).join('');
  document.getElementById('quotes-content').innerHTML = `
    <div class="kpi-grid">
      ${kpi('Total Quotes', quotes.length, 'All time', 'highlight')}
      ${kpi('Won / Invoiced', accepted, 'Accepted + Invoiced', 'good')}
      ${kpi('Win Rate', pct(accepted/(quotes.length||1)*100), 'Of all quotes sent', '')}
      ${kpi('Avg Quote Value', fmt(avgValue), 'Excl. GST', '')}
      ${kpi('Total Quoted', fmt(totalValue), 'All time', '')}
      ${kpi('Job Categories', categories.length, 'Auto-detected', '')}
    </div>
    <div class="section">
      <div class="section-head"><h2>Pricing Benchmarks by Job Type</h2><span class="chart-clickable-hint">click a row for line item patterns</span></div>
      <table><thead><tr>
        <th>Job Type</th><th style="text-align:right">Quotes</th><th style="text-align:right">Range</th>
        <th style="text-align:right">Avg Value</th><th style="text-align:right">Total</th><th>Sample Clients</th>
      </tr></thead><tbody>${catRows}</tbody></table>
    </div>
    <div class="section">
      <div class="section-head"><h2>All Quotes — Most Recent 60</h2></div>
      <table><thead><tr><th>Number</th><th>Date</th><th>Client</th><th>Job Type</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
      <tbody>${recentRows}</tbody></table>
    </div>`;
}

function showCategoryDetail(cat) {
  const quotesSource = (D && D.quotes && D.quotes.length) ? D.quotes : QUOTES_LIVE;
  if (!quotesSource) return;
  const catQuotes = quotesSource.map(q => {
    const lineItems = (q.line_items||q.LineItems||[]).filter(li=>(li.desc||li.Description||'').trim());
    const allDesc = lineItems.map(li=>(li.desc||li.Description||'')+(li.ItemCode||'')).join(' ');
    return { ...q, _cat:detectCategory(allDesc), _total:Math.abs(q.total||q.SubTotal||q.Total||0), _lineItems:lineItems };
  }).filter(q=>q._cat===cat).sort((a,b)=>b._total-a._total);
  const freq = {};
  catQuotes.forEach(q => {
    (q._lineItems||[]).forEach(li => {
      const desc = (li.desc||li.Description||'').trim();
      if (!desc||desc.length<4) return;
      if (!freq[desc]) freq[desc]={count:0,unitAmounts:[],qtys:[],lineAmounts:[]};
      freq[desc].count++;
      const unit=li.unit!=null?li.unit:li.UnitAmount, qty=li.qty!=null?li.qty:li.Quantity, line=li.total!=null?li.total:li.LineAmount;
      if (unit!=null) freq[desc].unitAmounts.push(Math.abs(unit));
      if (qty!=null)  freq[desc].qtys.push(Math.abs(qty));
      if (line!=null) freq[desc].lineAmounts.push(Math.abs(line));
    });
  });
  const topItems = Object.entries(freq).sort((a,b)=>b[1].count-a[1].count).slice(0,20);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const itemRows = topItems.map(([desc,d]) => {
    const avgUnit=avg(d.unitAmounts), avgQty=avg(d.qtys), avgLine=avg(d.lineAmounts);
    return `<tr>
      <td style="font-size:12px;max-width:260px;line-height:1.4">${desc}</td>
      <td style="text-align:right;font-size:12px">${d.count}×</td>
      <td class="amount" style="font-size:12px">${avgQty!==null?avgQty.toFixed(1):'—'}</td>
      <td class="amount" style="color:var(--amber);font-weight:700">${avgUnit!==null?fmt(avgUnit,2):'—'}</td>
      <td class="amount" style="font-size:12px">${avgLine!==null?fmt(avgLine):'—'}</td>
    </tr>`;
  }).join('');
  const statusMap={INVOICED:'badge-green',SENT:'badge-blue',ACCEPTED:'badge-green',DECLINED:'badge-red',DRAFT:'badge-gray'};
  const quoteRows = catQuotes.slice(0,15).map(q => {
    const num=q.number||q.QuoteNumber||'—', date=(q.date||q.DateString||'').slice(0,10);
    const client=q.contact||(q.Contact?q.Contact.Name:'—'), st=q.status||q.Status||'—';
    return `<tr><td style="font-size:12px;color:var(--ink-4)">${num}</td><td style="font-size:12px;color:var(--ink-4)">${date}</td><td>${client}</td><td class="amount">${fmt(q._total)}</td><td><span class="badge ${statusMap[st]||'badge-gray'}">${st}</span></td></tr>`;
  }).join('');
  const vals = catQuotes.map(q=>q._total).filter(v=>v>0);
  openModal(cat + ' — Pricing Intelligence', `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:20px">
      ${kpi('Quotes',catQuotes.length,'In this category','highlight')}
      ${kpi('Avg Value',fmt(avg(vals)),'Excl. GST','')}
      ${kpi('Min',fmt(Math.min(...vals)||0),'Smallest','')}
      ${kpi('Max',fmt(Math.max(...vals)||0),'Largest','')}
    </div>
    ${topItems.length ? `
    <div class="divider" style="margin-top:0">Common Line Items — Unit Rate Benchmarks</div>
    <table><thead><tr>
      <th>Description</th><th style="text-align:right">Used</th><th style="text-align:right">Avg Qty</th>
      <th style="text-align:right">Avg Unit $</th><th style="text-align:right">Avg Line $</th>
    </tr></thead><tbody>${itemRows}</tbody></table>
    <div style="padding:10px;margin:8px 0 20px;background:var(--bg-3);border-radius:5px;font-size:11px;color:var(--ink-4);line-height:1.6">
      ⓘ <strong style="color:var(--ink-3)">Avg Unit $</strong> = what you typically charge per unit. Your pricing benchmark for this job type.
    </div>` : ''}
    <div class="divider">Quotes in This Category</div>
    <table><thead><tr><th>Number</th><th>Date</th><th>Client</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
    <tbody>${quoteRows}</tbody></table>
    ${catQuotes.length>15?`<div style="padding:10px 14px;font-size:11px;color:var(--ink-4)">+ ${catQuotes.length-15} more quotes in this category</div>`:''}`);
}

// ── Xero OAuth callback handler ───────────────────────────────────────────────
// After xeroConnect() redirects to Xero, Xero redirects back to
// https://matierehub2.netlify.app/xero-callback?code=...&state=...
// Netlify's SPA redirect serves index.html, and we handle the code here.
async function handleXeroCallback() {
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const state = params.get('state');
  if (!code) return false;

  // CSRF check
  const savedState = localStorage.getItem('xero_state');
  if (state && savedState && state !== savedState) {
    console.error('Xero OAuth state mismatch — possible CSRF');
    history.replaceState({}, '', '/');
    return false;
  }

  try {
    const res = await fetch('/.netlify/functions/xero-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'callback', code, redirect_uri: XERO_REDIRECT_URI })
    });
    const tokens = await res.json();
    if (tokens.error) throw new Error(tokens.error_description || tokens.error);

    localStorage.setItem('xero_access_token', tokens.access_token);
    if (tokens.refresh_token) localStorage.setItem('xero_refresh_token', tokens.refresh_token);
    localStorage.setItem('xero_token_expiry', Date.now() + (tokens.expires_in * 1000));

    // Fetch tenant ID
    const connRes = await fetch('/.netlify/functions/xero-api', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint: 'connections', method: 'GET', access_token: tokens.access_token, tenant_id: 'none' })
    });
    const conns = await connRes.json();
    if (Array.isArray(conns) && conns[0]) {
      localStorage.setItem('xero_tenant_id', conns[0].tenantId);
      localStorage.setItem('xero_org_name', conns[0].tenantName || 'Xero');
    }
  } catch (e) {
    console.error('Xero callback failed:', e);
    history.replaceState({}, '', '/');
    updateXeroBtn();
    alert('⚠ Xero connection failed: ' + e.message + '\n\nPlease try clicking ⚡ Connect Xero again.');
    return false;
  }

  history.replaceState({}, '', '/');
  return true;
}

// ── Smart Suggest — reusable type-ahead ──────────────────────────────────────
// Attaches a filtered suggestion dropdown to a text input. The dropdown is
// position:fixed and appended to <body> so it is never clipped by a scrolling
// table/overflow container. getItems() returns the candidate string list.
// onCreate (optional): when the typed value matches no existing item, a
// "＋ Create '<value>'" row is appended. Picking it calls onCreate(value).
function smartSuggest(input, getItems, onPick, onCreate) {
  if (!input || input.dataset.ssWired) return;
  input.dataset.ssWired = '1';
  input.setAttribute('autocomplete', 'off');
  let box = null;
  const close = () => { if (box) { box.remove(); box = null; } };
  const open = () => {
    const raw = (input.value || '').trim();
    const v = raw.toLowerCase();
    close();
    let all = (getItems() || []).filter(Boolean);
    let items = v ? all.filter(x => x.toLowerCase().includes(v)) : all;
    items = [...new Set(items)].slice(0, 8);
    const exact = all.some(x => x.toLowerCase() === v);
    const showCreate = !!onCreate && raw.length > 0 && !exact;
    if (!items.length && !showCreate) return;
    box = document.createElement('div');
    box.style.cssText = 'position:fixed;z-index:99999;background:var(--bg-1);border:1px solid var(--border);border-radius:6px;max-height:230px;overflow:auto;box-shadow:0 6px 22px rgba(0,0,0,.45)';
    const r = input.getBoundingClientRect();
    box.style.left = r.left + 'px';
    box.style.top = (r.bottom + 2) + 'px';
    box.style.minWidth = r.width + 'px';
    items.forEach(it => {
      const o = document.createElement('div');
      o.textContent = it;
      o.style.cssText = 'padding:7px 10px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap';
      o.onmouseenter = () => o.style.background = 'var(--bg-2)';
      o.onmouseleave = () => o.style.background = '';
      o.onmousedown = e => { e.preventDefault(); input.value = it; close(); if (onPick) onPick(it); };
      box.appendChild(o);
    });
    if (showCreate) {
      const c = document.createElement('div');
      c.innerHTML = `＋ Create "<strong>${attrEsc(raw)}</strong>"`;
      c.style.cssText = 'padding:8px 10px;font-size:13px;cursor:pointer;color:var(--amber);white-space:nowrap;border-top:1px solid var(--border)';
      c.onmouseenter = () => c.style.background = 'var(--bg-2)';
      c.onmouseleave = () => c.style.background = '';
      c.onmousedown = e => { e.preventDefault(); close(); onCreate(raw); };
      box.appendChild(c);
    }
    document.body.appendChild(box);
  };
  input.addEventListener('input', open);
  input.addEventListener('focus', open);
  input.addEventListener('blur', () => setTimeout(close, 150));
}

// ── Create a project on the spot (Feature 1) ─────────────────────────────────
// POSTs to hub-write's INSERT path (server generates the PR-### id), then adds
// the new row to the in-memory D.projects so it's immediately selectable.
async function hubCreateProject(name) {
  const clean = (name || '').trim();
  if (!clean) return null;
  const res = await fetch('/.netlify/functions/hub-write', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ insert: true, table: 'projects', fields: { name: clean } })
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || !out.ok) throw new Error(out.error || ('Could not create project (' + res.status + ')'));
  D.projects = D.projects || [];
  if (!D.projects.some(p => p.id === out.row.id)) D.projects.push(out.row);
  return out.row;
}

// -- Fuzzy project matching (client mirror of claude-parse.js's server-side
// matcher) --------------------------------------------------------------
// Bug (2026-09-24): the Scan Receipt project fields (per-line + "apply to all")
// only accepted an exact (case-insensitive) match -- anything else was saved
// verbatim with no warning, so a typo/partial name silently never linked to
// the real project. Natural-language entries via the Claude bar already get
// this fuzzy behaviour server-side; this brings the same logic client-side.
function ssTokenise(str) {
  return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(Boolean);
}

// Valid project names ordered so a tied fuzzy score resolves to the project
// Seb most likely means: Active projects first, then most recently created.
function ssProjectCandidates() {
  const projects = (D && D.projects) ? D.projects.slice() : [];
  return projects
    .filter(p => p.name)
    .sort((a, b) => {
      const aActive = a.status === 'Active' ? 0 : 1;
      const bActive = b.status === 'Active' ? 0 : 1;
      if (aActive !== bActive) return aActive - bActive;
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    })
    .map(p => p.name);
}

// name: typed text. candidates: ordered valid names (earlier = preferred on a tie).
// Returns {match, score} -- score 1.0 = exact, else token-overlap 0..1, null match if none.
function fuzzyMatchProject(name, candidates) {
  const clean = (name || '').trim();
  if (!clean) return { match: null, score: 0 };
  const exact = candidates.find(c => c.toLowerCase() === clean.toLowerCase());
  if (exact) return { match: exact, score: 1.0 };
  const inputTokens = ssTokenise(clean);
  let bestMatch = null, bestScore = 0;
  for (const c of candidates) {
    const cTokens = ssTokenise(c);
    const overlap = inputTokens.filter(t => cTokens.includes(t)).length;
    const score = overlap / Math.max(inputTokens.length, cTokens.length, 1);
    if (score > bestScore) { bestScore = score; bestMatch = c; }
  }
  return { match: bestMatch, score: bestScore };
}

// Canonicalise a typed project name into RC.items[idx].project -- same 0.6
// confidence threshold as the server-side matcher. Flags the row as
// unmatched (amber outline, same as a blank field) rather than silently
// saving unlinkable free text when nothing is confident enough.
function rcApplyProjectToRow(idx, typed, inp) {
  const raw = (typed || '').trim();
  if (!raw) { RC.items[idx].project = ''; RC.items[idx]._projUnmatched = false; if (inp) inp.value = ''; return; }
  const { match, score } = fuzzyMatchProject(raw, [...ssProjectCandidates(), ...NON_BILLABLE]);
  if (match && score >= 0.6) {
    RC.items[idx].project = match;
    RC.items[idx]._projUnmatched = false;
    if (inp) inp.value = match;
    if (score < 1) claudeToast(`Matched "${raw}" -> "${match}"`, 'success', 2000);
  } else {
    RC.items[idx].project = raw;
    RC.items[idx]._projUnmatched = true;
    claudeToast(`No project match for "${raw}" - pick from the list or it won't be linked`, 'unclear');
  }
}

// Escape a value for safe use inside an HTML attribute (value="…")
function attrEsc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Format a YYYY-MM-DD (or ISO) string as dd/mm/yyyy
function fmtDMY(s) {
  if (!s) return '';
  const p = String(s).slice(0, 10).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : s;
}

// Same as fmtDMY but dash-separated (dd-mm-yyyy) — used across the Projects tab
// per Seb's ask (2026-07-10) for consistent DD-MM-YYYY display there.
function fmtDMYDash(s) { return fmtDMY(s).replace(/\//g, '-'); }

// Preset → from/to date range. Returns nothing for 'custom' (keeps existing dates).
function txSetPreset(p) {
  TX.preset = p;
  if (p === 'custom') return;
  const today = new Date();
  const iso = d => d.toISOString().slice(0, 10);
  TX.to = iso(today);
  if (p === '30d')        TX.from = iso(new Date(today.getTime() - 30 * 86400000));
  else if (p === 'month') TX.from = iso(new Date(today.getFullYear(), today.getMonth(), 1));

  else if (p === 'all')   TX.from = '2022-01-01';
}

async function txFetch() {
  const wrap = document.getElementById('tx-table-wrap');
  if (wrap) wrap.innerHTML = '<div style="color:var(--ink-4);padding:20px;text-align:center">Loading…</div>';

  const base = `/rest/v1/bank_transactions?date=gte.${TX.from}&date=lte.${TX.to}&order=date.desc,id.desc&select=id,date,type,contact,account_code,account_name,description,reference,gross,tax,net,debit,credit,bank_account,project,notes,expense_log_id`;
  let q = base;
  if (TX.type !== 'ALL') q += `&type=eq.${TX.type}`;
  if (TX.contact)        q += `&contact=ilike.*${encodeURIComponent(TX.contact)}*`;
  if (TX.account)        q += `&account_name=eq.${encodeURIComponent(TX.account)}`;

  try {
    // Supabase caps at 1000 rows per request — paginate until exhausted
    const PAGE = 1000;
    let all = [], offset = 0;
    while (true) {
      const r = await fetch(SB_URL + q, {
        headers: { ...SB_HDR, 'Range': `${offset}-${offset + PAGE - 1}`, 'Range-Unit': 'items' }
      });
      if (!r.ok) throw new Error('Supabase error ' + r.status);
      const page = await r.json();
      all = all.concat(page);
      if (page.length < PAGE) break;   // last page
      offset += PAGE;
      if (offset > 5000) break;        // safety cap
    }
    TX.rows = all;
    txRenderTable();
  } catch(e) {
    if (wrap) wrap.innerHTML = `<div style="color:var(--pink);padding:20px">Error: ${e.message}</div>`;
  }
}

            <td style="padding:7px 10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-4)">${r.description||''}</td>
            <td style="padding:7px 10px;color:var(--ink-4)">${r.reference||''}</td>
            <td style="padding:7px 10px;text-align:right;color:var(--pink);font-weight:${r.debit?'600':'400'}">${r.debit?fmt(r.debit):'—'}</td>

            <td style="padding:5px 6px"><input class="tx-cell" data-id="${attrEsc(r.id)}" data-field="project" value="${attrEsc(r.project||'')}" placeholder="" style="width:110px;padding:4px 6px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink-3);font-size:11px"></td>

// Save an inline Project/Notes edit straight to bank_transactions
async function txSaveCell(inp) {
  const id = inp.dataset.id, field = inp.dataset.field, value = inp.value.trim();
  const row = (TX.rows || []).find(r => String(r.id) === String(id));
  if (row && (row[field] || '') === value) return;   // no change
  try {
    await hubWrite('bank_transactions', id, { [field]: value });
    if (row) row[field] = value;
    inp.style.outline = '2px solid var(--sage)';
    setTimeout(() => { inp.style.outline = 'none'; }, 700);
  } catch (e) {
    inp.style.outline = '2px solid var(--pink)';
    alert('Could not save: ' + e.message);
  }
}

}

async function exSaveCell(inp) {
  const id = inp.dataset.id, field = inp.dataset.field, value = inp.value.trim();

// be attached to a Xero draft. Files sit in a private bucket; the Hub only gets short-lived links.

async function siApi(body) {
  const r = await fetch('/.netlify/functions/receipt-inbox', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));

async function siLoad(pile) {

async function siUrl(id) {

  return SI.urls[id] = { url: j.url, mime: j.mime, exp: Date.now() + 50 * 60 * 1000 };

function siPileTab(v, label, n) {

// ── Add (upload) ──
async function siAddFiles(files) {
  const list = [...files].filter(f => f.type.startsWith('image/') || f.type === 'application/pdf');
  if (!list.length) return;
  let done = 0, dup = 0, fail = 0;
  claudeToast(`Adding ${list.length} receipt${list.length>1?'s':''}…`);
  const one = async (f) => {
    try {
      const { data, type } = await fileToBase64(f);
      const j = await siApi({ action:'add', name:f.name, mime:type, data, source:'upload' });
      if (j.duplicate) dup++; else done++;
    } catch (e) { fail++; }
  };
  const q = [...list];
  await Promise.all([0,1].map(async () => { while (q.length) await one(q.shift()); }));
  claudeToast(`✓ ${done} added${dup?`, ${dup} already in`:''}${fail?`, ${fail} failed`:''}`, fail ? 'unclear' : 'success');
  SI.pile = 'pending'; SI.idx = 0;
  await siLoad('pending').catch(() => {});
  renderReceipts();
}

// ── Combined PDF import: one PDF holding many receipts -> one Inbox card per receipt ──
async function siLoadPdfLib() {
  if (window.PDFLib) return;
  await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
function siB64(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); }
async function siSubPdf(src, idxs) { const out = await PDFLib.PDFDocument.create(); const pgs = await out.copyPages(src, idxs); pgs.forEach(p => out.addPage(p)); return await out.save(); }
async function siImportMulti(files) {
  const list = [...files].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!list.length) return;
  if (SI.importing) { claudeToast('An import is already running', 'unclear'); return; }
  SI.importing = true;
  const st = { added: 0, dup: 0, fail: 0, bad: 0 };
  try {
    await siLoadPdfLib();
    for (const f of list) {
      const src = await PDFLib.PDFDocument.load(await f.arrayBuffer(), { ignoreEncryption: true });
      const n = src.getPageCount();
      let start = 0, win = 4, guard = 0;
      while (start < n && guard++ < 120) {
        const end = Math.min(start + win, n);
        claudeToast(`📚 ${f.name}: reading pages ${start + 1}–${end} of ${n} · ${st.added} receipts added so far…`);
        let j;
        try { j = await siApi({ action: 'read_multi', data: siB64(await siSubPdf(src, Array.from({ length: end - start }, (_, i) => start + i))) }); }
        catch (e) { st.fail++; start = end; win = 4; continue; }
        let recs = j.receipts || [];
        const last = recs[recs.length - 1];
        let cut = !!(last && last.complete === false && end < n);
        if (cut) {
          const rel = (last.first_page || 1) - 1;
          if (rel === 0) { if (win < 16) { win += 4; continue; } cut = false; }
          else recs = recs.slice(0, -1);
        }
        for (const r of recs) {
          const a = Math.max(1, r.first_page || 1), z = Math.min(end - start, r.last_page || a);
          const idx = Array.from({ length: z - a + 1 }, (_, i) => start + a - 1 + i);
          try {
            const bytes = await siSubPdf(src, idx);
            if (bytes.length > 4.4 * 1024 * 1024) { st.fail++; continue; }
            const items = r.lines.map(l => ({ description: l.description, qty: l.qty, unit_price: l.unit_price, amount: l.amount, date: r.date, supplier: r.supplier, category: '' }));
            const sumEx = items.reduce((t, l) => t + l.amount, 0);
            const res = await siApi({ action: 'add', name: `${f.name.replace(/\.pdf$/i, '')} p${start + a}-${start + z}.pdf`, mime: 'application/pdf', data: siB64(bytes), source: 'upload',
              salt: [r.invoice_number, r.date, r.receipt_total].join('|'),
              prefill: { supplier: r.supplier, items, check: { ok: r.check_ok, total: r.receipt_total, gst_status: r.gst_status, invoice_no: r.invoice_number, lines_inc_gst: r.gst_status === 'none' ? sumEx : Math.round(sumEx * 110) / 100 } } });
            if (res.duplicate) st.dup++; else { st.added++; if (!r.check_ok) st.bad++; }
          } catch (e) { st.fail++; }
        }
        start = cut && last ? start + ((last.first_page || 1) - 1) : end;
        if (!cut) win = 4;
      }
    }
    claudeToast(`✓ ${st.added} receipts added${st.dup ? `, ${st.dup} already in` : ''}${st.bad ? `, ${st.bad} don't add up to their total (check those)` : ''}${st.fail ? `, ${st.fail} failed` : ''}`, st.fail || st.bad ? 'unclear' : 'success');
  } catch (e) { claudeToast('⚠ Import failed: ' + (e.message || e), 'error'); }
  SI.importing = false;
  SI.pile = 'pending'; SI.idx = 0;
  await siLoad('pending').catch(() => {});
  renderReceipts();
}

// ── Pending card ──
function siSuggest(date) {
  const by = {};
  (D.timesheets || []).filter(t => (t.date || '').slice(0,10) === date && t.project && !isNonBillable(t.project)).forEach(t => by[t.project] = (by[t.project]||0) + (Number(t.hours)||0));
  return Object.entries(by).sort((a,b) => b[1]-a[1]).slice(0, 3);
}
// What we remember about a supplier from last time: category, tax, project.
function siMem(sup) { try { return (JSON.parse(localStorage.getItem('si_mem') || '{}'))[String(sup||'').toLowerCase()] || {}; } catch (e) { return {}; } }
function siMemSave(sup, o) { try { const m = JSON.parse(localStorage.getItem('si_mem') || '{}'); m[String(sup||'').toLowerCase()] = { ...(m[String(sup||'').toLowerCase()]||{}), ...o }; localStorage.setItem('si_mem', JSON.stringify(m)); } catch (e) {} }
// Supplier guess from the email address (payments-noreply@google.com -> Google)
function siGuessSupplier(r) {
  if (r.supplier) return r.supplier;
  const m = String(r.email_from || '').match(/@([a-z0-9-]+\.)*([a-z0-9-]+)\.[a-z.]{2,}$/i);
  const d = m ? m[2] : '';
  if (!d || /^(gmail|hotmail|outlook|yahoo|icloud|live|me)$/i.test(d)) return '';
  return d.charAt(0).toUpperCase() + d.slice(1);
}
// From past saved expenses: is this supplier usually NOT tied to a project? (e.g. Google, Anthropic)
function siHabit(sup) {
  const k = String(sup || '').toLowerCase().trim(); if (!k) return null;
  const rows = (D.expense_log || []).filter(e => String(e.supplier || '').toLowerCase().trim() === k);
  if (rows.length < 3) return null;
  const none = rows.filter(e => !String(e.project || '').trim() || isNonBillable(e.project)).length;
  return { n: rows.length, noProjShare: none / rows.length };
}
// Most common description / category this supplier has had in past saved expenses (works on any device).
function siHabitField(sup, field, minShare) {
  const k = String(sup || '').toLowerCase().trim(); if (!k) return '';
  const rows = (D.expense_log || []).filter(e => String(e.supplier || '').toLowerCase().trim() === k && String(e[field] || '').trim());
  if (rows.length < 2) return '';
  const cnt = {};
  rows.forEach(e => { const v = String(e[field]).trim(); cnt[v.toLowerCase()] = cnt[v.toLowerCase()] || { v, n: 0 }; cnt[v.toLowerCase()].n++; });
  const top = Object.values(cnt).sort((a, b) => b.n - a.n)[0];
  return top.n / rows.length >= minShare ? top.v : '';
}
// ── Duplicate protection ──
const siNorm = (x) => String(x || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
function siDupes(r) {
  const lines = Array.isArray(r.lines) ? r.lines : [];
  const sup = siNorm(siGuessSupplier(r));
  const date = (r.receipt_date || '').slice(0, 10);
  if (!lines.length || !sup || !date) return null;
  const t0 = new Date(date + 'T00:00:00').getTime();

    const wantDivided = tax === 'gst';
    if (readerDivided && !wantDivided) lines = lines.map(l => { const u = Math.round((parseFloat(l.unit_price)||0) * 1.1 * 100) / 100; return { ...l, unit_price: u, amount: Math.round(u * (parseFloat(l.qty)||1) * 100) / 100 }; });
    else if (!readerDivided && wantDivided) lines = lines.map(l => { const u = Math.round((parseFloat(l.unit_price)||0) / 1.1 * 100) / 100; return { ...l, unit_price: u, amount: Math.round(u * (parseFloat(l.qty)||1) * 100) / 100 }; });
  }
  lines.forEach(l => { if (cat) l.category = cat; });
  const items = lines.map(l => ({ action:'new', type:'expense', date, supplier: sup, description: l.description || '', category: l.category || '', project: (l.project || '').trim() || project || '',
    qty: parseFloat(l.qty)||1, unit_price: parseFloat(l.unit_price)||0, amount: Math.round((parseFloat(l.qty)||1)*(parseFloat(l.unit_price)||0)*100)/100, receipt_id: r.id, reference: ref }));
  // last safety net: refuse to double-log identical lines on the same job without a yes
  const same = items.filter(i => (D.expense_log || []).some(e => siNorm(e.supplier) === siNorm(i.supplier) && String(e.date).slice(0,10) === i.date && siNorm(e.description) === siNorm(i.description) && Math.abs(Number(e.amount) - i.amount) <= 0.01 && siNorm(e.project) === siNorm(i.project)));
  if (same.length && !SI.dupOk[r.id] && !confirm(`${same.length} of these lines look IDENTICAL to expenses already saved on this job (e.g. “${same[0].description}” ${fmt(same[0].amount,2)}).\n\nSaving would count them twice and lower the job's margin.\n\nOK = save anyway\nCancel = go back`)) return;
  SI.busy = true; const btn = document.getElementById('si-save'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const res = await fetch('/.netlify/functions/claude-parse', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pendingAction:{ action:'expense_batch', items } }) });
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message || 'Save failed');
    if (data.entries && D) { D.expense_log = D.expense_log || []; data.entries.forEach(e => D.expense_log.push(e)); }
    const ids = (data.entries || []).map(e => e.id);
    siMemSave(sup, { cat: cat || undefined, tax, project: project || undefined, noProj: !project, desc: (!(r.lines || []).length && desc) ? desc : undefined });
    await siApi({ action:'update', id:r.id, fields:{ status:'processed', supplier:sup, receipt_date:date, total_inc: isNaN(total) ? r.total_inc : total, lines: items.map(i => ({ description:i.description, qty:i.qty, unit_price:i.unit_price, amount:i.amount, category:i.category, project: i.project !== (project || '') ? i.project : '' })), project, no_project:!project, expense_ids:ids, notes: desc || '', reference: ref, tax_mode: tax, xero_status: 'queued', xero_error: '' } });
    SI.counts.processed = (SI.counts.processed||0) + 1;
    claudeToast(`✓ ${items.length} line${items.length>1?'s':''} saved${project?' to '+project:''}`, 'success');
    siAdvance(r.id);
  } catch (e) { claudeToast('⚠ ' + (e.message||'Save failed'), 'error'); }
  finally { SI.busy = false; const b2 = document.getElementById('si-save'); if (b2) { b2.disabled = false; b2.textContent = 'Save & next'; } }
}

async function siOpenFile(id) { try { const u = await siUrl(id); window.open(u.url, '_blank'); } catch (e) { claudeToast('⚠ ' + e.message, 'error'); } }
async function siRestore(id) { try { await siApi({ action:'update', id, fields:{ status:'pending' } }); await siLoad(SI.pile); SI.counts.pending = (SI.counts.pending||0)+1; siRender(); } catch (e) { claudeToast('⚠ ' + e.message, 'error'); } }
// Learn the invoice number of saved receipts that don't have one yet (needed to tell two copies apart).
async function siFillRefs() {
  if (SI.refsBusy) return; SI.refsBusy = true;
  try {
    const todo = SI.rows.filter(r => r.status === 'processed' && !r.reference && !SI.tried['ref' + r.id]).slice(0, 12);
    let n = 0;
    for (const r of todo) { SI.tried['ref' + r.id] = 1; try { const j = await siApi({ action:'reread', id:r.id, only_ref:true }); if (j.invoice_no) { r.reference = j.invoice_no; n++; } } catch (e) {} }
    if (n) siRender();
  } finally { SI.refsBusy = false; }
}
// Sends queued receipts to Xero (server-side: no Xero sign-in on the phone). Loops until none are left.
async function siPush(ids) {
  if (SI.pushing) return;
  SI.pushing = true; let ok = 0, bad = 0, left = 1, guard = 0;
  try {
    claudeToast('Sending to Xero…');
    while (left > 0 && guard++ < 15) {
      const r = await fetch('/.netlify/functions/receipt-xero', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ action:'push', ids: ids || undefined }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'Xero error ' + r.status);
      (j.results || []).forEach(x => x.ok ? ok++ : bad++);
      left = ids ? 0 : j.remaining;
      if (!(j.results || []).length) break;
    }
    claudeToast(`✓ ${ok} sent to Xero${bad ? `, ${bad} failed — see Processed` : ''}`, bad ? 'unclear' : 'success');
  } catch (e) { claudeToast('⚠ ' + e.message, 'error'); }
  SI.pushing = false;
  await siLoad('processed').catch(() => {});
  siRender();
}
async function siXeroStatus() {
  try { const r = await fetch('/.netlify/functions/receipt-xero', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ action:'status' }) }); return await r.json(); } catch (e) { return {}; }
}

function siIgnore(id) { let ign = []; try { ign = JSON.parse(localStorage.getItem('si_ignored') || '[]'); } catch (e) {} ign.push(id); try { localStorage.setItem('si_ignored', JSON.stringify(ign)); } catch (e) {} siRender(); }

// Entry point from the Claude-bar "+" button: take attached receipt file(s),
// switch to the Scan Receipt tab, and auto-parse into the preview table.
async function rcReceiveFiles(files) {
  if (!D) { claudeToast('Still loading — try again in a moment', 'unclear'); return; }
  for (const file of files) {
    if (!file.type.startsWith('image/') && file.type !== 'application/pdf') continue;
    try {
      const { data, type } = await fileToBase64(file);
      RC.files.push({ name: file.name, type, data });
    } catch(e) { claudeToast('Could not read file: ' + file.name, 'error'); }
  }
  if (!RC.files.length) return;
  // Activate the Scan Receipt tab without relying on a click event
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const tabEl = [...document.querySelectorAll('.tab')].find(t => /'receipts'/.test(t.getAttribute('onclick') || ''));
  if (tabEl) tabEl.classList.add('active');
  const pg = document.getElementById('page-receipts');
  if (pg) pg.classList.add('active');
  RC.view = 'scan';
  await renderReceipts();
  rcParse();          // auto-kick the parse; lines land in the editable preview
}

async function rcFilesSelected(files) {
  for (const file of files) {

async function rcParse() {
  RC.note = (document.getElementById('rc-note')||{}).value || '';
  if (!RC.files.length) { claudeToast('Attach a receipt photo or PDF first', 'unclear'); return; }
  const btn = document.getElementById('rc-parse-btn');
  const prev = document.getElementById('rc-preview');
  if (btn) { btn.disabled = true; btn.textContent = 'Parsing…'; }
  if (prev) prev.innerHTML = '<div style="color:var(--ink-4);padding:20px;text-align:center"><span class="spinner-sm"></span> Reading every line on every receipt…</div>';
  try {
    // One request per receipt, in parallel: each keeps its own supplier, date and printed-total check.
    const reads = await Promise.all(RC.files.map(async (f, i) => {
      try {
        const res = await fetch('/.netlify/functions/claude-parse', {
          method: 'POST', headers: { 'Content-Type':'application/json' },
          body: JSON.stringify({ previewOnly: true, text: RC.note.trim() || undefined, images: [{ name:f.name, mediaType:f.type, data:f.data }] })
        });
        const data = await res.json();
        if (data.status !== 'preview' || !Array.isArray(data.items)) throw new Error(data.message || data.error || 'Could not read this receipt');
        return { i, name: f.name, data };
      } catch (e) { return { i, name: f.name, error: e.message || 'Could not read this receipt' }; }
    }));
    RC.items = []; RC.receipts = [];
    reads.forEach(r => {
      if (r.error) { RC.receipts.push({ id: r.i, name: r.name, supplier: '', date: '', lines: 0, error: r.error }); return; }
      const d = r.data;
      const supplier = d.supplier || (d.items.find(x => x.supplier) || {}).supplier || '';
      const date = (d.items[0] || {}).date || '';
      d.items.forEach(it => RC.items.push({ ...it, _inc: true, _rc: r.i }));
      RC.receipts.push({ id: r.i, name: r.name, supplier, date, lines: d.items.length, check: d.check || null, model: d.model || '' });
    });
    if (!RC.items.length) throw new Error((RC.receipts[0] && RC.receipts[0].error) || 'Could not parse the receipt');
    RC.supplier = RC.receipts.length === 1 ? RC.receipts[0].supplier : '';
    if (RC.presetProject) RC.items.forEach(it => { if (!it.project) it.project = RC.presetProject; });
    rcRenderTable();
  } catch(err) {
    if (prev) prev.innerHTML = `<div style="color:var(--pink);padding:20px;text-align:center">⚠ ${(err.message||'Parse failed').replace(/</g,'&lt;')}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Read receipts'; }
  }
}

    if (field === 'category') smartSuggest(inp, () => EX_CATEGORIES || [], v => { RC.items[idx].category = v; });
  });
  // "Allocate one project to every line" control
  const allProj = document.getElementById('rc-allproj');
  if (allProj) smartSuggest(allProj, ssProjectNames, () => {}, raw => rcCreateProj(raw, p => { allProj.value = p.name; }));
  rcPopulateXeroPayment();
  wrap.querySelectorAll('input.rc-inc').forEach(cb => {

    });
  });
  rcUpdateTotal();
}

// One header row per receipt: supplier + date (editable, applied to that receipt's lines),
// the lines-vs-printed-total check, and a warning if it looks already saved.
function rcReceiptHeader(id) {
  const r = (RC.receipts || []).find(x => x.id === id);
  if (!r) return '';
  const many = (RC.receipts || []).length > 1;
  const lines = RC.items.filter(x => x._rc === id);
  const inc = Math.round(lines.filter(x => x._inc).reduce((t, x) => t + (parseFloat(x.amount) || 0), 0) * 110) / 100;
  let note = '';
  if (r.check && r.check.total) note = r.check.ok
    ? `<span style="color:var(--sage)">✓ adds up to the printed total ${fmt(r.check.total, 2)}</span>`
    : `<span style="color:var(--amber)">⚠ lines add to ${fmt(r.check.lines_inc_gst, 2)} but the receipt says ${fmt(r.check.total, 2)} — check for a missed line</span>`;
  else note = '<span style="color:var(--ink-4)">no printed total to check</span>';
  const sup = String(lines[0] && lines[0].supplier || r.supplier || '').toLowerCase();
  const dup = (D.expense_log || []).filter(e => String(e.supplier || '').toLowerCase() === sup && String(e.date || '').slice(0, 10) === (lines[0] || {}).date);
  const dupHit = lines.length && lines.filter(l => dup.some(e => String(e.description || '').toLowerCase() === String(l.description || '').toLowerCase())).length / lines.length >= 0.6;
  const ci = 'padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg-1);color:var(--ink-1);font-size:12px';
  return `<tr class="rc-rhead"><td colspan="8" style="padding:12px 8px 6px;background:var(--bg-2);border-top:2px solid var(--border-2)">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <span style="font-size:15px">🧾</span>
      <input style="${ci};width:150px" value="${attrEsc((lines[0] && lines[0].supplier) || r.supplier || '')}" placeholder="Supplier" onchange="rcSetReceipt(${id},'supplier',this.value)">
      <input type="date" style="${ci}" value="${attrEsc((lines[0] && lines[0].date) || r.date || '')}" onchange="rcSetReceipt(${id},'date',this.value)">
      <span style="font-size:11px;color:var(--ink-4)">${lines.length} line${lines.length === 1 ? '' : 's'} · ${fmt(inc, 2)} inc GST${many ? ' · ' + attrEsc(r.name || '') : ''}</span>
    </div>
    <div style="font-size:11px;margin-top:4px">${note}${dupHit ? ' · <span style="color:var(--pink)">⚠ looks already saved — untick or Cancel to avoid doubling up</span>' : ''}</div></td></tr>`;
}
function rcSetReceipt(id, field, val) {
  RC.items.forEach(it => { if (it._rc === id) it[field] = val.trim(); });
  const r = (RC.receipts || []).find(x => x.id === id); if (r) r[field] = val.trim();
}

function rcAddRow() {
  RC.items = RC.items || [];
  RC.items.push({ action:'new', type:'expense', date:(RC.items[0]?.date)||new Date().toISOString().slice(0,10),
    supplier:RC.supplier||'', description:'', category:'', project:'', qty:1, unit_price:0, amount:0, _inc:true });
  rcRenderTable();
}

function rcDeleteRow(i) { RC.items.splice(i,1); rcRenderTable(); }

// Create a project from a receipt field, then run cb(row) on success.
async function rcCreateProj(name, cb) {
  try {
    const p = await hubCreateProject(name);
    if (p && cb) cb(p);
    claudeToast('✓ Project created: ' + p.name, 'success');
  } catch (e) { claudeToast('⚠ ' + (e.message || 'Could not create project'), 'error'); }
}

// Feature 5 -- apply one project to every parsed line at once.
function rcApplyProjectAll() {
  const inp = document.getElementById('rc-allproj');
  const val = (inp && inp.value || '').trim();
  if (!val) { claudeToast('Type or pick a project first', 'unclear'); return; }
  // Fuzzy-canonicalise (same logic + 0.6 threshold as the Claude-bar timesheet/
  // expense parser) instead of requiring an exact match.
  const { match, score } = fuzzyMatchProject(val, [...ssProjectCandidates(), ...NON_BILLABLE]);
  const unmatched = !(match && score >= 0.6);
  const final = unmatched ? val : match;
  (RC.items || []).forEach(it => { it.project = final; it._projUnmatched = unmatched; });
  if (inp) inp.value = final;
  rcRenderTable();
  const n = (RC.items || []).length;
  if (unmatched) {
    claudeToast(`No project match for "${val}" - set as typed on ${n} line${n !== 1 ? 's' : ''}, but it won't link to a real project`, 'unclear');
  } else {
    claudeToast(`"${final}" set on ${n} line${n !== 1 ? 's' : ''}${score < 1 ? ` (matched from "${val}")` : ''}`, 'success');
  }
}

// Discard a parsed receipt without saving. Keeps the attached file(s) so Seb can
// re-parse or swap them; confirms first if there are edits to lose.
function rcCancel() {
  if (RC.items && RC.items.length && !confirm('Discard this parsed receipt? Nothing has been saved and your edits will be lost.')) return;
  RC.items = null; RC.receipts = []; RC.supplier = ''; RC.presetProject = null;
  rcRenderScan();
}

async function rcSave() {
  const rows = (RC.items||[]).filter(r => r._inc);
  if (!rows.length) { claudeToast('No lines ticked to save', 'unclear'); return; }
  const items = rows.map(r => ({
    action:'new', type:'expense', date:r.date, supplier:r.supplier||RC.supplier||'',
    description:r.description||'', category:r.category||'', project:r.project||'',
    qty:parseFloat(r.qty)||1, unit_price:parseFloat(r.unit_price)||0, amount:r.amount
  }));
  // Remember before rcRenderScan() resets RC — the Xero export (if ticked) runs
  // straight after the local save succeeds, using the same line items.
  const wantsXeroExport = !!(document.getElementById('rc-xero-export') || {}).checked;
  const btn = document.getElementById('rc-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    const res = await fetch('/.netlify/functions/claude-parse', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ pendingAction: { action:'expense_batch', items } })
    });
    const data = await res.json();
    if (data.status !== 'success') throw new Error(data.message || 'Save failed');
    // Optimistic in-memory update so Expenses/Projects reflect it immediately
    if (data.entries && D) { D.expense_log = D.expense_log || []; data.entries.forEach(e => D.expense_log.push(e)); }
    claudeToast(`✓ ${data.label || (items.length+' lines saved')}`, 'success');
    if (wantsXeroExport) await rcExportToXero(items, data.label);
    RC.items = null; RC.receipts = []; RC.files = []; RC.supplier = ''; RC.note = ''; RC.presetProject = null;
    rcRenderScan();
  } catch(err) {
    claudeToast('⚠ ' + (err.message||'Save failed'), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Save lines'; }
  }
}

// ── Xero export (Scan Receipt → draft Spend Money transaction) ─────────────
// One-click alternative to re-keying the same receipt into Xero by hand: once
// the batch is saved to MatiereHub, optionally also POSTs it to Xero as a
// DRAFT bank transaction (Type SPEND — "already paid, receipt in hand", the
// modern equivalent of the old Expense Claims "Receipt"). Seb reviews and
// approves it from within Xero, same pattern as create_quote/create_invoice.
// Runs entirely through the Hub's own Xero session (xeroApiCall) — no new
// connector, no new OAuth scopes (accounting.contacts + .banktransactions are
// already granted). Nothing here writes to expense_log — the payment method
// lives only in which Xero bank account the transaction is posted against.
async function rcLoadXeroAccounts() {
  if (RC.xeroAccounts) return RC.xeroAccounts;
  const res = await xeroApiCall('Accounts', 'GET');
  const accounts = res.Accounts || [];
  const expenseMap = {};
  accounts.filter(a => a.Class === 'EXPENSE').forEach(a => { if (a.Name) expenseMap[a.Name.toLowerCase().trim()] = a.Code; });
  const bankAccounts = accounts
    .filter(a => a.Type === 'BANK' && a.Status === 'ACTIVE')
    .map(a => ({ AccountID: a.AccountID, Code: a.Code, Name: a.Name }));
  RC.xeroAccounts = { expenseMap, bankAccounts };
  return RC.xeroAccounts;
}

// Rendered inline in rcRenderTable, right above the line-items table. Hidden
// entirely when the Hub isn't connected to Xero — nothing to export to.
function rcRenderXeroExportBox() {
  if (!localStorage.getItem('xero_access_token')) return '';
  return `
    <div id="rc-xero-box" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;padding:10px 12px;background:var(--bg-2);border-radius:8px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);cursor:pointer">
        <input type="checkbox" id="rc-xero-export" ${RC.xeroExport===false?'':'checked'} onchange="RC.xeroExport=this.checked">
        Also create a draft in Xero
      </label>
      <span style="font-size:12px;color:var(--ink-3)">Paid via:</span>
      <select id="rc-xero-payment" onchange="RC.xeroBankAccountId=this.value" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-2);font-size:12px;min-width:170px">
        <option value="">Loading accounts…</option>
      </select>
    </div>`;
}

// Populates the "Paid via" select once the table has been inserted into the DOM.
async function rcPopulateXeroPayment() {
  const sel = document.getElementById('rc-xero-payment');
  if (!sel) return;
  try {
    const { bankAccounts } = await rcLoadXeroAccounts();
    if (!bankAccounts.length) { sel.innerHTML = '<option value="">No Xero bank accounts found</option>'; return; }
    sel.innerHTML = bankAccounts.map(a => `<option value="${a.AccountID}">${a.Name.replace(/</g,'&lt;')}</option>`).join('');
    // Default payment method: the last one used this session, else the first
    // active bank account — Seb can always switch it in the dropdown per receipt.
    let saved = ''; try { saved = localStorage.getItem('rc_bank') || ''; } catch (e) {}
    const want = RC.xeroBankAccountId || saved;
    const preferred = (want && bankAccounts.some(a=>a.AccountID===want)) ? want : bankAccounts[0].AccountID;
    sel.value = preferred;
    RC.xeroBankAccountId = preferred;
    sel.onchange = () => { RC.xeroBankAccountId = sel.value; try { localStorage.setItem('rc_bank', sel.value); } catch (e) {} };
  } catch(e) { sel.innerHTML = '<option value="">Could not load Xero accounts</option>'; }
}

async function rcExportToXero(items, batchLabel, opts) {
  opts = opts || {};
  // One draft per receipt: group by supplier + date.
  const groups = {};
  items.forEach(it => { const k = (it.supplier || RC.supplier || '') + '|' + (it.date || ''); (groups[k] = groups[k] || []).push(it); });
  if (Object.keys(groups).length > 1) {
    let last = null;
    for (const g of Object.values(groups)) last = await rcExportToXero(g, (g[0].supplier || '') + ' ' + (g[0].date || ''), opts);
    return last;
  }
  const bankAccountId = RC.xeroBankAccountId || (document.getElementById('rc-xero-payment')||{}).value;
  if (!bankAccountId) { claudeToast('⚠ Saved to MatiereHub, but no Xero bank account was selected — export skipped', 'unclear'); return null; }
  try {
    const { expenseMap } = await rcLoadXeroAccounts();
    const supplier = (items.find(i=>i.supplier)||{}).supplier || RC.supplier || 'Unknown supplier';

    // Find or create the supplier contact (exact match first, then a loose
    // contains-match — mirrors find_contact in the xero-mcp connector).
    const contactsRes = await xeroApiCall('Contacts', 'GET');
    const allContacts = contactsRes.Contacts || [];
    let contact = allContacts.find(c => (c.Name||'').toLowerCase() === supplier.toLowerCase())
               || allContacts.find(c => (c.Name||'').toLowerCase().includes(supplier.toLowerCase()));
    if (!contact) {
      const created = await xeroApiCall('Contacts', 'POST', { Contacts: [{ Name: supplier }] });
      contact = created.Contacts && created.Contacts[0];
    }
    if (!contact) throw new Error('Could not find or create a Xero contact for "' + supplier + '"');

    // Category → Xero expense account code. expense_log categories are kept in
    // sync with the chart of accounts (see DATA_REFERENCE.md), so this is
    // normally a direct name match; anything unrecognised falls back to
    // "Sundry Expenses" and is flagged in the confirmation toast for review.
    const missingCats = [];
    const lineItems = items.map(it => {
      const key = (it.category || '').toLowerCase().trim();
      const code = expenseMap[key] || expenseMap['sundry expenses'];
      if (!expenseMap[key]) missingCats.push(it.category || '(blank)');
      return {
        Description: it.description || '(no description)',
        Quantity: parseFloat(it.qty) || 1,
        UnitAmount: parseFloat(it.unit_price) || 0,
        AccountCode: code,
        TaxType: opts.tax === 'free' ? 'EXEMPTEXPENSES' : opts.tax === 'excl' ? 'BASEXCLUDED' : 'INPUT'
      };
    });

    const payload = { BankTransactions: [{
      Type: 'SPEND',
      Contact: { ContactID: contact.ContactID },
      Date: (items[0] && items[0].date) || new Date().toISOString().slice(0,10),
      Status: 'DRAFT',
      LineAmountTypes: 'Exclusive',
      Reference: opts.reference || `MatiereHub — ${batchLabel || supplier}`,
      BankAccount: { AccountID: bankAccountId },
      LineItems: lineItems
    }] };

    const res = await xeroApiCall('BankTransactions', 'POST', payload);
    if (!res || !res.BankTransactions || !res.BankTransactions.length) {
      const msg = (res && res.Elements && res.Elements[0] && res.Elements[0].ValidationErrors
        && res.Elements[0].ValidationErrors.map(e=>e.Message).join('; ')) || (res && res.error) || 'Xero rejected the transaction';
      throw new Error(msg);
    }
    const warn = missingCats.length ? ` — category "${[...new Set(missingCats)].join('", "')}" mapped to Sundry Expenses, check in Xero` : '';
    claudeToast(`✓ Draft created in Xero for ${supplier} — review under Bank Transactions ▸ Drafts${warn}`, missingCats.length ? 'unclear' : 'success');
    return res.BankTransactions[0];
  } catch(e) {
    claudeToast('⚠ Saved to MatiereHub, but the Xero export failed: ' + (e.message||e), 'error');
    return null;
  }
}

// ── Materials catalog sub-view ──────────────────────────────────────────────
// Dedupes expense_log by supplier+description (case-insensitive, trimmed).
// Shows latest unit price + last-seen date + category + times purchased — the
// reusable price reference for building quotes.
function rcBuildCatalog() {
  // Shared price library (receipts + web finds in chat + manual) — same data the quoting chat searches.
  if (Array.isArray(D.price_list)) {
    return D.price_list.map(r => ({ supplier: r.supplier || '', description: r.item, category: r.category || '', unit_price: Number(r.unit_price) || 0,
      date: r.last_seen || '', count: r.times_seen || 1, project: '', projects: [], source: r.source, low: r.low, high: r.high, url: r.source_url, unit: r.unit }))
      .sort((a, b) => a.description.localeCompare(b.description));
  }
  const map = {};
  (D.expense_log || []).forEach(e => {
    const desc = (e.description||'').trim();
    if (!desc) return;
    const supplier = (e.supplier||'').trim();
    const key = (supplier+'||'+desc).toLowerCase();
    const date = (e.date||'').slice(0,10);
    const proj = (e.project||'').trim();
    if (!map[key]) {
      map[key] = { supplier, description:desc, category:e.category||'', unit_price:Number(e.unit_price)||0, date, count:1, project:proj, projects:new Set(proj?[proj]:[]) };
    } else {
      const m = map[key];
      m.count++;
      if (proj) m.projects.add(proj);
      if (date > m.date) { m.date = date; m.unit_price = Number(e.unit_price)||m.unit_price; m.category = e.category||m.category; if (proj) m.project = proj; }
    }
  });
  return Object.values(map)
    .map(m => ({ ...m, projects:[...m.projects] }))   // latest project in `project`, all distinct in `projects[]`
    .sort((a,b) => a.description.localeCompare(b.description));
}

function rcRenderCatalog() {
  const body = document.getElementById('rc-body');

  const inp = 'padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:13px';

}

function rcCatFilter() {
  RC.catSearch   = (document.getElementById('rc-cat-search')||{}).value || '';
  RC.catSupplier = (document.getElementById('rc-cat-supplier')||{}).value || '';
  RC.catProject  = (document.getElementById('rc-cat-project')||{}).value || '';
  rcRenderCatalogTable();
}

function rcRenderCatalogTable() {
  const wrap = document.getElementById('rc-cat-table');
  if (!wrap) return;
  let rows = rcBuildCatalog();
  const s = RC.catSearch.trim().toLowerCase(), sup = RC.catSupplier.trim().toLowerCase(), prj = RC.catProject.trim().toLowerCase();
  if (s)   rows = rows.filter(r => r.description.toLowerCase().includes(s));
  if (sup) rows = rows.filter(r => (r.supplier||'').toLowerCase().includes(sup));
  if (prj) rows = rows.filter(r => (r.projects||[]).some(p => p.toLowerCase().includes(prj)));
  if (!rows.length) {
    wrap.innerHTML = '<div style="color:var(--ink-4);padding:20px;text-align:center">The price library is empty — it builds up from saved receipts and prices found in chat.</div>';
    return;
  }
  wrap.innerHTML = `
    <div style="font-size:13px;color:var(--ink-4);margin-bottom:10px">${rows.length} unique item${rows.length!==1?'s':''}</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:var(--bg-2);text-align:left">
        <th style="padding:8px 10px;font-weight:600">Description</th>
        <th style="padding:8px 10px;font-weight:600">Supplier</th>
        <th style="padding:8px 10px;font-weight:600">Category</th>
        <th style="padding:8px 10px;font-weight:600">Source</th>
        <th style="padding:8px 10px;font-weight:600;text-align:right">Latest unit $ (ex GST)</th>
        <th style="padding:8px 10px;font-weight:600;text-align:right">Times</th>
        <th style="padding:8px 10px;font-weight:600">Last seen</th>
        <th style="padding:8px 8px;width:90px"></th>
      </tr></thead>
      <tbody>
        ${rows.map((r,i) => {
          const extra = (r.projects||[]).length > 1 ? ` +${r.projects.length-1}` : '';
          const projTitle = (r.projects||[]).join(', ');
          return `
          <tr style="border-top:1px solid var(--border);background:${i%2===0?'var(--bg-1)':'var(--bg-2)'}">
            <td style="padding:7px 10px;color:var(--ink-2)">${attrEsc(r.description)}</td>
            <td style="padding:7px 10px;color:var(--ink-3)">${attrEsc(r.supplier||'—')}</td>
            <td style="padding:7px 10px;color:var(--ink-4)">${attrEsc(r.category||'—')}</td>
            <td style="padding:7px 10px;color:var(--ink-3)" title="${attrEsc(projTitle)}">${r.source ? (r.url ? '<a href="'+attrEsc(r.url)+'" target="_blank" rel="noopener" style="color:inherit">'+attrEsc(r.source)+'</a>' : attrEsc(r.source)) : (attrEsc(r.project||'—')+(extra?`<span style="color:var(--ink-4)">${extra}</span>`:''))}</td>
            <td style="padding:7px 10px;text-align:right;color:var(--amber);font-weight:600">${fmt(r.unit_price,2)}${r.low != null && Number(r.low) !== Number(r.high) ? `<div style="font-size:10px;color:var(--ink-4);font-weight:400">${fmt(r.low,2)}–${fmt(r.high,2)}</div>` : ''}</td>
            <td style="padding:7px 10px;text-align:right;color:var(--ink-4)">${r.count}</td>
            <td style="padding:7px 10px;color:var(--ink-4);white-space:nowrap">${fmtDMY(r.date)}</td>
            <td style="padding:5px 8px;text-align:right"><button onclick='rcCopyLine(${JSON.stringify({d:r.description,p:r.unit_price,s:r.supplier}).replace(/'/g,"&#39;")})' style="padding:5px 9px;background:var(--bg-1);color:var(--ink-3);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:11px">Copy</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function rcCopyLine(o) {
  const line = `${o.d} — ${fmt(o.p,2)} ea${o.s?(' ('+o.s+')'):''}`;
  if (navigator.clipboard) navigator.clipboard.writeText(line).then(
    () => claudeToast('✓ Copied for quote: ' + line.slice(0,40), 'success'),
    () => claudeToast('Copy failed — ' + line, 'unclear')
  );
  else claudeToast(line, 'unclear');
}

// ── For Action tab ────────────────────────────────────────────────────────────
// A single place that collects everything needing review. Each section is a
// self-contained block returning { html, count } so new review types drop in here.
const FA = { window_days: 120 };

function faSection(title, count, bodyHtml, accent) {
  const c = accent || 'var(--orange)';
  return `
    <div style="margin-bottom:26px">
      <h3 style="font-size:14px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px">
        ${title}
        <span style="background:${count?c:'var(--border)'};color:${count?'#fff':'var(--ink-4)'};border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600">${count}</span>
      </h3>
      ${count ? bodyHtml : `<div style="font-size:12px;color:var(--ink-4)">✓ Nothing to review.</div>`}
    </div>`;
}

async function renderForAction() {
  const el = document.getElementById('page-action');
  if (!el) return;
  el.innerHTML = `<div style="padding:20px"><div style="color:var(--ink-4);padding:20px;text-align:center">Loading review items…</div></div>`;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const iso = d => d.toISOString().slice(0, 10);
  const from = iso(new Date(today.getTime() - FA.window_days * 86400000));
  const to   = iso(today);

  // Fetch in parallel
  let exps = [], spend = [], contacts = [];
  try {
    [exps, spend, contacts] = await Promise.all([
      sbGet(`/rest/v1/expense_log?date=gte.${from}&date=lte.${to}&select=id,date,supplier,description,amount&order=date.desc`),
      sbGet(`/rest/v1/bank_transactions?type=eq.SPEND&date=gte.${from}&date=lte.${to}&select=id,date,contact,description,gross,account_name,project,expense_log_id&order=date.desc`),
      sbGet(`/rest/v1/contacts?select=id,name,categories,rating,is_supplier,is_customer&order=name.asc`)
    ]);
  } catch (e) {
    el.innerHTML = `<div style="padding:20px;color:var(--pink)">Could not load review items: ${e.message}</div>`;
    return;
  }

  // 1 — Expense matches (logged expense ≈ an unlinked bank SPEND, ±1 day, gross ≈ amount×1.1)
  const unlinked = spend.filter(t => !t.expense_log_id);
  const matches = [];
  for (const exp of exps) {
    const targetGross = Math.round(exp.amount * 1.1 * 100) / 100;
    const expMs = new Date(exp.date).getTime();
    const cands = unlinked.filter(t => Math.abs(new Date(t.date).getTime() - expMs) / 86400000 <= 1 && Math.abs((t.gross || 0) - targetGross) <= 0.55);
    if (cands.length) matches.push({ exp, candidates: cands });
  }
  const matchHtml = `<div style="display:flex;flex-direction:column;gap:10px">
    ${matches.map(({ exp, candidates }) => `
      <div style="background:var(--bg-2);border-radius:8px;padding:12px 14px;border-left:3px solid var(--orange)">
        <div style="font-size:12px;color:var(--ink-3);margin-bottom:8px">
          <strong>Expense logged:</strong> ${fmtDMY(exp.date)} · ${exp.supplier || '(no supplier)'} · ${exp.description || ''} · ${fmt(exp.amount)} ex GST
          <span style="color:var(--ink-4)">(≈ ${fmt(exp.amount * 1.1)} incl GST)</span>
        </div>
        ${candidates.map(t => `
          <div style="display:flex;align-items:center;gap:12px;padding:7px 10px;background:var(--bg-1);border-radius:6px;margin-bottom:6px;font-size:12px">
            <span style="color:var(--ink-3);white-space:nowrap">${fmtDMY(t.date)}</span>
            <span style="color:var(--ink-2)">${t.contact || '—'}</span>
            <span style="color:var(--ink-4);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.description || ''}</span>
            <span style="color:var(--pink);font-weight:600;white-space:nowrap">${fmt(t.gross)}</span>
            <button onclick="faLink('${attrEsc(t.id)}',${exp.id})" style="padding:4px 10px;background:var(--sage);color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap">Link ✓</button>
          </div>`).join('')}
      </div>`).join('')}
  </div>`;

  // 2 — Overdue invoices (open invoices aged > 30 days)
  const overdue = (D.open_invoices || []).map(inv => {
    const age = Math.floor((today - new Date(inv.date + 'T00:00:00')) / 86400000);
    return { ...inv, age };
  }).filter(inv => inv.age > 30).sort((a, b) => b.age - a.age);
  const overdueHtml = `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="background:var(--bg-2);text-align:left">
      <th style="padding:7px 10px;font-weight:600">Invoice</th><th style="padding:7px 10px;font-weight:600">Client</th>
      <th style="padding:7px 10px;font-weight:600">Date</th><th style="padding:7px 10px;font-weight:600;text-align:right">Amount</th>
      <th style="padding:7px 10px;font-weight:600;text-align:right">Age</th></tr></thead>
    <tbody>${overdue.map(inv => `
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:7px 10px">${inv.invoice || ''}</td>
        <td style="padding:7px 10px">${inv.contact || ''}</td>
        <td style="padding:7px 10px;color:var(--ink-3)">${fmtDMY(inv.date)}</td>
        <td style="padding:7px 10px;text-align:right">${fmt(inv.amount)}</td>
        <td style="padding:7px 10px;text-align:right;color:${inv.age > 60 ? 'var(--pink)' : 'var(--orange)'};font-weight:600">${inv.age}d</td>
      </tr>`).join('')}</tbody></table>`;

  // 3 — Uncategorised transactions (recent SPEND with no account category AND no project)
  const uncat = spend.filter(t => !((t.account_name || '').trim()) && !((t.project || '').trim()));
  const uncatHtml = `<table style="width:100%;border-collapse:collapse;font-size:12px">
    <thead><tr style="background:var(--bg-2);text-align:left">
      <th style="padding:7px 10px;font-weight:600">Date</th><th style="padding:7px 10px;font-weight:600">Contact</th>
      <th style="padding:7px 10px;font-weight:600">Description</th><th style="padding:7px 10px;font-weight:600;text-align:right">Amount</th></tr></thead>
    <tbody>${uncat.slice(0, 50).map(t => `
      <tr style="border-top:1px solid var(--border)">
        <td style="padding:7px 10px;color:var(--ink-3);white-space:nowrap">${fmtDMY(t.date)}</td>
        <td style="padding:7px 10px">${t.contact || '—'}</td>
        <td style="padding:7px 10px;color:var(--ink-4);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.description || ''}</td>
        <td style="padding:7px 10px;text-align:right;color:var(--pink)">${fmt(t.gross)}</td>
      </tr>`).join('')}</tbody></table>
    ${uncat.length > 50 ? `<div style="font-size:11px;color:var(--ink-4);margin-top:8px">Showing first 50 of ${uncat.length}.</div>` : ''}`;

  // 4 — Untagged contacts (no category AND no rating)
  const untagged = contacts.filter(c => (!c.categories || !c.categories.length) && (c.rating == null));
  const untaggedHtml = `<div style="display:flex;flex-wrap:wrap;gap:6px">
    ${untagged.slice(0, 60).map(c => `<span style="font-size:12px;background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--ink-3)">${c.name}${c.is_supplier ? ' <span style="color:var(--ink-4);font-size:10px">supplier</span>' : ''}</span>`).join('')}
  </div>${untagged.length > 60 ? `<div style="font-size:11px;color:var(--ink-4);margin-top:8px">Showing first 60 of ${untagged.length}.</div>` : ''}`;

  const total = matches.length + overdue.length + uncat.length + untagged.length;
  el.innerHTML = `
    <div style="padding:20px">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:20px">
        <h2 style="margin:0;font-size:18px;font-weight:600">For Action</h2>
        <span style="font-size:12px;color:var(--ink-4)">${total} item${total === 1 ? '' : 's'} to review · last ${FA.window_days} days</span>
      </div>
      ${faSection('Expense matches', matches.length, matchHtml, 'var(--orange)')}
      ${faSection('Overdue invoices', overdue.length, overdueHtml, 'var(--pink)')}
      ${faSection('Uncategorised transactions', uncat.length, uncatHtml, 'var(--amber)')}
      ${faSection('Untagged contacts', untagged.length, untaggedHtml, 'var(--blue)')}
    </div>`;

  faUpdateBadge(total);
}

// Update the nav-tab count badge
function faUpdateBadge(n) {
  const b = document.getElementById('fa-count');
  if (!b) return;
  if (n > 0) { b.textContent = n; b.style.display = 'inline-block'; }
  else { b.style.display = 'none'; }
}

// Link a bank transaction to a logged expense, then refresh For Action
async function faLink(bankTxId, expenseLogId) {
  try {
    await hubWrite('bank_transactions', bankTxId, { expense_log_id: expenseLogId });
    await renderForAction();
  } catch (e) {
    alert('Could not link: ' + e.message);
  }
}

// ── Auth gate ──────────────────────────────────────────────────────────────
// Single shared password (server-checked via netlify/functions/hub-auth.js,
// never shipped in this file) gates the whole HUB. Once a browser enters it
// correctly, hub_auth_token stays in localStorage and it's never asked again
// on that device. Admin-only for now (full access) — member/guest roles
// with restricted access can be layered on top later (see CLAUDE.md).
const HUB_AUTH_KEY = 'hub_auth_token';

function hubToggleGatePw() {
  const pw = document.getElementById('hub-gate-pw');
  const btn = document.getElementById('hub-gate-pw-toggle');
  const showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  btn.textContent = showing ? 'Show' : 'Hide';
}

function hubShowGate(errorMsg) {
  document.getElementById('loading').style.display = 'none';
  const gate = document.getElementById('hub-gate');
  gate.style.display = 'flex';
  const err = document.getElementById('hub-gate-error');
  if (errorMsg) { err.textContent = errorMsg; err.style.display = 'block'; }
  else { err.style.display = 'none'; }
  const pw = document.getElementById('hub-gate-pw');
  pw.value = '';
  pw.focus();
}

async function hubTryLogin() {
  const pwInput = document.getElementById('hub-gate-pw');
  const btn = document.getElementById('hub-gate-btn');
  const password = pwInput.value;
  if (!password) return;
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    const r = await fetch('/.netlify/functions/hub-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password })
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok && data.ok) {
      localStorage.setItem(HUB_AUTH_KEY, data.token);
      document.getElementById('hub-gate').style.display = 'none';
      document.getElementById('loading').style.display = 'flex';
      bootHub();
    } else {
      hubShowGate(data.error === 'Wrong password' ? 'Wrong password — try again.' : (data.error || 'Could not verify password.'));
    }
  } catch (e) {
    hubShowGate('Could not reach the Hub — check your connection.');
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

function hubCheckAuth() {
  if (localStorage.getItem(HUB_AUTH_KEY)) {
    bootHub();
  } else {
    hubShowGate();
  }
}

async function bootHub() {
  if (window.location.pathname === '/xero-callback' || window.location.search.includes('code=')) {
    await handleXeroCallback();
  }
  if (window.location.search.includes('xero=connected')) history.replaceState({}, '', '/');
  updateXeroBtn();
  loadData();
}

// ── Usage tracking (2026-11-06) ───────────────────────────────────────────
// Records which tabs are opened and which buttons are tapped (function name only,
// never text or client names) into usage_events via hub-track. Failures are silent.
const HUB_SESSION = Math.random().toString(36).slice(2, 10);
const HUB_DEVICE = /iPhone/.test(navigator.userAgent) ? 'iphone' : /iPad/.test(navigator.userAgent) ? 'ipad'
  : /Android/.test(navigator.userAgent) ? 'android' : /Mac/.test(navigator.userAgent) ? (navigator.maxTouchPoints > 1 ? 'ipad' : 'mac') : 'other';
let hubTrackTab = 'timesheet', hubTrackQ = [];
function hubTrack(kind, name) {
  if (kind === 'view') hubTrackTab = name;
  hubTrackQ.push({ session: HUB_SESSION, device: HUB_DEVICE, standalone: !!(navigator.standalone || matchMedia('(display-mode: standalone)').matches),
    tab: hubTrackTab, kind, name, ts: new Date().toISOString() });
  if (hubTrackQ.length >= 10) hubTrackFlush();
}
function hubTrackFlush() {
  if (!hubTrackQ.length || !localStorage.getItem('hub_auth_token')) return;
  const events = hubTrackQ.splice(0, 50);
  fetch('/.netlify/functions/hub-track', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ events }) }).catch(() => {});
}
document.addEventListener('click', function (e) {
  try {
    const el = e.target.closest && e.target.closest('button,[onclick],a,summary,.tab,.hub-pill-btn,.ts-range-btn');
    if (!el) return;
    const m = (el.getAttribute('onclick') || '').match(/^\s*(?:return\s+)?([A-Za-z_$][\w$]*)\s*\(/);
    const name = m ? m[1] : (el.id || '');
    if (!name || name === 'showTab' || name === 'hubGo') return;   // tab opens are recorded as views
    hubTrack('tap', name);
  } catch (err) {}
}, true);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') hubTrackFlush(); });
setInterval(hubTrackFlush, 20000);
hubTrack('open', HUB_DEVICE);

// ── Phone navigation (bottom bar + More sheet) ───────────────────────────
function hubGo(name) {
  hubMore(false);
  const tab = [...document.querySelectorAll('.tabs .tab')].find(t => (t.getAttribute('onclick') || '').includes("'" + name + "'"));
  if (tab) showTab(name, tab);
}
function hubMore(open) { document.getElementById('hub-more').classList.toggle('open', !!open); }
function hubNavSync(name) {
  const main = ['timesheet', 'projects', 'schedule', 'receipts'];
  document.querySelectorAll('#hub-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === (main.includes(name) ? name : 'more')));
  document.querySelectorAll('#hub-more .sheet button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  const cnt = id => { const e = document.getElementById(id); return e && e.style.display !== 'none' ? (e.textContent || '').trim() : ''; };
  const sc = cnt('sch-count'), fa = cnt('fa-count');
  const set = (id, v) => { const e = document.getElementById(id); if (e) { e.textContent = v; e.style.display = v ? '' : 'none'; } };
  set('nb-schedule', sc); set('nb-more', fa); set('mb-action', fa);
}
['sch-count', 'fa-count'].forEach(id => { const e = document.getElementById(id); if (e) new MutationObserver(() => hubNavSync(hubTrackTab)).observe(e, { childList: true, characterData: true, subtree: true, attributes: true }); });
hubNavSync('timesheet');

// ── Quick "Log hours" sheet (2026-11-06) ─────────────────────────────────
let QL = { hours: 8 };
function tsQuickLog() {
  const names = [];
  (D.projects || []).filter(p => (p.status || 'Active') === 'Active').forEach(p => names.push(p.name));
  NON_BILLABLE.filter(n => n !== "Elea's bed").forEach(n => { if (!names.includes(n)) names.push(n); });
  let last = ''; try { last = localStorage.getItem('ql_last_project') || ''; } catch (e) {}
  if (last && !names.includes(last)) names.unshift(last);
  QL = { hours: 8 };
  const opts = names.map(n => `<option value="${attrEsc(n)}"${n === last ? ' selected' : ''}>${attrEsc(n)}</option>`).join('');
  openModal('Log hours', `
    <div class="ql-row"><label>Project</label><select id="ql-project">${last ? '' : '<option value="">Choose…</option>'}${opts}</select></div>
    <div class="ql-row"><label>Hours</label>
      <div class="ql-step"><button class="sb" onclick="qlStep(-0.5)" aria-label="Less">−</button><div class="ql-val" id="ql-val">8</div><button class="sb" onclick="qlStep(0.5)" aria-label="More">+</button></div>
      <div class="ql-presets"><button onclick="qlSet(2)">2h</button><button onclick="qlSet(4)">4h</button><button onclick="qlSet(6)">6h</button><button onclick="qlSet(8)">Full day</button></div></div>
    <div class="ql-row"><label>Date</label><input type="date" id="ql-date" value="${ds(todayMidnight())}" max="${ds(todayMidnight())}"></div>
    <div class="ql-row"><label>Notes (optional)</label><input type="text" id="ql-notes" placeholder="What was done"></div>
    <button class="btn-primary" id="ql-save" style="width:100%;min-height:50px;font-size:16px;border-radius:12px" onclick="qlSave()">Save hours</button>`);
}
function qlSet(h) { QL.hours = h; document.getElementById('ql-val').textContent = h; }
function qlStep(d) { qlSet(Math.min(24, Math.max(0.5, QL.hours + d))); }
async function qlSave() {
  const project = document.getElementById('ql-project').value;
  if (!project) { claudeToast('Choose a project first', 'unclear'); return; }
  const btn = document.getElementById('ql-save'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const row = await (async () => {
      const r = await fetch('/.netlify/functions/hub-write', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ table: 'timesheets', insert: true, fields: { project, hours: QL.hours, date: document.getElementById('ql-date').value, notes: document.getElementById('ql-notes').value.trim(), employee: 'Seb' } }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok || !out.ok) throw new Error(out.error || ('Save failed ' + r.status));
      return out.row;
    })();
    try { localStorage.setItem('ql_last_project', project); } catch (e) {}
    D.timesheets = D.timesheets || []; D.timesheets.push(row);
    closeModal(); renderTimesheet();
    claudeToast(`✓ ${row.hours}h on ${row.project}`, 'success');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Save hours';
    claudeToast('⚠ ' + e.message, 'error');
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
hubCheckAuth();
