<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matière Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #000000;
  --bg-2:    #0f0f0f;
  --bg-3:    #1a1a1a;
  --bg-4:    #252525;
  --border:  #2a2a2a;
  --border-2:#383838;
  --ink:     #ffffff;
  --ink-2:   #cccccc;
  --ink-3:   #888888;
  --ink-4:   #505050;
  /* keep old names for compat */
  --cream:   #000000;
  --cream-2: #0f0f0f;
  --cream-3: #1a1a1a;
  --navy:    #0a0a0a;
  /* brand palette */
  --amber:   #FFBE0B;
  --orange:  #FB5607;
  --pink:    #FF006E;
  --purple:  #8338EC;
  --blue:    #3A86FF;
  /* semantic */
  --gold:    #FFBE0B;
  --gold-2:  #ffd54f;
  --gold-light: rgba(255,190,11,0.12);
  --rust:    #FB5607;
  --sage:    #05C46B;
  --r: 6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:var(--bg);color:var(--ink);min-height:100vh}

/* ── Header ── */
.header{background:#000;border-bottom:1px solid var(--border);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:100}
.header-brand{display:flex;align-items:baseline;gap:8px}
.header-brand h1{font-size:18px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.header-brand span{font-size:10px;color:var(--ink-4);letter-spacing:.2em;text-transform:uppercase}
.header-meta{font-size:11px;color:var(--ink-4);text-align:right;line-height:1.5}
.btn-refresh{background:rgba(255,255,255,.06);border:1px solid var(--border-2);color:var(--ink-3);padding:6px 14px;border-radius:var(--r);font-size:12px;cursor:pointer;transition:all .2s}
.btn-refresh:hover{background:rgba(255,255,255,.12);color:var(--ink)}

/* ── Tabs ── */
.tabs{display:flex;gap:0;background:#000;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 18px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:700}

/* ── Pages ── */
.page{display:none;padding:20px;max-width:1040px;margin:0 auto}
.page.active{display:block}

/* ── KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.kpi-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:6px}
.kpi-value{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:11px;color:var(--ink-4);margin-top:4px}
.kpi.highlight{border-left:2px solid var(--amber)}
.kpi.warn{border-left:2px solid var(--orange)}
.kpi.good{border-left:2px solid var(--sage)}

/* ── Sections ── */
.section{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.section-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.section-head h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.section-body{padding:16px}
.chart-wrap{position:relative;height:220px}

/* ── Tables ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 14px;text-align:left;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-3)}
.amount{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

/* ── Badges ── */
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.04em}
.badge-green{background:rgba(5,196,107,.15);color:#05C46B}
.badge-amber{background:rgba(255,190,11,.15);color:var(--amber)}
.badge-red{background:rgba(255,0,110,.15);color:var(--pink)}
.badge-blue{background:rgba(58,134,255,.15);color:var(--blue)}
.badge-gray{background:var(--bg-3);color:var(--ink-4)}

/* ── Mini bars ── */
.mini-bar{background:var(--bg-3);border-radius:2px;height:4px;overflow:hidden;margin-top:6px}
.mini-bar-fill{background:var(--amber);height:100%;border-radius:2px;transition:width .4s}

/* ── Layout ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.kpi-value{font-size:20px}}
.divider{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-4);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── Loading / Error ── */
#loading{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:12px;color:var(--ink-4)}
.spinner{width:28px;height:28px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite}
.spinner-sm{width:14px;height:14px;border:2px solid var(--border-2);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#error-box{display:none;background:rgba(255,0,110,.1);border:1px solid rgba(255,0,110,.3);border-radius:var(--r);padding:16px;margin:20px;color:var(--pink);font-size:13px}

/* ── Log entries ── */
.log-entry{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.log-entry:last-child{border-bottom:none}
.log-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);margin-top:5px;flex-shrink:0}
.log-dot.expense{background:var(--orange)}
.log-dot.hours{background:var(--sage)}
.log-text{flex:1;line-height:1.5}
.log-date{font-size:11px;color:var(--ink-4);margin-top:2px}
.log-amount{font-weight:600;white-space:nowrap;color:var(--ink)}

/* ── Empty states ── */
.empty{text-align:center;padding:40px 20px;color:var(--ink-4);font-size:13px}
.empty-icon{font-size:28px;margin-bottom:8px;opacity:.5}

/* ── Modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;width:100%;max-width:660px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.8);animation:modalIn .18s ease}
@keyframes modalIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;border-radius:8px 8px 0 0}
.modal-head h3{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.modal-close{background:var(--bg-3);border:1px solid var(--border);font-size:14px;cursor:pointer;color:var(--ink-3);line-height:1;padding:4px 9px;border-radius:var(--r)}
.modal-close:hover{color:var(--ink)}
.modal-body{padding:20px;max-height:72vh;overflow-y:auto}
.modal-body .kpi{padding:12px}
.modal-body .kpi-value{font-size:20px}

/* ── Misc ── */
.project-row{cursor:pointer}
.chart-clickable-hint{font-size:10px;color:var(--ink-4);letter-spacing:.04em}
.btn-primary{background:var(--amber);color:#000;border:none;padding:9px 18px;font-size:12px;border-radius:var(--r);cursor:pointer;transition:background .2s;font-weight:700;letter-spacing:.04em}
.btn-primary:hover{background:var(--gold-2)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.load-bar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;padding:14px 16px;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r)}

/* ── Timesheet specific ── */
.ts-filter-bar{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:14px;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.ts-filter-bar label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4)}
.ts-filter-bar select{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:5px 10px;border-radius:var(--r);font-size:12px}
.ts-nav-btn{background:transparent;border:1px solid var(--border-2);color:var(--ink-3);padding:5px 12px;border-radius:var(--r);cursor:pointer;font-size:16px;transition:all .15s}
.ts-nav-btn:hover{color:var(--ink);border-color:var(--ink-4)}
.ts-range-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ts-range-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-right:4px}
.ts-range-btn{background:var(--bg-2);border:1px solid var(--border);color:var(--ink-4);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.04em;transition:all .15s}
.ts-range-btn:hover{color:var(--ink-2);border-color:var(--ink-4)}
.ts-range-btn.active{background:var(--amber);color:#000;border-color:var(--amber)}
.ts-range-bar input[type="date"]{background:var(--bg-2);border:1px solid var(--border-2);color:var(--ink);padding:4px 8px;border-radius:var(--r);font-size:11px;color-scheme:dark}
.ts-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.ts-day-hdr{text-align:center;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);padding:6px 0}
.ts-cell{aspect-ratio:1;border-radius:5px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:flex-start;padding:4px 5px;font-size:10px;position:relative;overflow:hidden;min-height:36px}
.ts-cell.clickable{cursor:pointer}
.ts-cell.clickable:hover{border-color:var(--amber) !important}
.ts-cell-grey{background:rgba(255,255,255,.02);border-color:transparent}
.ts-cell-missing{border-color:rgba(255,0,110,.25) !important}
.ts-day-num{font-size:10px;font-weight:700;color:var(--ink-3);z-index:1;position:relative;line-height:1}
.ts-day-label{font-size:8px;color:var(--ink-4);z-index:1;position:relative;margin-top:1px;letter-spacing:.04em}
.ts-miss-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);opacity:.85}
.ts-bar-fill{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse}
.ts-bar-seg{width:100%;flex-shrink:0}
.ts-popup-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4)}
.ts-popup{position:absolute;background:var(--bg-2);border:1px solid var(--border-2);border-radius:8px;min-width:260px;max-width:320px;box-shadow:0 12px 40px rgba(0,0,0,.7);overflow:hidden}
.ts-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-bottom:1px solid var(--border)}
.ts-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.ts-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── Floating Claude input bar ── */
#claude-bar{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(0,0,0,.94);border-top:1px solid var(--border-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:10px 14px;display:flex;align-items:center;gap:8px}
#claude-bar-input{flex:1;background:var(--bg-3);border:1px solid var(--border-2);color:var(--ink);padding:9px 14px;border-radius:24px;font-size:13px;outline:none;transition:border-color .2s;min-width:0}
#claude-bar-input:focus{border-color:var(--amber)}
#claude-bar-input::placeholder{color:var(--ink-4)}
#claude-bar-input:disabled{opacity:.5}
#claude-mic-btn{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .2s;background:var(--bg-3);border:1px solid var(--border-2)}
#claude-mic-btn:hover{border-color:var(--ink-4)}
#claude-mic-btn.listening{background:var(--pink);border-color:var(--pink);animation:pulse .9s infinite}
#claude-mic-btn.processing{background:var(--bg-3);border-color:var(--border-2);pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,0,110,.4)}50%{box-shadow:0 0 0 8px rgba(255,0,110,0)}}
#claude-send-btn{background:var(--amber);color:#000;border:none;padding:9px 16px;border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;letter-spacing:.04em;transition:all .15s;flex-shrink:0}
#claude-send-btn:hover:not(:disabled){background:var(--gold-2)}
#claude-send-btn:disabled{opacity:.4;cursor:not-allowed}
#claude-bar-status{font-size:10px;color:var(--ink-4);white-space:nowrap;flex-shrink:0;letter-spacing:.06em;min-width:60px;text-align:right;display:none}
/* toast */
#claude-toast{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;padding:9px 20px;border-radius:24px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;letter-spacing:.04em;white-space:nowrap;max-width:90vw;text-align:center}
#claude-toast.success{background:var(--sage);color:#000;opacity:1}
#claude-toast.error{background:var(--pink);color:#fff;opacity:1}
#claude-toast.unclear{background:var(--amber);color:#000;opacity:1}
body{padding-bottom:62px}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><span style="font-size:12px;letter-spacing:.08em">LOADING MATIÈRE HUB</span></div>
<div id="error-box"></div>

<div id="app" style="display:none">

<div class="header">
  <div class="header-brand">
    <img src="https://raw.githubusercontent.com/smatiere/matierehub/main/logo.png"
         alt="Matiere" height="22"
         style="display:block;filter:invert(1);image-rendering:crisp-edges">
    <span style="font-size:12px;font-weight:700;letter-spacing:.28em;color:rgba(255,255,255,0.2);text-transform:uppercase;align-self:center;margin-left:4px">HUB</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="header-meta" id="header-meta"></div>
    <button id="xero-btn" class="btn-refresh">⚡ Connect Xero</button>
    <button id="xero-sync-btn" class="btn-refresh" style="display:none" onclick="syncFromXero()">⬇ Sync Xero</button>
    <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('overview',this)">Overview</div>
  <div class="tab" onclick="showTab('cash',this)">Cash & Invoices</div>
  <div class="tab" onclick="showTab('timesheet',this)">Timesheets</div>
  <div class="tab" onclick="showTab('profitability',this)">Profitability</div>
  <div class="tab" onclick="showTab('materials',this)">Materials</div>
  <div class="tab" onclick="showTab('projects',this)">Projects</div>
  <div class="tab" onclick="showTab('quotes',this)">Quotes & Pricing</div>
  <div class="tab" onclick="showTab('log',this)">Activity Log</div>
</div>

<div class="page active" id="page-overview"></div>
<div class="page" id="page-cash"></div>
<div class="page" id="page-timesheet"></div>
<div class="page" id="page-profitability"></div>
<div class="page" id="page-materials"></div>
<div class="page" id="page-projects"></div>
<div class="page" id="page-quotes"></div>
<div class="page" id="page-log"></div>

<div id="modal-overlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Timesheet day popup -->
<div id="ts-popup-overlay" class="ts-popup-overlay" onclick="if(event.target===this)tsDismissPopup()">
  <div id="ts-popup" class="ts-popup"></div>
</div>

</div><!-- end #app -->

<!-- Floating Claude input bar -->
<div id="claude-bar">
  <button id="claude-mic-btn" onclick="claudeMicToggle()" title="Hold to speak">🎤</button>
  <input id="claude-bar-input" type="text" placeholder='e.g. "4h Mark Nth Balgowlah" or "$280 Bunnings materials"' autocomplete="off">
  <span id="claude-bar-status"></span>
  <button id="claude-send-btn" onclick="claudeBarSend()">Log</button>
</div>
<div id="claude-toast"></div>

<script>
let D = null;
let charts = {};

// ── Data load ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/smatiere/matierehub/main/data.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('error-box').style.display = 'none';
    renderAll();
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    const eb = document.getElementById('error-box');
    eb.style.display = 'block';
    eb.textContent = 'Could not load data. ' + e.message;
  }
}

function fmt(n, decimals=0) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toLocaleString('en-AU', {minimumFractionDigits:decimals, maximumFractionDigits:decimals});
}
function pct(n) { return (n||0).toFixed(1) + '%'; }

function showTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  (el || event.target).classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'quotes') renderQuotes();
  if (name === 'timesheet') renderTimesheet();
}

function kpi(label, value, sub, style='') {
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

function kpiBar(label, value, sub, fillPct, style='') {
  const w = Math.min(100, Math.max(0, fillPct||0));
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    <div class="mini-bar"><div class="mini-bar-fill" style="width:${w}%"></div></div>
  </div>`;
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

const CHART_GRID = 'rgba(255,255,255,0.06)';
const CHART_TICK = { color:'#555', font:{size:11} };

function renderAll() {
  const k = D.kpis, m = D.monthly;
  const lastSync = D.meta && D.meta.last_updated
    ? new Date(D.meta.last_updated).toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'numeric'})
    : '—';
  document.getElementById('header-meta').innerHTML = `Last sync: ${lastSync}`;
  renderOverview(k, m);
  renderCash(k);
  renderProfitability(k, m);
  renderMaterials(k, m);
  renderProjects(k);
  renderLog();
}

// ── Overview ──────────────────────────────────────────────────────────────────
function renderOverview(k, m) {
  const totalMonthlyRev = m.revenue.reduce((a,b)=>a+b,0);
  const avgMonthly = totalMonthlyRev / m.revenue.filter(v=>v>0).length;
  const openCount = D.open_invoices ? D.open_invoices.length : 0;
  document.getElementById('page-overview').innerHTML = `
    <div class="divider">FY2026 · Year to Date (Jul 2025 – Apr 2026)</div>
    <div class="kpi-grid">
      ${kpi('Revenue YTD', fmt(k.fy26_revenue), '10 months collected', 'highlight')}
      ${kpi('Gross Profit', fmt(k.fy26_gross_profit), 'Margin: ' + pct(k.fy26_gp_margin), 'good')}
      ${kpi('Materials Cost', fmt(k.fy26_materials), 'Direct job costs', '')}
      ${kpi('Outstanding', fmt(k.total_outstanding), openCount + ' open invoices', k.total_outstanding > 10000 ? 'warn' : '')}
      ${kpi('Avg Monthly Rev', fmt(avgMonthly), 'Active months only', '')}
      ${kpi('Owner Drawings', fmt(k.fy26_owner_drawings), 'FY26 paid to Seb', '')}
    </div>
    <div class="section">
      <div class="section-head"><h2>Monthly Revenue — FY2026</h2><span class="chart-clickable-hint">click a bar for month detail</span></div>

// ── Projects ──────────────────────────────────────────────────────────────────
function renderProjects(k) {
  const definedProjects = D.projects || [];
  const timesheets = D.timesheets || [];
  const expenses = D.expense_log || [];
  const rate = k.sebRate_per_hour || 100;
  const definedNames = new Set(definedProjects.map(p => p.name));
  const definedMap = {};
  definedProjects.forEach(p => definedMap[p.name] = p);
  const allNames = new Set(definedProjects.map(p => p.name));
  timesheets.forEach(t => t.project && allNames.add(t.project));
  expenses.forEach(e => e.project && allNames.add(e.project));
  const pData = {};
  allNames.forEach(name => {
    const def = definedMap[name] || {};
    pData[name] = { name, status: def.status || 'Active', quoted: def.quoted != null ? def.quoted : null, hours: 0, laborValue: 0, expenses: 0 };
  });
  timesheets.forEach(t => { if (t.project && pData[t.project]) { pData[t.project].hours += (t.hours||0); pData[t.project].laborValue += (t.hours||0) * rate; } });
  expenses.forEach(e => { if (e.project && pData[e.project]) pData[e.project].expenses += (e.amount||0); });
  const sorted = Object.values(pData).sort((a,b) => {
    const aD = definedNames.has(a.name) ? 0 : 1, bD = definedNames.has(b.name) ? 0 : 1;
    if (aD !== bD) return aD - bD;
    return a.name.localeCompare(b.name);
  });
  const projectRows = sorted.map(p => {
    const remaining = p.quoted != null ? p.quoted - p.laborValue - p.expenses : null;
    const safeName = p.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<tr class="project-row" onclick="showProjectDetail('${safeName}')">
      <td><strong>${p.name}</strong></td>
      <td><span class="badge ${p.status==='Active'?'badge-green':'badge-gray'}">${p.status}</span></td>
      <td class="amount">${p.quoted != null ? fmt(p.quoted) : '<span style="color:var(--ink-4)">TBD</span>'}</td>
      <td class="amount">${p.hours > 0 ? p.hours + 'h' : '—'}</td>
      <td class="amount">${p.laborValue > 0 ? fmt(p.laborValue) : '—'}</td>
      <td class="amount" style="color:var(--orange)">${p.expenses > 0 ? fmt(p.expenses) : '—'}</td>
      <td class="amount" style="color:${remaining===null?'var(--ink-4)':remaining>=0?'var(--sage)':'var(--pink)'}">
        ${remaining !== null ? fmt(remaining) : '—'}</td>
    </tr>`;
  }).join('');
  const recentHours = timesheets.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10);
  const hoursRows = recentHours.length
    ? recentHours.map(t => `<tr><td>${t.date||'—'}</td><td>${t.project||'—'}</td><td style="color:var(--ink-4)">${t.notes||'—'}</td><td class="amount">${t.hours}h</td><td class="amount" style="color:var(--amber)">${fmt(t.hours*rate)}</td></tr>`).join('')
    : '<tr><td colspan="5"><div class="empty" style="padding:20px">No hours logged yet.</div></td></tr>';
  const totalQuoted = definedProjects.reduce((a,p)=>a+(p.quoted||0),0);
  const totalHoursAll = timesheets.reduce((a,t)=>a+(t.hours||0),0);
  const totalExpensesAll = expenses.reduce((a,e)=>a+(e.amount||0),0);
  document.getElementById('page-projects').innerHTML = `
    <div class="divider">Projects — All Active</div>
    <div class="kpi-grid">
      ${kpi('Tracked Projects', sorted.length, 'From logs + defined', 'highlight')}
      ${kpi('Total Quoted', fmt(totalQuoted), 'Defined projects only', '')}
      ${kpi('Hours Logged', totalHoursAll + 'h', 'All projects', '')}
      ${kpi('Expenses Logged', fmt(totalExpensesAll), 'All projects', 'warn')}
    </div>
    <div class="section">
      <div class="section-head"><h2>Project Overview</h2><span class="chart-clickable-hint">click a row for details</span></div>
      <table><thead><tr><th>Project</th><th>Status</th><th style="text-align:right">Quoted</th><th style="text-align:right">Hours</th><th style="text-align:right">Labour</th><th style="text-align:right">Expenses</th><th style="text-align:right">Remaining</th></tr></thead>
      <tbody>${projectRows || '<tr><td colspan="7"><div class="empty">No projects yet</div></td></tr>'}</tbody></table>
    </div>
    <div class="section">
      <div class="section-head"><h2>Recent Timesheet Entries</h2></div>
      <table><thead><tr><th>Date</th><th>Project</th><th>Notes</th><th style="text-align:right">Hours</th><th style="text-align:right">Value</th></tr></thead>
      <tbody>${hoursRows}</tbody></table>
    </div>`;
}

// ── Activity Log ──────────────────────────────────────────────────────────────
function renderLog() {
  const timesheets = D.timesheets || [];
  const expenses = D.expense_log || [];
  const rate = D.kpis.sebRate_per_hour || 100;
  const allEntries = [
    ...timesheets.map(t => ({type:'hours', date:t.date, text:`${t.hours}h on ${t.project}${t.notes?': '+t.notes:''}`, amount:t.hours*rate})),
    ...expenses.map(e => ({type:'expense', date:e.date, text:`${e.description}${e.category?' ('+e.category+')':''}`, amount:e.amount}))
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const entries = allEntries.length
    ? allEntries.map(e => `<div class="log-entry">
        <div class="log-dot ${e.type}"></div>
        <div class="log-text"><div>${e.text}</div><div class="log-date">${e.date||'—'}</div></div>
        <div class="log-amount">${e.type==='hours' ? e.amount/rate+'h' : fmt(e.amount)}</div>
      </div>`).join('')
    : `<div class="empty"><div class="empty-icon">💬</div><div>No activity logged yet.</div>

// ── Modals ────────────────────────────────────────────────────────────────────
function openModal(title, bodyHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); tsDismissPopup(); } });

function showProjectDetail(name) {
  const rate = D.kpis.sebRate_per_hour || 100;
  const ts = (D.timesheets||[]).filter(t=>t.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const exp = (D.expense_log||[]).filter(e=>e.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalHours = ts.reduce((a,t)=>a+(t.hours||0),0);
  const laborValue = totalHours * rate;
  const totalExpenses = exp.reduce((a,e)=>a+(e.amount||0),0);
  const defined = (D.projects||[]).find(p=>p.name===name);
  const quoted = defined && defined.quoted != null ? defined.quoted : null;
  const remaining = quoted != null ? quoted - laborValue - totalExpenses : null;
  const tsRows = ts.length
    ? ts.map(t=>`<tr><td>${t.date||'—'}</td><td>${t.employee||'Seb'}</td><td style="color:var(--ink-4)">${t.notes||'—'}</td><td class="amount">${t.hours}h</td><td class="amount" style="color:var(--amber)">${fmt(t.hours*rate)}</td></tr>`).join('')
      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${totalHours}h</td><td class="amount" style="color:var(--amber)">${fmt(laborValue)}</td></tr>`
    : `<tr><td colspan="5" style="text-align:center;color:var(--ink-4);padding:16px 0">No timesheet entries</td></tr>`;
  const expRows = exp.length
    ? exp.map(e=>`<tr><td>${e.date||'—'}</td><td style="color:var(--ink-4)">${e.description||'—'}</td><td>${e.category||'—'}</td><td class="amount">${fmt(e.amount)}</td></tr>`).join('')
      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${fmt(totalExpenses)}</td></tr>`
    : `<tr><td colspan="4" style="text-align:center;color:var(--ink-4);padding:16px 0">No expenses logged</td></tr>`;
  openModal(name, `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:20px">
      ${kpi('Quoted', quoted!=null?fmt(quoted):'TBD','',quoted?'highlight':'')}
      ${kpi('Labour',fmt(laborValue),totalHours+'h @ $'+rate+'/hr','')}
      ${kpi('Expenses',totalExpenses>0?fmt(totalExpenses):'$0','Materials & costs','')}
      ${kpi('Remaining',remaining!==null?fmt(remaining):'—','Budget left',remaining===null?'':remaining>=0?'good':'warn')}
    </div>
    <div style="margin-bottom:20px">
      <div class="divider" style="margin-top:0">Timesheets</div>
      <table><thead><tr><th>Date</th><th>By</th><th>Notes</th><th style="text-align:right">Hours</th><th style="text-align:right">Value</th></tr></thead><tbody>${tsRows}</tbody></table>
    </div>
    <div>
      <div class="divider">Expenses</div>
      <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>${expRows}</tbody></table>
    </div>`);
}

function showMonthDetail(idx) {
  const m = D.monthly;
  const label = m.labels[idx], period = m.periods[idx];
  const revenue = m.revenue[idx]||0, materials = (m.materials&&m.materials[idx])||0;
  const gp = revenue - materials, gpm = revenue > 0 ? gp/revenue*100 : 0;
  const rate = D.kpis.sebRate_per_hour || 100;
  const monthTs = (D.timesheets||[]).filter(t=>t.date&&t.date.startsWith(period)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const monthExp = (D.expense_log||[]).filter(e=>e.date&&e.date.startsWith(period)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const tsSection = monthTs.length ? `<div style="margin-bottom:20px">
    <div class="divider" style="margin-top:0">Hours Logged</div>
    <table><thead><tr><th>Date</th><th>Project</th><th>Notes</th><th style="text-align:right">Hours</th><th style="text-align:right">Value</th></tr></thead>
    <tbody>${monthTs.map(t=>`<tr><td>${t.date}</td><td>${t.project||'—'}</td><td style="color:var(--ink-4)">${t.notes||'—'}</td><td class="amount">${t.hours}h</td><td class="amount" style="color:var(--amber)">${fmt(t.hours*rate)}</td></tr>`).join('')}
    <tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${monthTs.reduce((a,t)=>a+(t.hours||0),0)}h</td><td class="amount" style="color:var(--amber)">${fmt(monthTs.reduce((a,t)=>a+(t.hours||0),0)*rate)}</td></tr>
    </tbody></table></div>` : '';
  const expSection = monthExp.length ? `<div>
    <div class="divider">Expenses Logged</div>
    <table><thead><tr><th>Date</th><th>Project</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead>
    <tbody>${monthExp.map(e=>`<tr><td>${e.date}</td><td>${e.project||'—'}</td><td style="color:var(--ink-4)">${e.description||'—'}</td><td class="amount">${fmt(e.amount)}</td></tr>`).join('')}
    <tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${fmt(monthExp.reduce((a,e)=>a+(e.amount||0),0))}</td></tr>
    </tbody></table></div>` : '';
  const noData = !monthTs.length&&!monthExp.length ? `<div class="empty" style="padding:28px 0">
    <div class="empty-icon">📅</div><div>No Claude-logged entries for this month.</div></div>` : '';
  openModal(label + ' ' + period.slice(0,4), `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:20px">
      ${kpi('Revenue',fmt(revenue),'Cash received (Xero)','highlight')}
      ${kpi('Materials',fmt(materials),'Direct costs (Xero)','')}
      ${kpi('Gross Profit',fmt(gp),pct(gpm)+' margin',gp>=0?'good':'warn')}
    </div>${tsSection}${expSection}${noData}`);
}

// ── TIMESHEETS TAB ────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════

const NON_BILLABLE = ['Admin','Office','Wasted time','Holidays','Sick days','Carer days'];

// NSW public holidays (no Bank Holidays — not applicable)
const NSW_HOLIDAYS = {
  '2025-01-01':'NYD','2025-01-27':'AUD','2025-04-18':'GFR','2025-04-19':'ESA',
  '2025-04-20':'ESU','2025-04-21':'EMO','2025-04-25':'ANZ','2025-06-09':'KBD',
  '2025-10-06':'LAB','2025-12-25':'CHR','2025-12-26':'BOX',
  '2026-01-01':'NYD','2026-01-26':'AUD','2026-04-03':'GFR','2026-04-04':'ESA',
  '2026-04-05':'ESU','2026-04-06':'EMO','2026-04-25':'ANZ','2026-06-08':'KBD',
  '2026-10-05':'LAB','2026-12-25':'CHR','2026-12-28':'BOX',
};

// 5 brand colours for active projects (cycles if more than 5)
const PROJ_PALETTE = ['#FFBE0B','#3A86FF','#05C46B','#8338EC','#FB5607'];
const PROJ_NB_COLOR = '#383838';   // non-billable grey
let PROJECT_COLOR_MAP = {};

let tsPlayer     = 'Seb';
let tsCalMonth   = new Date();
let tsRangeMode  = '2w';
let tsRangeFrom  = null;
let tsRangeTo    = null;

function ds(d) {
  // Use local date parts — avoids UTC offset shifting the date
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Returns today's date string in Sydney timezone (AEST/AEDT)
// More reliable than new Date() which can shift at day boundaries
function todayStrSydney() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
  // en-CA locale returns YYYY-MM-DD format
}

// Returns a Date object for the start of today in local/Sydney time
function todayMidnight() {
  const s = todayStrSydney();
  return new Date(s + 'T00:00:00');
}

function isWeekend(d) { const w=d.getDay(); return w===0||w===6; }
function isNSWHoliday(d) { return !!NSW_HOLIDAYS[ds(d)]; }
function isWorkday(d) { return !isWeekend(d) && !isNSWHoliday(d); }

function buildColorMap(timesheets, projects) {
  const active = new Set();
  (projects||[]).filter(p=>p.status==='Active').forEach(p=>active.add(p.name));
  (timesheets||[]).forEach(t=>{ if(t.project && !NON_BILLABLE.includes(t.project)) active.add(t.project); });
  const arr = [...active].sort();
  PROJECT_COLOR_MAP = {};
  arr.forEach((name,i) => { PROJECT_COLOR_MAP[name] = PROJ_PALETTE[i % PROJ_PALETTE.length]; });
  NON_BILLABLE.forEach(name => { PROJECT_COLOR_MAP[name] = PROJ_NB_COLOR; });
}

function getRange() {
  const today = todayMidnight();
  let from, to = new Date(today);
  if (tsRangeMode==='2w')      { from=new Date(today); from.setDate(from.getDate()-14); }
  else if (tsRangeMode==='1m') { from=new Date(today); from.setMonth(from.getMonth()-1); }
  else if (tsRangeMode==='3m') { from=new Date(today); from.setMonth(from.getMonth()-3); }
  else if (tsRangeMode==='1y') { from=new Date(today); from.setFullYear(from.getFullYear()-1); }
  else { from=tsRangeFrom?new Date(tsRangeFrom):new Date(today); to=tsRangeTo?new Date(tsRangeTo):new Date(today); }
  return { from, to };
}

function renderTimesheet() {
  if (!D) return;
  buildColorMap(D.timesheets, D.projects);

  const today = todayMidnight();
  const twoWeeksAgo = new Date(today); twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);
  const twelveMonthsAgo = new Date(today); twelveMonthsAgo.setFullYear(today.getFullYear()-1);

  const allTs = D.timesheets || [];
  const playerTs = allTs.filter(t => (t.employee||'Seb') === tsPlayer);

  // KPI 1: missing days in past 2 weeks
  let missingDays=0, availHrs=0, loggedHrs=0;
  for (let d=new Date(twoWeeksAgo); d<today; d.setDate(d.getDate()+1)) {
    if (!isWorkday(d)) continue;
    availHrs += 8;
    const dayH = playerTs.filter(t=>t.date===ds(d)).reduce((a,t)=>a+(t.hours||0),0);
    loggedHrs += dayH;
    if (dayH < 8) missingDays++;
  }
  const busyPct   = availHrs>0 ? loggedHrs/availHrs*100 : 0;
  const twoWeekTs = playerTs.filter(t=>t.date>=ds(twoWeeksAgo)&&t.date<ds(today));
  const nbHrs     = twoWeekTs.filter(t=>NON_BILLABLE.includes(t.project)).reduce((a,t)=>a+(t.hours||0),0);
  const nbPct     = availHrs>0 ? nbHrs/availHrs*100 : 0;
  const yearTs    = playerTs.filter(t=>t.date>=ds(twelveMonthsAgo));
  const holidayD  = yearTs.filter(t=>t.project==='Holidays').reduce((a,t)=>a+(t.hours||0)/8,0);
  const sickD     = yearTs.filter(t=>t.project==='Sick days').reduce((a,t)=>a+(t.hours||0)/8,0);

  // Players list
  const players = [...new Set(allTs.map(t=>t.employee).filter(Boolean))];
  if (!players.includes('Seb')) players.unshift('Seb');
  const playerOpts = players.map(p=>`<option value="${p}"${p===tsPlayer?' selected':''}>${p}</option>`).join('');

  // Range buttons
  const rangeBtns = [
    {v:'2w',l:'Last 2 weeks'},{v:'1m',l:'Last month'},{v:'3m',l:'Last quarter'},{v:'1y',l:'Last year'}
  ].map(r=>`<button class="ts-range-btn${tsRangeMode===r.v?' active':''}" onclick="tsSetRange('${r.v}')">${r.l}</button>`).join('');
  const customBtn = `<button class="ts-range-btn${tsRangeMode==='custom'?' active':''}" onclick="tsSetRange('custom')">Custom</button>`;
  const customInputs = tsRangeMode==='custom' ? `
    <input type="date" id="ts-from" value="${tsRangeFrom||''}" onchange="tsCustomRange()" max="${ds(today)}">
    <span style="color:var(--ink-4)">→</span>
    <input type="date" id="ts-to" value="${tsRangeTo||ds(today)}" onchange="tsCustomRange()" max="${ds(today)}">` : '';

  document.getElementById('page-timesheet').innerHTML = `
    <!-- KPIs -->
    <div class="kpi-grid">
      ${kpi('Missing Days', missingDays, 'Past 2 weeks · need input', missingDays>0?'warn':'good')}
      ${kpiBar('How Busy', busyPct.toFixed(0)+'%', loggedHrs.toFixed(0)+'h logged of '+availHrs+'h available', busyPct, 'highlight')}
      ${kpiBar('Non-Billable', nbHrs.toFixed(0)+'h', 'Admin, office, sick…', nbPct, '')}
      ${kpi('Holidays', holidayD.toFixed(1)+'d', 'Rolling 12 months', '')}
      ${kpi('Sick Days', sickD.toFixed(1)+'d', 'Rolling 12 months', '')}
    </div>

    <!-- Player filter -->
    <div class="ts-filter-bar">
      <label>Player</label>
      <select id="ts-player" onchange="tsChangePlayer(this.value)">${playerOpts}</select>
    </div>

    <!-- Calendar -->
    <div class="section">
      <div class="section-head">
        <button class="ts-nav-btn" onclick="tsNavMonth(-1)">←</button>
        <h2 id="ts-cal-title" style="flex:1;text-align:center"></h2>
        <button class="ts-nav-btn" onclick="tsNavMonth(1)">→</button>
      </div>
      <div id="ts-legend" class="ts-legend"></div>
      <div id="ts-calendar" class="ts-cal-grid"></div>
    </div>

    <!-- Second filter -->
    <div class="ts-range-bar">
      <span class="ts-range-label">Period</span>
      ${rangeBtns}${customBtn}${customInputs}
    </div>

    <!-- Treemap -->
    <div class="section">
      <div class="section-head"><h2>Time Distribution</h2><span class="chart-clickable-hint">click a block for name + hours</span></div>
      <div class="section-body" style="padding:12px">
        <div id="ts-treemap" style="min-height:140px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start"></div>
        <div id="ts-treemap-legend" style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="section">
      <div class="section-head"><h2>Timesheet Log</h2></div>
      <div id="ts-table"></div>
    </div>`;

  renderTsCalendar();
  renderTsTreemap();
  renderTsTable();
}

// ── Calendar ──────────────────────────────────────────────────────────────────
function renderTsCalendar() {
  const today = todayMidnight();
  const y = tsCalMonth.getFullYear(), mo = tsCalMonth.getMonth();

  const playerTs = (D.timesheets||[]).filter(t=>(t.employee||'Seb')===tsPlayer);

  // Build day lookup
  const dayMap = {};
  playerTs.forEach(t => {
    if (!dayMap[t.date]) dayMap[t.date] = [];
    dayMap[t.date].push({ project: t.project, hours: t.hours||0 });
  });

  document.getElementById('ts-cal-title').textContent =
    new Date(y,mo,1).toLocaleDateString('en-AU',{month:'long',year:'numeric'});

  // Legend — active projects seen in this month
  const activeInMonth = new Set();
  Object.entries(dayMap).forEach(([d, entries]) => {
    if (d.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)) {
      entries.forEach(e => { if (!NON_BILLABLE.includes(e.project)) activeInMonth.add(e.project); });
    }
  });
  const legend = document.getElementById('ts-legend');
  legend.innerHTML = [...activeInMonth].map(p =>
    `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJECT_COLOR_MAP[p]||'#666'}"></div>${p}</div>`
  ).join('') + (activeInMonth.size
    ? `<div class="ts-legend-item"><div class="ts-legend-dot" style="background:${PROJ_NB_COLOR}"></div>Non-billable</div>` : '');

  const firstDay = new Date(y, mo, 1);
  const lastDay  = new Date(y, mo+1, 0);
  let pad = firstDay.getDay() - 1; if (pad < 0) pad = 6;

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cal = document.getElementById('ts-calendar');

  let html = dayNames.map(d => `<div class="ts-day-hdr">${d}</div>`).join('');

  // Empty pad cells
  for (let i=0; i<pad; i++) html += `<div></div>`;

  for (let d=1; d<=lastDay.getDate(); d++) {
    const date = new Date(y, mo, d);
    const dStr = ds(date);
    const isFuture = date > today;
    const isGrey   = isWeekend(date) || isNSWHoliday(date) || isFuture;
    const hlabel   = NSW_HOLIDAYS[dStr];
    const entries  = dayMap[dStr] || [];
    const totalH   = entries.reduce((a,e)=>a+e.hours,0);
    const isPast   = date < today;
    const isMiss   = isPast && !isGrey && totalH === 0;
    const isOver   = totalH > 8;

    if (isGrey) {
      html += `<div class="ts-cell ts-cell-grey">
        <span class="ts-day-num" style="color:var(--ink-4)">${d}</span>
        ${hlabel ? `<span class="ts-day-label">${hlabel}</span>` : ''}
      </div>`;
      continue;
    }

    if (isMiss) {
      html += `<div class="ts-cell ts-cell-missing clickable" onclick="tsDayClick('${dStr}',event)" title="No hours logged — click to add">
        <span class="ts-day-num">${d}</span>
        <div class="ts-miss-dot"></div>
      </div>`;
      continue;
    }

    if (entries.length > 0) {
      // Stacked bar: segments bottom-up, sorted by hours desc (largest at bottom)
      const sorted = entries.slice().sort((a,b)=>b.hours-a.hours);
      const fillPct = Math.min(100, totalH/8*100);
      // Build segments as % of cell height
      let segsHtml = '';
      sorted.forEach(e => {
        const segH = (e.hours / Math.max(totalH, 0.01)) * fillPct;
        const col  = PROJECT_COLOR_MAP[e.project] || '#555';
        segsHtml += `<div class="ts-bar-seg" style="height:${segH.toFixed(1)}%;background:${col};opacity:.85"></div>`;
      });
      const borderStyle = isOver
        ? `2px solid ${PROJECT_COLOR_MAP[sorted[0].project]||'var(--amber)'}`
        : '1px solid var(--border)';
      html += `<div class="ts-cell clickable" style="border:${borderStyle}" onclick="tsDayClick('${dStr}',event)" title="${totalH}h logged">
        <span class="ts-day-num" style="position:relative;z-index:2">${d}</span>
        <div class="ts-bar-fill" style="position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column-reverse;height:100%">${segsHtml}</div>
      </div>`;
      continue;
    }

    // Today or future day within working week with no entries yet
    html += `<div class="ts-cell clickable" onclick="tsDayClick('${dStr}',event)" title="${dStr}">
      <span class="ts-day-num">${d}</span>
    </div>`;
  }

  cal.innerHTML = html;
}

// ── Day popup ─────────────────────────────────────────────────────────────────
function tsDayClick(dStr, ev) {
  const playerTs = (D.timesheets||[]).filter(t=>(t.employee||'Seb')===tsPlayer&&t.date===dStr);
  const totalH = playerTs.reduce((a,t)=>a+(t.hours||0),0);
  const sorted = playerTs.slice().sort((a,b)=>b.hours-a.hours);
  const dateLabel = new Date(dStr+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});

  let entriesHtml = '';
  if (sorted.length > 0) {
    // Visual bar + list
    entriesHtml = `<div style="margin-bottom:10px">
      <div style="height:8px;border-radius:4px;overflow:hidden;display:flex;margin-bottom:10px">
        ${sorted.map(t=>{
          const col = PROJECT_COLOR_MAP[t.project]||'#555';
          const w = totalH>0 ? t.hours/totalH*100 : 0;
          return `<div style="height:100%;width:${w}%;background:${col}"></div>`;
        }).join('')}
      </div>
      ${sorted.map(t=>{
        const col = PROJECT_COLOR_MAP[t.project]||'#555';
        return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:12px">
          <div style="width:3px;height:18px;border-radius:2px;background:${col};flex-shrink:0"></div>
          <div style="flex:1;color:var(--ink-2)">${t.project}</div>
          <div style="font-weight:700;color:var(--ink)">${t.hours}h</div>
        </div>`;
      }).join('')}
    </div>`;
  } else {
    entriesHtml = `<div style="color:var(--ink-4);font-size:12px;margin-bottom:10px">No hours logged</div>`;
  }

  const popup = document.getElementById('ts-popup');
  popup.innerHTML = `
    <div style="padding:12px 14px;border-bottom:1px solid var(--border)">
      <div style="font-size:13px;font-weight:700;color:var(--ink)">${dateLabel}</div>
      <div style="font-size:11px;color:var(--ink-4);margin-top:2px">${totalH>0?totalH+'h logged':'Nothing logged yet'}</div>
    </div>
    <div style="padding:12px 14px">${entriesHtml}</div>
    <div style="padding:10px 14px;border-top:1px solid var(--border)">
      <div style="font-size:10px;color:var(--ink-4);margin-bottom:6px;letter-spacing:.04em">ADD ENTRY (e.g. "4h Mark Nth Balgowlah")</div>
      <div style="display:flex;gap:6px">
        <input id="ts-input" type="text" placeholder="e.g. 3h Admin" style="flex:1;padding:7px 9px;border-radius:5px;border:1px solid var(--border-2);background:var(--bg-3);color:var(--ink);font-size:12px;outline:none">
        <button onclick="tsSubmitEntry('${dStr}')" style="padding:7px 12px;background:var(--amber);color:#000;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:.04em">Add</button>
      </div>
    </div>`;

  // Position popup centred on screen (works on mobile too)
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';

  document.getElementById('ts-popup-overlay').style.display = 'block';
  setTimeout(() => { const inp = document.getElementById('ts-input'); if (inp) inp.focus(); }, 50);
  ev && ev.stopPropagation();
}

function tsDismissPopup() {
  document.getElementById('ts-popup-overlay').style.display = 'none';
}

// ── Claude bar — voice + text → Netlify function → data.json ─────────────────
let recognition = null;
let micActive   = false;

function claudeSetState(state) {
  // states: idle | listening | processing
  const mic    = document.getElementById('claude-mic-btn');
  const inp    = document.getElementById('claude-bar-input');
  const btn    = document.getElementById('claude-send-btn');
  const status = document.getElementById('claude-bar-status');
  mic.className = '';
  if (state === 'listening') {
    mic.classList.add('listening');
    mic.textContent = '⏹';
    inp.disabled = true;
    btn.disabled = true;
    status.style.display = 'block';
    status.textContent = 'Listening…';
  } else if (state === 'processing') {
    mic.classList.add('processing');
    mic.textContent = '⏳';
    inp.disabled = true;
    btn.disabled = true;
    status.style.display = 'block';
    status.textContent = 'Parsing…';
  } else {
    mic.textContent = '🎤';
    inp.disabled = false;
    btn.disabled = false;
    status.style.display = 'none';
    status.textContent = '';
  }
}

function claudeMicToggle() {
  if (micActive) { recognition && recognition.stop(); return; }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    claudeToast('Microphone not supported in this browser', 'error'); return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'en-AU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => { micActive = true; claudeSetState('listening'); };

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('claude-bar-input').value = transcript;
    micActive = false;
    claudeBarSend();
  };

  recognition.onerror = (e) => {
    micActive = false;
    claudeSetState('idle');
    if (e.error !== 'aborted') claudeToast('Mic error: ' + e.error, 'error');
  };

  recognition.onend = () => { micActive = false; };

  recognition.start();
}

async function claudeBarSend() {
  const inp  = document.getElementById('claude-bar-input');
  const text = inp.value.trim();
  if (!text) return;

  claudeSetState('processing');

  try {
    const res = await fetch('/.netlify/functions/claude-parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();

    claudeSetState('idle');

    if (data.status === 'success') {
      inp.value = '';
      const e = data.entry;
      const t = data.type || (e && e.type) || '';
      let msg = '';
      if (t === 'timesheet')        msg = `✓ Logged ${e.hours}h · ${e.project} · ${e.date}`;
      else if (t === 'expense')     msg = `✓ Logged $${e.amount} · ${e.description.slice(0,35)}`;
      else if (t === 'delete_timesheet' || t === 'delete_expense') msg = `🗑 Deleted · ${data.label}`;
      else if (t === 'edit_timesheet' || t === 'edit_timesheets' || t === 'edit_by_date' || t === 'edit_by_date_multi') msg = `✏ Updated · ${data.label}`;
      else msg = `✓ ${data.label || 'Done'}`;
      claudeToast(msg, 'success');

      // Optimistic update: apply entry directly to in-memory D and re-render immediately.
      // No need to wait and re-fetch — the function already confirmed the commit.
      if (D) {
        if (t === 'timesheet') {
          D.timesheets = D.timesheets || [];
          D.timesheets.push(e);
        } else if (t === 'expense') {
          D.expense_log = D.expense_log || [];
          D.expense_log.push(e);
        } else if (t === 'delete_timesheet' && data.deleted) {
          D.timesheets = (D.timesheets||[]).filter(ts => ts.id !== data.deleted.id);
        } else if (t === 'delete_expense' && data.deleted) {
          // Remove by matching key fields since we don't have a stable id
          D.expense_log = (D.expense_log||[]).filter(ex =>
            !(ex.date === data.deleted.date && ex.description === data.deleted.description && ex.amount === data.deleted.amount));
        } else if (t === 'edit_timesheet' && data.updated) {
          const idx = (D.timesheets||[]).findIndex(ts => ts.id === data.updated.id);
          if (idx !== -1) D.timesheets[idx] = data.updated;
        } else if ((t === 'edit_timesheets' || t === 'edit_by_date' || t === 'edit_by_date_multi') && data.updated) {
          const updatedArr = Array.isArray(data.updated) ? data.updated : [data.updated];
          updatedArr.forEach(u => {
            const idx = (D.timesheets||[]).findIndex(ts => ts.id === u.id);
            if (idx !== -1) D.timesheets[idx] = u;
          });
        }
        renderAll();
        // Also re-render timesheet tab if it's active, since renderAll doesn't always call it
        if (document.getElementById('page-timesheet').classList.contains('active')) renderTimesheet();
      }

    } else if (data.status === 'unclear') {
      claudeToast('❓ ' + (data.message || 'Could not understand — try again'), 'unclear');
    } else {
      claudeToast('⚠ ' + (data.message || 'Something went wrong'), 'error');
    }

  } catch (err) {
    claudeSetState('idle');
    claudeToast('⚠ Connection error — try again', 'error');
  }
}

function claudeToast(msg, type='success') {
  const t = document.getElementById('claude-toast');
  t.textContent = msg;
  t.className = type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, type === 'success' ? 3000 : 4500);
}

// Popup "Add" button — prefix with DATE: so Haiku always uses the calendar date
function tsSubmitEntry(dStr) {
  const val = (document.getElementById('ts-input')||{}).value||'';
  if (!val.trim()) return;
  tsDismissPopup();
  // DATE: prefix is explicitly parsed by the Netlify function as override date
  document.getElementById('claude-bar-input').value = `DATE:${dStr} ${val.trim()}`;
  claudeBarSend();
}

// Enter key on bar
document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('claude-bar-input');
  if (inp) inp.addEventListener('keydown', e => { if (e.key==='Enter') claudeBarSend(); });

// ── Treemap ───────────────────────────────────────────────────────────────────
function renderTsTreemap() {
  const { from, to } = getRange();
  const playerTs = (D.timesheets||[]).filter(t => {
    return (t.employee||'Seb')===tsPlayer && t.date>=ds(from) && t.date<=ds(to);
  });

  // Available workday hours in range
  let avail = 0;
  for (let d=new Date(from); d<=to; d.setDate(d.getDate()+1)) {
    if (isWorkday(d)) avail += 8;
  }

  // Group by project
  const byProj = {};
  playerTs.forEach(t => { byProj[t.project] = (byProj[t.project]||0)+(t.hours||0); });
  const total = playerTs.reduce((a,t)=>a+(t.hours||0),0);
  const missing = Math.max(0, avail-total);

  const items = Object.entries(byProj)
    .sort((a,b)=>b[1]-a[1])
    .map(([name,hrs]) => ({ name, hrs, color: PROJECT_COLOR_MAP[name]||'#555', isGap:false }));
  if (missing>0.5) items.push({ name:'Not logged', hrs:missing, color:'rgba(255,0,110,0.12)', isGap:true });

  const tmTotal = avail || total || 1;
  const tmEl = document.getElementById('ts-treemap');
  const lgEl = document.getElementById('ts-treemap-legend');
  if (!tmEl) return;

  tmEl.innerHTML = items.map(item => {
    const share = item.hrs/tmTotal;
    if (share < 0.005) return '';
    const basis = Math.max(50, share*800);
    return `<div
      onclick="tsTmTip(this,'${item.name.replace(/'/g,"\\'")}',${item.hrs})"
      style="flex-grow:${share*100};flex-shrink:0;flex-basis:${basis}px;min-height:70px;
             background:${item.color};border-radius:5px;cursor:pointer;
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             border:${item.isGap?'1px dashed rgba(255,0,110,0.35)':'none'};
             padding:6px;text-align:center;position:relative;overflow:hidden">
      <div style="font-size:10px;font-weight:700;color:${item.isGap?'#FF006E':'rgba(0,0,0,0.8)'};line-height:1.3;word-break:break-word">${item.name}</div>
      <div style="font-size:13px;font-weight:700;color:${item.isGap?'#FF006E':'rgba(0,0,0,0.9)'}">${item.hrs.toFixed(0)}h</div>
    </div>`;
  }).join('');

  lgEl.innerHTML = items.map(i =>
    `<div class="ts-legend-item">
      <div class="ts-legend-dot" style="background:${i.color};border:${i.isGap?'1px dashed rgba(255,0,110,.5)':'none'}"></div>
      <span>${i.name} — ${i.hrs.toFixed(0)}h</span>
    </div>`
  ).join('');
}

function tsTmTip(el, name, hrs) {

  const tip = document.createElement('div');

function xeroConnect() {
  const state = Math.random().toString(36).substring(2);
  localStorage.setItem('xero_state', state);
  window.location.href = 'https://login.xero.com/identity/connect/authorize'
    + '?response_type=code&client_id=' + XERO_CLIENT_ID
    + '&redirect_uri=' + encodeURIComponent(XERO_REDIRECT_URI)
    + '&scope=' + encodeURIComponent(XERO_SCOPES)
    + '&state=' + state;
}

function xeroDisconnect() {
  ['xero_access_token','xero_refresh_token','xero_tenant_id','xero_org_name','xero_token_expiry','xero_state'].forEach(k => localStorage.removeItem(k));
  updateXeroBtn();
}

async function getXeroToken() {
  const expiry = parseInt(localStorage.getItem('xero_token_expiry')||'0');
  if (Date.now() < expiry - 60000) return localStorage.getItem('xero_access_token');
  const refresh_token = localStorage.getItem('xero_refresh_token');
  if (!refresh_token) return null;
  try {
    const res = await fetch('/.netlify/functions/xero-auth', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'refresh', refresh_token})
    });
    const tokens = await res.json();
    if (tokens.error) throw new Error(JSON.stringify(tokens.error));
    localStorage.setItem('xero_access_token', tokens.access_token);
    if (tokens.refresh_token) localStorage.setItem('xero_refresh_token', tokens.refresh_token);
    localStorage.setItem('xero_token_expiry', Date.now() + (tokens.expires_in * 1000));
    return tokens.access_token;
  } catch(e) { console.error('Xero token refresh failed:', e); return null; }
}

async function xeroApiCall(endpoint, method='GET', body=null) {
  const token = await getXeroToken();
  if (!token) throw new Error('Not connected to Xero');
  const res = await fetch('/.netlify/functions/xero-api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({endpoint, method, body, access_token:token, tenant_id:localStorage.getItem('xero_tenant_id')})
  });
  return res.json();
}

function updateXeroBtn() {
  const btn = document.getElementById('xero-btn');
  if (!btn) return;
  const connected = !!localStorage.getItem('xero_access_token');
  const org = localStorage.getItem('xero_org_name') || 'Xero';
  const syncBtn = document.getElementById('xero-sync-btn');
  if (connected) {
    btn.textContent = '⚡ ' + org;
    btn.style.borderColor = 'rgba(5,196,107,.4)';
    btn.style.color = '#05C46B';
    btn.onclick = () => { if (confirm('Disconnect from Xero?')) xeroDisconnect(); };
    if (syncBtn) syncBtn.style.display = '';
  } else {
    btn.textContent = '⚡ Connect Xero';
    btn.style.borderColor = '';
    btn.style.color = '';
    btn.onclick = xeroConnect;
    if (syncBtn) syncBtn.style.display = 'none';
  }
}

let QUOTES_LIVE = null;

function detectCategory(text) {
  const t = (text || '').toLowerCase();
  if (/paling|picket|pool fence|boundary fence|timber fence|\bfenc/.test(t)) return 'Fencing';
  if (/\bdeck\b|decking/.test(t)) return 'Decking';
  if (/pergola|carport|gazebo|shade structure/.test(t)) return 'Pergola & Carport';
  if (/timber floor|floorboard|flooring|floor board/.test(t)) return 'Flooring';
  if (/handrail|balustrade|staircase|\bstair/.test(t)) return 'Handrails & Stairs';
  if (/cladding|weatherboard|lining board/.test(t)) return 'Cladding';
  if (/wardrobe|cabinet|joinery|built.in|built in/.test(t)) return 'Joinery & Built-ins';
  if (/\bshelf\b|shelving|bookcase/.test(t)) return 'Shelving';
  if (/\bdoor\b|\bwindow\b/.test(t)) return 'Doors & Windows';
  if (/retaining|garden bed|planter|landscape/.test(t)) return 'Garden & Landscaping';
  if (/\bframe\b|stud wall|partition/.test(t)) return 'Framing';
  if (/repair|replace|\bfix\b|patch|maintenance/.test(t)) return 'Repairs & Maintenance';
  return 'General Carpentry';
}

async function loadXeroQuotes() {
  const statusEl = document.getElementById('quotes-status');
  const btn = document.getElementById('load-quotes-btn');
  if (!localStorage.getItem('xero_access_token')) {
    statusEl.innerHTML = '<span style="color:var(--pink)">⚠ Connect Xero first</span>';

  setStatus('Connecting to Xero…');
  try {

    while (true) {
      setStatus(`Fetching page ${page} · ${allQuotes.length} quotes…`);

      const batch = res.Quotes || [];

function renderQuotesData(quotes) {
  quotes = quotes || [];
  const enriched = quotes.map(q => {
    const lineItems = (q.line_items || q.LineItems || []).filter(li => (li.desc || li.Description||'').trim());
    const allDesc = lineItems.map(li => (li.desc || li.Description||'') + ' ' + (li.ItemCode||'')).join(' ');
    const total = Math.abs(q.total || q.SubTotal || q.Total || 0);
    return { number: q.number||q.QuoteNumber||'—', contact: q.contact||(q.Contact?q.Contact.Name:'—'),
      date: (q.date||q.DateString||q.Date||'').slice(0,10), status: q.status||q.Status||'—',
      total, category: detectCategory(allDesc), lineItems, _raw: q };
  });
  const byCategory = {};
  enriched.forEach(q => {
    if (!byCategory[q.category]) byCategory[q.category] = { quotes:[], total:0, amounts:[] };
    byCategory[q.category].quotes.push(q);
    byCategory[q.category].total += q.total;
    byCategory[q.category].amounts.push(q.total);
  });
  const categories = Object.entries(byCategory)
    .sort((a,b) => b[1].quotes.length - a[1].quotes.length)
    .map(([cat, d]) => {
      const sorted = d.amounts.filter(v=>v>0).sort((a,b)=>a-b);
      return { cat, count:d.quotes.length, total:d.total, avg:d.total/d.quotes.length,
        min:sorted[0]||0, max:sorted[sorted.length-1]||0,
        samples:d.quotes.slice(0,2).map(q=>q.contact.split(' ')[0]).join(', ') };
    });
  const accepted = enriched.filter(q=>['INVOICED','ACCEPTED'].includes(q.status)).length;
  const totalValue = enriched.reduce((a,q)=>a+q.total,0);
  const avgValue = totalValue / (quotes.length||1);
  const statusBadge = s => {
    const map = {INVOICED:'badge-green',SENT:'badge-blue',ACCEPTED:'badge-green',DECLINED:'badge-red',DRAFT:'badge-gray',DELETED:'badge-gray'};
    return `<span class="badge ${map[s]||'badge-gray'}">${s}</span>`;
  };
  const catRows = categories.map(c => `
    <tr onclick="showCategoryDetail('${c.cat.replace(/'/g,"\\\'")}')" style="cursor:pointer">
      <td><strong>${c.cat}</strong></td>
      <td style="text-align:right">${c.count}</td>
      <td class="amount" style="color:var(--ink-4);font-size:12px">${fmt(c.min)} – ${fmt(c.max)}</td>
      <td class="amount" style="color:var(--amber);font-weight:700">${fmt(c.avg)}</td>
      <td class="amount">${fmt(c.total)}</td>
      <td style="font-size:11px;color:var(--ink-4)">${c.samples}</td>
    </tr>`).join('');
  const recentRows = enriched.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(q => `
    <tr>
      <td style="font-size:12px;color:var(--ink-4)">${q.number}</td>
      <td style="font-size:12px;color:var(--ink-4)">${q.date}</td>
      <td>${q.contact}</td>
      <td><span class="badge badge-gray" style="font-size:10px">${q.category}</span></td>
      <td class="amount">${fmt(q.total)}</td>
      <td>${statusBadge(q.status)}</td>
    </tr>`).join('');
  document.getElementById('quotes-content').innerHTML = `
    <div class="kpi-grid">
      ${kpi('Total Quotes', quotes.length, 'All time', 'highlight')}
      ${kpi('Won / Invoiced', accepted, 'Accepted + Invoiced', 'good')}
      ${kpi('Win Rate', pct(accepted/(quotes.length||1)*100), 'Of all quotes sent', '')}
      ${kpi('Avg Quote Value', fmt(avgValue), 'Excl. GST', '')}
      ${kpi('Total Quoted', fmt(totalValue), 'All time', '')}
      ${kpi('Job Categories', categories.length, 'Auto-detected', '')}
    </div>
    <div class="section">
      <div class="section-head"><h2>Pricing Benchmarks by Job Type</h2><span class="chart-clickable-hint">click a row for line item patterns</span></div>
      <table><thead><tr>
        <th>Job Type</th><th style="text-align:right">Quotes</th><th style="text-align:right">Range</th>
        <th style="text-align:right">Avg Value</th><th style="text-align:right">Total</th><th>Sample Clients</th>
      </tr></thead><tbody>${catRows}</tbody></table>
    </div>
    <div class="section">
      <div class="section-head"><h2>All Quotes — Most Recent 60</h2></div>
      <table><thead><tr><th>Number</th><th>Date</th><th>Client</th><th>Job Type</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
      <tbody>${recentRows}</tbody></table>
    </div>`;
}

function showCategoryDetail(cat) {
  const quotesSource = (D && D.quotes && D.quotes.length) ? D.quotes : QUOTES_LIVE;
  if (!quotesSource) return;
  const catQuotes = quotesSource.map(q => {
    const lineItems = (q.line_items||q.LineItems||[]).filter(li=>(li.desc||li.Description||'').trim());
    const allDesc = lineItems.map(li=>(li.desc||li.Description||'')+(li.ItemCode||'')).join(' ');
    return { ...q, _cat:detectCategory(allDesc), _total:Math.abs(q.total||q.SubTotal||q.Total||0), _lineItems:lineItems };
  }).filter(q=>q._cat===cat).sort((a,b)=>b._total-a._total);
  const freq = {};
  catQuotes.forEach(q => {
    (q._lineItems||[]).forEach(li => {
      const desc = (li.desc||li.Description||'').trim();
      if (!desc||desc.length<4) return;
      if (!freq[desc]) freq[desc]={count:0,unitAmounts:[],qtys:[],lineAmounts:[]};
      freq[desc].count++;
      const unit=li.unit!=null?li.unit:li.UnitAmount, qty=li.qty!=null?li.qty:li.Quantity, line=li.total!=null?li.total:li.LineAmount;
      if (unit!=null) freq[desc].unitAmounts.push(Math.abs(unit));
      if (qty!=null)  freq[desc].qtys.push(Math.abs(qty));
      if (line!=null) freq[desc].lineAmounts.push(Math.abs(line));
    });
  });
  const topItems = Object.entries(freq).sort((a,b)=>b[1].count-a[1].count).slice(0,20);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const itemRows = topItems.map(([desc,d]) => {
    const avgUnit=avg(d.unitAmounts), avgQty=avg(d.qtys), avgLine=avg(d.lineAmounts);
    return `<tr>
      <td style="font-size:12px;max-width:260px;line-height:1.4">${desc}</td>
      <td style="text-align:right;font-size:12px">${d.count}×</td>
      <td class="amount" style="font-size:12px">${avgQty!==null?avgQty.toFixed(1):'—'}</td>
      <td class="amount" style="color:var(--amber);font-weight:700">${avgUnit!==null?fmt(avgUnit,2):'—'}</td>
      <td class="amount" style="font-size:12px">${avgLine!==null?fmt(avgLine):'—'}</td>
    </tr>`;
  }).join('');
  const statusMap={INVOICED:'badge-green',SENT:'badge-blue',ACCEPTED:'badge-green',DECLINED:'badge-red',DRAFT:'badge-gray'};
  const quoteRows = catQuotes.slice(0,15).map(q => {
    const num=q.number||q.QuoteNumber||'—', date=(q.date||q.DateString||'').slice(0,10);
    const client=q.contact||(q.Contact?q.Contact.Name:'—'), st=q.status||q.Status||'—';
    return `<tr><td style="font-size:12px;color:var(--ink-4)">${num}</td><td style="font-size:12px;color:var(--ink-4)">${date}</td><td>${client}</td><td class="amount">${fmt(q._total)}</td><td><span class="badge ${statusMap[st]||'badge-gray'}">${st}</span></td></tr>`;
  }).join('');
  const vals = catQuotes.map(q=>q._total).filter(v=>v>0);
  openModal(cat + ' — Pricing Intelligence', `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:20px">
      ${kpi('Quotes',catQuotes.length,'In this category','highlight')}
      ${kpi('Avg Value',fmt(avg(vals)),'Excl. GST','')}
      ${kpi('Min',fmt(Math.min(...vals)||0),'Smallest','')}
      ${kpi('Max',fmt(Math.max(...vals)||0),'Largest','')}
    </div>
    ${topItems.length ? `
    <div class="divider" style="margin-top:0">Common Line Items — Unit Rate Benchmarks</div>
    <table><thead><tr>
      <th>Description</th><th style="text-align:right">Used</th><th style="text-align:right">Avg Qty</th>
      <th style="text-align:right">Avg Unit $</th><th style="text-align:right">Avg Line $</th>
    </tr></thead><tbody>${itemRows}</tbody></table>
    <div style="padding:10px;margin:8px 0 20px;background:var(--bg-3);border-radius:5px;font-size:11px;color:var(--ink-4);line-height:1.6">
      ⓘ <strong style="color:var(--ink-3)">Avg Unit $</strong> = what you typically charge per unit. Your pricing benchmark for this job type.
    </div>` : ''}
    <div class="divider">Quotes in This Category</div>
    <table><thead><tr><th>Number</th><th>Date</th><th>Client</th><th style="text-align:right">Amount</th><th>Status</th></tr></thead>
    <tbody>${quoteRows}</tbody></table>
    ${catQuotes.length>15?`<div style="padding:10px 14px;font-size:11px;color:var(--ink-4)">+ ${catQuotes.length-15} more quotes in this category</div>`:''}`);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if (window.location.search.includes('xero=connected')) history.replaceState({}, '', '/');
updateXeroBtn();
loadData();
</script>
</body>
</html>
