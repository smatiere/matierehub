      <strong style="white-space:nowrap;color:${pr.v ? 'var(--ink-1)' : 'var(--ink-4)'}">${pr.kind === 'leave' ? '' : (pr.v ? fmt(pr.v) : '$0')} ›</strong></div>`;
  }).join('');
  const col = pfColor(pfStatusClass(d.value, bench)), diff = d.value - bench;
  openModal(label, note + (d.hours ? `
    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
      ${kpi('Margin', fmt(d.value), '', '')}
      ${kpi('Hours', +d.hours.toFixed(1) + 'h', d.idle ? +d.idle.toFixed(1) + 'h earned nothing' : '', '')}
      <div class="kpi"><div class="kpi-label">vs benchmark</div><div class="kpi-value" style="color:${col}">${diff >= 0 ? '+' : '−'}${fmt(Math.abs(diff))}</div><div class="kpi-sub">${fmt(bench)} = 8h</div></div>
    </div>` : '') + `<div style="font-size:11px;color:var(--ink-4);margin-bottom:8px">Tap a job to open its card</div>${rows}`);
}

// ── chart series ─────────────────────────────────────────────────────────────
function pfSeries() {
  const days = PF.days || {}, bench = pfBench(), view = PF.view, today = ymd(new Date());
  const keys = Object.keys(days).sort();
  const firstDay = keys[0] || today;
  const span = PF.range === 0 ? Math.max(14, Math.round((pd(today) - pd(firstDay)) / 864e5) + 1) : PF.range;
  const win = view === 'day' ? 7 : view === 'week' ? 4 : 3;
  const sumRange = (a, b) => { let v = 0, h = 0, wd = 0; for (let d = a; d <= b; d = addD(d, 1)) { const x = days[d]; if (x) { v += x.value; h += x.hours; } if (pfIsWorkday(d)) wd++; } return { v, h, wd }; };
  const all = [];
  if (view === 'day') {
    for (let d = addD(today, -(span - 1 + 14)); d <= today; d = addD(d, 1)) {
      if (!pfIsWorkday(d)) continue;
      const x = days[d];
      all.push({ date: d, label: pd(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }), title: pd(d).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' }), v: x ? x.value : 0, bench });
    }
  } else if (view === 'week') {
    const n = Math.ceil(span / 7) + win;
    for (let i = n - 1; i >= 0; i--) {
      const a = addD(mondayOf(today), -7 * i), s = sumRange(a, addD(a, 6));
      all.push({ date: a, label: pd(a).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }), title: 'Week of ' + pd(a).toLocaleDateString('en-AU', { day: 'numeric', month: 'long' }), v: s.v, bench: bench * s.wd });
    }
  } else {
    const n = Math.max(1, Math.ceil(span / 30.4)) + win, now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const f = new Date(now.getFullYear(), now.getMonth() - i, 1), l = new Date(f.getFullYear(), f.getMonth() + 1, 0), s = sumRange(ymd(f), ymd(l));
      all.push({ date: ymd(f), label: f.toLocaleDateString('en-AU', { month: 'short', year: '2-digit' }), title: f.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }), v: s.v, bench: bench * s.wd });
    }
  }
  // smooth trend: rolling mean over the previous `win` buckets (7 working days when daily)
  all.forEach((b, i) => { const from = Math.max(0, i - win + 1), seg = all.slice(from, i + 1); b.trend = seg.reduce((a, x) => a + x.v, 0) / seg.length; });
  let shown;
  if (view === 'day') { const cut = addD(today, -(span - 1)); shown = all.filter(b => b.date >= cut); }
  else { const keep = view === 'week' ? Math.ceil(span / 7) : Math.max(1, Math.ceil(span / 30.4)); shown = all.slice(-keep); }
  return { shown, win };
}

function pfDrawChart() {
  const canvas = document.getElementById('pf-chart');
  if (!canvas) return;
  destroyChart('pf-chart');
  const { shown: b, win } = pfSeries(), n = b.length;
  if (!n) return;
  const first = b[0].trend, last = b[n - 1].trend, delta = last - first;
  const unit = { day: 'day', week: 'week', month: 'month' }[PF.view];
  const cap = document.getElementById('pf-trend');
  if (cap) cap.innerHTML = `<span class="pf-key"><i style="background:#9AA0A6"></i> ${win}-${unit} smooth trend</span> ${n > 1 ? `<strong style="color:${delta >= 0 ? '#34D399' : '#FF5D73'}">${delta >= 0 ? '▲ up' : '▼ down'} ${fmt(Math.abs(delta))}</strong> over this period · average ${fmt(b.reduce((a, x) => a + x.v, 0) / n)} per ${unit}` : ''}`;
  const grad = (ctx, c) => {
    const a = ctx.chart.chartArea; if (!a) return c;
    const g = ctx.chart.ctx.createLinearGradient(0, a.bottom, 0, a.top);
    g.addColorStop(0, c + '33'); g.addColorStop(1, c + 'EE'); return g;
  };
  charts['pf-chart'] = new Chart(canvas.getContext('2d'), {
    data: {
      labels: b.map(x => x.label),
      datasets: [
        { type: 'bar', label: 'Margin', data: b.map(x => Math.round(x.v)), order: 3, borderRadius: { topLeft: 6, topRight: 6 }, borderSkipped: false, maxBarThickness: 34,
          backgroundColor: ctx => { const x = b[ctx.dataIndex]; return grad(ctx, pfColor(pfStatusClass(x ? x.v : 0, x ? x.bench : pfBench()))); } },
        { type: 'line', label: 'Benchmark', data: b.map(x => x.bench), order: 2, borderColor: '#FFBE0B', borderWidth: 1.25, borderDash: [5, 5], pointRadius: 0, stepped: true },
        { type: 'line', label: 'Trend', data: b.map(x => Math.round(x.trend)), order: 1, borderColor: '#E8EAED', borderWidth: 2.5, tension: 0.45, cubicInterpolationMode: 'monotone', pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: '#fff' },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      layout: { padding: { top: 6, right: 4 } },
      animation: { duration: 500 },
      plugins: {
        legend: { align: 'start', labels: { color: '#9AA0A6', usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, font: { size: 11 } } },
        tooltip: {
          backgroundColor: 'rgba(20,20,20,.96)', borderColor: 'rgba(255,255,255,.12)', borderWidth: 1, padding: 12, cornerRadius: 10, displayColors: false,
          titleColor: '#fff', bodyColor: '#C9CDD2', titleFont: { size: 12, weight: '700' }, bodyFont: { size: 12 },
          callbacks: {
            title: items => b[items[0].dataIndex].title,
            label: c => c.dataset.label === 'Margin' ? `Margin  ${fmt(c.raw)}` : c.dataset.label === 'Trend' ? `${win}-${unit} trend  ${fmt(c.raw)}` : null,
            afterBody: items => { const x = b[items[0].dataIndex], d = x.v - x.bench; return [`${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))} vs benchmark ${fmt(x.bench)}`]; },
          },
        },
      },
      scales: {
        x: { ticks: { color: '#7B8087', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 }, grid: { display: false }, border: { display: false } },
        y: { ticks: { color: '#7B8087', font: { size: 10 }, callback: v => pfShort(v), maxTicksLimit: 6 }, grid: { color: 'rgba(255,255,255,.06)', drawTicks: false }, border: { display: false } },
      },
    },
  });
}

// ── analysis window, job highlights, smart reading ──────────────────────────
function pfWindow() {
  const today = ymd(new Date()), t = new Date(), w = PF.win;
  const monthEnd = (y, m) => ymd(new Date(y, m + 1, 0));
  if (w === 'm0') return { from: ymd(new Date(t.getFullYear(), t.getMonth(), 1)), to: today, label: t.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }) };
  if (w === 'm1') { const f = new Date(t.getFullYear(), t.getMonth() - 1, 1); return { from: ymd(f), to: monthEnd(f.getFullYear(), f.getMonth()), label: f.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }) }; }
  if (w === 'q') return { from: ymd(new Date(t.getFullYear(), t.getMonth() - 2, 1)), to: today, label: 'the last 3 months' };
  if (w === 's') return { from: ymd(new Date(t.getFullYear(), t.getMonth() - 5, 1)), to: today, label: 'the last 6 months' };
  if (w === 'y') return { from: ymd(new Date(t.getFullYear() - 1, t.getMonth() + 1, 1)), to: today, label: 'the last 12 months' };
  if (/^ym:/.test(w)) { const [y, m] = w.slice(3).split('-').map(Number), f = new Date(y, m - 1, 1); return { from: ymd(f), to: monthEnd(y, m - 1), label: f.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' }) }; }
  const keys = Object.keys(PF.days || {}).sort();
  return { from: keys[0] || today, to: today, label: 'since the beginning' };
}

function pfScopeText(name) {
  const def = (D.projects || []).find(p => p.name === name) || {};
  const q = (D.quote_items || []).filter(x => (x.project || '').trim() === name).map(x => x.description || '').join(' ');
  const i = (D.invoice_items || []).filter(x => (x.project || '').trim() === name).map(x => x.description || '').join(' ');
  return { byName: name.toLowerCase(), byScope: (String(def.baseline_scope || '') + ' ' + q + ' ' + i).toLowerCase() };
}
function pfType(name) {
  const s = pfScopeText(name);
  for (const [t, re] of PF_TYPES) if (re.test(s.byName)) return t;
  for (const [t, re] of PF_TYPES) if (re.test(s.byScope)) return t;
  return 'Other work';
}

function pfAnalyse() {
  const win = pfWindow(), rate = pfRate();
  const jobs = {}; let idle = 0, idleBy = {}, unbilledH = 0, totalH = 0, totalV = 0;
  (PF.entries || []).forEach(e => {
    if (e.date < win.from || e.date > win.to || e.kind === 'leave') return;
    totalH += e.h;
    if (e.kind === 'idle') { idle += e.h; idleBy[e.project || '(no job)'] = (idleBy[e.project || '(no job)'] || 0) + e.h; return; }
    const j = jobs[e.project] || (jobs[e.project] = { name: e.project, h: 0, v: 0, sales: false });
    j.h += e.h; j.v += e.v; if (e.kind === 'sales') j.sales = true; else unbilledH += e.h;
    totalV += e.v;
  });
  const P = {}; PROJ_SORTED.forEach(p => P[p.name] = p);
  const list = Object.values(jobs).map(j => {
    const p = P[j.name] || {}, def = (D.projects || []).find(x => x.name === j.name) || {};
    const sales = (PF.basis === 'paid' ? (p.linkedPaidValue || 0) : (p.linkedInvValue || 0)) + (p.manualRev || 0);
    return Object.assign(j, { perH: j.h ? j.v / j.h : 0, status: def.status || p.status || '', sales$: sales, exp: p.expensesTotal || 0,
      matShare: sales > 0 ? (p.expensesTotal || 0) / sales : null, type: pfType(j.name),
      baseH: def.baseline_labour_hours != null ? Number(def.baseline_labour_hours) : null, allH: p.hours || 0 });
  });
  return { win, list, idle, idleBy, unbilledH, totalH, totalV, rate };
}

function pfJobRow(j, rate) {
  const safe = j.name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const pct = Math.max(0, Math.min(100, j.perH / (rate * 2) * 100));
  const col = j.sales ? (j.perH >= rate ? '#34D399' : j.perH >= rate * 0.875 ? '#FFA94D' : '#FF5D73') : '#7B8087';
  return `<div class="pf-job" onclick="showProjectDetail('${safe}')">
    <div class="pf-job-top"><strong>${attrEsc(j.name)}</strong><span style="color:${col};font-weight:700">${j.sales ? fmt(j.perH) + '/h' : 'no sales yet'}</span></div>
    <div class="pf-bar"><i style="width:${j.sales ? pct : 0}%;background:${col}"></i></div>
    <div class="pf-job-sub">${+j.h.toFixed(1)}h · ${fmt(j.v)} margin${j.matShare != null ? ' · materials ' + Math.round(j.matShare * 100) + '% of sales' : ''} · ${j.type}</div></div>`;
}

function pfInsights(a) {
  const { list, rate } = a, bill = list.filter(j => j.sales && j.h >= 1);
  const avg = bill.reduce((s, j) => s + j.v, 0) / (bill.reduce((s, j) => s + j.h, 0) || 1);
  const types = {};
  bill.forEach(j => { const t = types[j.type] || (types[j.type] = { type: j.type, jobs: 0, h: 0, v: 0, sales: 0, exp: 0, over: [] }); t.jobs++; t.h += j.h; t.v += j.v; t.sales += j.sales$; t.exp += j.exp;
    if (j.baseH && j.allH) t.over.push(j.allH / j.baseH - 1); });
  const T = Object.values(types).map(t => Object.assign(t, { perH: t.v / t.h, mat: t.sales ? t.exp / t.sales : 0, size: t.sales / t.jobs, over: t.over.length ? t.over.reduce((s, x) => s + x, 0) / t.over.length : null }));
  const ranked = T.filter(t => t.h >= 8).sort((x, y) => y.perH - x.perH);
  const win = [], fix = [];
  if (ranked.length) {
    const b = ranked[0];
    win.push(`<strong>${b.type}</strong> is your strongest work: ${fmt(b.perH)} an hour over ${b.jobs} job${b.jobs > 1 ? 's' : ''}${avg ? ` (${b.perH >= avg ? Math.round((b.perH / avg - 1) * 100) + '% above' : 'near'} your ${fmt(avg)} average)` : ''}. Quote more of it and protect its price.`);
    if (ranked.length > 1) { const w = ranked[ranked.length - 1];
      if (w.perH < rate) fix.push(`<strong>${w.type}</strong> earns only ${fmt(w.perH)} an hour over ${w.jobs} job${w.jobs > 1 ? 's' : ''}, under your ${fmt(rate)}/h nominal rate. Raise the price per hour on the next quote${w.mat > 0.35 ? ', and add margin on materials' : ''}.`);
      else if (w.perH < avg * 0.85) fix.push(`<strong>${w.type}</strong> sits ${Math.round((1 - w.perH / avg) * 100)}% below your average (${fmt(w.perH)}/h). Worth pricing a little higher.`); }
    ranked.filter(t => t.mat > 0.4 && t.perH < avg).forEach(t => fix.push(`<strong>${t.type}</strong>: materials are ${Math.round(t.mat * 100)}% of what you bill. Mark up supplies or ask for deposits to cover them.`));
    ranked.filter(t => t.over != null && t.over > 0.15).forEach(t => fix.push(`<strong>${t.type}</strong> jobs run ${Math.round(t.over * 100)}% over the hours you quoted. Allow more labour time in these quotes.`));
    ranked.filter(t => t.over != null && t.over < -0.1 && t.perH >= avg).slice(0, 1).forEach(t => win.push(`<strong>${t.type}</strong> comes in ${Math.round(-t.over * 100)}% under the hours you quoted, so your estimating is sharp here.`));
  }
  const small = bill.filter(j => j.sales$ && j.sales$ < 1500), big = bill.filter(j => j.sales$ >= 3000);
  if (small.length >= 2 && big.length >= 2) {
    const sp = small.reduce((s, j) => s + j.v, 0) / small.reduce((s, j) => s + j.h, 0), bp = big.reduce((s, j) => s + j.v, 0) / big.reduce((s, j) => s + j.h, 0);
    if (sp < bp * 0.85) fix.push(`Small jobs (under $1,500) earn ${fmt(sp)}/h against ${fmt(bp)}/h on jobs over $3,000. Consider a call-out minimum.`);
    else if (sp > bp * 1.15) win.push(`Small jobs (under $1,500) earn ${fmt(sp)}/h, more than big jobs at ${fmt(bp)}/h. They are worth keeping.`);
  }
  if (a.totalH && a.idle / a.totalH > 0.08) {
    const top = Object.entries(a.idleBy).sort((x, y) => y[1] - x[1]).slice(0, 2).map(([k, v]) => `${k} ${+v.toFixed(1)}h`).join(', ');
    fix.push(`${Math.round(a.idle / a.totalH * 100)}% of your hours (${+a.idle.toFixed(1)}h) earned nothing (${top}). At the benchmark that is about ${fmt(a.idle * rate)} of margin.`);
  } else if (a.totalH && a.idle > 0) win.push(`Only ${Math.round(a.idle / a.totalH * 100)}% of your hours were non-billable. That is healthy.`);
  if (a.unbilledH >= 4) fix.push(`${+a.unbilledH.toFixed(1)}h are on jobs with no sales linked yet. Link or raise the invoices so the margin shows.`);
  return { win, fix, T: T.sort((x, y) => y.perH - x.perH), avg };
}

function pfAnalysisHtml() {
  const a = pfAnalyse(), ins = pfInsights(a), rate = a.rate;
  const withSales = a.list.filter(j => j.sales && j.h >= 4);
  const high = withSales.filter(j => j.perH >= rate).sort((x, y) => y.perH - x.perH).slice(0, 5);
  const low = a.list.filter(j => (j.sales && j.h >= 4 && j.perH < rate) || (!j.sales && j.h >= 2))
    .sort((x, y) => (x.sales ? x.perH : -1) - (y.sales ? y.perH : -1)).slice(0, 5);
  const months = [...new Set(Object.keys(PF.days || {}).map(d => d.slice(0, 7)))].sort().reverse();
  const sel = `<select onchange="pfSetWin(this.value)" class="pf-sel" aria-label="Pick a month"><option value="">Pick a month…</option>${months.map(m => `<option value="ym:${m}"${PF.win === 'ym:' + m ? ' selected' : ''}>${new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })}</option>`).join('')}</select>`;
  const chips = PF_WINS.map(([v, l]) => `<span class="hub-pill-btn${PF.win === v ? ' active' : ''}" onclick="pfSetWin('${v}')">${l}</span>`).join('');
  const list = (arr, empty) => arr.length ? arr.map(s => `<li>${s}</li>`).join('') : `<li style="color:var(--ink-4)">${empty}</li>`;
  const tbl = ins.T.length ? `<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr><th>Type of work</th><th style="text-align:right">Jobs</th><th style="text-align:right">Hours</th><th style="text-align:right">Margin/h</th><th style="text-align:right">Materials</th></tr></thead><tbody>${ins.T.map(t => `<tr><td>${t.type}</td><td class="amount">${t.jobs}</td><td class="amount">${+t.h.toFixed(0)}</td><td class="amount" style="color:${t.perH >= rate ? '#34D399' : t.perH >= rate * 0.875 ? '#FFA94D' : '#FF5D73'};font-weight:700">${fmt(t.perH)}</td><td class="amount">${Math.round(t.mat * 100)}%</td></tr>`).join('')}</tbody></table></div>` : '';
  return `
    <div class="section">
      <div class="section-head" style="gap:10px;flex-wrap:wrap"><h2>Period for the sections below</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${chips}${sel}</div></div>
      <div style="padding:2px 14px 14px;font-size:12px;color:var(--ink-4)">Showing ${a.win.label}: ${+a.totalH.toFixed(0)}h worked, ${fmt(a.totalV)} margin.</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Jobs to watch</h2><span class="chart-clickable-hint">margin per hour · benchmark ${fmt(rate)}/h · tap a job</span></div>
      <div class="pf-two">
        <div><div class="pf-sub" style="color:#34D399">▲ Doing well</div>${high.map(j => pfJobRow(j, rate)).join('') || '<div class="pf-empty-note">Not enough billed hours in this period.</div>'}</div>
        <div><div class="pf-sub" style="color:#FF5D73">▼ Needs attention</div>${low.map(j => pfJobRow(j, rate)).join('') || '<div class="pf-empty-note">Nothing to flag.</div>'}
          ${a.idle ? `<div class="pf-job" style="cursor:default"><div class="pf-job-top"><strong>Non-billable time</strong><span style="color:#FF5D73;font-weight:700">$0/h</span></div><div class="pf-job-sub">${+a.idle.toFixed(1)}h (${Object.entries(a.idleBy).sort((x, y) => y[1] - x[1]).map(([k, v]) => k + ' ' + +v.toFixed(1) + 'h').join(', ')}) · costs about ${fmt(a.idle * rate)} at the benchmark</div></div>` : ''}</div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h2>What the numbers say</h2><span class="chart-clickable-hint">read from job names and scope-of-work text</span></div>
      <div class="pf-two" style="margin-bottom:6px">
        <div class="pf-card" style="border-color:#34D39955"><div class="pf-sub" style="color:#34D399">Keep doing</div><ul>${list(ins.win, 'Not enough data in this period to call a winner.')}</ul></div>
        <div class="pf-card" style="border-color:#FFA94D55"><div class="pf-sub" style="color:#FFA94D">Improve</div><ul>${list(ins.fix, 'Nothing stands out. Margins look steady.')}</ul></div>
      </div>
      ${tbl}
      <div style="font-size:11px;color:var(--ink-4);padding:10px 14px 14px">Jobs are grouped by keywords in their name and quote text (for example deck, fence, cabinet). This is a rule-based reading, not a prediction. Types need at least 8 hours in the period to be ranked.</div>
    </div>`;
}

function pfRender() {
  const page = document.getElementById('page-performance');
  if (!page || !D) return;
  const days = pfCompute(), bench = pfBench(), today = ymd(new Date());
  if (!PF.month) PF.month = today.slice(0, 7);
  const [y, m] = PF.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1), count = new Date(y, m, 0).getDate(), lead = (first.getDay() + 6) % 7;
  let total = 0, worked = 0, okDays = 0, hrs = 0, cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="pf-cell pf-blank"></div>';
  for (let d = 1; d <= count; d++) {
    const date = PF.month + '-' + pad2(d), x = days[date];
    if (x && x.hours > 0) { total += x.value; hrs += x.hours; worked++; if (x.value >= bench) okDays++; }
    cells += pfDayCell(date, bench, today);
  }
  const monthName = first.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  const avg = worked ? total / worked : 0;
  const pill = (arr, cur, fn) => arr.map(([v, l]) => `<span class="hub-pill-btn${v === cur ? ' active' : ''}" onclick="${fn}(${typeof v === 'string' ? `'${v}'` : v})">${l}</span>`).join('');
  page.innerHTML = `
    <div class="divider">Performance — Operating margin per day</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px"><span style="font-size:11px;color:var(--ink-4);margin-right:4px">Sales counted:</span>${pill([['invoiced','Invoiced'],['paid','Paid only']], PF.basis, 'pfSetBasis')}<span style="font-size:11px;color:var(--ink-4)">${PF.basis === 'paid' ? 'only money actually received' : 'everything invoiced, paid or not'}</span></div>
    <div class="kpi-grid">
      ${kpi(monthName, fmt(total), 'margin this month', 'highlight')}
      ${kpi('Average per worked day', fmt(avg), worked + ' day' + (worked === 1 ? '' : 's') + ' worked', worked ? (avg >= bench ? 'good' : 'warn') : '')}
      ${kpi('Days on benchmark', worked ? okDays + ' of ' + worked : '—', 'at or above ' + fmt(bench), '')}
      ${kpi('Margin per hour', hrs ? fmt(total / hrs) : '—', 'nominal $' + pfRate() + '/h · idle time included', hrs && total / hrs >= pfRate() ? 'good' : hrs ? 'warn' : '')}
    </div>
    <div class="section">
      <div class="section-head" style="gap:10px;flex-wrap:wrap">
        <h2>${monthName}</h2>
        <div style="display:flex;gap:6px"><span class="hub-pill-btn" onclick="pfMonthShift(-1)" aria-label="Previous month">‹</span><span class="hub-pill-btn" onclick="PF.month=null;pfRender()">Today</span><span class="hub-pill-btn" onclick="pfMonthShift(1)" aria-label="Next month">›</span></div>
      </div>
      <div class="pf-grid pf-head"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="pf-grid">${cells}</div>
      <div class="pf-legend"><i class="pf-ok"></i> ${fmt(bench)}+ <i class="pf-near"></i> ${fmt(pfNear())}–${fmt(bench)} <i class="pf-low"></i> below <span>★ public holiday</span> <span>🌴 leave</span> <span>tap any day for its jobs</span></div>
    </div>
    <div class="section">
      <div class="section-head" style="gap:10px;flex-wrap:wrap">
        <h2>Margin over time</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(PF_RANGES, PF.range, 'pfSetRange')}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">${pill(PF_VIEWS, PF.view, 'pfSetView')}</div>
      </div>
      <div class="pf-chartbox"><canvas id="pf-chart"></canvas></div>
      <div id="pf-trend" class="pf-trend"></div>
    </div>
    ${pfAnalysisHtml()}
    <div style="font-size:11px;color:var(--ink-4);padding:0 4px 20px;line-height:1.5">
      Left out of this page: ${PF_EXCLUDE.map(attrEsc).join(', ')} (time tracking started near the end of the job, so its hours are mostly missing). Its sales and hours are unchanged everywhere else.<br>
      How it works: for each job, (sales − expenses) is the money left to pay labour and profit. It is spread over every hour worked on that job, then added up per day, week and month. Sales = linked invoices + cash. Time on non-billable work (Admin, Wasted Time…) counts as hours earning $0. Holidays and sick days are leave and never count against you. Public holidays are NSW.
    </div>`;
  pfDrawChart();
}

function kpi(label, value, sub, style='') {
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}

// Actual / quoted tile with a small coloured difference (green on or under, amber a
// little over, red well over). With no quoted figure it just shows the actual.
function projVsTile(label, actual, quoted, sub) {
  if (quoted == null || !(quoted > 0)) return kpi(label, fmt(actual), sub, '');
  const d = actual - quoted, over = d / quoted * 100;
  const col = over <= 0 ? 'var(--sage)' : over <= 10 ? 'var(--amber)' : 'var(--pink)';
  const diff = (d > 0 ? '+' : d < 0 ? '−' : '') + fmt(Math.abs(d)) + (d > 0 ? ' over' : d < 0 ? ' under' : ' on quote');
  return `<div class="kpi"><div class="kpi-label">${label}</div>
    <div class="kpi-value">${fmt(actual)} <span style="font-size:13px;font-weight:400;color:var(--ink-4)">/ ${fmt(quoted)}</span></div>
    <div class="kpi-sub" style="color:${col};font-weight:600">${diff}</div>
    <div class="kpi-sub">${sub}</div></div>`;
}
// Remaining = estimate minus labour and expenses, with its share of the job.
function projMarginColor(pct) { return pct == null ? 'var(--ink-4)' : pct >= 30 ? 'var(--sage)' : pct >= 10 ? 'var(--amber)' : 'var(--pink)'; }
function projRemainingTile(remaining, pct) {
  if (remaining == null) return kpi('Remaining', '—', 'Needs an estimate', '');
  const col = projMarginColor(pct);
  return `<div class="kpi"><div class="kpi-label">Remaining</div>
    <div class="kpi-value" style="color:${col}">${remaining < 0 ? '−' : ''}${fmt(Math.abs(remaining))}</div>
    <div class="kpi-sub" style="color:${col};font-weight:600">${pct != null ? pct.toFixed(0) + '% of the job' : ''}</div></div>`;
}

function kpiBar(label, value, sub, fillPct, style='') {
  const w = Math.min(100, Math.max(0, fillPct||0));
  return `<div class="kpi ${style}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
    <div class="mini-bar"><div class="mini-bar-fill" style="width:${w}%"></div></div>
  </div>`;
}

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

// ── Projects ──────────────────────────────────────────────────────────────────
// 2026-06-30 batch: trimmed table columns (ID/Project/Contact/Est. Value/Invoiced/
// Labour/Expenses/Profitability/Adj rate), sortable+filterable, default Active-only
// filter, Est. Value now derived from hand-linked quote_items (falls back to the
// manual `quoted` figure). Dropped columns (Players, Quote No., Quote Item,
// Description, Start, End, Span, Dilution) are NOT discarded — they still surface
// inside showProjectDetail(). The old inline Non-Billable expandable row is gone;
// Non-Billable projects now live in their own window — see showNonBillableWindow().
let projSortCol      = null;
let projSortDir      = 'asc';
let projFilterText   = '';
const PROJ_STATUS_ORDER = ['Active','Won','Finished','Quoted','Paid','Inactive','Lost'];
let projStatusSel    = new Set(['Active','Won','Finished']);   // default: chase payments + jobs to schedule
let PROJ_SORTED       = [];        // cached billable rows for projRenderRows() (avoids re-aggregating per keystroke)

// 'Quoted' added 2026-09-18 — set automatically when a quote is approved via
// the Xero MCP connector (job-status baseline feature); still hand-changeable
// like any other status via the pills in showProjectDetail().
const PROJECT_STATUSES   = ['Quoted','Won','Active','Finished','Paid','Inactive','Lost'];
const PROJ_STATUS_BADGE  = { Won:'badge-green', Lost:'badge-red', Quoted:'badge-purple', Active:'badge-green', Finished:'badge-blue', Paid:'badge-amber', Inactive:'badge-gray' };

function projStatusBadge(status) {
  const s = status || 'Active';
  return `<span class="badge ${PROJ_STATUS_BADGE[s]||'badge-gray'}" style="font-size:9px">${s}</span>`;
}

// Clickable status pills — used at the top of the project detail modal.
function projStatusPills(name, current) {
  const safe = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return PROJECT_STATUSES.map(s => {
    const isActive = s === (current || 'Active');
    const cls = PROJ_STATUS_BADGE[s];
    return `<span onclick="projSetStatus('${safe}','${s}')" class="badge ${cls}" style="cursor:pointer;font-size:10px;${isActive ? 'box-shadow:0 0 0 2px var(--ink) inset;' : 'opacity:.45'}">${s}</span>`;
  }).join(' ');
}

async function projSetStatus(name, status) {
  try {
    let proj = (D.projects||[]).find(p => p.name === name);
    if (!proj) proj = await hubCreateProject(name);
    const row = await hubWrite('projects', proj.id, { status });
    Object.assign(proj, row);
    claudeToast('✓ Status set to ' + status, 'success');
    showProjectDetail(name);
    renderProjects(D.kpis);
  } catch (e) { claudeToast('⚠ ' + (e.message||'Status update failed'), 'error'); }
}

function renderProjects(k) {
  const definedProjects = D.projects || [];
  const timesheets      = D.timesheets || [];
  const expenses        = D.expense_log || [];
  const invoiceItems    = D.invoice_items || [];
  const quoteItems      = D.quote_items || [];
  const rate            = k.sebRate_per_hour || 100;

  // ── Lookup helpers ────────────────────────────────────────────────────────
  const definedMap = {};
  definedProjects.forEach(p => { definedMap[p.name] = p; });

  const allNames = new Set(definedProjects.map(p => p.name));
  timesheets.forEach(t => t.project && allNames.add(t.project));
  expenses.forEach(e => e.project && allNames.add(e.project));

  // Working days Mon–Fri between two YYYY-MM-DD strings (inclusive)
  function workingDays(start, end) {
    if (!start || !end) return null;
    const s = new Date(start + 'T00:00:00');
    const e = new Date(end   + 'T00:00:00');
    let count = 0;
    const d = new Date(s);
    while (d <= e) {
      const dow = d.getDay();
      if (dow > 0 && dow < 6) count++;
      d.setDate(d.getDate() + 1);
    }
    return count || 1;   // minimum 1 so same-day projects don't divide by zero
  }

  // ── Build per-project aggregates ──────────────────────────────────────────
  const pData = {};
  allNames.forEach(name => {
    const def = definedMap[name] || {};
    pData[name] = {
      id: def.id || '—', name,
      status: def.status || 'Active',
      quoted: def.quoted != null ? def.quoted : null,
      // stored links (exact, from Supabase projects table)
      storedContactId:  def.contact_id   || null,
      // fallback fuzzy key (first segment of project name)
      clientName: name.split(' - ')[0].trim(),
      hours: 0, laborValue: 0,
      players: new Set(),
      dates: [],
      expensesTotal: 0,
      invoicedValue: 0,
      linkedQuoteValue: 0,
      quoteNumbers: new Set(),
      invoiceContactName: null,
    };
  });

  timesheets.forEach(t => {
    if (!t.project || !pData[t.project]) return;
    const p = pData[t.project];
    p.hours      += (t.hours || 0);
    p.laborValue += (t.hours || 0) * rate;
    if (t.employee) p.players.add(t.employee);
    if (t.date) p.dates.push(t.date);
  });

  expenses.forEach(e => {
    if (!e.project || !pData[e.project]) return;
    pData[e.project].expensesTotal += (e.amount || 0);
  });

  // Match invoice_items → projects
  // Feature 3 — an invoice line item with an explicit `project` link is attributed
  // ONLY to that project, and such projects are EXCLUDED from the client-name
  // auto-match (manual picks override auto-match). Projects with no explicit links
  // keep the original behaviour: exact contact_id match > fuzzy client-name match.
  const linkedNames = new Set();
  invoiceItems.forEach(ii => {
    const lp = (ii.project || '').trim();
    if (lp && pData[lp]) linkedNames.add(lp);
  });
  quoteItems.forEach(qi => {
    const lp = (qi.project || '').trim();
    if (lp && pData[lp]) linkedNames.add(lp);
  });
  invoiceItems.forEach(ii => {
    const lp = (ii.project || '').trim();
    if (lp && pData[lp]) {                       // explicit link wins
      const p = pData[lp];
      p.invoicedValue += (ii.price_excl_gst || 0);
      p.linkedInvValue = (p.linkedInvValue || 0) + (ii.price_excl_gst || 0);
      p.linkedPaidValue = (p.linkedPaidValue || 0) + (Number(ii.paid) || 0);
      p.linkedCount = (p.linkedCount || 0) + 1;
      if (ii.quote_number) p.quoteNumbers.add(ii.quote_number);
      if (ii.contact && !p.invoiceContactName) p.invoiceContactName = ii.contact;
    }
  });

  // Fuzzy auto-match by client name/contact — only for projects with zero
  // explicit hand-links. Brings just the single most recent invoice per client,
  // not every invoice ever billed to them — see projAutoMatchInvoices for why.
  Object.values(pData).forEach(p => {
    if (linkedNames.has(p.name)) return;          // curated project → auto-match off
    const matches = projAutoMatchInvoices(p.name, definedMap[p.name]);
    matches.forEach(ii => {
      p.invoicedValue += (ii.price_excl_gst || 0);
      if (ii.quote_number) p.quoteNumbers.add(ii.quote_number);
      if (!p.invoiceContactName) p.invoiceContactName = ii.contact;
    });
  });

  // 2026-06-30 — hand-linked quote line items roll up into Est. Value. A project
  // with linked quote_items uses their summed line_amount as Est. Value; the
  // manual `quoted` figure is the fallback for projects with no quote linked.
  quoteItems.forEach(qi => {
    const lp = (qi.project || '').trim();
    if (!lp || !pData[lp]) return;
    pData[lp].linkedQuoteValue += (qi.line_amount || 0);
    pData[lp].linkedQuoteCount = (pData[lp].linkedQuoteCount || 0) + 1;
    if (qi.quote_number) pData[lp].quoteNumbers.add(qi.quote_number);
  });

  // Feature 3 — manual cash revenue per project (used when no Xero invoice exists).
  // Always additive, independent of quotes/invoices.
  Object.values(pData).forEach(p => {
    p.manualRev = projManualRev(definedMap[p.name]);
    p.invoicedValue += p.manualRev;
    // 2026-07-09 fix: take the LARGER of the linked-quote total and the manual
    // estimate, never just the linked-quote total on its own. A project can have
    // several Xero quotes (variations, add-ons) and the invoice→quote auto-cascade
    // (see autoLinkQuotesFromInvoices) links whichever quote number happens to be
    // on a linked invoice — that can be a small variation quote, not the main one.
    // Blindly trusting it as Est. Value silently wiped a real $39,450 manual
    // estimate down to $8,135 on a live project the first time this ran. Manual
    // Est. Value now acts as a floor; clear it to $0 if a linked quote should win.
    // Value of a job: picked quote lines, else the manual estimate, else what was
    // really billed (linked invoices + cash) when there was never a quote.
    const billed = (p.linkedInvValue || 0) + p.manualRev;
    p.estValue = p.linkedQuoteValue > 0 ? p.linkedQuoteValue : (p.quoted > 0 ? p.quoted : (billed > 0 ? billed : null));
    const dd = definedMap[p.name] || {};
    p.quotedLabour = dd.baseline_labour_hours != null ? Number(dd.baseline_labour_hours) * rate : null;
    p.quotedMaterials = dd.baseline_materials_estimate != null ? Number(dd.baseline_materials_estimate) : null;
  });

  // ── Derive final metrics per project ─────────────────────────────────────
  const sorted = Object.values(pData).map(p => {
    const sortedDates = [...p.dates].sort();
    const startDate   = sortedDates[0] || null;
    const endDate     = sortedDates[sortedDates.length - 1] || null;
    const span        = workingDays(startDate, endDate);

    const hasInv = p.invoicedValue > 0;
    const profit       = hasInv ? p.invoicedValue - p.expensesTotal - p.laborValue : null;
    const profitPct    = hasInv && p.invoicedValue ? profit / p.invoicedValue * 100 : null;
    const adjRate      = hasInv && p.hours > 0 ? (p.invoicedValue - p.expensesTotal) / p.hours : null;
    const hrPerDay     = span && p.hours > 0 ? p.hours / span : null;
    const dilutionPct  = hrPerDay != null ? (hrPerDay / 8) * 100 : null;

    // Contact display: prefer the name resolved from stored contact_id match,
    // then from fuzzy match, then fall back to client name extracted from project name
    const contactDisplay = p.invoiceContactName || p.clientName;

    return {
      ...p,
      players: [...p.players],
      quoteNums: [...p.quoteNumbers],
      contactDisplay,
      startDate, endDate, span,
      profit, profitPct, adjRate, hrPerDay, dilutionPct,
    };
  });

  // ── Summary KPIs (always over ALL billable projects, unaffected by table filters) ──
  const billableAll     = sorted.filter(p => !isNonBillable(p.name));
  const nbAll           = sorted.filter(p =>  isNonBillable(p.name));
  const totalQuoted     = billableAll.reduce((a,p)=>a+(p.estValue||0),0);
  const totalHoursAll   = timesheets.reduce((a,t)=>a+(t.hours||0),0);
  const totalExpAll     = expenses.reduce((a,e)=>a+(e.amount||0),0);
  const totalInvoicedAll= billableAll.reduce((a,p)=>a+p.invoicedValue,0);
  const totalLabourAll  = totalHoursAll * rate;
  const totalProfitAll  = totalInvoicedAll > 0 ? totalInvoicedAll - totalExpAll - totalLabourAll : null;
  const nbHoursAll      = nbAll.reduce((a,p)=>a+p.hours,0);

  PROJ_SORTED = billableAll;

  document.getElementById('page-projects').innerHTML = `
    <div class="divider">Projects — Performance Analysis</div>
    <div class="kpi-grid">
      ${kpi('Projects', billableAll.length, 'Active + closed', 'highlight')}
      ${kpi('Total Est. Value', fmt(totalQuoted), 'Quoted or manually entered', '')}
      ${kpi('Total Invoiced', fmt(totalInvoicedAll), 'Matched from Xero', 'good')}
      ${kpi('Total Hours', totalHoursAll.toFixed(1) + 'h', 'All projects', '')}
      ${kpi('Labour Value', fmt(totalLabourAll), 'At $' + rate + '/hr', '')}
      ${kpi('Gross Profit', totalProfitAll !== null ? fmt(totalProfitAll) : '—',
             totalProfitAll !== null ? (totalProfitAll >= 0 ? '+' : '') + (totalInvoicedAll > 0 ? (totalProfitAll/totalInvoicedAll*100).toFixed(1) : '0') + '% margin' : 'Need invoiced data',
             totalProfitAll === null ? '' : totalProfitAll >= 0 ? 'good' : 'warn')}
      <div class="kpi" style="cursor:pointer" onclick="showNonBillableWindow()" title="Open the Non-Billable window">
        <div class="kpi-label">Non-Billable</div>
        <div class="kpi-value">${nbHoursAll.toFixed(0)}h</div>
        <div class="kpi-sub">${nbAll.length} categories · click to open →</div>
      </div>
    </div>
    <div class="section">
      <div class="section-head" style="flex-wrap:wrap;gap:10px">
        <h2>Project Table</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input id="proj-filter-text" value="${attrEsc(projFilterText)}" oninput="projSetFilter(this.value)" placeholder="Search ID, name or contact…" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:12px;width:200px">
        </div>
        <div id="proj-status-chips" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%">${projStatusChips()}</div>
        <span class="chart-clickable-hint">click a row for full detail · values excl. GST</span>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <table class="proj-table" style="font-size:12px">
          <thead><tr>
            ${projHeader('id','ID')}
            ${projHeader('name','Project')}
            ${projHeader('contact','Contact')}
            ${projHeader('estValue','Est. Value', true)}
            ${projHeader('invoicedValue','Invoiced', true)}
            ${projHeader('laborValue','Labour', true)}
            ${projHeader('expensesTotal','Expenses', true)}
            ${projHeader('profit','Profitability', true)}
            ${projHeader('adjRate','Adj rate', true)}
          </tr></thead>
          <tbody id="proj-tbody"></tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--ink-4);padding:10px 14px;border-top:1px solid var(--border)">
        Est. Value = sum of hand-linked quote line items, else the manually entered figure ·
        Invoiced = hand-linked invoice line items (if any) else Xero lines matched by client name, plus any manual revenue ·
        Profitability = Invoiced − Expenses − Labour · Adj rate = (Invoiced − Expenses) ÷ Hrs ·
        click a column heading to sort
      </div>
    </div>`;

  projRenderRows();
}

function projHeader(col, label, right) {
  const active = projSortCol === col;
  const arrow = active ? (projSortDir === 'asc' ? ' ▲' : ' ▼') : '';
  return `<th class="${col==='name'?'':'pc-hide-sm'}" style="${right?'text-align:right;':''}cursor:pointer;white-space:nowrap;user-select:none" onclick="projSort('${col}')">${label}${arrow}</th>`;
}

function projSort(col) {
  if (projSortCol === col) projSortDir = projSortDir === 'asc' ? 'desc' : 'asc';
  else { projSortCol = col; projSortDir = 'asc'; }
  renderProjects(D.kpis);
}

function projSetFilter(v) {
  projFilterText = v || '';
  projRenderRows();
}

// Tag-style status filter: tap tags to include/exclude, All and None to reset.
function projStatusChips() {
  const chip = (label, on, fn, cls) => `<span onclick="${fn}" class="hub-pill-btn${on?' active':''}" style="cursor:pointer;padding:5px 11px;font-size:12px;${cls||''}">${label}</span>`;
  return PROJ_STATUS_ORDER.map(s => chip(s, projStatusSel.has(s), `projToggleStatus('${s}')`)).join('')
    + chip('All', projStatusSel.size === PROJ_STATUS_ORDER.length, `projStatusAll()`, 'margin-left:6px')
    + chip('None', projStatusSel.size === 0, `projStatusNone()`);
}
function projRefreshChips() {
  const el = document.getElementById('proj-status-chips');
  if (el) el.innerHTML = projStatusChips();
  projRenderRows();
}
function projToggleStatus(s) { projStatusSel.has(s) ? projStatusSel.delete(s) : projStatusSel.add(s); projRefreshChips(); }
function projStatusAll()  { projStatusSel = new Set(PROJ_STATUS_ORDER); projRefreshChips(); }
function projStatusNone() { projStatusSel = new Set(); projRefreshChips(); }

const PROJ_SORT_KEYS = {
  id:            p => parseInt(String(p.id).replace(/\D/g,''),10) || 0,
  name:          p => p.name.toLowerCase(),
  contact:       p => (p.contactDisplay||'').toLowerCase(),
  estValue:      p => p.estValue != null ? p.estValue : -Infinity,
  invoicedValue: p => p.invoicedValue,
  laborValue:    p => p.laborValue,
  expensesTotal: p => p.expensesTotal,
  profit:        p => p.profit != null ? p.profit : -Infinity,
  adjRate:       p => p.adjRate != null ? p.adjRate : -Infinity,
};

// Light tbody-only re-render — used by the search box on every keystroke so the
// input never loses focus (mirrors the existing pd-link-search pattern).
function projRenderRows() {
  const tbody = document.getElementById('proj-tbody');
  if (!tbody) return;
  const dash = '<span style="color:var(--ink-4)">—</span>';
  const q = projFilterText.trim().toLowerCase();
  const rate = (D.kpis && D.kpis.sebRate_per_hour) || 100;

  let list = PROJ_SORTED.filter(p => {
    if (!projStatusSel.has(p.status || 'Active')) return false;
    if (q && !(`${p.id} ${p.name} ${p.contactDisplay}`.toLowerCase().includes(q))) return false;
    return true;
  });

  if (projSortCol) {
    const keyFn = PROJ_SORT_KEYS[projSortCol];
    if (keyFn) {
      list = [...list].sort((a,b) => {
        const av = keyFn(a), bv = keyFn(b);
        if (av < bv) return projSortDir === 'asc' ? -1 : 1;
        if (av > bv) return projSortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }
  } else {
    list = [...list].sort((a, b) => {
      const sa = PROJ_STATUS_ORDER.indexOf(a.status || 'Active'), sb = PROJ_STATUS_ORDER.indexOf(b.status || 'Active');
      if (sa !== sb) return sa - sb;
      const aD = (D.projects||[]).some(x=>x.name===a.name) ? 0 : 1;
      const bD = (D.projects||[]).some(x=>x.name===b.name) ? 0 : 1;
      if (aD !== bD) return aD - bD;
      if (a.startDate && b.startDate) return b.startDate.localeCompare(a.startDate);
      return a.name.localeCompare(b.name);
    });
  }

  function pc(v, pos='var(--sage)', neg='var(--pink)') { return v === null ? 'var(--ink-4)' : v >= 0 ? pos : neg; }

  tbody.innerHTML = list.map(p => {
    const safeName = p.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const adjRateColor = p.adjRate !== null ? (p.adjRate >= rate ? 'var(--sage)' : 'var(--pink)') : 'var(--ink-4)';
    const profitCell = p.profit !== null
      ? `<span style="color:${pc(p.profit)};font-weight:600">${fmt(p.profit)}</span><br>
         <span style="font-size:10px;color:${pc(p.profitPct)}">${p.profitPct >= 0 ? '+' : ''}${p.profitPct.toFixed(1)}%</span>`
      : dash;
    const rem = p.estValue ? p.estValue - p.laborValue - p.expensesTotal : null;
    const remPct = p.estValue ? rem / p.estValue * 100 : null;
    const mc = projMarginColor(remPct);
    const marginChip = remPct != null
      ? `<span class="proj-margin" style="color:${mc};border-color:${mc}" title="Remaining after labour and expenses, as a share of the estimate">${remPct.toFixed(0)}%</span>` : '';
    const vs = (a, q) => q > 0 && a > 0 ? `<span style="color:${a <= q ? 'var(--sage)' : a <= q * 1.1 ? 'var(--amber)' : 'var(--pink)'}">${fmt(a)}</span><span style="color:var(--ink-4)">/${fmt(q)}</span>` : (a > 0 ? fmt(a) : '—');
    const mini = `<div class="proj-mini">
        <span><i>Est</i> ${p.estValue != null ? fmt(p.estValue) : '—'}</span>
        <span><i>Inv</i> ${p.invoicedValue > 0 ? fmt(p.invoicedValue) : '—'}</span>
        <span><i>Lab</i> ${vs(p.laborValue, p.quotedLabour)}</span>
        <span><i>Exp</i> ${vs(p.expensesTotal, p.quotedMaterials)}</span>
        <span><i>Left</i> <b style="color:${mc}">${rem != null ? fmt(rem) : '—'}</b></span>
      </div>`;
    return `<tr onclick="showProjectDetail('${safeName}')" style="cursor:pointer">
      <td class="pc-hide-sm" style="font-size:11px;color:var(--ink-4);white-space:nowrap">#${p.id}</td>
      <td><div class="proj-namerow"><strong class="proj-name">${p.name}</strong>${marginChip}</div>
          <div style="margin-top:2px">${projStatusBadge(p.status)}<span class="proj-contact-sm"> ${p.contactDisplay || ''}</span></div>
          ${mini}
      </td>
      <td class="pc-hide-sm" style="font-size:12px;white-space:nowrap">${p.contactDisplay}</td>
      <td class="amount pc-hide-sm">${p.estValue != null ? fmt(p.estValue) : dash}</td>
      <td class="amount pc-hide-sm" style="color:var(--blue)">${p.invoicedValue > 0 ? fmt(p.invoicedValue) : dash}</td>
      <td class="amount pc-hide-sm" style="color:var(--amber)">${p.laborValue > 0 ? vs(p.laborValue, p.quotedLabour) : dash}</td>
      <td class="amount pc-hide-sm" style="color:var(--orange)">${p.expensesTotal > 0 ? vs(p.expensesTotal, p.quotedMaterials) : dash}</td>
      <td class="amount pc-hide-sm">${profitCell}</td>
      <td class="amount pc-hide-sm" style="color:${adjRateColor};white-space:nowrap">${p.adjRate !== null ? '$' + Math.round(p.adjRate) + '/h' : dash}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="9"><div class="empty" style="padding:20px">No projects match the current filter</div></td></tr>`;
}

// ── Modals ────────────────────────────────────────────────────────────────────
function openModal(title, bodyHtml, wide) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.querySelector('.modal').classList.toggle('modal-wide', !!wide);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.querySelector('.modal').classList.remove('modal-wide');
  document.body.style.overflow = '';
}

// 2026-06-30 batch — rewritten: clickable status pills, quote-line linking
// (mirrors invoice linking) feeding Est. Value, manual Est. Value as fallback,
// manual cash Revenue kept fully independent, and the columns trimmed off the
// main Projects table (Players, Quote No./Item/Description, Start/End/Span/
// Dilution) are surfaced here instead of discarded.
function showProjectDetail(name) {
  const rate = D.kpis.sebRate_per_hour || 100;
  const ts = (D.timesheets||[]).filter(t=>t.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const exp = (D.expense_log||[]).filter(e=>e.project===name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalHours = ts.reduce((a,t)=>a+(t.hours||0),0);
  const laborValue = totalHours * rate;
  const totalExpenses = exp.reduce((a,e)=>a+(e.amount||0),0);
  const defined = (D.projects||[]).find(p=>p.name===name);
  const status = defined ? (defined.status || 'Active') : 'Active';
  const quoted = defined && defined.quoted != null ? defined.quoted : null;
  const safe = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const manRev = projManualRev(defined);
  const manRevNote = defined ? (defined.manual_revenue_note||'') : '';
  const inpS = 'padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:13px';

  // Dropped table columns, surfaced here: team, span/dilution, start/end.
  function workingDays(start, end) {
    if (!start || !end) return null;
    const s = new Date(start + 'T00:00:00'), e = new Date(end + 'T00:00:00');
    let count = 0; const d = new Date(s);
    while (d <= e) { const dow = d.getDay(); if (dow > 0 && dow < 6) count++; d.setDate(d.getDate() + 1); }
    return count || 1;
  }
  const players = [...new Set(ts.map(t=>t.employee).filter(Boolean))];
  const dateList = ts.map(t=>t.date).filter(Boolean).sort();
  const startDate = dateList[0] || null;
  const endDate   = dateList[dateList.length-1] || null;
  const span      = workingDays(startDate, endDate);
  const hrPerDay  = span && totalHours > 0 ? totalHours / span : null;
  const dilutionPct = hrPerDay != null ? (hrPerDay / 8) * 100 : null;

  // Quote-line links (2026-06-30) — sum becomes Est. Value when present.
  const linkedQ = (D.quote_items||[]).filter(qi => (qi.project||'').trim() === name)
                    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const linkedQTotal = linkedQ.reduce((a,qi)=>a+(Number(qi.line_amount)||0),0);

  // Invoice-line links (Feature 3, unchanged) — sum (+ manual revenue) = Invoiced.
  const linked = (D.invoice_items||[]).filter(ii => (ii.project||'').trim() === name)
                   .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const linkedTotal = linked.reduce((a,ii)=>a+(Number(ii.price_excl_gst)||0),0);

  // Manual Est. Value is a floor, not just a fallback — see renderProjects() for why.
  const billedVal = linkedTotal + manRev;
  const estValue  = linkedQTotal > 0 ? linkedQTotal : (quoted > 0 ? quoted : (billedVal > 0 ? billedVal : null));
  const remaining = estValue != null ? estValue - laborValue - totalExpenses : null;
  const remPct    = estValue ? remaining / estValue * 100 : null;
  const qLab = defined && defined.baseline_labour_hours != null ? Number(defined.baseline_labour_hours) * rate : null;
  const qMat = defined && defined.baseline_materials_estimate != null ? Number(defined.baseline_materials_estimate) : null;
  const showLinks = !isNonBillable(name);

  const autoMatchedSection = projRenderAutoMatchedSection(name);
  const scopeSection = projRenderScope(name, linkedQ, linked, projHasHandLinks(name) ? [] : projAutoMatchInvoices(name, defined));

  // Merged, compact "bar" list — Seb's ask 2026-07-10: the old two-table layout
  // (Linked Quotes / Linked Invoices, each its own table + search box) was too
  // busy. One combined list, one search box, and the "nothing linked yet" filler
  // copy is dropped entirely rather than shown as an empty state.
  const linkBars = [
    ...linkedQ.map(qi => ({ kind:'Q', id:qi.id, num:qi.quote_number, contact:qi.contact, date:qi.date, amount:qi.line_amount })),
    ...linked.map(ii  => ({ kind:'INV', id:ii.id, num:ii.invoice_number, contact:ii.contact, date:ii.date, amount:ii.price_excl_gst })),
  ].sort((a,b)=>(b.date||'').localeCompare(a.date||''))
   .map(it => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 9px;background:var(--bg-2);border-radius:6px;margin-bottom:3px;font-size:12px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <span style="font-size:9px;font-weight:700;color:${it.kind==='Q'?'var(--amber)':'var(--blue)'};background:var(--bg-1);padding:1px 5px;border-radius:4px;margin-right:6px">${it.kind}</span>
        <strong style="color:var(--blue)">${attrEsc(it.num||'—')}</strong>
        <span style="color:var(--ink-4)"> · ${attrEsc(it.contact||'')} · ${it.date?fmtDMYDash(it.date):'—'}</span>
      </span>
      <span style="display:flex;align-items:center;gap:10px;white-space:nowrap">
        <strong class="amount" style="color:var(--blue)">${fmt(it.amount||0)}</strong>
        <span onclick="${it.kind==='Q'?`projUnlinkQuoteItem('${safe}','${attrEsc(it.id)}')`:`projUnlinkItem('${safe}','${attrEsc(it.id)}')`}" style="cursor:pointer;color:var(--pink);font-size:11px">✕</span>
      </span>
    </div>`).join('');

  const linksSection = showLinks ? `
    <div style="margin-bottom:20px">
      <div class="divider" style="margin-top:0">Est. Value & Revenue</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;padding:12px;background:var(--bg-2);border-radius:10px">
        <div><div style="font-size:11px;color:var(--ink-4);margin-bottom:3px">Manual Est. Value${linkedQTotal>0?' <span style="color:var(--amber)">(not used — picked quote lines win)</span>':''}</div><input id="pd-quoted" type="number" step="0.01" value="${quoted!=null?quoted:''}" placeholder="0" style="${inpS};width:140px;text-align:right"></div>
        <div><div style="font-size:11px;color:var(--ink-4);margin-bottom:3px">Manual revenue (cash)</div><input id="pd-manrev" type="number" step="0.01" value="${manRev||''}" placeholder="0" style="${inpS};width:140px;text-align:right"></div>
        <div style="flex:1;min-width:160px"><div style="font-size:11px;color:var(--ink-4);margin-bottom:3px">Manual revenue note</div><input id="pd-manrev-note" value="${attrEsc(manRevNote)}" placeholder="e.g. cash job, no invoice" style="${inpS};width:100%"></div>
        <button onclick="projSaveRevenue('${safe}')" style="padding:8px 16px;background:var(--sage);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700">Save</button>
      </div>

      <div class="divider">Linked Quotes & Invoices</div>
      ${autoMatchedSection}
      ${linkBars}
      <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--ink-4);margin:${linkBars?'6px':'0'} 0 12px">
        ${linkedQ.length ? `<span>Quotes: <strong style="color:var(--ink-2)">${fmt(linkedQTotal)}</strong> (${linkedQ.length}) → Est. Value</span>` : ''}
        ${linked.length ? `<span>Invoices: <strong style="color:var(--ink-2)">${fmt(linkedTotal)}</strong> (${linked.length}) → Invoiced</span>` : ''}
      </div>
      <input id="pd-link-search" placeholder="Search quote #, invoice # or contact name…" oninput="projRenderCombinedCandidates('${safe}')" style="${inpS};width:100%">
      <div id="pd-link-results" style="margin-top:8px"></div>
    </div>` : '';

  // Notes cell is an inline-editable input (matches the Expenses/Transactions
  // pattern) — Seb's ask 2026-07-10: allow entering notes here, not just viewing.
  const tsNoteInp = t => `<input value="${attrEsc(t.notes||'')}" data-id="${attrEsc(t.id)}" placeholder="—" onchange="projSaveTsNote(this)" onkeydown="if(event.key==='Enter')this.blur()" onfocus="this.style.border='1px solid var(--border)';this.style.background='var(--bg-1)'" onblur="this.style.border='1px solid transparent';this.style.background='transparent'" style="width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink-3);font-size:12px;font-family:inherit">`;
  const tsRows = ts.length
    ? ts.map(t=>`<tr><td style="white-space:nowrap">${t.date?fmtDMYDash(t.date):'—'}</td><td>${t.employee||'Seb'}</td><td style="padding:2px 4px">${tsNoteInp(t)}</td><td class="amount">${t.hours}h</td><td class="amount" style="color:var(--amber)">${fmt(t.hours*rate)}</td></tr>`).join('')
      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${totalHours}h</td><td class="amount" style="color:var(--amber)">${fmt(laborValue)}</td></tr>`
    : `<tr><td colspan="5" style="text-align:center;color:var(--ink-4);padding:16px 0">No timesheet entries</td></tr>`;
  const expRows = exp.length
    ? exp.map(e=>`<tr><td style="white-space:nowrap">${e.date?fmtDMYDash(e.date):'—'}</td><td style="color:var(--ink-4)">${e.description||'—'}</td><td>${e.category||'—'}</td><td class="amount">${fmt(e.amount)}</td></tr>`).join('')
      + `<tr style="font-weight:600;background:var(--bg-3)"><td colspan="3" style="font-size:12px;color:var(--ink-4)">Total</td><td class="amount">${fmt(totalExpenses)}</td></tr>`
    : `<tr><td colspan="4" style="text-align:center;color:var(--ink-4);padding:16px 0">No expenses logged</td></tr>`;

  openModal(name, `
    <div style="margin-bottom:16px">
      <div style="font-size:11px;color:var(--ink-4);margin-bottom:6px">Status — click to change</div>
      ${projStatusPills(name, status)}
      ${defined && defined.site_address ? '<div style="font-size:12px;color:var(--ink-3);margin-top:8px">📍 '+attrEsc(defined.site_address)+'</div>' : ''}
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:16px">
      ${kpi('Est. Value', estValue!=null?fmt(estValue):'TBD', linkedQ.length?linkedQ.length+' quote line'+(linkedQ.length>1?'s':'')+' picked':'','highlight')}
      ${projVsTile('Labour', laborValue, qLab, totalHours+'h @ $'+rate+'/hr')}
      ${projVsTile('Expenses', totalExpenses, qMat, 'Materials & costs')}
      ${projRemainingTile(remaining, remPct)}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:18px;font-size:11px;color:var(--ink-4);margin-bottom:20px;padding:10px 12px;background:var(--bg-2);border-radius:8px">
      <div><strong style="color:var(--ink-2)">Team:</strong> ${players.length?players.join(', '):'—'}</div>
      <div><strong style="color:var(--ink-2)">Start:</strong> ${startDate?fmtDMYDash(startDate):'—'}</div>
      <div><strong style="color:var(--ink-2)">End:</strong> ${endDate?fmtDMYDash(endDate):'—'}</div>
      <div><strong style="color:var(--ink-2)">Span:</strong> ${span!=null?span+'d':'—'}</div>
      <div><strong style="color:var(--ink-2)">Dilution:</strong> ${dilutionPct!=null?dilutionPct.toFixed(0)+'% ('+hrPerDay.toFixed(1)+'h/d)':'—'}</div>
    </div>
    ${projRenderBaseline(defined, totalHours, totalExpenses, rate)}
    ${scopeSection}
    ${linksSection}
    <div style="margin-bottom:20px">
      <div class="divider" style="margin-top:0">Timesheets</div>
      <table><thead><tr><th>Date</th><th>By</th><th>Notes</th><th style="text-align:right">Hours</th><th style="text-align:right">Value</th></tr></thead><tbody>${tsRows}</tbody></table>
    </div>
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px" class="divider">
        <span>Expenses</span>
        <span onclick="rcStartForProject('${safe}')" style="cursor:pointer;color:var(--amber);font-weight:700;font-size:12px;white-space:nowrap;text-transform:none;letter-spacing:normal">📷 Scan a receipt for this job</span>
      </div>
      <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>${expRows}</tbody></table>
    </div>`);
}

// ── Combined quote+invoice search/link (2026-07-10 merge) ─────────────────────
// One search box now covers both quote_items and invoice_items, grouped by
// document number as compact bars (Q/INV badge) instead of the old two separate
// full-width tables + two search boxes. Replaces the old
// projRenderLinkCandidates / projRenderQuoteLinkCandidates pair — link/unlink
// actions below (projLinkItem, projLinkQuoteItem, etc.) are unchanged.
function projRenderCombinedCandidates(name) {
  const box = document.getElementById('pd-link-results');
  const q = ((document.getElementById('pd-link-search')||{}).value || '').trim().toLowerCase();
  if (!box) return;
  if (q.length < 2) { box.innerHTML = '<div style="font-size:11px;color:var(--ink-4);padding:4px 2px">Type at least 2 characters…</div>'; return; }
  const safe = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

  // Search restricted to document # + contact name (description text is often
  // long/garbled and made results hard to scan on a phone).
  const qCands = (D.quote_items||[]).filter(qi => (qi.project||'').trim() !== name
    && `${qi.quote_number||''} ${qi.contact||''}`.toLowerCase().includes(q));
  const iCands = (D.invoice_items||[]).filter(ii => (ii.project||'').trim() !== name
    && `${ii.invoice_number||''} ${ii.contact||''}`.toLowerCase().includes(q));
  if (!qCands.length && !iCands.length) { box.innerHTML = '<div style="font-size:11px;color:var(--ink-4);padding:4px 2px">No matching quote or invoice lines.</div>'; return; }

  // Group each type by its document number — multi-line docs get a one-tap
  // "link all" shortcut instead of linking each line one at a time.
  const byQ = {}; qCands.forEach(qi => { const k = qi.quote_number || '—'; (byQ[k] = byQ[k]||[]).push(qi); });
  const byI = {}; iCands.forEach(ii => { const k = ii.invoice_number || '—'; (byI[k] = byI[k]||[]).push(ii); });
  const groups = [
    ...Object.keys(byQ).map(k => ({ kind:'Q',   num:k, rows: byQ[k].sort((a,b)=>(b.date||'').localeCompare(a.date||'')) })),
    ...Object.keys(byI).map(k => ({ kind:'INV', num:k, rows: byI[k].sort((a,b)=>(b.date||'').localeCompare(a.date||'')) })),
  ].sort((a,b)=>(b.rows[0].date||'').localeCompare(a.rows[0].date||''));

  box.innerHTML = groups.slice(0, 20).map(g => {
    const total = g.rows.reduce((a,r)=>a+(Number(g.kind==='Q'?r.line_amount:r.price_excl_gst)||0),0);
    const numSafe = String(g.num).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const action = g.rows.length > 1
      ? `<span onclick="${g.kind==='Q'?`projLinkAllQuote('${safe}','${numSafe}')`:`projLinkAllInvoice('${safe}','${numSafe}')`}" style="cursor:pointer;color:var(--sage);font-weight:700;font-size:11px;margin-left:8px">+ link all ${g.rows.length}</span>`
      : `<span onclick="${g.kind==='Q'?`projLinkQuoteItem('${safe}','${attrEsc(g.rows[0].id)}')`:`projLinkItem('${safe}','${attrEsc(g.rows[0].id)}')`}" style="cursor:pointer;color:var(--sage);font-weight:700;font-size:11px;margin-left:8px">+ link</span>`;
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 9px;background:var(--bg-2);border-radius:6px;margin-bottom:4px;font-size:12px">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        <span style="font-size:9px;font-weight:700;color:${g.kind==='Q'?'var(--amber)':'var(--blue)'};background:var(--bg-1);padding:1px 5px;border-radius:4px;margin-right:6px">${g.kind}</span>
        <strong style="color:var(--blue)">${attrEsc(g.num)}</strong>
        <span style="color:var(--ink-4)"> · ${attrEsc(g.rows[0].contact||'')} · ${g.rows[0].date?fmtDMYDash(g.rows[0].date):'—'}${g.rows.length>1?` · ${g.rows.length} lines`:''}</span>
      </span>
      <span style="white-space:nowrap"><strong class="amount">${fmt(total)}</strong>${action}</span>
    </div>`;
  }).join('');
}

async function projLinkItem(name, id) {
  try {
    await hubWrite('invoice_items', id, { project: name });
    const ii = (D.invoice_items||[]).find(x => String(x.id) === String(id));
    if (ii) ii.project = name;
    const cascaded = await cascadeLinkedQuotesAndInvoices();
    const paidChanged = await autoUpdatePaidProjects();
    claudeToast('✓ Line linked to ' + name
      + (cascaded ? ` (+${cascaded} quote/invoice line${cascaded>1?'s':''} auto-linked)` : '')
      + (paidChanged ? ` (${paidChanged} project${paidChanged>1?'s':''} marked Paid)` : ''), 'success');
    showProjectDetail(name);
    renderProjects(D.kpis);
  } catch (e) { claudeToast('⚠ ' + (e.message||'Link failed'), 'error'); }
}

// Link every line item of one invoice number to a project in a single action
// (Seb's ask: linking whole invoices one-line-at-a-time was too slow on a phone).
async function projLinkAllInvoice(name, invoiceNumber) {
  const rows = (D.invoice_items||[]).filter(ii => (ii.invoice_number||'') === invoiceNumber && (ii.project||'').trim() !== name);
  if (!rows.length) return;
  let ok = 0;
  for (const ii of rows) {
    try { await hubWrite('invoice_items', ii.id, { project: name }); ii.project = name; ok++; }
    catch (e) { /* keep going, report partial success below */ }
  }
  const cascaded = await cascadeLinkedQuotesAndInvoices();
  const paidChanged = await autoUpdatePaidProjects();
  claudeToast((ok === rows.length
    ? `✓ Linked all ${ok} lines from ${invoiceNumber} to ${name}`
    : `⚠ Linked ${ok}/${rows.length} lines from ${invoiceNumber} — retry the rest`)
    + (cascaded ? ` (+${cascaded} quote/invoice line${cascaded>1?'s':''} auto-linked)` : '')
    + (paidChanged ? ` (${paidChanged} project${paidChanged>1?'s':''} marked Paid)` : ''), ok ? 'success' : 'error');
  showProjectDetail(name);
  renderProjects(D.kpis);
}

// Inline notes edit on a Timesheets row inside the project detail modal
// (Seb's ask 2026-07-10). Mirrors exSaveCell's save-on-change pattern.
async function projSaveTsNote(inp) {
  const id = inp.dataset.id, value = inp.value.trim();
  const row = (D.timesheets || []).find(t => String(t.id) === String(id));
  if (row && (row.notes || '') === value) return;
  try {
    await hubWrite('timesheets', id, { notes: value });
    if (row) row.notes = value;
    inp.style.outline = '2px solid var(--sage)';
    setTimeout(() => { inp.style.outline = 'none'; }, 700);
  } catch (e) {
    inp.style.outline = '2px solid var(--pink)';
    claudeToast('⚠ ' + (e.message || 'Could not save note'), 'error');
  }
}

async function projSaveRevenue(name) {
  const qEl = document.getElementById('pd-quoted');
  const mEl = document.getElementById('pd-manrev');
  const nEl = document.getElementById('pd-manrev-note');
  const quoted  = qEl && qEl.value !== '' ? Number(qEl.value) : 0;
  const manRev  = mEl && mEl.value !== '' ? Number(mEl.value) : 0;
  const note    = nEl ? nEl.value.trim() : '';
  try {
    let proj = (D.projects||[]).find(p => p.name === name);
    if (!proj) proj = await hubCreateProject(name);          // ensure a row exists
    const row = await hubWrite('projects', proj.id, { quoted, manual_revenue: manRev, manual_revenue_note: note });
    Object.assign(proj, row);
    claudeToast('✓ Revenue saved', 'success');
    showProjectDetail(name);
    renderProjects(D.kpis);
  } catch (e) { claudeToast('⚠ ' + (e.message||'Save failed'), 'error'); }
}

// ── NON-BILLABLE WINDOW (2026-06-30 batch) ───────────────────────────────────
// Separate from the billable Project table — these categories have no quotes
// or invoices and stay perpetually "open". Own period-preset set (this window
// intentionally does NOT reuse getRange()/tsRangeMode, which only knows the
// Timesheets tab's 2w/1m/3m/1y presets) plus a category filter and a
// hours-over-time graph switchable between week/month/year buckets.
// ══════════════════════════════════════════════════════════════════════════════
let nbCategory    = 'All';   // 'All' | 'None' | one of NON_BILLABLE
let nbRangeMode    = '2w';    // 2w | 30d | 3m | 6m | 1y | 36m | custom
let nbCustomFrom   = null;
let nbCustomTo     = null;
let nbGraphMode    = 'week';  // week | month | year

function nbGetRange() {
  const today = todayMidnight();
  let from, to;
  if (nbRangeMode === 'custom') {
    from = nbCustomFrom ? new Date(nbCustomFrom + 'T00:00:00') : new Date(today);
    to   = nbCustomTo   ? new Date(nbCustomTo   + 'T00:00:00') : new Date(today);
  } else {
    from = new Date(today);
    to   = new Date(today);
    if      (nbRangeMode === '2w')  from.setDate(from.getDate() - 14);
    else if (nbRangeMode === '30d') from.setDate(from.getDate() - 30);
    else if (nbRangeMode === '3m')  from.setMonth(from.getMonth() - 3);
    else if (nbRangeMode === '6m')  from.setMonth(from.getMonth() - 6);
    else if (nbRangeMode === '1y')  from.setFullYear(from.getFullYear() - 1);
    else if (nbRangeMode === '36m') from.setMonth(from.getMonth() - 36);
  }
  return { from: ds(from), to: ds(to) };
}

// ISO-8601 week label, e.g. "2026-W23" — used to bucket the hours graph by week number.
function isoWeekLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + (4 - (d.getDay() || 7)));   // shift to the Thursday of this week
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return d.getFullYear() + '-W' + String(weekNo).padStart(2, '0');
}

function showNonBillableWindow() {
  openModal('Non-Billable Projects', nbRenderBody(), true);
  nbRenderChart();
}

function nbRefresh() {
  const body = document.getElementById('modal-body');
  if (!body) return;
  body.innerHTML = nbRenderBody();
  nbRenderChart();
}

function nbSetCategory(v) { nbCategory = v; nbRefresh(); }
function nbSetRange(mode) {
  nbRangeMode = mode;
  if (mode !== 'custom') { nbCustomFrom = null; nbCustomTo = null; }
  nbRefresh();
}
function nbSetCustomFrom(v) { nbRangeMode = 'custom'; nbCustomFrom = v; nbRefresh(); }
function nbSetCustomTo(v)   { nbRangeMode = 'custom'; nbCustomTo   = v; nbRefresh(); }
function nbSetGraphMode(mode) { nbGraphMode = mode; nbRefresh(); }

function nbMatchingEntries(list, from, to) {
  if (nbCategory === 'None') return [];
  return list.filter(r =>
    isNonBillable(r.project) && r.date && r.date >= from && r.date <= to &&
    (nbCategory === 'All' || r.project === nbCategory)
  );
}

function nbRenderBody() {
  const { from, to } = nbGetRange();
  const rate = (D.kpis && D.kpis.sebRate_per_hour) || 100;
  const filteredTs  = nbMatchingEntries(D.timesheets   || [], from, to);
  const filteredExp = nbMatchingEntries(D.expense_log  || [], from, to);

  const totalHours  = filteredTs.reduce((a,t)=>a+(t.hours||0),0);
  const labourValue = totalHours * rate;
  const totalExp    = filteredExp.reduce((a,e)=>a+(e.amount||0),0);
  const entryCount  = filteredTs.length;

  const byCat = {};
  NON_BILLABLE.forEach(c => byCat[c] = 0);
  filteredTs.forEach(t => { if (byCat[t.project] != null) byCat[t.project] += (t.hours||0); });
  const catRows = NON_BILLABLE
    .map(c => ({ c, h: byCat[c] || 0 }))
    .filter(r => r.h > 0 || nbCategory === 'All')
    .map(r => `<tr><td>${r.c}</td><td class="amount">${r.h.toFixed(1)}h</td></tr>`).join('')
    || `<tr><td colspan="2" style="text-align:center;color:var(--ink-4);padding:10px 0">No entries in this period</td></tr>`;

  const catOptions = ['All','None', ...NON_BILLABLE]
    .map(c => `<option value="${c}"${nbCategory===c?' selected':''}>${c}</option>`).join('');

  const presets = [
    {v:'2w',l:'2 Weeks'},{v:'30d',l:'30 Days'},{v:'3m',l:'3 Months'},
    {v:'6m',l:'6 Months'},{v:'1y',l:'1 Year'},{v:'36m',l:'36 Months'}
  ].map(p=>`<button class="hub-pill-btn${nbRangeMode===p.v?' active':''}" onclick="nbSetRange('${p.v}')">${p.l}</button>`).join('');
  const customBtn = `<button class="hub-pill-btn${nbRangeMode==='custom'?' active':''}" onclick="nbSetRange('custom')">Custom</button>`;
  const customInputs = nbRangeMode === 'custom' ? `
    <input type="date" value="${nbCustomFrom||from}" onchange="nbSetCustomFrom(this.value)" style="margin-left:8px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:11px">
    <span style="color:var(--ink-4);font-size:11px">to</span>
    <input type="date" value="${nbCustomTo||to}" onchange="nbSetCustomTo(this.value)" style="padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:11px">` : '';

  const graphToggle = ['week','month','year'].map(m=>
    `<button class="hub-pill-btn${nbGraphMode===m?' active':''}" onclick="nbSetGraphMode('${m}')">${m[0].toUpperCase()+m.slice(1)}</button>`
  ).join('');

  const catSub = nbCategory === 'All' ? 'All categories' : nbCategory === 'None' ? 'No category selected' : nbCategory;

  return `
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px">
      <span style="font-size:11px;color:var(--ink-4)">Category</span>
      <select onchange="nbSetCategory(this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-1);color:var(--ink-1);font-size:12px">
        ${catOptions}
      </select>
    </div>
    <div class="ts-range-bar">
      <span class="ts-range-label">Period:</span>
      ${presets}${customBtn}${customInputs}
      <span style="font-size:10px;color:var(--ink-4);margin-left:auto;white-space:nowrap">${from} → ${to}</span>
    </div>
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:18px">
      ${kpi('Total Hours', totalHours.toFixed(1) + 'h', catSub, 'highlight')}
      ${kpi('Labour Value', fmt(labourValue), 'At $' + rate + '/hr', '')}
      ${kpi('Expenses', totalExp > 0 ? fmt(totalExp) : '$0', 'Materials & costs', '')}
      ${kpi('Entries', entryCount, 'Timesheet rows', '')}
    </div>
    <div style="margin-bottom:18px">
      <div class="divider" style="margin-top:0">By Category</div>
      <table style="font-size:12px"><thead><tr><th>Category</th><th style="text-align:right">Hours</th></tr></thead><tbody>${catRows}</tbody></table>
    </div>
    <div class="divider">Hours Over Time</div>
    <div style="display:flex;gap:6px;margin-bottom:10px">${graphToggle}</div>
    <div class="chart-wrap" style="height:260px"><canvas id="chart-nb-hours"></canvas></div>`;
}

function nbRenderChart() {
  const canvas = document.getElementById('chart-nb-hours');
  if (!canvas) return;
  destroyChart('nb-hours');
  const { from, to } = nbGetRange();
  const filtered = nbMatchingEntries(D.timesheets || [], from, to);

  const buckets = {};
  filtered.forEach(t => {
    if (!t.date) return;
    let key;
    if      (nbGraphMode === 'week')  key = isoWeekLabel(t.date);
    else if (nbGraphMode === 'month') key = t.date.slice(0,7);
    else                              key = t.date.slice(0,4);
    buckets[key] = (buckets[key] || 0) + (t.hours || 0);
  });
  const labels = Object.keys(buckets).sort();
  const data   = labels.map(k => buckets[k]);

  charts['nb-hours'] = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Hours', data, backgroundColor: '#FFBE0B', borderRadius: 4 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.raw.toFixed(1)}h` } }
      },
      scales: {
        x: { ticks: CHART_TICK, grid: { display: false } },
        y: { ticks: CHART_TICK, grid: { color: CHART_GRID }, beginAtZero: true }
      }
    }
  });
}

}

// Non-billable categories — internal projects tracked for time/cost but never invoiced.
// Single source of truth hub-wide. To add a new non-billable category later, add it
// here (one line). Matching is case-insensitive (see isNonBillable). On the Projects
// tab every name in this list is rolled up under one expandable "Non-Billable" row.
