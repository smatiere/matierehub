}

// ═══════════════════════════════════════════════════════════════════════════
// SCHEDULE — pipeline of approved quotes → calendar of tentative/confirmed jobs
// (added 2026-11-01; table = bookings, see supabase_bookings.sql)
//
// Flow: a quote is approved (Xero ACCEPTED, or "Add job" here) → booking
// 'approved' (needs a date) → drag / tap-to-place → 'tentative' → 'confirmed'.
// Constraints (plumber ready 15/11, delivery lead times, client away…) push the
// earliest sensible start and raise warnings; weather flags outdoor days;
// "Notify client" drafts the message into the Comms Hub (never auto-sent),
// or opens SMS / email prefilled. Everything writes through hubWrite.
// ═══════════════════════════════════════════════════════════════════════════
const SCH_SQL = `CREATE TABLE IF NOT EXISTS bookings (
  id TEXT PRIMARY KEY, project TEXT DEFAULT '', title TEXT DEFAULT '', quote_number TEXT DEFAULT '',
  approval_source TEXT DEFAULT 'hub', approved_at DATE, status TEXT DEFAULT 'approved',
  client_name TEXT DEFAULT '', client_phone TEXT DEFAULT '', client_email TEXT DEFAULT '',
  site_address TEXT DEFAULT '', lat NUMERIC(9,6), lng NUMERIC(9,6), env TEXT DEFAULT 'indoor',
  priority INT DEFAULT 2, hours NUMERIC(7,2), hours_per_day NUMERIC(4,2) DEFAULT 8,
  start_date DATE, start_time TEXT DEFAULT '07:00', end_date DATE, window_days INT DEFAULT 0,
  constraints JSONB NOT NULL DEFAULT '[]', notify_log JSONB NOT NULL DEFAULT '[]', notified_start DATE,
  notes TEXT DEFAULT '', created_at TIMESTAMPTZ DEFAULT NOW(), updated_at TIMESTAMPTZ DEFAULT NOW());
GRANT SELECT ON bookings TO anon;
GRANT ALL ON bookings TO service_role;
ALTER TABLE bookings DISABLE ROW LEVEL SECURITY;`;

const SCH_STATUS = {
  approved:    { label: 'Needs a date', color: '#FFBE0B' },
  tentative:   { label: 'Tentative',    color: '#3A86FF' },
  confirmed:   { label: 'Confirmed',    color: '#05C46B' },
  in_progress: { label: 'In progress',  color: '#8338EC' },
  done:        { label: 'Done',         color: '#707070' },
  cancelled:   { label: 'Cancelled',    color: '#707070' }
};
const SCH_ACTIVE = ['tentative', 'confirmed', 'in_progress'];          // statuses that occupy capacity
const SCH_PRIO = { 1: 'High', 2: 'Normal', 3: 'Low' };
const SCH_CON_TYPES = { trade: 'Other trade', delivery: 'Delivery', client: 'Client', other: 'Other' };
const SCH_HOME = { lat: -33.7969, lng: 151.2878 };                      // Manly — weather + travel fallback

let SCH = { view: 'week', anchor: null, selDay: null, placing: null, showDone: false,
            weather: null, weatherTried: false, msg: null, openId: null };
try { SCH.view = localStorage.getItem('sch_view') || 'week'; } catch (e) {}

// ── Settings (per-device, localStorage) ─────────────────────────────────────
function schSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('sch_settings') || '{}'); } catch (e) {}
  return { commsUrl: '', commsKey: '', window: 0, capacity: 8, ...s };
}
function schStoreSettings(o) {
  try { localStorage.setItem('sch_settings', JSON.stringify({ ...schSettings(), ...o })); } catch (e) {}
}

// ── Date helpers (all local-time, YYYY-MM-DD strings) ───────────────────────
const pad2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function pd(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d, 12); }
function addD(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function isWork(s) { const w = pd(s).getDay(); return w >= 1 && w <= 5; }
function nextWork(s, dir = 1) { let x = s, i = 0; while (!isWork(x) && i++ < 10) x = addD(x, dir); return x; }
function mondayOf(s) { const d = pd(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }
function todayStr() { return ymd(new Date()); }
function schHomeMonday() { const t = todayStr(); return isWork(t) ? t : nextWork(t); }   // week view now starts on today (name kept for callers)
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
function fmtDay(s, o) { return s ? pd(s).toLocaleDateString('en-AU', o || { weekday: 'short', day: 'numeric', month: 'short' }) : '—'; }
function fmtShort(s) { return s ? pd(s).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '—'; }
function fmtHM(mins) { const h = Math.floor(mins / 60) % 24, m = Math.round(mins % 60); return h + ':' + pad2(m); }
function hmToMin(t) { const [h, m] = String(t || '07:00').split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function hrsText(h) { return (Math.round(h * 10) / 10) + 'h'; }

// ── Booking maths ───────────────────────────────────────────────────────────
function schAll() { return Array.isArray(D && D.bookings) ? D.bookings : []; }
function schGet(id) { return schAll().find(b => b.id === id); }
function schCap() { return Number(schSettings().capacity) || 8; }

// Working days a booking occupies, with hours per day: [{d, h}]
function schSpan(b) {
  if (!b.start_date) return [];
  const hpd = Number(b.hours_per_day) || 8;
  const hrs = Number(b.hours) || hpd;
  const n = Math.max(1, Math.ceil(hrs / hpd - 1e-9));
  const out = [];
  let d = nextWork(b.start_date);
  for (let i = 0; i < n; i++) {
    out.push({ d, h: i < n - 1 ? hpd : Math.round((hrs - (n - 1) * hpd) * 100) / 100 });
    d = nextWork(addD(d, 1));
  }
  return out;
}
function schEndDate(b) { const s = schSpan(b); return s.length ? s[s.length - 1].d : null; }

function schDayEntries(d, includeDone) {
  const out = [];
  schAll().forEach(b => {
    if (b.status === 'cancelled') return;
    if (b.status === 'done' && !includeDone) return;
    if (!b.start_date) return;
    const hit = schSpan(b).find(x => x.d === d);
    if (hit) out.push({ b, h: hit.h });
  });
  return out;
}
function schDayLoad(d, exceptId) {
  return schDayEntries(d).filter(e => SCH_ACTIVE.includes(e.b.status) && e.b.id !== exceptId).reduce((s, e) => s + e.h, 0);
}

// Parse "10 days", "3 weeks", "2-3 weeks", "6 wks" → days (upper bound)
function schLeadDays(txt) {
  const m = String(txt || '').toLowerCase().match(/(\d+)(?:\s*[-–to]+\s*(\d+))?\s*(day|d\b|week|wk|month)/);
  if (!m) { const n = parseInt(txt, 10); return isNaN(n) ? 0 : n; }
  const n = Number(m[2] || m[1]);
  return /week|wk/.test(m[3]) ? n * 7 : /month/.test(m[3]) ? n * 30 : n;
}

// Special-order items on the project's open shopping list(s) that carry a lead time
function schDeliveries(b) {
  const out = [];
  const key = (b.project || '').toLowerCase();
  if (!key) return out;
  (D.shopping_lists || []).forEach(l => {
    if (l.status === 'done' || (l.project || '').toLowerCase() !== key) return;
    (Array.isArray(l.items) ? l.items : []).forEach((it, idx) => {
      if (!it || !it.special || it.checked) return;
      const lead = schLeadDays(it.lead_time);
      if (!lead && !it.eta) return;
      const today = todayStr();
      const eta = it.eta || addD(today, lead);
      const orderBy = b.start_date ? addD(b.start_date, -lead) : null;
      out.push({ listId: l.id, idx, item: it, lead, ordered: !!it.ordered, eta, orderBy,
                 late: !it.ordered && !!orderBy && today > orderBy,
                 arrivesAfterStart: !!b.start_date && eta > b.start_date });
    });
  });
  return out;
}

// Everything that has to be true before the job can start: manual constraints + deliveries
function schBlockers(b) {
  const out = [];
  (Array.isArray(b.constraints) ? b.constraints : []).forEach(c => {
    if (c.done) return;
    out.push({ key: c.id, type: c.type, label: c.label, ready: c.ready_date || null, confirmed: !!c.confirmed, manual: true });
  });
  schDeliveries(b).forEach(d => out.push({
    key: 'dl-' + d.listId + '-' + d.idx, type: 'delivery', label: (d.item.name || 'Special order') + (d.ordered ? ' (ordered)' : ' (not ordered)'),
    ready: d.eta, confirmed: d.ordered, manual: false, delivery: d
  }));
  return out;
}
function schEarliest(b) {
  const dates = schBlockers(b).map(x => x.ready).filter(Boolean).sort();
  return dates.length ? nextWork(addD(dates[dates.length - 1], 1)) : null;
}

// Free-text description of the window the client is told
function schDateText(b, forDate) {
  const s = forDate || b.start_date;
  if (!s) return 'a date to be confirmed';
  const w = Number(b.window_days) || 0;
  if (!w) return fmtDay(s, { weekday: 'long', day: 'numeric', month: 'long' });
  const e = nextWork(addD(s, w));
  return 'between ' + fmtDay(s, { weekday: 'long', day: 'numeric' }) + ' and ' + fmtDay(e, { weekday: 'long', day: 'numeric', month: 'long' });
}

function schWx(d) {
  const w = SCH.weather && SCH.weather[d];
  if (!w) return null;
  return { ...w, rain: w.pop >= 60 || w.mm >= 5, wind: w.wind >= 45 };
}

// All problems with a booking, worst first: {level:'bad'|'warn'|'info', text}
function schIssues(b) {
  const out = [];
  if (['done', 'cancelled'].includes(b.status)) return out;
  const today = todayStr();
  const blockers = schBlockers(b);
  if (b.start_date) {
    blockers.forEach(x => {
      if (x.ready && b.start_date <= x.ready) out.push({ level: 'bad', text: 'Starts before ' + x.label + ' is ready (' + fmtShort(x.ready) + ')' });
      else if (!x.confirmed && x.manual) out.push({ level: 'warn', text: 'Confirm ' + x.label + (x.ready ? ' (due ' + fmtShort(x.ready) + ')' : '') });
    });
    schDeliveries(b).forEach(d => { if (d.late || (d.arrivesAfterStart && !d.ordered)) out.push({ level: 'bad', text: 'Order ' + (d.item.name || 'special item') + ' by ' + fmtShort(d.orderBy) + (d.late ? ' — already late' : '') }); });
    schSpan(b).forEach(x => {
      const load = schDayLoad(x.d);
      if (SCH_ACTIVE.includes(b.status) && load > schCap() + 0.01) out.push({ level: 'bad', text: 'Overbooked ' + fmtDay(x.d) + ' (' + hrsText(load) + ')' });
      const w = schWx(x.d);
      if (w && w.rain && b.env !== 'indoor') out.push({ level: 'warn', text: 'Rain ' + fmtDay(x.d) + ' (' + w.pop + '%) on an outdoor job' });
    });
    if (['tentative', 'confirmed'].includes(b.status) && b.notified_start !== b.start_date)
      out.push({ level: 'warn', text: b.notified_start ? 'Client not told about the new date' : 'Client not told yet' });
    if (b.start_date < today && ['tentative', 'confirmed'].includes(b.status)) out.push({ level: 'warn', text: 'Date has passed — mark in progress/done' });
  } else {
    const e = schEarliest(b);
    if (e) out.push({ level: 'info', text: 'Earliest start ' + fmtDay(e) });
  }
  if (!b.hours) out.push({ level: 'info', text: 'Hours not set' });
  if (!b.site_address) out.push({ level: 'info', text: 'No site address' });
  const rank = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, c) => rank[a.level] - rank[c.level]);
}

// Next date the whole job fits: ≥ earliest start, within capacity, avoiding forecast rain for outdoor work
function schSuggest(b) {
  const today = todayStr();
  let d = nextWork(addD(today, 1));
  const e = schEarliest(b);
  if (e && e > d) d = e;
  const hpd = Number(b.hours_per_day) || 8;
  for (let i = 0; i < 180; i++) {
    const probe = { ...b, start_date: d };
    const ok = schSpan(probe).every(x => {
      const free = schCap() - schDayLoad(x.d, b.id);
      const w = schWx(x.d);
      return free + 0.01 >= Math.min(x.h, hpd) && !(w && w.rain && b.env !== 'indoor');
    });
    if (ok) return d;
    d = nextWork(addD(d, 1));
  }
  return d;
}

// Straight-line distance → rough drive minutes between two jobs
function schTravelMin(a, b) {
  if (a.lat == null || b.lat == null || a.lng == null || b.lng == null) return null;
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  const km = 2 * R * Math.asin(Math.sqrt(h)) * 1.35;
  return Math.max(5, Math.round((km / 35 * 60 + 5) / 5) * 5);
}

// Ordered plan for a day: start/end clock times with travel gaps
function schDayPlan(d) {
  const es = schDayEntries(d, true).sort((a, c) => (a.b.priority - c.b.priority) || String(a.b.start_time).localeCompare(String(c.b.start_time)));
  let t = null, prev = null;
  return es.map(e => {
    const travel = prev ? schTravelMin(prev, e.b) : null;
    let start = hmToMin(e.b.start_time);
    if (t != null) start = Math.max(start, t + (travel || 0));
    const end = start + e.h * 60;
    t = end; prev = e.b;
    return { b: e.b, h: e.h, start, end, travel };
  });
}

// ── Persistence ─────────────────────────────────────────────────────────────
async function schSave(id, fields, quiet) {
  const b = schGet(id);
  if (!b) return null;
  const before = {};
  Object.keys(fields).forEach(k => before[k] = b[k]);
  const merged = { ...b, ...fields };
  if (['start_date', 'hours', 'hours_per_day'].some(k => k in fields)) fields.end_date = merged.start_date ? schEndDate(merged) : null;
  Object.assign(b, fields);                                              // optimistic
  try {
    const row = await hubWrite('bookings', id, fields);
    Object.assign(b, row);
    return { before };
  } catch (e) {
    Object.assign(b, before);
    claudeToast('Could not save: ' + e.message, 'error');
    schRender();
    return null;
  } finally {
    if (!quiet) schRender();
  }
}

function schSnack(msg, actions) {
  let el = document.getElementById('sch-snack');
  if (!el) { el = document.createElement('div'); el.id = 'sch-snack'; document.body.appendChild(el); }
  el.innerHTML = '<span>' + attrEsc(msg) + '</span>' + (actions || []).map((a, i) => '<button data-i="' + i + '">' + attrEsc(a.label) + '</button>').join('');
  el.querySelectorAll('button').forEach(btn => btn.onclick = () => { el.classList.remove('show'); actions[btn.dataset.i].run(); });
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 7000);
}

// ── Moving / placing ────────────────────────────────────────────────────────
async function schMove(id, to, label) {
  const b = schGet(id);
  if (!b || !to) return;
  const day = nextWork(to);
  const fields = { start_date: day };
  if (b.status === 'approved') fields.status = 'tentative';
  const res = await schSave(id, fields);
  if (!res) return;
  const problems = schIssues(b).filter(i => i.level === 'bad');
  const told = b.notified_start && b.notified_start !== day;
  const actions = [{ label: 'Undo', run: () => schSave(id, res.before) }];
  if (told || ['tentative', 'confirmed'].includes(b.status)) actions.push({ label: 'Tell client', run: () => schOpen(id, 'notify') });
  schSnack((label || 'Moved to ') + fmtDay(day) + (problems.length ? ' — ⚠ ' + problems[0].text : ''), actions);
}

// ── Geocoding (OpenStreetMap Nominatim, free) for travel-time estimates ─────
async function schGeocode(id) {
  const b = schGet(id);
  if (!b || !b.site_address) return;
  try {
    const q = encodeURIComponent(b.site_address + (/NSW|Australia/i.test(b.site_address) ? '' : ', NSW, Australia'));
    const r = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q=' + q)).json();

// ── Contacts → prefill client details ───────────────────────────────────────
async function schContactFor(name) {
  if (!name) return null;
  const tries = [name, name.split(/[\s-]+/)[0]].filter(t => t && t.length >= 3);
  for (const t of tries) {
    try {
      const rows = await sbGet('/rest/v1/contacts?select=name,email,phone,address_line1,city,region,postal_code&name=ilike.*' + encodeURIComponent(t) + '*&limit=2');
      if (rows.length === 1) return rows[0];
    } catch (e) { return null; }
  }
  return null;
}
// Best Xero contact for a booking: the quote's own contact first, then exact
// name, then "Name - Suburb" prefixes of the job name.
async function schContactList() {
  if (SCH.contacts) return SCH.contacts;
  try { SCH.contacts = await sbGet('/rest/v1/contacts?select=id,name,email,phone,address_line1,city,region,postal_code&limit=1000'); }
  catch (e) { SCH.contacts = []; }
  return SCH.contacts;
}
async function schFindContact(b) {
  const list = await schContactList();
  const low = x => String(x || '').toLowerCase().trim();
  const byId = id => list.find(c => c.id === id);
  const qi = (D.quote_items || []).find(q => b.quote_number && q.quote_number === b.quote_number && q.contact_id);
  if (qi && byId(qi.contact_id)) return byId(qi.contact_id);
  const names = [b.client_name, b.project].map(low).filter(Boolean);
  for (const n of names) { const c = list.find(c => low(c.name) === n); if (c) return c; }
  const pre = list.filter(c => low(c.name).length >= 5 && names.some(n => n.startsWith(low(c.name))));
  if (pre.length) return pre.sort((a, c) => c.name.length - a.name.length)[0];
  const first = (names[0] || '').split(/[\s-]+/)[0];
  if (first.length >= 3) {
    const cand = list.filter(c => low(c.name).startsWith(first) && c.city && names.some(n => n.includes(low(c.city))));
    if (cand.length === 1) return cand[0];
    const only = list.filter(c => low(c.name).split(/[\s-]+/)[0] === first);
    if (only.length === 1) return only[0];
  }
  return null;
}
function schAddrOf(c) { return c ? [c.address_line1, c.city, c.region || 'NSW', c.postal_code].filter(Boolean).join(', ') : ''; }

// The project card a booking belongs to: the quote's hand-linked project, else the same-name
// project, else a project whose name starts with the job's (e.g. "Amanda - Balgowlah" ->
// "Amanda - Balgowlah front door"), picking by the quoted amount when several fit.
function schProjectOf(b) {
  const P = D.projects || [], low = x => String(x || '').toLowerCase().trim();
  const byName = n => P.find(p => low(p.name) === low(n));
  const hasH = p => Number(p.baseline_labour_hours) > 0;
  const ql = (D.quote_items || []).filter(q => b.quote_number && q.quote_number === b.quote_number);
  const linked = ql.map(q => q.project).find(x => x && byName(x));
  if (linked) return byName(linked);
  const ex = byName(b.project);
  if (ex && hasH(ex)) return ex;
  const total = ql.reduce((t, q) => t + (Number(q.line_amount) || 0), 0);
  const close = p => total > 0 && Number(p.quoted) > 0 && (Math.abs(p.quoted - total) < 1.5 || Math.abs(p.quoted - total * 1.1) < 1.5);
  const names = [b.project, b.client_name].map(low).filter(Boolean);
  const pre = P.filter(p => p !== ex && hasH(p) && names.some(n => low(p.name).startsWith(n)));
  if (pre.length === 1) return pre[0];
  if (pre.length > 1) { const m = pre.filter(close); if (m.length === 1) return m[0]; }
  const byAmt = P.filter(p => hasH(p) && close(p));
  if (byAmt.length === 1) return byAmt[0];
  return ex || null;
}
function schQuotedHours(b) {
  const p = schProjectOf(b);
  if (p && Number(p.baseline_labour_hours) > 0) return Number(p.baseline_labour_hours);
  const lines = (D.quote_items || []).filter(q => b.quote_number && q.quote_number === b.quote_number);
  const h = lines.filter(l => /\b(labou?r|hours?|hrs?)\b/i.test((l.item || '') + ' ' + (l.description || ''))).reduce((t, l) => t + (Number(l.qty) || 0), 0);
  return h > 0 ? h : null;
}
function schOpenProject(id) {
  const b = schGet(id), p = b && schProjectOf(b);
  if (!p) { claudeToast('No project card found for this job', 'error'); return; }
  closeModal(); showProjectDetail(p.name);
}

// Fill missing hours and addresses on open bookings, and copy the address onto the project.
async function schGapFill() {
  if (SCH.filling || !Array.isArray(D.bookings)) return;
  SCH.filling = true;
  let n = 0;
  try {
    // Quotes accepted in Xero land in the pipeline by themselves.
    const won = schCandidates().filter(c => c.status === 'ACCEPTED');
    for (const c of won) { try { await schAddFromQuote(c.quote_number, false); n++; } catch (e) {} }
    // Every Won project has a place in the pipeline.
    for (const p of (D.projects || []).filter(x => x.status === 'Won')) {
      const back = D.bookings.find(b => b.status === 'cancelled' && /^Not won yet/.test(b.notes || '') && ((b.project || '').toLowerCase() === (p.name || '').toLowerCase() || (schProjectOf(b) || {}).id === p.id));
      if (back) { await schSave(back.id, { status: 'approved', notes: '' }, true); n++; continue; }
      const has = D.bookings.some(b => b.status !== 'cancelled' && (schProjectOf(b) || {}).id === p.id || (b.project || '').toLowerCase() === (p.name || '').toLowerCase());
      if (has) continue;
      try {
        const nb = await schCreate({ project: p.name, title: p.baseline_scope || '', approval_source: 'hub', approved_at: todayStr(), status: 'approved', client_name: p.name, hours: Number(p.baseline_labour_hours) || null });
        n++; schFillFromContact(nb.id);
      } catch (e) {}
    }
    // Jobs that are finished, paid, lost or inactive do not belong in the to-schedule list.
    for (const b of D.bookings) {
      if (b.status !== 'approved' || b.start_date) continue;
      const pr = schProjectOf(b);
      if (!pr) continue;
      if (['Finished', 'Paid'].includes(pr.status)) { await schSave(b.id, { status: 'done' }, true); n++; }
      else if (['Lost', 'Inactive'].includes(pr.status)) { await schSave(b.id, { status: 'cancelled', notes: b.notes || 'Not won yet — ' + pr.status }, true); n++; }
    }
    for (const b of D.bookings) {
      if (['done', 'cancelled'].includes(b.status)) continue;
      const patch = {};
      { const pr = schProjectOf(b); if (pr && pr.name !== b.project) patch.project = pr.name; }
      if (!Number(b.hours)) { const h = schQuotedHours(b); if (h) patch.hours = h; }
      if (!b.site_address || !b.client_phone || !b.client_email) {
        const c = await schFindContact(b);
        if (c) {
          if (!b.site_address && schAddrOf(c)) patch.site_address = schAddrOf(c);
          if (!b.client_phone && c.phone) patch.client_phone = c.phone;
          if (!b.client_email && c.email) patch.client_email = c.email;
        }
      }
      if (Object.keys(patch).length) {
        const ok = await schSave(b.id, patch, true);
        if (ok) { n++; if (patch.site_address && !b.lat) schGeocode(b.id); }
      }
      const p = (D.projects || []).find(x => (x.name || '').toLowerCase() === (b.project || '').toLowerCase());
      if (p && 'site_address' in p && !p.site_address && b.site_address) {
        try { await hubWrite('projects', p.id, { site_address: b.site_address }); p.site_address = b.site_address; } catch (e) {}
      }
    }
  } finally { SCH.filling = false; }
  autoUpdateWonLost().then(c => { if (c) claudeToast('✓ ' + c + ' quote' + (c > 1 ? 's' : '') + ' moved to Won/Lost from Xero'); });
  if (n) { claudeToast('✓ Schedule: filled hours/address on ' + n + ' job' + (n > 1 ? 's' : '')); schRender(); }
}

async function schFillFromContact(id) {
  const b = schGet(id);
  const c = await schFindContact(b);
  if (!c) { claudeToast('No matching Xero contact found', 'error'); return; }
  const fields = {};
  if (!b.client_phone && c.phone) fields.client_phone = c.phone;
  if (!b.client_email && c.email) fields.client_email = c.email;
  if (!b.site_address && schAddrOf(c)) fields.site_address = schAddrOf(c);
  if (!Number(b.hours)) { const h = schQuotedHours(b); if (h) fields.hours = h; }
  if (Object.keys(fields).length) await schSave(id, fields, true);
  if (!b.lat && b.site_address) schGeocode(id);
  if (SCH.openId === id) schOpen(id);
}

// Placeholders: won jobs with no date yet are laid out in the calendar from today
// (priority first, then oldest), filling free capacity. Nothing is saved until you
// drag one onto a day — then it becomes Tentative.
function schPlaceholders() {
  const out = {};
  if (!Array.isArray(D && D.bookings)) return out;
  const load = {};
  const cap = schCap();
  const used = d => (load[d] || 0) + schDayLoad(d);
  const todo = schAll().filter(b => b.status === 'approved' && !b.start_date)
    .sort((a, c) => (a.priority || 2) - (c.priority || 2) || String(a.approved_at || '').localeCompare(String(c.approved_at || '')));
  for (const b of todo) {
    let d = nextWork(todayStr());
    const e = schEarliest(b);
    if (e && e > d) d = e;
    const hpd = Number(b.hours_per_day) || 8;
    for (let i = 0; i < 200; i++) {
      const span = schSpan({ ...b, start_date: d });
      if (span.every(x => cap - used(x.d) + 0.01 >= Math.min(x.h, hpd))) {
        span.forEach(x => { load[x.d] = (load[x.d] || 0) + x.h; (out[x.d] = out[x.d] || []).push({ b, h: x.h }); });
        break;
      }
      d = nextWork(addD(d, 1));
    }
  }
  return out;
}

// ── Pipeline candidates: quotes accepted in Xero that aren't scheduled yet ──
function schCandidates() {
  const have = new Set(schAll().filter(b => b.status !== 'cancelled').flatMap(b => [b.quote_number, (b.project || '').toLowerCase()]).filter(Boolean));
  const cutoff = addD(todayStr(), -150);
  const byQuote = {};
  (D.quote_items || []).forEach(q => {
    if (!q.quote_number) return;
    (byQuote[q.quote_number] = byQuote[q.quote_number] || []).push(q);
  });
  const out = [];
  Object.keys(byQuote).forEach(qn => {
    const lines = byQuote[qn];
    const st = (lines[0].status || '').toUpperCase();
    if (!['ACCEPTED', 'SENT'].includes(st)) return;
    if ((lines[0].date || '') < cutoff) return;
    if (have.has(qn)) return;
    const proj = lines.map(l => l.project).find(Boolean) || '';
    if (proj) {
      if (have.has(proj.toLowerCase())) return;
      const p = (D.projects || []).find(x => (x.name || '').toLowerCase() === proj.toLowerCase());
      if (p && ['Finished', 'Paid', 'Inactive', 'Lost'].includes(p.status)) return;
    }
    const total = lines.reduce((s, l) => s + (Number(l.line_amount) || 0), 0);
    const labourHrs = lines.filter(l => /\b(labou?r|hours?|hrs?)\b/i.test((l.item || '') + ' ' + (l.description || ''))).reduce((s, l) => s + (Number(l.qty) || 0), 0);
    out.push({ quote_number: qn, status: st, contact: lines[0].contact || '', date: lines[0].date, project: proj, total, labourHrs, lines });
  });
  return out.sort((a, c) => (c.status === 'ACCEPTED') - (a.status === 'ACCEPTED') || String(c.date).localeCompare(String(a.date)));
}

async function schCreate(fields) {
  const r = await fetch('/.netlify/functions/hub-write', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ table: 'bookings', insert: true, fields })
  });
  const out = await r.json().catch(() => ({}));
  if (!r.ok || !out.ok) throw new Error(out.error || 'insert failed');
  D.bookings = [out.row, ...schAll()];
  return out.row;
}

async function schAddFromQuote(qn, open) {
  const c = schCandidates().find(x => x.quote_number === qn);
  if (!c) return null;
  SCH.adding = SCH.adding || new Set();
  if (SCH.adding.has(qn)) return null;
  SCH.adding.add(qn);
  try {
    const rows = await hubReadBookings();
    if (rows.some(x => x.quote_number === qn && x.status !== 'cancelled')) { D.bookings = rows; return null; }
    return await schAddFromQuote2(c, qn, open);
  } finally { SCH.adding.delete(qn); }
}
async function schAddFromQuote2(c, qn, open) {
  const proj = (D.projects || []).find(p => (p.name || '').toLowerCase() === (c.project || c.contact || '').toLowerCase());
  const b = await schCreate({
    project: c.project || (proj && proj.name) || c.contact, title: proj && proj.baseline_scope || '', quote_number: qn,
    approval_source: c.status === 'ACCEPTED' ? 'xero' : 'hub', approved_at: todayStr(), status: 'approved', client_name: c.contact,
    hours: (proj && Number(proj.baseline_labour_hours)) || c.labourHrs || null
  });
  if (proj && proj.status === 'Quoted' && c.status === 'ACCEPTED') hubWrite('projects', proj.id, { status: 'Won' }).then(r => Object.assign(proj, r)).catch(() => {});
  schFillFromContact(b.id);
  if (open) { schRender(); schOpen(b.id); }
  return b;
}
async function schAddAllAccepted() {
  const list = schCandidates().filter(c => c.status === 'ACCEPTED');

async function schAddFromProject(name) {

function schDayCell(d, month, curMonth) {
  if (d < todayStr()) return `<div class="sch-day past"><div class="sch-day-h"><span class="sch-dn">${month ? pd(d).getDate() : fmtDay(d)}</span></div></div>`;
  const es = schDayEntries(d, true);
  const load = schDayLoad(d), cap = schCap();
  const work = isWork(d);
  const pct = Math.min(100, load / cap * 100);
  const cls = 'sch-day' + (d === todayStr() ? ' today' : '') + (!work ? ' off' : '') + (month && pd(d).getMonth() !== curMonth ? ' dim' : '') + (SCH.selDay === d ? ' sel' : '') + (SCH.placing ? ' placeable' : '');
  return `<div class="${cls}" onclick="schDayClick('${d}')" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="schDrop(event,'${d}')">
    <div class="sch-day-h"><span class="sch-dn">${month ? pd(d).getDate() : fmtDay(d)}</span>${!month ? schWxBadge(d) : ''}</div>
    ${work ? `<div class="sch-load${load > cap + .01 ? ' over' : ''}" title="${hrsText(load)} of ${hrsText(cap)}"><i style="width:${pct}%"></i></div>` : ''}
    <div class="sch-evs">${es.map(e => schChip(e.b, d, e.h)).join('')}${((SCH.ghost || {})[d] || []).map(e => schChip(e.b, d, e.h, true)).join('')}</div>
  </div>`;
}

function schCalendar() {
  const a = SCH.anchor;
  let head, body;
  if (SCH.view === 'week') {
    const days = Array.from({ length: 7 }, (_, i) => addD(a, i));
    head = fmtShort(days[0]) + ' – ' + fmtDay(days[6], { day: 'numeric', month: 'short', year: 'numeric' });
    body = '<div class="sch-grid week">' + days.map(d => schDayCell(d, false)).join('') + '</div>';
  } else {
    const first = pd(a); first.setDate(1);
    const start = mondayOf(ymd(first));
    const cur = first.getMonth();
    const days = Array.from({ length: 42 }, (_, i) => addD(start, i));
    head = first.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
    body = '<div class="sch-dow">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => '<span>' + x + '</span>').join('') + '</div><div class="sch-grid month">' + days.map(d => schDayCell(d, true, cur)).join('') + '</div>';
  }
  return `<div class="section sch-cal">
    <div class="sch-cal-h">
      <div class="sch-nav"><button class="sch-ic" onclick="schNav(-1)" aria-label="Previous">‹</button><button class="sch-btn" onclick="schToday()">Today</button><button class="sch-ic" onclick="schNav(1)" aria-label="Next">›</button></div>
      <h2>${head}</h2>
      <div class="sch-seg"><button class="${SCH.view === 'week' ? 'on' : ''}" onclick="schView('week')">Week</button><button class="${SCH.view === 'month' ? 'on' : ''}" onclick="schView('month')">Month</button></div>
    </div>${body}</div>`;
}
function schNav(n) {
  if (SCH.view === 'week') SCH.anchor = addD(SCH.anchor, 7 * n);
  else { const d = pd(SCH.anchor); d.setMonth(d.getMonth() + n, 1); SCH.anchor = ymd(d); }
  const t = todayStr();
  if (SCH.view === 'week' && SCH.anchor < t) SCH.anchor = schHomeMonday();          // no scrolling into the past
  if (SCH.view === 'month' && SCH.anchor < t.slice(0, 8) + '01') SCH.anchor = t;
  schRender();
}
function schToday() { SCH.anchor = SCH.view === 'week' ? schHomeMonday() : todayStr(); schRender(); }
function schView(v) {
  SCH.view = v;
  SCH.anchor = v === 'week' ? (!SCH.anchor || SCH.anchor < todayStr() ? schHomeMonday() : SCH.anchor) : (SCH.anchor || todayStr());
  try { localStorage.setItem('sch_view', v); } catch (e) {}
  schRender();
}

function schDayPlanPanel() {
  const d = SCH.selDay;
  if (!d) return '';
  const plan = schDayPlan(d);
  const w = schWx(d);
  const rows = plan.map((p, i) => (p.travel ? '<div class="sch-trav">🚗 about ' + p.travel + ' min drive</div>' : '') +
    `<div class="sch-plan" onclick="schOpen('${p.b.id}')" style="--c:${(SCH_STATUS[p.b.status] || SCH_STATUS.approved).color}"><time>${fmtHM(p.start)}–${fmtHM(p.end)}</time><span><b>${attrEsc(p.b.project)}</b><small>${attrEsc(p.b.site_address || 'no address')}</small></span>${schStatusChip(p.b)}</div>`).join('');
  const load = schDayLoad(d), cap = schCap();
  return `<div class="section"><div class="section-head"><h2>${fmtDay(d, { weekday: 'long', day: 'numeric', month: 'long' })}</h2><span class="sch-sub">${hrsText(load)} of ${hrsText(cap)}${w ? ' · ' + w.pop + '% rain · wind ' + Math.round(w.wind) + ' km/h' : ''}</span></div>
    <div class="section-body">${rows || '<div class="sch-empty">Nothing booked. Drag a job here or tap “Pick a day” on a card.</div>'}</div></div>`;
}

function schAttention() {
  const items = [];
  const today = todayStr();
  schAll().forEach(b => {
    if (['done', 'cancelled'].includes(b.status)) return;
    const nm = b.project || b.id;
    schBlockers(b).forEach(x => {
      if (x.manual && !x.confirmed && x.ready && x.ready <= addD(today, 3))
        items.push({ rank: 1, id: b.id, icon: '✓', t: 'Check: ' + x.label, s: nm + ' · due ' + fmtShort(x.ready) + ' — confirm it’s done, then lock the date' });
    });
    schDeliveries(b).forEach(d => { if (d.late || (d.arrivesAfterStart && !d.ordered)) items.push({ rank: 0, id: b.id, icon: '📦', t: 'Order ' + (d.item.name || 'special item') + (d.late ? ' now' : ''), s: nm + ' · ' + (d.item.lead_time || d.lead + ' days') + ' lead time' + (b.start_date ? ' — order by ' + fmtShort(d.orderBy) : '') }); });
    if (['tentative', 'confirmed'].includes(b.status) && b.start_date && b.notified_start !== b.start_date) items.push({ rank: 2, id: b.id, icon: '✉', t: 'Tell ' + (b.client_name || nm) + ' about ' + fmtDay(b.start_date), s: b.notified_start ? 'Told ' + fmtShort(b.notified_start) + ' before' : 'Not told yet', notify: true });
    if (SCH_ACTIVE.includes(b.status)) schSpan(b).forEach(x => { if (schDayLoad(x.d) > schCap() + .01 && !items.find(i => i.key === 'o' + x.d)) items.push({ rank: 0, id: b.id, key: 'o' + x.d, icon: '⚠', t: 'Overbooked ' + fmtDay(x.d), s: hrsText(schDayLoad(x.d)) + ' booked of ' + hrsText(schCap()) }); });
    if (b.start_date && b.env !== 'indoor' && SCH_ACTIVE.includes(b.status)) {
      const bad = schSpan(b).find(x => { const w = schWx(x.d); return w && w.rain; });
      if (bad) {
        const alt = schAll().find(o => o.id !== b.id && o.env === 'indoor' && SCH_ACTIVE.includes(o.status) && o.start_date && o.start_date > bad.d);
        items.push({ rank: 1, id: b.id, icon: '🌧', t: 'Rain forecast ' + fmtDay(bad.d) + ' — ' + nm, s: 'Outdoor job' + (alt ? ' · swap with ' + (alt.project || alt.id) + ' (indoor)?' : ' · consider moving it') });
      }
    }
  });
  const needDate = schAll().filter(b => b.status === 'approved').length;
  if (needDate) items.push({ rank: 3, id: null, icon: '📅', t: needDate + ' approved job' + (needDate > 1 ? 's' : '') + ' need a date', s: 'In the pipeline below' });
  items.sort((a, c) => a.rank - c.rank);
  if (!items.length) return '';
  return `<div class="sch-attn">${items.slice(0, 6).map(i => `<button class="sch-att r${i.rank}" onclick="${i.id ? `schOpen('${i.id}'${i.notify ? ",'notify'" : ''})` : ''}"><i>${i.icon}</i><span><b>${attrEsc(i.t)}</b><small>${attrEsc(i.s)}</small></span></button>`).join('')}${items.length > 6 ? '<div class="sch-sub" style="padding:6px 4px">+' + (items.length - 6) + ' more</div>' : ''}</div>`;
}

function schPipeline() {
  const all = schAll();
  const needs = all.filter(b => b.status === 'approved').sort((a, c) => a.priority - c.priority);
  const tent = all.filter(b => b.status === 'tentative').sort((a, c) => String(a.start_date).localeCompare(String(c.start_date)));
  const conf = all.filter(b => ['confirmed', 'in_progress'].includes(b.status)).sort((a, c) => String(a.start_date).localeCompare(String(c.start_date)));
  const done = all.filter(b => ['done', 'cancelled'].includes(b.status));
  const cands = schCandidates();
  const acc = cands.filter(c => c.status === 'ACCEPTED');
  const sec = (title, list, color) => list.length ? `<div class="sch-sec"><div class="sch-sec-h" style="--c:${color}">${title} <em>${list.length}</em></div>${list.map(schCard).join('')}</div>` : '';
  return `<div class="sch-pipe">
    
    ${sec('Needs a date', needs, '#FFBE0B')}${sec('Tentative', tent, '#3A86FF')}${sec('Confirmed', conf, '#05C46B')}
    ${!all.filter(b => !['done', 'cancelled'].includes(b.status)).length ? '<div class="sch-empty big">No jobs in the pipeline.<br>Approve a quote in Xero, or tap <b>＋ Add job</b>.</div>' : ''}
    ${done.length ? `<button class="sch-link" onclick="SCH.showDone=!SCH.showDone;schRender()">${SCH.showDone ? 'Hide' : 'Show'} done / cancelled (${done.length})</button>${SCH.showDone ? done.map(schCard).join('') : ''}` : ''}
  </div>`;
}

function schHeader() {
  return `<div class="sch-top"><div><h1>Schedule</h1><span class="sch-sub">Pipeline &amp; bookings</span></div>
    <div class="sch-top-act"><button class="sch-ic" onclick="schSettingsModal()" aria-label="Settings">⚙︎</button><button class="sch-btn pri" onclick="schAddModal()">＋ Add job</button></div></div>`;
}

function schSetupCard() {
  return `<div class="section"><div class="section-body" style="padding:24px;max-width:640px;margin:0 auto">
    <h2 style="font-size:18px;margin-bottom:8px">Couldn't load your jobs</h2>
    <p style="color:var(--ink-3);line-height:1.5;margin-bottom:14px">The schedule didn't load. This is usually a dropped connection or a login that needs refreshing. Tap “Check again”; if it stays like this, reload the page.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sch-btn pri" onclick="loadData()">Check again</button></div></div></div>`;
}

function schRender() {
  const page = document.getElementById('page-schedule');
  if (!page) return;
  if (!SCH.anchor || (SCH.view === 'week' && SCH.anchor < todayStr())) SCH.anchor = SCH.view === 'week' ? schHomeMonday() : todayStr();
  SCH.ghost = schPlaceholders();
  schLoadWeather();
  if (D && D.bookings === null) { page.innerHTML = schHeader().replace(/<div class="sch-top-act">[\s\S]*<\/div><\/div>$/, '</div>') + schSetupCard(); return; }
  const banner = SCH.placing ? `<div class="sch-banner">Tap a day to place <b>${attrEsc((schGet(SCH.placing) || {}).project || '')}</b><button onclick="SCH.placing=null;schRender()">Cancel</button></div>` : '';
  page.innerHTML = schHeader() + banner + schAttention() + `<div class="sch-layout"><div class="sch-col-pipe">${schPipeline()}</div><div class="sch-col-cal">${schCalendar()}${schDayPlanPanel()}</div></div>`;
}

// ═══ BOOKING SHEET ══════════════════════════════════════════════════════════
const SCH_NUM = { hours: 1, hours_per_day: 1, priority: 1, window_days: 1 };
async function schSet(id, field, val) {
  if (field in SCH_NUM) val = val === '' ? null : Number(val);
  if (val === '') val = field === 'start_date' ? null : val;
  const b = schGet(id);
  const patch = { [field]: val };
  if (field === 'start_date' && val) {
    patch.start_date = nextWork(val);
    if (b.status === 'approved') patch.status = 'tentative';
  }
  const res = await schSave(id, patch, true);
  if (field === 'site_address' && val) { await schGeocode(id); }
  if (res && field === 'start_date') {
    const bad = schIssues(b).find(i => i.level === 'bad');
    if (bad) claudeToast('⚠ ' + bad.text, 'error');
  }
  schRender();
  if (SCH.openId === id) schOpen(id, SCH.msg && SCH.msg.id === id ? 'notify' : undefined, true);
}

function schTimeline(b, d) {
  const today = todayStr();
  const pts = [today, d.eta, b.start_date, d.orderBy].filter(Boolean).sort();
  const lo = pts[0], hi = addD(pts[pts.length - 1], 2), span = Math.max(1, diffDays(lo, hi));
  const pos = x => Math.max(0, Math.min(100, diffDays(lo, x) / span * 100));
  const ok = !d.arrivesAfterStart;
  return `<div class="sch-tl"><div class="sch-tl-bar"><i style="left:${pos(d.ordered ? today : (d.orderBy && d.orderBy > today ? d.orderBy : today))}%;width:${Math.max(2, pos(d.eta) - pos(d.ordered ? today : (d.orderBy && d.orderBy > today ? d.orderBy : today)))}%;background:${ok ? 'var(--sage)' : 'var(--pink)'}"></i>
    <u style="left:${pos(today)}%"><s>Today</s></u>${d.orderBy ? `<u class="o" style="left:${pos(d.orderBy)}%"><s>Order by ${fmtShort(d.orderBy)}</s></u>` : ''}<u class="e" style="left:${pos(d.eta)}%"><s>Arrives ${fmtShort(d.eta)}</s></u>${b.start_date ? `<u class="st" style="left:${pos(b.start_date)}%"><s>Start ${fmtShort(b.start_date)}</s></u>` : ''}</div></div>`;
}

function schConsEditor(b) {
  const cs = Array.isArray(b.constraints) ? b.constraints : [];
  const row = c => `<div class="sch-con${c.done ? ' done' : ''}">
    <div class="sch-con-main"><b>${attrEsc(c.label || 'Constraint')}</b><small>${SCH_CON_TYPES[c.type] || 'Other'}${c.ready_date ? ' · ready after ' + fmtDay(c.ready_date) : ''}</small></div>
    <label class="sch-chk"><input type="checkbox" ${c.confirmed ? 'checked' : ''} onchange="schConToggle('${b.id}','${c.id}','confirmed')"> Confirmed</label>
    <label class="sch-chk"><input type="checkbox" ${c.done ? 'checked' : ''} onchange="schConToggle('${b.id}','${c.id}','done')"> Done</label>
    <button class="sch-ic sm" onclick="schConDel('${b.id}','${c.id}')" aria-label="Remove">✕</button></div>`;
  const dl = schDeliveries(b).map(d => `<div class="sch-con del"><div class="sch-con-main"><b>📦 ${attrEsc(d.item.name || 'Special order')}</b><small>${attrEsc(d.item.supplier || '')} · lead ${attrEsc(d.item.lead_time || d.lead + ' days')} · ${d.ordered ? 'ordered, arrives ' + fmtShort(d.eta) : 'not ordered yet'}</small>${schTimeline(b, d)}</div>
    <button class="sch-btn ${d.ordered ? '' : 'pri'}" onclick="schMarkOrdered('${d.listId}',${d.idx},${!d.ordered})">${d.ordered ? 'Un-order' : 'Mark ordered'}</button></div>`).join('');
  return cs.map(row).join('') + dl + `<div class="sch-addcon">
    <select id="sch-ct" class="sch-in">${Object.entries(SCH_CON_TYPES).map(([k, v]) => '<option value="' + k + '">' + v + '</option>').join('')}</select>
    <input id="sch-cl" class="sch-in" placeholder="e.g. Plumber finishes first" style="flex:2;min-width:160px">
    <input id="sch-cd" type="date" class="sch-in" title="Ready after this date">
    <button class="sch-btn pri" onclick="schConAdd('${b.id}')">Add</button></div>`;
}
async function schConAdd(id) {
  const label = document.getElementById('sch-cl').value.trim();
  if (!label) { claudeToast('Describe the constraint', 'error'); return; }
  const b = schGet(id);
  const c = { id: 'c' + Date.now().toString(36), type: document.getElementById('sch-ct').value, label, ready_date: document.getElementById('sch-cd').value || null, confirmed: false, done: false };
  await schSave(id, { constraints: [...(b.constraints || []), c] }, true);
  const e = schEarliest(b);
  if (e && b.start_date && b.start_date <= (c.ready_date || '')) schSnack('Job now starts before “' + label + '” is ready', [{ label: 'Move to ' + fmtShort(e), run: () => schMove(id, e) }]);
  schRender(); schOpen(id, undefined, true);
}
async function schConToggle(id, cid, key) {
  const b = schGet(id);
  await schSave(id, { constraints: b.constraints.map(c => c.id === cid ? { ...c, [key]: !c[key] } : c) }, true);
  const c = b.constraints.find(x => x.id === cid);
  if (key === 'confirmed' && c.confirmed && ['approved', 'tentative'].includes(b.status)) schSnack('“' + c.label + '” confirmed ready', [{ label: 'Lock the date', run: () => schSetStatus(id, 'confirmed') }]);
  schRender(); schOpen(id, undefined, true);
}
async function schConDel(id, cid) { const b = schGet(id); await schSave(id, { constraints: b.constraints.filter(c => c.id !== cid) }, true); schRender(); schOpen(id, undefined, true); }
async function schMarkOrdered(listId, idx, ordered) {
  const l = (D.shopping_lists || []).find(x => x.id === listId);
  if (!l) return;
  const items = l.items.map((it, i) => i !== idx ? it : { ...it, ordered, ordered_at: ordered ? todayStr() : null, eta: ordered ? addD(todayStr(), schLeadDays(it.lead_time)) : null });
  try { const row = await hubWrite('shopping_lists', listId, { items }); l.items = row.items; } catch (e) { claudeToast('Could not save: ' + e.message, 'error'); return; }
  schRender(); if (SCH.openId) schOpen(SCH.openId, undefined, true);
}

// ── Client messages ─────────────────────────────────────────────────────────
function schFirst(b) { return String(b.client_name || b.project || '').split(/[\s\-–]+/)[0] || 'there'; }
function schBuildMsg(b, kind, reason) {
  const f = schFirst(b), job = b.title ? b.title.replace(/\.$/, '') : 'your job', date = schDateText(b);
  const at = b.site_address ? ' at ' + b.site_address : '';
  const blockers = schBlockers(b).filter(x => !x.confirmed).map(x => x.label.replace(/ \((not )?ordered\)/, ''));
  const t = {
    tentative: `Hi ${f}, it's Seb from Matiere. I've pencilled in ${date} for ${job}${at}.${blockers.length ? ' I\'ll lock it in once ' + blockers.slice(0, 2).join(' and ') + ' is sorted.' : ''} Does that work for you?`,
    confirmed: `Hi ${f}, confirming ${date}${Number(b.window_days) ? '' : ' from about ' + (b.start_time || '7:00')} for ${job}${at}. Let me know if anything changes your end.`,
    moved: `Hi ${f}, a quick update: ${job} has moved${b.notified_start ? ' from ' + fmtDay(b.notified_start, { weekday: 'long', day: 'numeric', month: 'long' }) : ''} to ${date}${reason ? ' — ' + reason : ''}. Sorry for the shuffle, let me know if that's a problem.`,
    window: `Hi ${f}, we're aiming to start ${job} ${date}. I'll lock in the exact day as soon as I can and keep you posted.`
  };
  return t[kind] || t.tentative;
}
function schDefaultKind(b) {
  if (b.notified_start && b.notified_start !== b.start_date) return 'moved';
  if (b.status === 'confirmed') return 'confirmed';
  return Number(b.window_days) > 0 ? 'window' : 'tentative';
}
function schMsgSet(id, key, val) {
  const b = schGet(id);
  SCH.msg = { ...SCH.msg, [key]: val };
  if (key !== 'text') SCH.msg.text = schBuildMsg(b, SCH.msg.kind, SCH.msg.reason);
  schOpen(id, 'notify', true);
}
async function schLogNotify(id, channel, note) {
  const b = schGet(id);
  const entry = { at: new Date().toISOString(), kind: SCH.msg.kind, channel, text: SCH.msg.text, start_date: b.start_date, note: note || '' };
  await schSave(id, { notify_log: [entry, ...(b.notify_log || [])], notified_start: b.start_date }, true);
  schRender(); schOpen(id, 'notify', true);
}
async function schSendComms(id) {
  const b = schGet(id), s = schSettings();
  if (!s.commsUrl || !s.commsKey) { schSettingsModal(); claudeToast('Set up the Comms Hub link first', 'error'); return; }
  try {
    const r = await fetch(s.commsUrl.replace(/\/$/, '') + '/api/schedule/draft', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-hub-schedule': s.commsKey },
      body: JSON.stringify({ phone: b.client_phone || undefined, email: b.client_email || undefined, name: b.client_name || undefined, text: SCH.msg.text })
    });
    const out = await r.json().catch(() => ({}));
    if (r.status === 404) { claudeToast('No conversation with this client in the Comms Hub — use SMS or email instead', 'error'); return; }
    if (!r.ok) throw new Error(out.error || 'HTTP ' + r.status);
    await schLogNotify(id, 'comms-hub-draft', 'Draft left in Comms Hub (' + out.channel + ')');
    schSnack('Draft is waiting in the Comms Hub — review and tap Send there', [{ label: 'Open', run: () => window.open(s.commsUrl, '_blank') }]);
  } catch (e) {
    claudeToast('Comms Hub not reachable (' + e.message + '). Is Tailscale on? Use SMS or email instead.', 'error');
  }
}
function schSendSms(id) {
  const b = schGet(id);
  if (!b.client_phone) { claudeToast('Add the client’s mobile number first', 'error'); return; }
  const sep = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? '&' : '?';
  schLogNotify(id, 'sms', 'Opened in Messages');
  location.href = 'sms:' + b.client_phone.replace(/\s/g, '') + sep + 'body=' + encodeURIComponent(SCH.msg.text);
}
function schSendEmail(id) {
  const b = schGet(id);
  if (!b.client_email) { claudeToast('Add the client’s email first', 'error'); return; }
  const subj = { moved: 'Update: new date for ' + (b.project || 'your job'), confirmed: 'Confirmed: ' + (b.project || 'your job') }[SCH.msg.kind] || 'Proposed date for ' + (b.project || 'your job');
  schLogNotify(id, 'email', 'Opened in Mail');
  location.href = 'mailto:' + b.client_email + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(SCH.msg.text);
}
function schCopyMsg(id) { navigator.clipboard.writeText(SCH.msg.text).then(() => { claudeToast('Message copied'); schLogNotify(id, 'copied', 'Copied'); }); }

function schNotifyPanel(b) {
  if (!SCH.msg || SCH.msg.id !== b.id) { const k = schDefaultKind(b); SCH.msg = { id: b.id, kind: k, reason: '', text: schBuildMsg(b, k, '') }; }
  const m = SCH.msg;
  const log = (b.notify_log || []).slice(0, 5).map(l => `<div class="sch-log"><b>${new Date(l.at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} · ${attrEsc(l.kind)}</b><span>${attrEsc(l.note || l.channel)}</span></div>`).join('');
  return `<div class="sch-notify">
    <div class="sch-seg wide">${[['tentative', 'Proposed'], ['confirmed', 'Confirmed'], ['moved', 'Date moved'], ['window', 'Window']].map(([k, v]) => `<button class="${m.kind === k ? 'on' : ''}" onclick="schMsgSet('${b.id}','kind','${k}')">${v}</button>`).join('')}</div>
    ${m.kind === 'moved' ? `<input class="sch-in" placeholder="Reason (optional) e.g. the plumber ran over" value="${attrEsc(m.reason)}" onchange="schMsgSet('${b.id}','reason',this.value)">` : ''}
    <textarea class="sch-in" rows="5" onchange="SCH.msg.text=this.value" oninput="SCH.msg.text=this.value">${attrEsc(m.text)}</textarea>
    <div class="sch-send">
      <button class="sch-btn pri" onclick="schSendComms('${b.id}')">Draft in Comms Hub</button>

// ── Performance (2026-11-05, v2) ─────────────────────────────────────────────
// Operating margin per day. For each billable job: sales (hand-linked invoices +
// cash) minus its expenses is the pool that pays for labour AND profit. It is
// spread over every hour worked on the job, so each timesheet entry earns
// hours x (pool / total hours). Non-billable time (Admin, Wasted Time...) is real
// working time that earns $0, so it pulls the day, week and month down.
// Holidays / Sick days / Carer days are leave: shown with a symbol and never
// counted against you. Benchmark = 8 hours at the nominal rate ($800/day).
const PF = { month: null, view: 'day', range: 28, win: 'm0', basis: 'invoiced' };
const PF_RANGES = [[14,'2w'],[28,'4w'],[90,'3m'],[180,'6m'],[365,'1y'],[0,'All']];
const PF_VIEWS = [['day','Day'],['week','Week'],['month','Month']];
const PF_WINS = [['m0','This month'],['m1','Last month'],['q','3 months'],['s','6 months'],['y','12 months'],['all','All time']];
const PF_HOL_NAMES = { NYD:"New Year's Day", AUD:'Australia Day', GFR:'Good Friday', ESA:'Easter Saturday', ESU:'Easter Sunday', EMO:'Easter Monday', ANZ:'Anzac Day', KBD:"King's Birthday", LAB:'Labour Day', CHR:'Christmas Day', BOX:'Boxing Day' };
let PF_HOL_CACHE = null;   // built on first use: NSW_HOLIDAYS is declared further down the file
function pfHol() {
  return PF_HOL_CACHE || (PF_HOL_CACHE = Object.assign({}, NSW_HOLIDAYS, {
    '2027-01-01':'NYD','2027-01-26':'AUD','2027-03-26':'GFR','2027-03-27':'ESA','2027-03-28':'ESU','2027-03-29':'EMO',
    '2027-04-25':'ANZ','2027-06-14':'KBD','2027-10-04':'LAB','2027-12-27':'CHR','2027-12-28':'BOX' }));
}
// Jobs left out of the Performance analysis (their sales and hours stay everywhere
// else). Mark - Nth Balgowlah: time tracking only began when it was nearly finished,
// so almost all its hours are missing and its margin per hour is meaningless.
const PF_EXCLUDE = ['Mark - Nth Balgowlah'];
const PF_LEAVE = /^(holidays?|sick days?|carer days?|leave|annual leave)$/i;
const PF_TYPES = [
  ['Decks & pergolas', /deck|pergola|veranda|decking|composite/],
  ['Balustrades & stairs', /balustrad|baluster|handrail|stair/],
  ['Fences & gates', /fenc|gate|screen/],
  ['Cabinetry & built-ins', /cabinet|built-?in|wardrobe|shelv|desk|joinery|vanity|pantry|bed\b|partition|bench|cupboard/],
  ['Doors, windows & trim', /door|window|architrave|sill|skirting|trim|frame/],
  ['Roofs & outdoor structures', /roof|polycarbonate|awning|carport|post|shade/],
  ['Repairs & maintenance', /repair|fix|replace|rot|maintenance|patch|make good/],
];
function pfRate() { return (D.kpis && D.kpis.sebRate_per_hour) || 100; }
function pfBench() { return 8 * pfRate(); }
function pfNear() { return pfBench() - 100; }          // orange from $700 up to the benchmark
function pfHolName(date) { const c = pfHol()[date]; return c ? (PF_HOL_NAMES[c] || 'Public holiday') : ''; }
function pfStatusClass(v, bench) { bench = bench || pfBench(); return v >= bench ? 'pf-ok' : v >= bench - 100 * (bench / pfBench()) ? 'pf-near' : 'pf-low'; }
function pfColor(cls) { return cls === 'pf-ok' ? '#34D399' : cls === 'pf-near' ? '#FFA94D' : '#FF5D73'; }
function pfShort(v) { const a = Math.abs(v); return (v < 0 ? '−' : '') + '$' + (a >= 1000 ? (a / 1000).toFixed(a % 1000 ? 1 : 0) + 'k' : Math.round(a)); }

function pfCompute() {
  if (!PROJ_SORTED.length && D && D.kpis) renderProjects(D.kpis);
  const perHour = {};
  PROJ_SORTED.forEach(p => {
    const sales = (PF.basis === 'paid' ? (p.linkedPaidValue || 0) : (p.linkedInvValue || 0)) + (p.manualRev || 0);
    if (sales > 0 && p.hours > 0) perHour[p.name] = (sales - (p.expensesTotal || 0)) / p.hours;
  });
  const days = {}, entries = [];
  (D.timesheets || []).forEach(t => {
    if (!t.date) return;
    const h = Number(t.hours) || 0, name = (t.project || '').trim();
    if (PF_EXCLUDE.includes(name)) return;
    const d = days[t.date] || (days[t.date] = { value: 0, hours: 0, idle: 0, unbilled: 0, leave: 0, projects: {} });
    const pr = d.projects[name || '(no job)'] || (d.projects[name || '(no job)'] = { h: 0, v: 0, kind: '' });
    let kind, v = 0;
    if (PF_LEAVE.test(name)) { kind = 'leave'; d.leave += h; }
    else {
      d.hours += h;
      if (perHour[name] != null) { kind = 'sales'; v = h * perHour[name]; d.value += v; }
      else if (isNonBillable(name) || !name) { kind = 'idle'; d.idle += h; }
      else { kind = 'unbilled'; d.unbilled += h; }
    }
    pr.h += h; pr.v += v; pr.kind = kind;
    entries.push({ date: t.date, project: name, h, v, kind });
  });
  PF.days = days; PF.entries = entries;
  return days;
}
function pfIsWorkday(date) {
  const w = pd(date).getDay(), x = (PF.days || {})[date];
  if (x && x.hours > 0) return true;
  return w > 0 && w < 6 && !pfHol()[date] && !(x && x.leave > 0);
}

function pfDayCell(date, bench, today) {

  return `<div class="pf-cell pf-empty${tcls}"><span class="pf-top"><span class="pf-n">${n}</span></span></div>`;
}

function pfMonthShift(n) {

  const d = new Date(y, m - 1 + n, 1);

function pfSetRange(n) {

  PF.view = n === 0 || n > 180 ? 'month' : n > 28 ? 'week' : 'day';

}

function pfDay(date) {
  const d = (PF.days || {})[date], bench = pfBench(), hol = pfHolName(date);
  const label = pd(date).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });

  const rows = Object.keys(d.projects).sort((a, b) => d.projects[b].v - d.projects[a].v || d.projects[b].h - d.projects[a].h).map(name => {
    const pr = d.projects[name], safe = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

      : pr.kind === 'unbilled' ? `${+pr.h.toFixed(1)}h · no sales linked yet`
      : `${+pr.h.toFixed(1)}h · ${fmt(pr.v / pr.h)}/h`;
