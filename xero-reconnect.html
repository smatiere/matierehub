<title>Matiere: add Xero payroll access</title>
<style>body{font-family:-apple-system,sans-serif;background:#1a1814;color:#f7f4ef;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}

<body><div class="c"><h2>Add Xero payroll access</h2>
<p>Gives the Hub read-only access to pay runs, payslips and super in Xero, on top of what it has now. It can't change anything in Xero.</p>
<a class="b" id="go" href="#">Continue to Xero</a></div>
<script>
const SC='openid profile email offline_access accounting.settings accounting.settings.read accounting.contacts accounting.contacts.read accounting.attachments accounting.attachments.read accounting.budgets.read accounting.payments accounting.payments.read accounting.invoices accounting.invoices.read accounting.banktransactions accounting.banktransactions.read accounting.manualjournals accounting.manualjournals.read accounting.reports.aged.read accounting.reports.balancesheet.read accounting.reports.banksummary.read accounting.reports.budgetsummary.read accounting.reports.executivesummary.read accounting.reports.profitandloss.read accounting.reports.trialbalance.read accounting.reports.taxreports.read accounting.reports.tenninetynine.read files files.read assets assets.read projects projects.read'+' payroll.employees.read payroll.payruns.read payroll.payslip.read payroll.settings.read payroll.timesheets.read';
document.getElementById('go').onclick=function(e){e.preventDefault();
location.href='https://login.xero.com/identity/connect/authorize?response_type=code&client_id=3854892E5C3B490EAE24E3B1A79E668D&redirect_uri='+encodeURIComponent('https://matierehub2.netlify.app/xero-callback')+'&scope='+encodeURIComponent(SC)+'&state=payroll';};
